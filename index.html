  color: var(--n-text-faint);
  font-family: var(--n-font-mono);
  font-size: 12px;
}
.calc-hist__res {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: var(--n-text);
  font-family: var(--n-font-mono);
  font-size: 18px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.calc-hist__empty { padding: 18px 8px; color: var(--n-text-faint); text-align: center; font-size: var(--n-fs-sm); }

/* ------------------------------------------------------------------ narrow cards */

@container app (max-width: 719px) {
  .calc { align-items: flex-start; padding: 18px 16px 24px; }
  .calc-wrap { grid-template-columns: minmax(0, 1fr); max-width: 400px; gap: 16px; }
  .calc-hist__list { max-height: 260px; }
}

@container app (max-width: 420px) {
  .calc { --calc-key-h: 50px; padding: 14px 12px 20px; }
  .calc-result { font-size: 42px; }
  .calc-keys { gap: 6px; }
}
/* ---- css/app-draw.css ---- */
/* Nova Draw — a full-bleed board on the page color, with a floating toolbar on top. */

.draw {
  position: absolute;
  inset: 0;
  overflow: hidden;
  outline: none;
}
.draw:focus-visible { outline: none; }

.draw-board {
  position: absolute;
  inset: 0;
  overflow: hidden;
  touch-action: none;
  background:
    radial-gradient(color-mix(in srgb, var(--n-text) 9%, transparent) 1px, transparent 1.4px) 0 0 / 24px 24px,
    var(--n-page);
}

.draw-main,
.draw-live {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.draw-main { pointer-events: none; }
.draw-live { touch-action: none; cursor: crosshair; }

.draw-hint {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  pointer-events: none;
  color: var(--n-text-faint);
  font-size: 14px;
  text-align: center;
}
.draw-hint__icon {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: var(--n-accent-soft);
  color: color-mix(in srgb, var(--n-accent) 80%, var(--n-text));
}

.draw-probe {
  position: absolute;
  width: 0;
  height: 0;
  visibility: hidden;
  pointer-events: none;
}

/* ------------------------------------------------------------------ floating toolbar (opaque in dark themes) */

.draw-toolbar {
  position: absolute;
  top: 12px;
  left: 50%;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 4px 6px;
  width: max-content;
  max-width: calc(100% - 20px);
  padding: 5px;
  transform: translateX(-50%);
  border: 1px solid var(--n-border);
  border-radius: var(--n-radius-lg);
  background: linear-gradient(var(--n-surface), var(--n-surface)), var(--n-page);
  box-shadow: var(--n-shadow);
}

.draw-group { display: flex; align-items: center; gap: 2px; }

.draw-sep {
  align-self: stretch;
  width: 1px;
  margin: 4px 3px;
  background: var(--n-border);
}

.draw-tool[aria-pressed="true"],
.draw-size[aria-pressed="true"] {
  --_bg: var(--n-accent-soft);
  --_fg: color-mix(in srgb, var(--n-accent) 75%, var(--n-text));
}

.draw-clear {
  --_fg: color-mix(in srgb, var(--n-danger) 85%, var(--n-text));
  --_fg-hover: var(--n-danger);
}

.draw-size i {
  display: block;
  width: var(--d);
  height: var(--d);
  border-radius: 999px;
  background: currentColor;
}

.draw-ink {
  position: relative;
  width: 20px;
  height: 20px;
  margin: 0 2px;
  border-radius: 999px;
  background: var(--ink);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
  cursor: pointer;
  transition: transform var(--n-dur) var(--n-ease-spring), box-shadow var(--n-dur) var(--n-ease);
}
.draw-ink::before { content: ""; position: absolute; inset: -2px; border-radius: 999px; } /* a 24px touch target around the 20px dot */
.draw-ink:hover { transform: scale(1.12); }
.draw-ink[aria-pressed="true"] {
  box-shadow: 0 0 0 2px var(--n-page), 0 0 0 3.5px var(--n-accent);
}
.draw-ink:focus-visible { outline: 2px solid var(--n-accent); outline-offset: 3px; }

/* ------------------------------------------------------------------ narrow cards */

@container app (max-width: 520px) {
  .draw-toolbar { top: 8px; gap: 3px 4px; padding: 4px; }
  .draw-ink { width: 18px; height: 18px; }
  .draw-ink::before { inset: -3px; }
  .draw-sep { display: none; }
}
/* ---- css/app-web.css ---- */
/* Nova Web — a slim bar over the framed page. Every page gets a frame; there is no blocked-site card. */

.web {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

.web-head {
  position: relative;
  z-index: 2;
  flex: none;
  border-bottom: 1px solid var(--n-border);
  background: linear-gradient(var(--n-surface), var(--n-surface)), var(--n-page);
}

.web-bar {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: var(--n-row-h);
  padding: 6px 10px 6px 12px;
}

.web-id {
  display: flex;
  align-items: baseline;
  flex: 1;
  gap: 8px;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
}

.web-name {
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--n-text);
  font-family: var(--n-font-display);
  font-size: 13.5px;
  font-weight: 650;
}

.web-host {
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--n-text-faint);
  font-size: var(--n-fs-sm);
}

/* A quiet "why might this not load" icon: dim until hovered or focused. */
.web-info { color: var(--n-text-faint); }
.web-info:hover, .web-info:focus-visible, .web-info[aria-expanded="true"] { color: var(--n-text); }

/* The one muted line shown where Nova can't frame anything (the claude.ai artifact). */
.web-note {
  margin: 0;
  padding: 0 12px 7px;
  color: var(--n-text-muted);
  font-size: var(--n-fs-sm);
  line-height: 1.4;
}

/* Click/tap version of the info tooltip: opaque, under the icon. */
.web-hint {
  position: absolute;
  top: calc(100% + 6px);
  right: 10px;
  z-index: 3;
  width: min(300px, calc(100% - 20px));
  padding: 9px 12px;
  border: 1px solid var(--n-border);
  border-radius: var(--n-radius);
  background: linear-gradient(var(--n-surface), var(--n-surface)), var(--n-page);
  box-shadow: var(--n-shadow);
  color: var(--n-text-muted);
  font-size: var(--n-fs-sm);
  line-height: 1.5;
}

.web-stage {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background: var(--n-page);
}

.web-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--n-page);
}

/* Loading cover: opaque, so the frame never shows as a blank dark box. It lifts when the page loads. */
.web-loading {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: var(--n-page);
  pointer-events: none;
}
.web-loading[hidden] { display: none; }

.web-loading__sheen {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--n-text) 10%, transparent) 50%, transparent 80%) 0 0 / 200% 100%,
    color-mix(in srgb, var(--n-text) 4%, transparent);
  animation: n-shimmer 1.3s ease-in-out infinite;
}

/* A thin accent bar sliding along the top edge. */
.web-loading::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 38%;
  height: 3px;
  background: var(--n-accent);
  border-radius: 0 3px 3px 0;
  animation: web-slide 1.2s ease-in-out infinite;
}

.web-loading__label {
  position: relative;
  max-width: calc(100% - 32px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--n-text-muted);
  font-size: var(--n-fs-sm);
}

@keyframes web-slide {
  from { transform: translateX(-100%); }
  to { transform: translateX(263%); }
}

/* ------------------------------------------------------------------ narrow cards */

@container app (max-width: 520px) {
  .web-bar { gap: 6px; padding: 6px 8px; }
  .web-host { display: none; }
  .web-open { width: calc(var(--n-row-h) - 6px); padding: 0; }
  .web-open > span { display: none; }
  .web-note { padding: 0 8px 7px; }
}
/* ---- css/app-ask.css ---- */
/* Nova Ask Claude — history pane + conversation. Card widths under 720px turn the history into a slide-over drawer. */

.app-ask { display: flex; overflow: hidden; }

.ask { position: relative; display: flex; flex: 1; min-width: 0; min-height: 0; }

/* ------------------------------------------------------------------ history pane */

.ask-side {
  display: flex;
  flex-direction: column;
  flex: none;
  width: 264px;
  min-height: 0;
  border-right: 1px solid var(--n-border);
  background: color-mix(in srgb, var(--n-text) 2.5%, transparent);
}

.ask-side__head { display: grid; gap: 14px; padding: 18px 14px 12px 16px; }
.ask-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ask-mark {
  display: grid;
  place-items: center;
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  background: var(--n-accent-soft);
  color: color-mix(in srgb, var(--n-accent) 80%, var(--n-text));
}
.ask-h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.ask-close { display: none; margin-left: auto; }
.ask-new { width: 100%; }

.ask-side__label {
  padding: 6px 20px 4px;
  color: var(--n-text-faint);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.ask-hist { flex: 1; min-height: 0; padding: 2px 8px 10px; }
.ask-hist__empty { padding: 28px 14px; color: var(--n-text-faint); font-size: var(--n-fs); text-align: center; }

.ask-hist__row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 2px;
  margin-bottom: 2px;
  border-radius: var(--n-radius);
  transition: background-color var(--n-dur) var(--n-ease), box-shadow var(--n-dur) var(--n-ease);
}
.ask-hist__row:hover, .ask-hist__row:focus-within { background: color-mix(in srgb, var(--n-text) 5%, transparent); }
.ask-hist__row.is-active {
  background: var(--n-surface);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 0 0 1px var(--n-border);
}
.ask-hist__row.is-active::before {
  content: "";
  position: absolute;
  left: 0;
  top: 11px;
  bottom: 11px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--n-accent);
}
.ask-hist__item {
  display: grid;
  flex: 1;
  gap: 2px;
  min-width: 0;
  padding: 9px 4px 9px 13px;
  border-radius: var(--n-radius);
  color: var(--n-text);
  text-align: left;
}
.ask-hist__item:focus-visible { outline-offset: -2px; }
.ask-hist__title { overflow: hidden; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; }
.ask-hist__time { color: var(--n-text-faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.ask-hist__del { margin-right: 4px; opacity: 0; }
.ask-hist__row:hover .ask-hist__del, .ask-hist__row:focus-within .ask-hist__del, .ask-hist__del:focus-visible { opacity: 1; }
.ask-hist__del:hover:not(:disabled) { color: var(--n-danger); }
@media (hover: none) { .ask-hist__del { opacity: 0.7; } }

.ask-side__foot {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px 14px;
  border-top: 1px solid var(--n-border);
  color: var(--n-text-faint);
  font-size: 11.5px;
}

.ask-scrim {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 20;
  background: rgba(0, 0, 0, 0.4);
  animation: n-fade-in var(--n-dur) var(--n-ease);
}

/* ------------------------------------------------------------------ conversation frame */

.ask-main { position: relative; display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }

.ask-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  height: 52px;
  padding: 0 14px 0 20px;
  border-bottom: 1px solid var(--n-border);
}
.ask-nav, .ask-new-mini { display: none; }
.ask-bar__title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  font-size: 14px;
  font-weight: 650;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.ask-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex: none;
  height: 26px;
  padding: 0 12px 0 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--n-text) 7%, transparent);
  color: var(--n-text-muted);
  font-size: var(--n-fs-sm);
  font-weight: 600;
  white-space: nowrap;
  animation: n-fade-in var(--n-dur-slow) var(--n-ease);
}
.ask-pill .n-spinner { width: 12px; height: 12px; border-width: 1.5px; }

.ask-log { flex: 1; min-height: 0; }
.ask-log:focus-visible { outline-offset: -3px; }
.ask-log__inner {

  flex-direction: column;
  width: 100%;
  max-width: 820px;
  min-height: 100%;

.ask-msgs { display: flex; flex-direction: column; gap: 18px; }
.ask.is-empty .ask-msgs { margin: auto 0; }
.ask-notewrap { margin-top: 16px; }
.ask-notewrap:empty { margin: 0; }

/* ------------------------------------------------------------------ empty chat */

.ask-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0 8px;
  text-align: center;
  animation: n-fade-in var(--n-dur-slow) var(--n-ease);

.ask-hero__mark, .ask-unavail__mark {
  display: grid;
  place-items: center;
  flex: none;
  width: 60px;
  height: 60px;
  margin-bottom: 16px;
  border-radius: 20px;
  background: var(--n-accent-soft);
  color: color-mix(in srgb, var(--n-accent) 80%, var(--n-text));
  box-shadow: 0 10px 30px -12px var(--n-accent), inset 0 0 0 1px color-mix(in srgb, var(--n-accent) 22%, transparent);
}
.ask-hero__title { font-size: 26px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.2; }
.ask-hero__sub {
  max-width: 46ch;
  margin-top: 8px;
  color: var(--n-text-muted);
  font-size: calc(var(--n-fs) + 1px);
  line-height: 1.55;
}
.ask-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 620px; margin-top: 26px; }
.ask-chip {
  display: inline-flex;
  align-items: center;
  min-height: 38px;
  padding: 8px 15px;
  border: 1px solid var(--n-border);
  border-radius: 999px;
  background: var(--n-surface);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  color: var(--n-text);
  font-size: var(--n-fs);
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  transition: border-color var(--n-dur) var(--n-ease), background-color var(--n-dur) var(--n-ease), transform 90ms var(--n-ease);
}
.ask-chip:hover { border-color: color-mix(in srgb, var(--n-accent) 55%, var(--n-border)); background: var(--n-accent-soft); }
.ask-chip:active { transform: scale(0.97); }

/* ------------------------------------------------------------------ messages */

.ask-msg { display: flex; gap: 10px; min-width: 0; }
.ask-msg--new { animation: n-rise-in var(--n-dur-slow) var(--n-ease); }
.ask-msg--user { justify-content: flex-end; }

.ask-bubble {
  min-width: 0;
  color: var(--n-text);
  font-size: calc(var(--n-fs) + 1.8px);
  line-height: 1.62;
  overflow-wrap: anywhere;
}
.ask-msg--user .ask-bubble {
  max-width: min(82%, 640px);
  padding: 10px 15px;
  border: 1px solid color-mix(in srgb, var(--n-accent) 22%, transparent);
  border-radius: var(--n-radius-lg) var(--n-radius-lg) 5px var(--n-radius-lg);
  background: var(--n-accent-soft);
  white-space: pre-wrap;
}

.ask-avatar {
  display: grid;
  place-items: center;
  flex: none;
  width: 28px;
  height: 28px;
  margin-top: 2px;
  border-radius: 10px;
  background: var(--n-accent-soft);
  color: color-mix(in srgb, var(--n-accent) 80%, var(--n-text));
}
.ask-msg__body { display: flex; flex-direction: column; align-items: flex-start; flex: 0 1 auto; min-width: 0; max-width: calc(100% - 38px); }
.ask-msg--claude .ask-bubble {
  max-width: 100%;
  padding: 12px 16px 13px;
  border: 1px solid var(--n-border);
  border-radius: 5px var(--n-radius-lg) var(--n-radius-lg) var(--n-radius-lg);
  background: var(--n-surface);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
}

/* Claude's Markdown */
.ask-md > * + * { margin-top: 0.7em; }
.ask-md > .n-sr + * { margin-top: 0; }
.ask-md ul, .ask-md ol { padding-left: 1.35em; }
.ask-md ul { list-style: disc; }
.ask-md ol { list-style: decimal; }
.ask-md li + li { margin-top: 0.3em; }
.ask-md li > ul, .ask-md li > ol { margin-top: 0.3em; }
.ask-md li::marker { color: var(--n-text-faint); }
.ask-md .ask-h { margin-top: 1.1em; line-height: 1.3; }
.ask-md h3 { font-size: 1.17em; }
.ask-md h4 { font-size: 1.08em; }
.ask-md h5, .ask-md h6 { font-size: 1em; }
.ask-md h6 { color: var(--n-text-muted); }
.ask-md strong { font-weight: 700; }
.ask-md code {
  padding: 1px 5px;
  border-radius: 5px;
  background: color-mix(in srgb, var(--n-text) 8%, transparent);
  font-size: 0.88em;
}
.ask-md blockquote {
  padding: 2px 0 2px 13px;
  border-left: 3px solid var(--n-accent-soft);
  color: var(--n-text-muted);
}
.ask-md hr { margin: 1em 0; }
.ask-md .ask-a { text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 38%, transparent); text-underline-offset: 2px; }
.ask-md .ask-a:hover { text-decoration-color: currentColor; }

.ask-code {
  overflow: hidden;
  border: 1px solid var(--n-border);
  border-radius: var(--n-radius);
  background: color-mix(in srgb, var(--n-text) 5%, transparent);
}
.ask-code__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  height: 30px;
  padding: 0 5px 0 12px;
  border-bottom: 1px solid var(--n-border);
  color: var(--n-text-faint);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.ask-code__copy {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 8px;
  border-radius: 6px;
  color: var(--n-text-muted);
  font-size: 11.5px;
  font-weight: 600;
  transition: background-color var(--n-dur) var(--n-ease), color var(--n-dur) var(--n-ease);
}
.ask-code__copy:hover { background: color-mix(in srgb, var(--n-text) 9%, transparent); color: var(--n-text); }
.ask-code pre {
  margin: 0;
  padding: 11px 14px 12px;
  overflow-x: auto;
  font-family: var(--n-font-mono);
  font-size: 12.8px;
  line-height: 1.6;
  tab-size: 4;
}
.ask-md .ask-code code { padding: 0; background: none; font: inherit; white-space: pre; }

.ask-table { overflow-x: auto; border: 1px solid var(--n-border); border-radius: var(--n-radius-sm); }
.ask-table table { width: 100%; border-collapse: collapse; font-size: 0.94em; }
.ask-table th, .ask-table td { padding: 7px 12px; border-bottom: 1px solid var(--n-border); text-align: left; vertical-align: top; }
.ask-table th { background: color-mix(in srgb, var(--n-text) 5%, transparent); font-weight: 650; white-space: nowrap; }
.ask-table tr:last-child td { border-bottom: 0; }
.ask-table .is-right { text-align: right; }
.ask-table .is-center { text-align: center; }

/* thinking + streaming */
.ask-thinking { display: inline-flex; align-items: center; gap: 10px; color: var(--n-text-muted); }
.ask-dots { display: inline-flex; gap: 4px; }
.ask-dots i {
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: var(--n-accent);
  animation: ask-bounce 1.1s ease-in-out infinite;
}
.ask-dots i:nth-child(2) { animation-delay: 0.15s; }
.ask-dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes ask-bounce { 0%, 60%, 100% { transform: none; opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

.ask-msg.is-streaming .ask-md > p:last-child::after,
.ask-msg.is-streaming .ask-md > .ask-h:last-child::after,
.ask-msg.is-streaming .ask-md > :is(ul, ol):last-child > li:last-child::after {
  content: "";
  display: inline-block;
  width: 7px;
  height: 1em;
  margin-left: 3px;
  vertical-align: -0.14em;
  border-radius: 2px;
  background: var(--n-accent);
  animation: ask-blink 1s step-end infinite;
}
@keyframes ask-blink { 50% { opacity: 0; } }

/* per-answer actions + tags */
.ask-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 10px;
  min-height: 26px;
  margin: 4px 0 0 3px;
}
.ask-act {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 24px;
  padding: 0 8px;
  border-radius: 6px;
  color: var(--n-text-faint);
  font-size: 11.5px;
  font-weight: 600;
  transition: background-color var(--n-dur) var(--n-ease), color var(--n-dur) var(--n-ease);
}
.ask-act:hover { background: color-mix(in srgb, var(--n-text) 8%, transparent); color: var(--n-text); }
.ask-tag {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--n-text) 8%, transparent);
  color: var(--n-text-muted);
  font-size: 11px;
  font-weight: 600;
}
.ask-tag--warn {
  background: color-mix(in srgb, var(--n-danger) 12%, transparent);
  color: color-mix(in srgb, var(--n-danger) 72%, var(--n-text));
}
@media (hover: hover) {
  .ask-msg--claude .ask-meta { opacity: 0; transition: opacity var(--n-dur) var(--n-ease); }
  .ask-msg--claude:hover .ask-meta, .ask-msg--claude:focus-within .ask-meta, .ask-msg--claude:last-child .ask-meta { opacity: 1; }
}

.ask-link {
  display: inline;
  border-radius: 3px;
  color: color-mix(in srgb, var(--n-accent) 78%, var(--n-text));
  font-weight: 650;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
.ask-link:hover { color: var(--n-text); }

/* inline notes (errors, hints) + the permanent banner */
.ask-note, .ask-banner {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 9px;
  padding: 9px 13px;
  border: 1px solid var(--n-border);
  border-radius: var(--n-radius);
  background: color-mix(in srgb, var(--n-text) 4%, transparent);
  color: var(--n-text-muted);
  font-size: var(--n-fs);
  line-height: 1.45;
}
.ask-note { animation: n-rise-in var(--n-dur-slow) var(--n-ease); }
.ask-note > .n-icon, .ask-banner > .n-icon { flex: none; }
.ask-note--warn, .ask-banner {
  border-color: color-mix(in srgb, var(--n-accent) 30%, var(--n-border));
  background: color-mix(in srgb, var(--n-accent) 7%, transparent);
  color: var(--n-text);
}
.ask-note--warn > .n-icon, .ask-banner > .n-icon { color: color-mix(in srgb, var(--n-accent) 80%, var(--n-text)); }
.ask-note--error { border-color: color-mix(in srgb, var(--n-danger) 34%, transparent); background: color-mix(in srgb, var(--n-danger) 9%, transparent); color: var(--n-text); }
.ask-note--error > .n-icon { color: var(--n-danger); }
.ask-banner { flex: none; width: calc(100% - 56px); max-width: 764px; margin: 0 auto 8px; }

/* ------------------------------------------------------------------ composer */

.ask-composer { flex: none; width: 100%; max-width: 820px; margin: 0 auto; padding: 6px 28px 12px; }
.ask-box {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 6px 6px 6px 16px;
  border: 1px solid var(--n-border);
  border-radius: calc(var(--n-radius-lg) + 4px);
  background: var(--n-surface);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 10px 28px -16px rgba(0, 0, 0, 0.4);
  transition: border-color var(--n-dur) var(--n-ease), box-shadow var(--n-dur) var(--n-ease), opacity var(--n-dur) var(--n-ease);
}
.ask-box:hover { border-color: color-mix(in srgb, var(--n-border), var(--n-text) 16%); }
.ask-box:focus-within {
  border-color: var(--n-accent);
  box-shadow: 0 0 0 3px var(--n-accent-soft), 0 10px 28px -16px rgba(0, 0, 0, 0.4);
}
.ask[data-state="connecting"] .ask-box, .ask[data-state="blocked"] .ask-box { opacity: 0.62; }

.ask-input {
  display: block;
  flex: 1;
  min-width: 0;
  max-height: 168px;
  padding: 8px 0;
  overflow-y: hidden;
  border: 0;
  background: transparent;
  color: var(--n-text);
  font-size: calc(var(--n-fs) + 2px);
  line-height: 1.5;
  resize: none;
}
.ask-input.is-scroll { overflow-y: auto; }
.ask-input::placeholder { color: var(--n-text-faint); opacity: 1; }
.ask-input:focus, .ask-input:focus-visible { outline: none; }
.ask-input:disabled { cursor: not-allowed; }

.ask-send { width: 38px; height: 38px; border-radius: calc(var(--n-radius-lg) - 2px); }
.ask-send.is-stop {
  --_bg: color-mix(in srgb, var(--n-text) 14%, transparent);
  --_fg: var(--n-text);
  --_hover: color-mix(in srgb, var(--n-text) 22%, transparent);
  --_press: color-mix(in srgb, var(--n-text) 28%, transparent);
  box-shadow: none;
}

.ask-foot {
  margin: 8px 6px 0;
  color: var(--n-text-faint);
  font-size: 11.5px;
  line-height: 1.4;
  text-align: center;
}

/* ------------------------------------------------------------------ "lives in claude.ai" card */

.ask-unavail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; overflow: auto; }
.ask-unavail__card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 440px;
  padding: 36px 32px 32px;
  border: 1px solid var(--n-border);
  border-radius: calc(var(--n-radius-lg) + 6px);
  background: var(--n-surface);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 18px 48px -24px rgba(0, 0, 0, 0.4);
  text-align: center;
  animation: n-rise-in var(--n-dur-slow) var(--n-ease);
}
.ask-unavail__title { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
.ask-unavail__hint { max-width: 36ch; color: var(--n-text-muted); font-size: calc(var(--n-fs) + 1px); line-height: 1.55; }
.ask-unavail__actions { display: flex; flex-direction: column; align-items: stretch; gap: 8px; width: 100%; max-width: 300px; margin-top: 16px; }

/* ------------------------------------------------------------------ responsive (card width) */

@container app (max-width: 900px) {
  .ask-side { width: 240px; }
  .ask-log__inner { padding: 22px 22px 10px; }
  .ask-composer { padding: 6px 22px 12px; }
  .ask-banner { width: calc(100% - 44px); }
}

@container app (max-width: 719px) {
  .ask-side {
    position: absolute;
    inset: 0 auto 0 0;
    z-index: 30;
    width: min(310px, 88%);
    background: linear-gradient(var(--n-surface), var(--n-surface)), var(--n-page);
    box-shadow: var(--n-shadow);
    transform: translateX(-104%);
    visibility: hidden;
    transition: transform var(--n-dur-slow) var(--n-ease), visibility 0s linear var(--n-dur-slow);
  }
  .ask[data-nav="open"] .ask-side { transform: none; visibility: visible; transition-delay: 0s; }
  .ask-scrim { display: block; }
  .ask-close, .ask-nav, .ask-new-mini { display: inline-flex; }
  .ask-bar { height: 48px; padding: 0 8px; }
  .ask-bar__title { padding-left: 4px; }
  .ask-log__inner { padding: 18px 16px 8px; }
  .ask-composer { padding: 6px 12px 10px; }
  .ask-banner { width: calc(100% - 24px); }
  .ask-foot__keys { display: none; }
  .ask-input { font-size: 16px; }
  .ask-hero__title { font-size: 23px; }
  .ask-unavail__card { padding: 30px 22px 26px; }
}

@container app (max-width: 480px) {
  .ask-avatar { display: none; }
  .ask-msg__body { max-width: 100%; }
  .ask-msg--user .ask-bubble { max-width: 92%; }
  .ask-chips { flex-direction: column; align-items: stretch; gap: 8px; margin-top: 20px; }
  .ask-hero__mark { width: 52px; height: 52px; margin-bottom: 12px; border-radius: 17px; }
  .ask-hero__sub { font-size: var(--n-fs); }
}
/* ---- css/music.css ---- */
/* Nova music — the Spotify mini-player (music.js) and the Settings → Music section.
 * The widget is fixed in the bottom-right corner of the content card (music.js sets --mp-bottom / --mp-right), clear of
 * every page's header and toolbar; on narrow screens it is a bar under the card (--mp-left / --mp-right, and the card
 * gives up --mp-reserve of height, see shell.css). It sits under popovers, dialogs and toasts (.nv-layer is
 * z-index 100) and under the sidebar peek / drawer.
 * Colors come from theme tokens only; the floating surfaces are opaque on translucent themes.
 * Class names: .mp-… (widget), .mp-set-… (settings). Views: data-view="connect|idle|paused|playing". */

/* ================================================================== widget shell */

.mp {
  position: fixed;
  right: var(--mp-right, 22px);
  bottom: var(--mp-bottom, 14px);
  z-index: 20;
  max-width: calc(100% - 24px);
  color: var(--n-text);
  font-size: var(--n-fs);
  line-height: 1.3;
  pointer-events: none; /* only the pill / card themselves take the pointer */
}
.mp > * { pointer-events: auto; }

.mp[data-view="connect"] .mp-pill,
.mp[data-view="connect"] .mp-card,
.mp:not([data-view="connect"]) .mp-connect,
.mp[data-mode="expanded"] .mp-pill,
.mp[data-mode="collapsed"] .mp-card { display: none; }

/* narrow screens: a bar along the bottom, prev / next always showing (there is no hover on a phone) */
.mp[data-narrow="true"] { left: var(--mp-left, 8px); right: var(--mp-right, 8px); max-width: none; }
.mp[data-narrow="true"] .mp-pill,
.mp[data-narrow="true"] .mp-card { width: 100%; max-width: none; }
.mp[data-narrow="true"] .mp-connect { width: max-content; margin-left: auto; }
.mp[data-narrow="true"] .mp-btn--side { width: 30px; opacity: 1; pointer-events: auto; }

/* shared look of the two small floating pills */
.mp-pill,
.mp-connect {
  position: relative;
  display: flex;
  align-items: center;
  gap: 2px;
  height: 44px;
  padding: 5px;
  border: 1px solid var(--n-border);
  border-radius: 999px;
  background: linear-gradient(var(--n-surface), var(--n-surface)), var(--n-page);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22), 0 1px 2px rgba(0, 0, 0, 0.18);
  animation: n-rise-in 220ms var(--n-ease);
}

/* ================================================================== buttons */

.mp-btn,
.mp-x {
  display: grid;
  flex: none;
  place-items: center;
  border-radius: 999px;
  color: var(--n-text-muted);
  transition: color var(--n-dur) var(--n-ease), background-color var(--n-dur) var(--n-ease),
    transform 90ms var(--n-ease), opacity var(--n-dur) var(--n-ease), width var(--n-dur) var(--n-ease);
}
.mp-btn { width: 30px; height: 30px; }
.mp-x { width: 28px; height: 28px; }
.mp-btn:hover:not(:disabled),
.mp-x:hover:not(:disabled) { color: var(--n-text); background: color-mix(in srgb, var(--n-text) 11%, transparent); }
.mp-btn:active:not(:disabled),
.mp-x:active:not(:disabled) { transform: scale(0.93); }
.mp-btn:focus-visible,
.mp-x:focus-visible,
.mp-pill__main:focus-visible,
.mp-connect__btn:focus-visible { outline: 2px solid var(--n-accent); outline-offset: 1px; }
.mp-btn:disabled { opacity: 0.38; }

.mp-btn--play {
  width: 32px;
  height: 32px;
  background: var(--n-accent);
  color: var(--n-accent-text);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 1px 3px rgba(0, 0, 0, 0.25);
}
.mp-btn--play:hover:not(:disabled) {
  background: color-mix(in srgb, var(--n-accent) 86%, var(--n-accent-text));
  color: var(--n-accent-text);
}
.mp-btn--play svg { margin-left: 1px; } /* optical centering of the triangle */
.mp-btn--play[data-state="pause"] svg { margin-left: 0; }
.mp-flip { display: grid; place-items: center; transform: scaleX(-1); }

/* prev / next live inside the pill and slide open on hover, focus or (touch) tap */
.mp-btn--side {
  width: 0;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}
.mp-pill:hover .mp-btn--side,
.mp-pill:focus-within .mp-btn--side { width: 28px; opacity: 1; pointer-events: auto; }
.mp[data-view="idle"] .mp-pill .mp-btn { display: none; }

/* ================================================================== connect pill */

.mp-connect { height: 42px; padding: 4px; }
.mp-connect__btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 14px 0 12px;
  border-radius: 999px;
  background: var(--n-accent);
  color: var(--n-accent-text);
  font-weight: 650;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
  transition: background-color var(--n-dur) var(--n-ease), transform 90ms var(--n-ease);
}
.mp-connect__btn:hover:not(:disabled) { background: color-mix(in srgb, var(--n-accent) 88%, var(--n-accent-text)); }
.mp-connect__btn:active:not(:disabled) { transform: scale(0.97); }
.mp-connect__btn:disabled { opacity: 0.7; }

/* ================================================================== collapsed pill */

.mp-pill {
  width: max-content;
  min-width: 150px;
  max-width: min(310px, calc(100vw - 24px));
}
.mp-pill__main {
  display: flex;
  flex: 1 1 auto;
  align-items: center;
  gap: 10px;
  min-width: 0;
  height: 34px;
  padding: 0 10px 0 0;
  border-radius: 999px;
  text-align: left;
  transition: background-color var(--n-dur) var(--n-ease);
}
.mp-pill__main:hover { background: color-mix(in srgb, var(--n-text) 6%, transparent); }

.mp-art {
  position: relative;
  display: grid;
  flex: none;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 11px;
  overflow: hidden;
  background: var(--n-accent-soft);
  color: color-mix(in srgb, var(--n-accent) 75%, var(--n-text));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 1px 3px rgba(0, 0, 0, 0.28);
}
.mp-art__ph { display: grid; place-items: center; transition: opacity 200ms var(--n-ease); }
.mp-art__img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 240ms var(--n-ease);
}
.mp-art.has-img .mp-art__img { opacity: 1; }
.mp-art.has-img .mp-art__ph { opacity: 0; }
.mp-art--lg { width: 92px; height: 92px; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 6px 18px rgba(0, 0, 0, 0.32); }

.mp-marquee {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  font-weight: 600;
  white-space: nowrap;
  transition: opacity var(--n-dur) var(--n-ease);
}
.mp-marquee__txt { display: inline-block; }
.mp-marquee.is-scroll {
  -webkit-mask-image: linear-gradient(90deg, rgba(0, 0, 0, 1) calc(100% - 16px), rgba(0, 0, 0, 0));
  mask-image: linear-gradient(90deg, rgba(0, 0, 0, 1) calc(100% - 16px), rgba(0, 0, 0, 0));
}
.mp[data-view="playing"] .mp-marquee.is-scroll .mp-marquee__txt,
.mp-pill:hover .mp-marquee.is-scroll .mp-marquee__txt,
.mp-pill:focus-within .mp-marquee.is-scroll .mp-marquee__txt { animation: mp-slide var(--mp-dur, 9s) ease-in-out infinite; }
@keyframes mp-slide {
  0%, 18% { transform: translateX(0); }
  52%, 72% { transform: translateX(var(--mp-shift, 0)); }
  100% { transform: translateX(0); }
}
.mp[data-view="idle"] .mp-marquee { color: var(--n-text-muted); font-weight: 500; }
.mp[data-busy="true"] .mp-marquee,
.mp[data-busy="true"] .mp-meta { opacity: 0.55; }

/* thin progress line along the pill's lower edge */
.mp-pill__bar {
  position: absolute;
  left: 22px;
  right: 22px;
  bottom: 2px;
  height: 2px;
  border-radius: 2px;
  background: color-mix(in srgb, var(--n-text) 10%, transparent);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms var(--n-ease);
}
.mp-pill__bar i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--n-accent); transition: width 250ms linear; }
.mp[data-view="playing"] .mp-pill__bar,
.mp[data-view="paused"] .mp-pill__bar { opacity: 1; }
.mp[data-view="paused"] .mp-pill__bar i { opacity: 0.6; }

/* ================================================================== expanded card */

.mp-card {
  position: relative;
  display: grid;
  gap: 12px;
  width: 300px;
  max-width: calc(100vw - 24px);
  padding: 10px 14px 12px;
  border: 1px solid var(--n-border);
  border-radius: var(--n-radius-lg);
  background: linear-gradient(var(--n-surface), var(--n-surface)), var(--n-page);
  box-shadow: var(--n-shadow);
  overflow: hidden;
  isolation: isolate;
  transform-origin: bottom right;
  animation: n-pop-in 170ms var(--n-ease);
}

/* the album art, blurred, as a soft accent behind the top of the card */
.mp-glow {
  position: absolute;
  z-index: -1;
  top: -50px;
  left: -20%;
  width: 140%;
  max-width: none; /* base.css caps every img at 100% — the glow is wider than the card on purpose */
  height: 190px;
  object-fit: cover;
  filter: blur(34px) saturate(1.5);
  -webkit-mask-image: linear-gradient(rgba(0, 0, 0, 1), rgba(0, 0, 0, 0));
  mask-image: linear-gradient(rgba(0, 0, 0, 1), rgba(0, 0, 0, 0));
  opacity: 0;
  pointer-events: none;
  transition: opacity 500ms var(--n-ease);
}
.mp-glow.is-on { opacity: 0.34; }

.mp-card__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-right: -6px; }
.mp-brand {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--n-text-muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
.mp-brand .n-icon { color: color-mix(in srgb, var(--n-accent) 80%, var(--n-text)); }
.mp-card__tools { display: inline-flex; gap: 2px; }

.mp-card__body { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center; }
.mp-meta { display: grid; gap: 3px; min-width: 0; transition: opacity var(--n-dur) var(--n-ease); }
.mp-title {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  font-family: var(--n-font-display);
  font-size: 15px;
  font-weight: 650;
  line-height: 1.25;
  overflow-wrap: anywhere;
}
.mp-artist,
.mp-album { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-artist { color: var(--n-text-muted); font-size: var(--n-fs); }
.mp-album { color: var(--n-text-faint); font-size: var(--n-fs-sm); }
.mp-album:empty { display: none; }
.mp[data-view="idle"] .mp-artist {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  white-space: normal;
  font-size: var(--n-fs-sm);
  line-height: 1.45;
}

.mp-prog { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 9px; }
.mp-time { min-width: 3ch; color: var(--n-text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.mp-time--end { text-align: right; }
.mp-track {
  height: 4px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--n-text) 13%, transparent);
  overflow: hidden;
}
.mp-track i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--n-accent); transition: width 250ms linear; }
.mp[data-view="paused"] .mp-track i { opacity: 0.6; }

.mp-controls { display: flex; align-items: center; justify-content: center; gap: 12px; }
.mp-btn--lg { width: 38px; height: 38px; }
.mp-btn--xl { width: 48px; height: 48px; }

.mp-card__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-width: 0;
  padding-top: 10px;
  border-top: 1px solid var(--n-border);
  color: var(--n-text-muted);
  font-size: var(--n-fs-sm);
}
.mp-device { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.mp-device span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-device .n-icon { color: var(--n-text-faint); }
.mp-open {
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: 5px;
  margin-left: auto;
  padding: 3px 4px;
  border-radius: 6px;
  color: color-mix(in srgb, var(--n-accent) 78%, var(--n-text));
  font-weight: 650;
}
.mp-open:hover { text-decoration: underline; text-underline-offset: 3px; }
.mp-open:focus-visible { outline: 2px solid var(--n-accent); outline-offset: 1px; }

@media (prefers-reduced-motion: reduce) {
  .mp-marquee__txt { display: inline !important; animation: none !important; }
  .mp-marquee { text-overflow: ellipsis; }
  .mp-marquee.is-scroll { -webkit-mask-image: none; mask-image: none; }
}

/* ================================================================== Settings → Music */

.mp-set-status .set-sync__ic { color: color-mix(in srgb, var(--n-accent) 75%, var(--n-text)); background: var(--n-accent-soft); }
.set-sync.is-off.mp-set-status .set-sync__ic { color: var(--n-text-muted); background: color-mix(in srgb, var(--n-text) 8%, transparent); }
.mp-set-status .set-sync__actions { display: flex; align-self: center; flex: none; gap: 8px; }
.mp-set-link { color: color-mix(in srgb, var(--n-accent) 78%, var(--n-text)); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.mp-set-link:focus-visible { outline: 2px solid var(--n-accent); outline-offset: 2px; border-radius: 3px; }

.mp-adv { border: 1px solid var(--n-border); border-radius: var(--n-radius); background: var(--n-page); }
.mp-adv > summary {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-radius: var(--n-radius);
  font-weight: 600;
  list-style: none;
  cursor: pointer;
}
.mp-adv > summary::-webkit-details-marker { display: none; }
.mp-adv > summary:focus-visible { outline: 2px solid var(--n-accent); outline-offset: 2px; }
.mp-adv > summary .n-icon { color: var(--n-text-muted); transition: transform var(--n-dur) var(--n-ease); }
.mp-adv[open] > summary .n-icon { transform: rotate(180deg); }
.mp-adv__body { display: grid; gap: 10px; padding: 0 16px 16px; }
.mp-adv__row { display: flex; align-items: center; gap: 8px; }
.mp-adv__row .n-input { flex: 1 1 auto; font-family: var(--n-font-mono); font-size: 12px; }
.mp-adv__err { min-height: 0; color: var(--n-danger); font-size: var(--n-fs-sm); }
.mp-adv__err:empty { display: none; }

@media (max-width: 560px) {
  .mp-set-status.set-sync { flex-wrap: wrap; }
  .mp-set-status .set-sync__actions { width: 100%; }
  .mp-adv__row { flex-wrap: wrap; }
}
/* ---- css/selection.css ---- */
/* Highlight bubble + Ask Claude answer card (selection.js).
 * Both live in the floating layer (.nv-layer), are placed with fixed viewport coordinates by layout() and carry
 * data-side="top|bottom" (which side of the selection they sit on) and --sel-ax (where the little arrow points). */

.sel-bubble,
.sel-card {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 36; /* above the page, below menus / dialogs / toasts so those can still cover it */
  border: 1px solid var(--n-border);
  background: linear-gradient(var(--n-surface), var(--n-surface)), var(--n-page);
  color: var(--n-text);
  box-shadow: var(--n-shadow);
}
.sel-bubble[data-side="top"],
.sel-card[data-side="top"] { transform-origin: var(--sel-ax, 50%) 100%; }
.sel-bubble[data-side="bottom"],
.sel-card[data-side="bottom"] { transform-origin: var(--sel-ax, 50%) 0; }
.sel-bubble.is-in,
.sel-card.is-in { animation: sel-pop 150ms var(--n-ease); }
@keyframes sel-pop { from { opacity: 0; transform: translateY(3px) scale(0.95); } to { opacity: 1; transform: none; } }

/* the little arrow that points at the selection */
.sel-bubble::after,
.sel-card::after {
  content: "";
  position: absolute;
  left: var(--sel-ax, 50%);
  width: 10px;
  height: 10px;
  margin-left: -5px;
  border: 1px solid var(--n-border);
  background: inherit;
  transform: rotate(45deg);
  pointer-events: none;
}
.sel-bubble[data-side="top"]::after,
.sel-card[data-side="top"]::after { bottom: -6px; border-top-color: transparent; border-left-color: transparent; }
.sel-bubble[data-side="bottom"]::after,
.sel-card[data-side="bottom"]::after { top: -6px; border-bottom-color: transparent; border-right-color: transparent; }
.sel-bubble:not([data-side])::after,
.sel-card:not([data-side])::after { display: none; }

/* ------------------------------------------------------------------ the bubble */

.sel-bubble {
  display: flex;
  align-items: center;
  gap: 2px;
  max-width: calc(100% - 16px);
  padding: 4px;
  border-radius: 13px;
  user-select: none;
  -webkit-user-select: none;
}

.sel-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  height: 30px;
  padding: 0 11px 0 9px;
  border-radius: 9px;
  color: var(--n-text);
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  transition: background-color var(--n-dur) var(--n-ease), color var(--n-dur) var(--n-ease), transform 90ms var(--n-ease);
}
.sel-btn .n-icon { flex: none; opacity: 0.85; }
.sel-btn:hover { background: color-mix(in srgb, var(--n-text) 9%, transparent); }
.sel-btn:active { transform: scale(0.96); }
.sel-btn:focus-visible { outline: 2px solid var(--n-accent); outline-offset: -2px; }

.sel-btn--ask {
  margin-right: 3px;
  background: var(--n-accent-soft);
  color: color-mix(in srgb, var(--n-accent) 72%, var(--n-text));
}
.sel-btn--ask .n-icon { opacity: 1; }
.sel-btn--ask:hover { background: color-mix(in srgb, var(--n-accent) 30%, transparent); color: color-mix(in srgb, var(--n-accent) 60%, var(--n-text)); }
.sel-ext { margin-left: -2px; font-size: 11px; opacity: 0.7; }

@media (max-width: 340px) {
  .sel-btn { padding: 0 9px; }
  .sel-btn:not(.sel-btn--ask) > span {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
}

/* ------------------------------------------------------------------ the answer card */

.sel-card {
  display: flex;
  flex-direction: column;
  width: min(380px, calc(100% - 16px));
  max-height: var(--sel-max, 460px);
  border-radius: var(--n-radius-lg);
  font-size: 13px;
}

.sel-card__head { display: flex; align-items: center; gap: 8px; flex: none; padding: 9px 8px 4px 12px; }
.sel-card__mark {
  display: grid;
  place-items: center;
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: var(--n-accent-soft);
  color: color-mix(in srgb, var(--n-accent) 80%, var(--n-text));
}
.sel-card__title { font-family: var(--n-font-display); font-size: 13.5px; font-weight: 650; letter-spacing: -0.01em; }
.sel-x {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  margin-left: auto;
  border-radius: 7px;
  color: var(--n-text-faint);
  transition: background-color var(--n-dur) var(--n-ease), color var(--n-dur) var(--n-ease);
}
.sel-x:hover { background: color-mix(in srgb, var(--n-text) 9%, transparent); color: var(--n-text); }

.sel-quote {
  flex: none;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
  margin: 2px 12px 8px;
  padding: 2px 0 2px 10px;
  border-left: 3px solid var(--n-accent-soft);
  color: var(--n-text-muted);
  font-size: 12px;
  line-height: 1.45;
  overflow-wrap: anywhere;
  white-space: pre-line;
}

.sel-chips { display: flex; flex-wrap: wrap; gap: 5px; flex: none; padding: 0 12px 8px; }
.sel-chip { height: 24px; padding: 0 10px; font-size: 12px; }
.sel-chip:disabled { opacity: 0.45; cursor: default; }
.sel-chip:focus-visible { outline: 2px solid var(--n-accent); outline-offset: 1px; }

.sel-body {
  flex: 1 1 auto;
  min-height: 72px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 2px 14px 10px;
  border-top: 1px solid var(--n-border);
  padding-top: 10px;
  color: var(--n-text);
  font-size: 13.5px;
  line-height: 1.55;
  overflow-wrap: anywhere;
  user-select: text;
  -webkit-user-select: text;
}
.sel-body:focus-visible { outline-offset: -2px; }
.sel-thread > * + * { margin-top: 10px; }
.sel-you {
  max-width: 88%;
  margin-left: auto;
  padding: 6px 11px;
  border: 1px solid color-mix(in srgb, var(--n-accent) 22%, transparent);
  border-radius: 12px 12px 4px 12px;
  background: var(--n-accent-soft);
  font-size: 13px;
  line-height: 1.45;
  white-space: pre-wrap;
}
.sel-ans { min-width: 0; }
.sel-ans .ask-code pre { font-size: 12px; }
.sel-ans .ask-table { font-size: 12.5px; }
.sel-ans .ask-tag { margin-top: 6px; }
.sel-ans.is-streaming > p:last-child::after,
.sel-ans.is-streaming > .ask-h:last-child::after,
.sel-ans.is-streaming > :is(ul, ol):last-child > li:last-child::after {
  content: "";
  display: inline-block;
  width: 6px;
  height: 1em;
  margin-left: 3px;
  vertical-align: -0.14em;
  border-radius: 2px;
  background: var(--n-accent);
  animation: ask-blink 1s step-end infinite;
}

.sel-notewrap:not(:empty) { margin-top: 10px; }
.sel-note {
  display: flex;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 4px 8px;
  padding: 8px 10px;
  border: 1px solid var(--n-border);
  border-radius: 10px;
  background: color-mix(in srgb, var(--n-text) 5%, transparent);
  color: var(--n-text-muted);
  font-size: 12.5px;
  line-height: 1.45;
}
.sel-note > .n-icon { flex: none; margin-top: 2px; }
.sel-note > span { flex: 1 1 160px; min-width: 0; }
.sel-note--warn {
  border-color: color-mix(in srgb, var(--n-accent) 28%, transparent);
  background: var(--n-accent-soft);
  color: var(--n-text);
}
.sel-note--error {
  border-color: color-mix(in srgb, var(--n-danger) 30%, transparent);
  background: color-mix(in srgb, var(--n-danger) 10%, transparent);
  color: var(--n-text);
}
.sel-note--error > .n-icon { color: var(--n-danger); }

.sel-foot { flex: none; padding: 8px 12px 9px; border-top: 1px solid var(--n-border); }
.sel-ask { display: flex; align-items: center; gap: 6px; }
.sel-input { flex: 1 1 auto; min-width: 0; height: 32px; font-size: 13px; }
.sel-send { flex: none; }
.sel-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 4px; margin-top: 6px; }

.sel-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 24px;
  padding: 0 8px;
  border-radius: 6px;
  color: var(--n-text-muted);
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  transition: background-color var(--n-dur) var(--n-ease), color var(--n-dur) var(--n-ease);
}
.sel-link:hover { background: color-mix(in srgb, var(--n-text) 8%, transparent); color: var(--n-text); }
.sel-link--go { margin-left: auto; color: color-mix(in srgb, var(--n-accent) 72%, var(--n-text)); }
.sel-link--go:hover { background: var(--n-accent-soft); color: color-mix(in srgb, var(--n-accent) 60%, var(--n-text)); }
.sel-note .sel-link { margin: -2px 0 -2px -4px; }

@media (pointer: coarse) {
  .sel-input { font-size: 16px; } /* no zoom-on-focus on phones */
  .sel-btn { height: 36px; }
  .sel-x { width: 32px; height: 32px; }
  .sel-link { height: 30px; }
  .sel-chip { height: 30px; }
}
</style>

/* Nova theme engine. Works as a classic browser script (window.NovaTheme) and as a CommonJS
 * module in the main process (require('../shared/theme.js')). See SPEC.md §5.2. */
(function (root, factory) {

  else root.NovaTheme = factory();
})(typeof self !== 'undefined' ? self : this, function () {

  const MONO_FALLBACK = 'ui-monospace, "SF Mono", Menlo, monospace';

  function clamp(n, lo, hi, dflt) {
    n = Number(n);
    if (!Number.isFinite(n)) return dflt;
    return Math.min(hi, Math.max(lo, n));
  }

  function hexToRgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
    if (!m) return null;
    const v = parseInt(m[1], 16);
    return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
  }

  // Text color that stays readable on top of the accent.
  function textOn(hex) {
    const c = hexToRgb(hex);
    if (!c) return '#ffffff';
    const lin = (x) => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); };
    const L = 0.2126 * lin(c.r) + 0.7152 * lin(c.g) + 0.0722 * lin(c.b);
    return L > 0.45 ? '#111114' : '#ffffff';

  function findTheme(data, id, dark) {

  // artifact viewer) wins over the OS preference.

    const vars = Object.assign({}, base);

    const accent = hexToRgb(settings.accent) ? settings.accent : vars['--n-accent'];

    vars['--n-accent-text'] = hexToRgb(accent) ? textOn(accent) : (scheme === 'dark' ? '#111114' : '#ffffff');
    vars['--n-accent-soft'] = 'color-mix(in srgb, ' + accent + ' 20%, transparent)';

    // Wallpaper replaces the frame. If its tone fights the theme's text color, add a scrim
    // to the sidebar so text stays readable.
    const wp = settings.wallpaper;
    if (wp === 'custom' && settings.customWallpaper) {
      vars['--n-frame'] = 'url("' + String(settings.customWallpaper).replace(/"/g, '%22') + '") center / cover no-repeat, ' + (theme.windowBg || '#000');

    } else if (wp && wp !== 'none') {
      const w = ((data && data.wallpapers) || []).find((x) => x.id === wp);

        if (w.tone !== scheme) {
          vars['--n-sidebar'] = scheme === 'dark' ? 'rgba(8, 8, 14, 0.55)' : 'rgba(255, 255, 255, 0.62)';

    const r = clamp(settings.cornerRadius, 0, 20, 10);
    vars['--n-radius'] = r + 'px';

    vars['--n-inset'] = clamp(settings.contentInset, 0, 16, 8) + 'px';
    vars['--n-sidebar-w'] = clamp(settings.sidebarWidth, 200, 360, 248) + 'px';

    vars['--n-font'] = fonts[settings.font] || fonts.system || 'system-ui, sans-serif';

      scheme,

  function apply(settings, data, el) {
    settings = settings || {};
    const target = el || document.documentElement;

    ds.vibrancy = res.vibrancy ? 'true' : 'false';

    return res;
  }

  }

  /** Call `cb(isDark)` whenever the OS appearance or the host's data-theme changes.
   *  Returns unsubscribe. */
  function watchSystem(cb) {
    if (typeof matchMedia !== 'function') return function () {};
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const fn = function () { cb(systemPrefersDark()); };
    mq.addEventListener('change', fn);
    let mo = null;
    if (typeof MutationObserver === 'function' && typeof document !== 'undefined') {
      mo = new MutationObserver(fn);
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    }
    return function () { mq.removeEventListener('change', fn); if (mo) mo.disconnect(); };
  }

  return { resolve, apply, previewVars, watchSystem, textOn, systemPrefersDark };
});

<script>
/* ---- web/src/js/web-themes.js ---- */
/* Nova web theme adaptations (SPEC §3.2).
 * Runs once, right after theme.js, and MUTATES window.NOVA_THEMES in place (the object the build
 * injected from src/shared/themes.json). window.NOVA_THEMES_WEB points at the same object, and core
 * exposes it as Nova.themes. Everything downstream (NovaTheme.apply/previewVars, settings gallery,
 * quick-theme popover) reads this adapted data. */
(function () {
  'use strict';

  const data = window.NOVA_THEMES;
  if (!data || !Array.isArray(data.themes)) {
    console.error('[nova] NOVA_THEMES missing — the build did not inject themes.json');
    window.NOVA_THEMES = window.NOVA_THEMES_WEB = { themes: [], wallpapers: [], fonts: {}, searchEngines: {}, choices: [], fontList: [], accents: [] };
    return;
  }
  if (data.__web) return; // already adapted

  // 1. Native window blur doesn't exist in a browser tab → drop vibrancy themes ("Glass").
  data.themes = data.themes.filter((t) => !t.vibrancy);

  // 2. Web fonts (loaded from Google Fonts by the page) with real system fallbacks.
  data.fonts = {
    system: '"Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif',
    rounded: '"Nunito", ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", system-ui, sans-serif',
    serif: '"Fraunces", ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif',
    mono: '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace',
  };
  data.fontList = [
    { id: 'system', label: 'Clean', stack: data.fonts.system },
    { id: 'rounded', label: 'Rounded', stack: data.fonts.rounded },
    { id: 'serif', label: 'Serif', stack: data.fonts.serif },
    { id: 'mono', label: 'Mono', stack: data.fonts.mono },
  ];

  // 3. No suggestion APIs on the web (no external fetch) → keep only name + search URL.
  const engines = {};
  for (const id in data.searchEngines || {}) {
    const e = data.searchEngines[id];
    engines[id] = { name: e.name, search: e.search };
  }
  data.searchEngines = engines;

  // 4. Theme choices for pickers: the 'auto' pseudo-theme first (theme.js maps it to Midnight in
  //    dark mode, Daylight in light mode), then every real theme. `auto` is NOT added to `themes`.
  data.choices = [{ id: 'auto', name: 'Auto', scheme: 'system', auto: true, hint: 'Follows your device: Midnight at night, Daylight by day' }]
    .concat(data.themes.map((t) => ({ id: t.id, name: t.name, scheme: t.scheme })));

  // 5. Accent presets shared by the quick-theme popover and Settings (null = theme default).
  data.accents = [
    { id: 'violet', name: 'Violet', color: '#8b7cff' },
    { id: 'blue', name: 'Blue', color: '#3b82f6' },
    { id: 'teal', name: 'Teal', color: '#14b8a6' },
    { id: 'green', name: 'Green', color: '#22c55e' },
    { id: 'amber', name: 'Amber', color: '#f59e0b' },
    { id: 'orange', name: 'Orange', color: '#f97316' },
    { id: 'rose', name: 'Rose', color: '#f43f5e' },
    { id: 'pink', name: 'Pink', color: '#ec4899' },
  ];

  // 6. Placeholder and "quiet" text (--n-text-faint) sits at 2.3–3.6:1 in the shared themes; move it most of the way to
  //    the muted tone (70%) so search boxes, "+ New tab" and hints reach about 4.5:1 while staying a step quieter than muted.
  data.themes.forEach((t) => {
    [t.vars, t.darkVars].forEach((vars) => {
      if (vars && vars['--n-text-muted'] && vars['--n-text-faint']) {
        vars['--n-text-faint'] = 'color-mix(in srgb, ' + vars['--n-text-muted'] + ' 70%, ' + vars['--n-text-faint'] + ')';
      }
    });
  });

  data.__web = true;
  window.NOVA_THEMES_WEB = data;
})();
</script>
<script>
/* ---- web/src/js/store.js ---- */
/* Nova store — local-first storage with optional sync through the claude.ai `db` capability (SPEC §5).
 * Exposes window.NovaStore. Core wraps it as Nova.settings / Nova.data / Nova.local / Nova.sync;
 * apps should not use NovaStore directly.
 *
 * Local:  localStorage 'nova:v1:<key>' → { v: value, t: updatedAtMs }, mirrored in memory. Every
 *         access is wrapped; if storage is blocked the in-memory map keeps the session working.
 * Sync:   artifact only. One doc per synced key at data/users/<uid>/<key> = { v, t, device }.
 *         Newer `t` wins. One subscription per key, debounced pushes, one write in flight per doc. */
(function () {
  'use strict';

  const PREFIX = 'nova:v1:';
  const SYNCED = ['settings', 'links', 'notes', 'tasks'];
  const LABELS = { settings: 'Settings', links: 'Quick links', notes: 'Notes', tasks: 'Tasks' };
  const PUSH_DELAY = 700;
  const MAX_SYNC_BYTES = 240 * 1024;
  const CONNECT_TIMEOUT = 15000;

  const mem = new Map();          // key → { v, t }  (cache + fallback when localStorage fails)
  const changeListeners = new Set();
  const syncListeners = new Set();
  let storageOk = probeStorage();
  let warnedQuota = false;
  const failedKeys = new Set();   // keys whose last localStorage write threw (full or blocked): they live in memory only
  const saveListeners = new Set();

  // ---------------------------------------------------------------- local

  function probeStorage() {
    try {
      const k = PREFIX + '__probe';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (_) { return false; }
  }

  function clone(v) {
    if (v === undefined) return undefined;
    try { return JSON.parse(JSON.stringify(v)); } catch (_) { return undefined; }
  }

  function toJson(v) {
    try { return JSON.stringify(v === undefined ? null : v); } catch (_) { return 'null'; }
  }

  function normalizeRecord(obj) {
    if (!obj || typeof obj !== 'object' || !('v' in obj)) return null;
    return { v: obj.v, t: Number(obj.t) || 0 };
  }

  function readRecord(key) {
    if (mem.has(key)) return mem.get(key);
    if (!storageOk) return null;
    try {
      const raw = window.localStorage.getItem(PREFIX + key);
      const rec = raw ? normalizeRecord(JSON.parse(raw)) : null;
      if (rec) mem.set(key, rec);
      return rec;
    } catch (_) { return null; }
  }

  /** Is localStorage really keeping what we write? (For one key, or for all of them.) */
  function saveOk(key) {
    if (!storageOk) return false;
    return key ? !failedKeys.has(key) : failedKeys.size === 0;
  }

  function markSave(key, ok) {
    if (ok ? !failedKeys.delete(key) : failedKeys.has(key)) return;
    if (!ok) failedKeys.add(key);
    saveListeners.forEach((fn) => { try { fn(saveOk(), key); } catch (err) { console.error('[nova] store listener failed', err); } });
  }

  function writeRecord(key, rec) {
    mem.set(key, rec);
    if (!storageOk) return;
    try {
      window.localStorage.setItem(PREFIX + key, JSON.stringify(rec));
      markSave(key, true);
    } catch (err) {
      markSave(key, false);
      if (!warnedQuota) {
        warnedQuota = true;
        console.warn('[nova] could not save "' + key + '" to localStorage — keeping it in memory for this visit', err);
      }
    }
  }

  function notify(key, value, source) {
    changeListeners.forEach((fn) => {
      try { fn(key, value, source); } catch (err) { console.error('[nova] store listener failed', err); }
    });
  }

  /** Value for a key (a fresh clone), or `dflt` when nothing is stored. */
  function get(key, dflt) {
    const rec = readRecord(key);
    return rec ? clone(rec.v) : dflt;
  }

  /** { v, t } for a key (v cloned), or null. */
  function getRecord(key) {
    const rec = readRecord(key);
    return rec ? { v: clone(rec.v), t: rec.t } : null;
  }

  /** Save locally now; synced keys are pushed (debounced). Returns false when nothing changed. */
  function set(key, value) {
    const prev = readRecord(key);
    const json = toJson(value);
    if (prev && toJson(prev.v) === json) return false;
    // Monotonic per key, so two quick edits never share a timestamp.
    const t = Math.max(Date.now(), prev ? prev.t + 1 : 0);
    writeRecord(key, { v: JSON.parse(json), t });
    notify(key, JSON.parse(json), 'local');
    if (SYNCED.indexOf(key) !== -1) schedulePush(key);
    return true;
  }

  function remove(key) {
    mem.delete(key);
    if (!storageOk) return;
    try { window.localStorage.removeItem(PREFIX + key); } catch (_) { /* ignore */ }
  }

  function onChange(fn) {
    changeListeners.add(fn);
    return () => changeListeners.delete(fn);
  }

  /** fn(allSavesOk, key) whenever a key starts or stops failing to save. */
  function onSaveState(fn) {
    saveListeners.add(fn);
    return () => saveListeners.delete(fn);
  }

  function isSynced(key) { return SYNCED.indexOf(key) !== -1; }

  function deviceId() {
    let id = get('device');
    if (typeof id !== 'string' || !id) {
      id = 'd-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
      writeRecord('device', { v: id, t: Date.now() });
    }
    return id;
  }

  // Another browser tab of Nova changed a key → refresh our mirror and tell core.
  window.addEventListener('storage', (e) => {
    if (!e.key || e.key.indexOf(PREFIX) !== 0) return;
    const key = e.key.slice(PREFIX.length);
    let rec = null;
    try { rec = e.newValue ? normalizeRecord(JSON.parse(e.newValue)) : null; } catch (_) { rec = null; }
    const cur = mem.get(key);
    if (!rec) { mem.delete(key); notify(key, undefined, 'storage'); return; }
    if (cur && cur.t === rec.t) return;
    mem.set(key, rec);
    notify(key, clone(rec.v), 'storage');
  });

  // ---------------------------------------------------------------- sync

  const docs = {};               // key → per-doc sync state
  let started = false;
  let active = false;
  let db = null;
  let uid = null;
  let lastError = '';
  let status = { state: 'off', message: '', lastSyncedAt: 0 };

  function emitSync(next) {
    const same = next.state === status.state && next.message === status.message &&
      !next.notify && JSON.stringify(next.keys || null) === JSON.stringify(status.keys || null);
    status = Object.assign({ lastSyncedAt: status.lastSyncedAt }, next);
    if (same) return;
    const payload = Object.assign({}, status);
    syncListeners.forEach((fn) => {
      try { fn(payload); } catch (err) { console.error('[nova] sync listener failed', err); }
    });
    delete status.notify;
  }

  function onSync(fn) {
    syncListeners.add(fn);
    return () => syncListeners.delete(fn);
  }

  function syncStatus() { return Object.assign({}, status); }

  function refreshState() {
    if (!active) return;
    const list = Object.keys(docs).map((k) => docs[k]);
    if (list.some((d) => d.inFlight || d.timer)) return emitSync({ state: 'saving', message: 'Saving…' });
    if (lastError) return emitSync({ state: 'error', message: lastError });
    const big = list.filter((d) => d.tooBig);
    if (big.length) {
      const names = big.map((d) => LABELS[d.key] || d.key).join(' and ');
      return emitSync({
        state: 'error', warning: true, keys: big.map((d) => d.key),
        message: names + (big.length > 1 ? ' are' : ' is') + ' too big to sync — saved on this device only',
      });
    }
    if (list.some((d) => !d.remoteSeen)) return emitSync({ state: 'connecting', message: 'Connecting…' });
    emitSync({ state: 'synced', message: 'Synced' });
  }

  function codeOf(err) {
    if (!err) return '';
    if (typeof err === 'string') return err;
    const direct = err.code ? String(err.code) : '';
    if (direct) return direct;
    const m = /\b(unavailable|revoked|not_granted|capability_[a-z_]+|quota_exceeded)\b/.exec(String(err.message || ''));
    return m ? m[1] : String(err.name || 'unknown');
  }

  function classify(code) {
    if (code === 'unavailable') return 'retry';
    if (code === 'revoked' || code === 'not_granted' || code.indexOf('capability_') === 0) return 'off';
    if (code === 'quota_exceeded') return 'quota';
    return 'error';
  }

  function withTimeout(p, ms) {
    return Promise.race([Promise.resolve(p), new Promise((res) => setTimeout(() => res(null), ms))]);
  }

  async function startSync() {
    if (started) return;
    started = true;
    const c = window.claude;
    if (!c || typeof c.use !== 'function') {
      emitSync({ state: 'off', message: 'Sync works in the claude.ai version of Nova' });
      return;
    }
    emitSync({ state: 'connecting', message: 'Connecting…' });
    let dbCap = null;
    let userCap = null;
    try {
      const caps = await Promise.all([withTimeout(c.use('db'), CONNECT_TIMEOUT), withTimeout(c.use('user'), CONNECT_TIMEOUT)]);
      dbCap = caps[0];
      userCap = caps[1];
    } catch (err) {
      return failConnect(err);
    }
    if (!dbCap || !userCap || typeof dbCap.doc !== 'function') {
      emitSync({ state: 'off', message: 'Sync isn’t turned on for this page' });
      return;
    }
    let id = null;
    try { id = await withTimeout(userCap.id(), CONNECT_TIMEOUT); } catch (err) { return failConnect(err); }
    if (!id) {
      emitSync({ state: 'off', message: 'Sign in to claude.ai to sync' });
      return;
    }
    db = dbCap;
    uid = String(id).replace(/\//g, '_');
    active = true;
    SYNCED.forEach(attach);
    refreshState();
  }

  function failConnect(err) {
    const kind = classify(codeOf(err));
    if (kind === 'off') emitSync({ state: 'off', message: 'Sync is turned off for this page' });
    else emitSync({ state: 'error', message: 'Couldn’t connect to sync' });
  }

  function attach(key) {
    if (docs[key]) return;
    docs[key] = {
      key, ref: null, unsub: null, timer: null, fallback: null, inFlight: false, pending: false,
      remoteSeen: false, lastSyncedJson: null, tooBig: false, retries: 0, subRetries: 0,
    };
    subscribe(docs[key]);
  }

  function subscribe(d) {
    try {
      d.ref = db.doc('data/users/' + uid + '/' + d.key);
      const un = d.ref.onSnapshot((snap) => onSnapshot(d, snap), (err) => onSubscribeError(d, err));
      d.unsub = typeof un === 'function' ? un : null;
    } catch (err) {
      onSubscribeError(d, err);
      return;
    }
    // Hosts normally deliver an initial snapshot; if one never comes, read the doc once.
    clearTimeout(d.fallback);
    d.fallback = setTimeout(() => {
      if (!active || d.remoteSeen || !d.ref || typeof d.ref.get !== 'function') return;
      Promise.resolve(d.ref.get()).then((snap) => onSnapshot(d, snap), (err) => onSubscribeError(d, err));
    }, 6000);
  }

  function readSnapshot(snap) {
    try {
      if (!snap) return null;
      const exists = typeof snap.exists === 'function' ? snap.exists() : !!snap.exists;
      if (!exists) return null;
      const body = typeof snap.data === 'function' ? snap.data() : snap.data;
      return body && typeof body === 'object' && 'v' in body ? body : null;
    } catch (_) { return null; }
  }

  // Decide who wins. Never writes from here — pushes are scheduled on a timer.
  function onSnapshot(d, snap) {
    if (!active) return;
    d.remoteSeen = true;
    d.subRetries = 0;
    clearTimeout(d.fallback);
    const body = readSnapshot(snap);
    const local = readRecord(d.key);
    const lt = local ? local.t : 0;
    if (body) {
      const rt = Number(body.t) || 0;
      d.lastSyncedJson = toJson(body.v);
      if (rt > lt) {
        writeRecord(d.key, { v: clone(body.v), t: rt });
        notify(d.key, clone(body.v), 'remote');
      } else if (lt > rt) {
        schedulePush(d.key);
      }
    } else {
      d.lastSyncedJson = null;
      if (local) schedulePush(d.key);
    }
    refreshState();
  }

  function onSubscribeError(d, err) {
    const kind = classify(codeOf(err));
    if (kind === 'retry' && d.subRetries < 1) {
      d.subRetries += 1;
      if (typeof d.unsub === 'function') { try { d.unsub(); } catch (_) { /* ignore */ } }
      d.unsub = null;
      setTimeout(() => { if (active) subscribe(d); }, 1000 + Math.random() * 2000);
      return;
    }
    handleFailure(kind, codeOf(err));
  }

  function schedulePush(key) {
    const d = docs[key];
    if (!active || !d) return; // the first snapshot will compare and push
    clearTimeout(d.timer);
    d.retries = 0; // each new change earns one retry
    d.timer = setTimeout(() => { d.timer = null; flush(d); }, PUSH_DELAY);
    refreshState();
  }

  async function flush(d) {
    if (!active || !d.ref || !d.remoteSeen) return refreshState();
    if (d.inFlight) { d.pending = true; return; }
    const rec = readRecord(d.key);
    if (!rec) return refreshState();
    const json = toJson(rec.v);
    if (json === d.lastSyncedJson) { d.tooBig = false; return refreshState(); }
    const bytes = new TextEncoder().encode(json).length;
    if (bytes > MAX_SYNC_BYTES) {
      d.tooBig = true;
      return refreshState();
    }
    d.tooBig = false;
    d.inFlight = true;
    refreshState();
    let failure = null;
    try {
      await d.ref.set({ v: JSON.parse(json), t: rec.t, device: deviceId() });
    } catch (err) {
      failure = err;
    }
    d.inFlight = false;
    if (!active) return;
    if (failure) {
      const code = codeOf(failure);
      const kind = classify(code);
      if (kind === 'retry' && d.retries < 1) {
        d.retries += 1;
        d.timer = setTimeout(() => { d.timer = null; flush(d); }, 1000 + Math.random() * 2000);
        refreshState();
      } else {
        handleFailure(kind, code);
      }
      d.pending = false; // the failed value is retried on the next change (or retrySync)
      return;
    }
    d.lastSyncedJson = json;
    d.retries = 0;
    lastError = '';
    status.lastSyncedAt = Date.now();
    if (d.pending) { d.pending = false; flush(d); return; }
    refreshState();
  }

  function handleFailure(kind, code) {
    if (kind === 'off') { stopSync('Sync was turned off for this page'); return; }
    if (kind === 'quota') {
      lastError = 'Sync storage is full — changes are saved on this device only';
      emitSync({ state: 'error', message: lastError, notify: true }); // core turns notify into a toast
      return;
    }
    lastError = kind === 'retry' ? 'Can’t reach sync right now — will try again on your next change'
      : 'Sync hit a problem (' + (code || 'unknown') + ')';
    refreshState();
  }

  function stopSync(message) {
    active = false;
    Object.keys(docs).forEach((k) => {
      const d = docs[k];
      clearTimeout(d.timer);
      clearTimeout(d.fallback);
      if (typeof d.unsub === 'function') { try { d.unsub(); } catch (_) { /* ignore */ } }
      delete docs[k];
    });
    emitSync({ state: 'off', message: message || 'Sync is off' });
  }

  /** Push every pending change right away (page hiding, coming back online, manual retry). */
  function flushAll() {
    if (!active) return;
    Object.keys(docs).forEach((k) => {
      const d = docs[k];
      if (d.timer) { clearTimeout(d.timer); d.timer = null; }
      flush(d);
    });
  }

  function retrySync() {
    lastError = '';
    Object.keys(docs).forEach((k) => { docs[k].retries = 0; });
    flushAll();
    refreshState();
  }

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
  window.addEventListener('pagehide', flushAll);
  window.addEventListener('online', retrySync);

  window.NovaStore = {
    PREFIX,
    SYNCED: SYNCED.slice(),
    MAX_SYNC_BYTES,
    get,
    getRecord,
    set,
    remove,
    onChange,
    isSynced,
    deviceId,
    storageAvailable: () => storageOk,
    saveOk,
    onSaveState,
    startSync,
    stopSync,
    flushAll,
    retrySync,
    syncStatus,
    onSync,
  };
})();
</script>

    if (/^\d+$/.test(raw)) return Number(raw);
    const m = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/.exec(raw);
    return m ? (Number(m[1] || 0) * 3600 + Number(m[2] || 0) * 60 + Number(m[3] || 0)) : 0;
  }

  /** Rewrite a page URL into its embeddable form (YouTube/Spotify/Scratch embeds, Google results in igu=1 mode). Unknown URLs come back normalized. */
  function toEmbedUrl(url) {
    const u = parse(url);
    if (!u) return String(url || '');
    const yt = youtubeId(u);
    if (yt && /^[\w-]{6,}$/.test(yt)) {
      const start = youtubeStart(u);
      return 'https://www.youtube-nocookie.com/embed/' + yt + (start ? '?start=' + start : '');
    }
    const h = u.hostname.toLowerCase();
    if (h === 'open.spotify.com') {
      const m = /^\/(?:intl-[\w-]+\/)?(track|album|playlist|episode|show|artist)\/([A-Za-z0-9]+)/.exec(u.pathname);
      if (m) return 'https://open.spotify.com/embed/' + m[1] + '/' + m[2];
    }
    if (h === 'www.google.com' && u.pathname === '/search' && !u.searchParams.has('igu')) { // results only frame in embeddable mode
      u.searchParams.set('igu', '1');
      return u.href;
    }
    if (bareHost(u) === 'scratch.mit.edu') {
      const m = /^\/projects\/(\d+)\/?$/.exec(u.pathname);
      if (m) return 'https://scratch.mit.edu/projects/' + m[1] + '/embed';
    }
    return u.href;
  }

  // YouTube's player refuses to start without a referrer (Error 153), and a local file:// page sends none, so it
  // doesn't count as embeddable there. (Spotify's embed was checked from file:// and plays fine.)
  const FILE_PAGE_BLOCKED = ['youtube.com', 'youtube-nocookie.com', 'youtu.be'];

  /** True for a page whose embed won't play from a local file:// copy of Nova (it sends no referrer). */
  function needsReferrer(url) {
    const u = parse(url);
    return !!u && onHostList(u.hostname, FILE_PAGE_BLOCKED);
  }

  // Search result pages that render inside a frame (checked 2026-10-12 in a sandboxed iframe): Google, and only in its
  // embeddable mode (igu=1); a result click then navigates inside the frame. DuckDuckGo and Brave send
  // frame-ancestors 'self'. Bing renders too, but every result link is target=_blank, so each click would pop a real
  // browser tab; it stays off the list (it still opens in a web tab like any address, and shows its label).
  function isFramableSearch(u) {
    return u.hostname.toLowerCase() === 'www.google.com' && u.pathname === '/search' && u.searchParams.get('igu') === '1';
  }

  /** True when the page (after toEmbedUrl) is on the allowlist, i.e. known to allow being framed. */
  function isEmbeddable(url) {
    const u = parse(toEmbedUrl(url));

    if (isFramableSearch(u)) return true;
    if (location.protocol === 'file:' && onHostList(u.hostname, FILE_PAGE_BLOCKED)) return false;
    const isYtEmbed = /(^|\.)youtube(-nocookie)?\.com$/.test(u.hostname) && /^\/embed\//.test(u.pathname);
    if (!isYtEmbed && onHostList(u.hostname, NEVER_EMBED)) return false;
    return EMBED_RULES.some((r) => hostMatches(u.hostname, r) && (!r.path || r.path.test(u.pathname)));
  }

  /** The address for a real browser tab: Nova's embed-only tweak (Google's igu=1 frame mode) is taken back off. */
  function realTabUrl(url) {
    const u = parse(url);
    if (!u) return String(url || '');
    if (u.hostname.toLowerCase() === 'www.google.com' && u.pathname === '/search' && u.searchParams.get('igu') === '1') {
      u.searchParams.delete('igu');
      return u.href;
    }
    return String(url);
  }

  /** Best catalog entry for a URL (exact host beats subdomain; a matching path prefix adds weight). */
  function lookup(url) {
    const u = parse(url);
    if (!u) return null;
    const host = bareHost(u);
    let best = null;
    let bestScore = 0;
    for (const site of CATALOG) {
      const s = parse(site.url);
      const home = bareHost(s);
      let score = 0;
      for (const h of [home].concat(site.aliases || [])) {
        if (host === h) score = Math.max(score, 10);
        else if (host.endsWith('.' + h)) score = Math.max(score, 5);
      }
      if (!score) continue;
      const sp = s.pathname.replace(/\/$/, '');
      if (sp && host === home && (u.pathname === sp || u.pathname.startsWith(sp + '/'))) score += sp.length;
      if (score > bestScore) { best = site; bestScore = score; }
    }
    return best;
  }

  // Search result pages: the label names the query ("photosynthesis – Google"), so a search tab reads like one.
  const SEARCH_PAGES = [
    { engine: 'Google', host: /^(www\.)?google\.com$/, path: /^\/search\/?$/, param: 'q' },
    { engine: 'Bing', host: /^(www\.)?bing\.com$/, path: /^\/(images\/)?search\/?$/, param: 'q' },
    { engine: 'DuckDuckGo', host: /^(www\.)?duckduckgo\.com$/, path: /^\/$/, param: 'q' },
    { engine: 'Brave Search', host: /^search\.brave\.com$/, path: /^\/search\/?$/, param: 'q' },
    { engine: 'Wikipedia', host: /(^|\.)wikipedia\.org$/, path: /^\/w\/index\.php$/, param: 'search' },
  ];

  /** { engine, query, label } for a search results URL, else null. */
  function searchInfo(url) {
    const u = parse(url);
    if (!u) return null;
    const host = u.hostname.toLowerCase();
    for (const page of SEARCH_PAGES) {
      if (!page.host.test(host) || !page.path.test(u.pathname)) continue;
      const query = (u.searchParams.get(page.param) || '').trim();
      if (query) return { engine: page.engine, query, label: query + ' – ' + page.engine };
    }
    return null;
  }

  /** Friendly short name for a URL: a search's "query – Engine", else the catalog name, else a tidy host. */
  function nameFor(url) {
    const search = searchInfo(url);
    if (search) return search.label;
    const site = lookup(url);
    if (site) return site.short || site.name;
    const u = parse(url);
    return u ? bareHost(u) : String(url || '');
  }

  function byId(id) { return CATALOG.find((s) => s.id === id) || null; }

  function freezeDeep(list) { return Object.freeze(list.map((o) => Object.freeze(o))); }

  const catalog = freezeDeep(CATALOG);

  const launcher = Object.freeze(LAUNCHER.map((group) => Object.freeze({
    id: group.id,
    label: group.label,
    sites: Object.freeze(group.sites.map((id) => catalog.find((s) => s.id === id)).filter(Boolean)),
  })));

  /** English Wikipedia's search results page for a query (an embeddable URL). */
  function wikipediaSearchUrl(query) {
    return 'https://en.wikipedia.org/w/index.php?search=' + encodeURIComponent(String(query == null ? '' : query).trim());
  }

  const defaultLinks = freezeDeep(DEFAULT_LINK_IDS.map((id) => {
    const s = byId(id);
    return { id: 'link-' + id, title: s.short || s.name, url: s.url, color: s.color };
  }));

  window.NovaSites = {
    catalog,
    launcher,
    defaultLinks,
    isEmbeddable,
    needsReferrer,
    realTabUrl,
    toEmbedUrl,
    lookup,
    nameFor,
    searchInfo,
    byId,
    parse,
    wikipediaSearchUrl,
  };
})();

  function vBool(v, d) { return typeof v === 'boolean' ? v : d; }

    return v !== null && v !== '' && Number.isFinite(n) ? Math.round(Math.min(hi, Math.max(lo, n))) : d;
  }

    if (short) s = short[1] + short[1] + short[2] + short[2] + short[3] + short[3];

  }

  function isSmallJson(v) {
    if (v === null || typeof v === 'boolean') return true;
    if (typeof v === 'number') return Number.isFinite(v);
    if (typeof v === 'string') return v.length <= 500;
    if (typeof v === 'object') { try { return JSON.stringify(v).length <= 2000; } catch (_) { return false; } }
    return false;
  }

  function validateSettings(raw) {
    raw = isObj(raw) ? raw : {};
