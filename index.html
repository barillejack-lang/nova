        statusEl.innerHTML =
          '<span class="set-sync__ic">' + ic + '</span>' +
          '<div class="set-sync__text"><div class="set-sync__title">' + esc(title) + '</div><div class="set-sync__msg">' + esc(msg) + '</div></div>' +
          (actions ? '<div class="set-sync__actions">' + actions + '</div>' : '');
        showEl.checked = !st.hidden;
        if (document.activeElement !== cidInput) cidInput.value = st.customClientId || '';
        cidInput.placeholder = st.defaultClientId;
        cidHint.textContent = st.customClientId ? 'Using your own Client ID.' : 'Using the Client ID built into Nova — you don’t need to change anything.';
        resetBtn.disabled = !st.customClientId;
      }

      statusEl.addEventListener('click', (e) => {
        const b = e.target.closest('[data-act]');
        if (!b || b.disabled) return;
        if (b.getAttribute('data-act') === 'connect') M.connect();
        else if (b.getAttribute('data-act') === 'disconnect') { M.disconnect(); N.ui.toast('Spotify disconnected'); }
      });
      showEl.addEventListener('change', () => M.setHidden(!showEl.checked));
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const r = M.setClientId(cidInput.value);
        cidErr.textContent = r.ok ? '' : r.error;
        if (r.ok) { cidInput.removeAttribute('aria-invalid'); N.ui.toast('Client ID saved'); } else cidInput.setAttribute('aria-invalid', 'true');
        renderMusic();
      });
      cidInput.addEventListener('input', () => { cidErr.textContent = ''; cidInput.removeAttribute('aria-invalid'); });
      resetBtn.addEventListener('click', () => {
        M.setClientId('');
        cidInput.value = '';
        cidErr.textContent = '';
        cidInput.removeAttribute('aria-invalid');
        N.ui.toast('Using the built-in Client ID');
        renderMusic();
      });

      subs.push(N.on('music', renderMusic));
      renderMusic();
      if (M.state().connected) M.loadProfile();
    }

    const BUILDERS = { appearance: buildAppearance, home: buildHome, search: buildSearch, links: buildLinks, keyboard: buildKeyboard, sync: buildSync, about: buildAbout, music: buildMusic };

    // ------------------------------------------------------------ navigation

    function parsePath(path) {
      const parts = String(path || '').toLowerCase().split('/').filter(Boolean);
      let sec = parts[0] || 'appearance';
      if (sec === 'data' || sec === 'backup') sec = 'sync';
      if (sec === 'shortcuts') sec = 'keyboard';
      if (sec === 'quicklinks' || sec === 'quick-links') sec = 'links';
      if (!BUILDERS[sec]) sec = 'appearance';
      return { sec, sub: parts[1] || '' };
    }

    function build(id) {
      const page = document.createElement('div');
      page.className = 'set-page set-page--' + id;
      page.setAttribute('data-page', id);
      main.appendChild(page);
      pages[id] = page;
      const before = syncers.length;
      BUILDERS[id](page);
      const s = N.settings.get();
      syncers.slice(before).forEach((fn) => { try { fn(s); } catch (err) { console.error('[settings] sync failed', err); } });
      return page;
    }

    function show(id, sub, fromParams) {
      if (!BUILDERS[id]) id = 'appearance';
      if (!pages[id]) build(id);
      Object.keys(pages).forEach((k) => { pages[k].hidden = k !== id; });
      nav.querySelectorAll('.set-nav__item').forEach((b) => {
        const on = b.getAttribute('data-sec') === id;
        if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      });
      const changedSection = current !== id;
      current = id;
      if (id === 'links' && pages.links.__refreshLinks) pages.links.__refreshLinks();
      if (id === 'sync' && pages.sync.__refreshStats) pages.sync.__refreshStats();
      if (sub) {
        const target = pages[id].querySelector('[data-group="' + CSS.escape(sub) + '"]');
        if (target) requestAnimationFrame(() => target.scrollIntoView({ block: 'start' }));
      } else if (changedSection) main.scrollTop = 0;
      if (changedSection) {
        const active = nav.querySelector('.set-nav__item[aria-current="page"]');
        if (active && active.scrollIntoView && nav.scrollWidth > nav.clientWidth) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
      if (!fromParams) ctx.setParams({ path: id + (sub ? '/' + sub : '') });
      startRelTimer();
    }

    nav.addEventListener('click', (e) => {
      const b = e.target.closest('[data-sec]');
      if (!b) return;
      show(b.getAttribute('data-sec'), '', false);
      if (b.classList.contains('set-nav__item') && e.detail === 0) main.focus({ preventScroll: true });
    });

    // ------------------------------------------------------------ live updates

    function renderNavSync() {
      const st = syncStatus || { state: 'off' };
      const navSync = nav.querySelector('[data-part="navsync"]');
      const label = { off: 'Sync off', connecting: 'Connecting…', saving: 'Saving…', synced: 'Synced', error: st.warning ? 'Partly synced' : 'Sync problem' }[st.state] || 'Sync off';
      navSync.className = 'set-nav__sync is-' + st.state;
      navSync.innerHTML = '<i class="set-dot"></i><span>' + esc(label) + '</span>';
      navSync.title = st.message || label;
    }

    function startRelTimer() {
      clearInterval(relTimer);
      relTimer = null;
      if (current === 'sync') relTimer = setInterval(() => { if (pages.sync && pages.sync.__refreshSync) pages.sync.__refreshSync(); }, 30000);
    }

    function runSyncers(s) {
      syncers.forEach((fn) => { try { fn(s); } catch (err) { console.error('[settings] sync failed', err); } });
    }

    subs.push(N.on('settings', (s) => runSyncers(s)));
    subs.push(N.on('theme', () => runSyncers(N.settings.get())));
    subs.push(N.on('data:links', () => { if (pages.links) pages.links.__refreshLinks(); }));
    subs.push(N.on('data', () => { if (pages.sync && current === 'sync') pages.sync.__refreshStats(); }));
    subs.push(N.on('recents', () => { if (pages.sync && current === 'sync') pages.sync.__refreshStats(); }));
    subs.push(N.on('sync', (st) => {
      syncStatus = st;
      renderNavSync();
      if (pages.sync) pages.sync.__refreshSync();
      if (pages.about) pages.about.__refreshAbout();
    }));
    subs.push(N.on('env', () => {
      if (pages.about) pages.about.__refreshAbout();
      if (pages.links) pages.links.__refreshLinks();
    }));

    renderNavSync();
    const start = parsePath(ctx.params.path);
    show(start.sec, start.sub, true);
    ctx.setTitle('Settings');

    return {
      onShow() {
        runSyncers(N.settings.get());
        if (current === 'sync' && pages.sync) { pages.sync.__refreshSync(); pages.sync.__refreshStats(); }
        startRelTimer();
      },
      onHide() { clearInterval(relTimer); relTimer = null; },
      onParams(params) {
        const p = parsePath(params && params.path);
        show(p.sec, p.sub, true);
      },
      unmount() {
        clearInterval(relTimer);
        if (rafSettings) cancelAnimationFrame(rafSettings);
        subs.forEach((off) => off());
        subs.length = 0;
      },
    };
  }

  N.registerApp({
    id: 'settings',
    name: 'Settings',
    icon: 'settings',
    singleton: true,
    hidden: false,
    keywords: ['settings', 'preferences', 'options', 'theme', 'appearance', 'customize', 'backup'],
    description: 'Themes, layout, Home widgets, quick links, shortcuts, sync and backups',
    mount,
  });
})();
</script>
<script>
/* ---- web/src/js/apps/notes.js ---- */
/* Nova Notes (SPEC §4.1) — searchable list + editor.
 *  - Autosave: edits are debounced (450 ms) into Nova.data.set('notes'); flushed on hide/unmount/pagehide.
 *  - Pinned notes first, then by updatedAt. Blank notes are never saved (and are dropped when you leave them).
 *  - Delete asks Nova.ui.confirm, then offers Undo in a toast.
 *  - Markdown-lite preview: # headings, - lists, 1. lists, [ ] checklists, > quotes, **bold**, *italic*,
 *    `code` and links (real <a target=_blank>, http(s) only).
 * Tab params: { id } = the open note (saved in the tab session).
 * Open with params { action: 'new' } (or nova:notes/new) to start a fresh note.
 * Device prefs: Nova.local('notes:ui') = { preview: bool }. */
(function () {
  'use strict';

  const Nova = window.Nova;
  if (!Nova) return;
  const U = Nova.util;
  const esc = U.esc;
  const icon = (name, size) => U.icon(name, size || 16);

  const SAVE_MS = 450;
  const UI_KEY = 'notes:ui';

  // ------------------------------------------------------------------ pure helpers

  function normalizeNote(n) {
    const now = Date.now();
    return {
      id: String(n.id || U.uid('note')),
      title: typeof n.title === 'string' ? n.title : '',
      body: typeof n.body === 'string' ? n.body : '',
      pinned: !!n.pinned,
      createdAt: Number(n.createdAt) || Number(n.updatedAt) || now,
      updatedAt: Number(n.updatedAt) || Number(n.createdAt) || now,
    };
  }

  function normalizeList(list) {
    return Array.isArray(list) ? list.filter((n) => n && typeof n === 'object').map(normalizeNote) : [];
  }

  function isBlank(n) { return !n.title.trim() && !n.body.trim(); }

  function sortNotes(list) {
    return list.slice().sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));
  }

  function wordCount(text) {
    const m = String(text || '').match(/\S+/g);
    return m ? m.length : 0;
  }

  // Strip Markdown markers so list snippets read as plain text.
  function plainLine(line) {
    return line
      .replace(/^\s{0,3}(#{1,6}\s+|>\s?|[-*+]\s+\[[ xX]\]\s+|[-*+]\s+|\d+[.)]\s+)/, '')
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1$2')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '$1')
      .trim();
  }

  function bodyLines(n) {
    return n.body.split('\n').map(plainLine).filter(Boolean);
  }

  function displayTitle(n) {
    const t = n.title.trim();
    if (t) return t;
    const first = bodyLines(n)[0];
    return first ? first.slice(0, 90) : 'Untitled';
  }

  function snippet(n) {
    const lines = bodyLines(n);
    if (!n.title.trim()) lines.shift(); // the first line is already the display title
    return lines.join(' · ').slice(0, 160);
  }

  function highlight(text, q) {
    if (!q) return esc(text);
    const lower = text.toLowerCase();
    let out = '';
    let i = 0;
    let hit = lower.indexOf(q);
    while (hit !== -1) {
      out += esc(text.slice(i, hit)) + '<mark>' + esc(text.slice(hit, hit + q.length)) + '</mark>';
      i = hit + q.length;
      hit = lower.indexOf(q, i);
    }
    return out + esc(text.slice(i));
  }

  // Snippet around the first match in the body, so search results show why they matched.
  function matchSnippet(n, q) {
    const flat = bodyLines(n).join(' · ');
    const i = flat.toLowerCase().indexOf(q);
    if (i < 0) return snippet(n);
    const start = Math.max(0, i - 40);
    return (start > 0 ? '…' : '') + flat.slice(start, start + 160);
  }

  // ------------------------------------------------------------------ Markdown-lite

  const SAFE_URL = /^https?:\/\/[^\s<>"']+$/i;

  function linkHtml(url, label) {
    const href = url.replace(/&amp;/g, '&');
    if (!SAFE_URL.test(href)) return label;
    return '<a class="n-link notes-a" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
  }

  // `text` is raw; returns HTML. Escapes first, then applies inline marks on the escaped string.
  function inline(text) {
    const codes = [];
    let s = esc(text).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (m, label, url) => linkHtml(url, label));
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, (m, pre, url) => pre + linkHtml(url, url.replace(/^https?:\/\/(www\.)?/, '')));
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>');
    s = s.replace(/(^|[^\w])_([^_\s][^_]*?)_(?!\w)/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    return s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[Number(i)] + '</code>');
  }

  function renderMarkdown(src) {
    const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let para = [];
    let list = null; // { tag, items: [] }
    let quote = [];

    function flushPara() {
      if (para.length) out.push('<p>' + para.map(inline).join('<br>') + '</p>');
      para = [];
    }
    function flushList() {
      if (list) out.push('<' + list.tag + (list.check ? ' class="notes-checklist"' : '') + '>' + list.items.join('') + '</' + list.tag + '>');
      list = null;
    }
    function flushQuote() {
      if (quote.length) out.push('<blockquote>' + quote.map(inline).join('<br>') + '</blockquote>');
      quote = [];
    }
    function flushAll() { flushPara(); flushList(); flushQuote(); }
    function pushItem(tag, html, check) {
      flushPara();
      flushQuote();
      if (!list || list.tag !== tag || !!list.check !== !!check) { flushList(); list = { tag, items: [], check }; }
      list.items.push(html);
    }

    lines.forEach((line) => {
      let m;
      if (!line.trim()) { flushAll(); return; }
      if ((m = /^\s{0,3}(#{1,3})\s+(.*)$/.exec(line))) {
        flushAll();
        const level = m[1].length + 1; // # → h2 … ### → h4 (the note title is the h1)
        out.push('<h' + level + '>' + inline(m[2]) + '</h' + level + '>');
        return;
      }
      if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { flushAll(); out.push('<hr>'); return; }
      if ((m = /^\s*[-*+]\s+\[([ xX])\]\s+(.*)$/.exec(line))) {
        const done = m[1] !== ' ';
        pushItem('ul', '<li class="' + (done ? 'is-done' : '') + '"><span class="notes-box" aria-hidden="true">' +
          (done ? icon('check', 12) : '') + '</span><span>' + inline(m[2]) + '</span></li>', true);
        return;
      }
      if ((m = /^\s*[-*+]\s+(.*)$/.exec(line))) { pushItem('ul', '<li>' + inline(m[1]) + '</li>'); return; }
      if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(line))) { pushItem('ol', '<li>' + inline(m[1]) + '</li>'); return; }
      if ((m = /^\s*>\s?(.*)$/.exec(line))) { flushPara(); flushList(); quote.push(m[1]); return; }
      flushList();
      flushQuote();
      para.push(line.trim());
    });
    flushAll();
    return out.join('');
  }

  // ------------------------------------------------------------------ app

  const TEMPLATE =
    '<div class="notes" data-view="list">' +
      '<aside class="notes-side" aria-label="All notes">' +
        '<div class="notes-side__head">' +
          '<div class="notes-side__titles"><h1 class="notes-h1">Notes</h1><span class="notes-count"></span></div>' +
          '<button type="button" class="n-btn n-btn--primary n-btn--sm notes-new" title="New note">' + icon('plus', 15) + '<span>New</span></button>' +
        '</div>' +
        '<label class="notes-search">' + icon('search', 15) +
          '<input type="search" class="notes-search__input" placeholder="Search notes" aria-label="Search notes" autocomplete="off" spellcheck="false">' +
        '</label>' +
        '<div class="notes-list n-scroll" role="listbox" aria-label="Notes"></div>' +
      '</aside>' +
      '<section class="notes-main" aria-label="Note">' +
        '<div class="notes-bar">' +
          '<button type="button" class="n-btn n-btn--ghost n-btn--icon notes-back" aria-label="Back to all notes" title="All notes">' + icon('chevron-left', 18) + '</button>' +
          '<span class="notes-status" aria-live="polite"></span>' +
          '<span class="notes-bar__spacer"></span>' +
          '<div class="n-seg notes-mode" role="group" aria-label="Editor mode">' +
            '<button type="button" data-mode="write" aria-pressed="true" aria-label="Write" title="Write">' + icon('pencil', 13) + '<span>Write</span></button>' +
            '<button type="button" data-mode="preview" aria-pressed="false" aria-label="Preview" title="Preview (Markdown)">' + icon('type', 13) + '<span>Preview</span></button>' +
          '</div>' +
          '<button type="button" class="n-btn n-btn--ghost n-btn--icon notes-pin" aria-pressed="false" aria-label="Pin note" title="Pin note">' + icon('pin', 16) + '</button>' +
          '<button type="button" class="n-btn n-btn--ghost n-btn--icon notes-del" aria-label="Delete note" title="Delete note">' + icon('trash', 16) + '</button>' +
        '</div>' +
        '<div class="notes-doc n-scroll">' +
          '<div class="notes-doc__inner">' +
            '<input type="text" class="notes-title" placeholder="Untitled" aria-label="Note title" maxlength="200" spellcheck="true">' +
            '<div class="notes-meta"></div>' +
            '<textarea class="notes-body" placeholder="Start writing… (# heading, - list, **bold** work in Preview)" aria-label="Note text" spellcheck="true"></textarea>' +
            '<div class="notes-preview" hidden></div>' +
          '</div>' +
        '</div>' +
        '<div class="notes-pick n-empty" hidden>' +
          '<div class="n-empty__icon">' + icon('file', 22) + '</div>' +
          '<div class="n-empty__title">Pick a note</div>' +
          '<div class="n-empty__hint">Choose one on the left, or start a new one.</div>' +
        '</div>' +
      '</section>' +
      '<div class="notes-zero n-empty n-empty--fill" hidden>' +
        '<div class="n-empty__icon">' + icon('file', 24) + '</div>' +
        '<div class="n-empty__title">Your notes live here</div>' +
        '<div class="n-empty__hint">Homework reminders, quick ideas, links to come back to. Everything saves as you type.</div>' +
        '<button type="button" class="n-btn n-btn--primary notes-zero__btn">' + icon('plus', 15) + '<span>Write your first note</span></button>' +
      '</div>' +
    '</div>';

  function mount(el, ctx) {
    el.innerHTML = TEMPLATE;
    const $ = (sel) => el.querySelector(sel);
    const root = $('.notes');
    const listEl = $('.notes-list');
    const searchEl = $('.notes-search__input');
    const countEl = $('.notes-count');
    const titleEl = $('.notes-title');
    const bodyEl = $('.notes-body');
    const previewEl = $('.notes-preview');
    const metaEl = $('.notes-meta');
    const statusEl = $('.notes-status');
    const docEl = $('.notes-doc');
    const pickEl = $('.notes-pick');
    const zeroEl = $('.notes-zero');
    const pinBtn = $('.notes-pin');
    const delBtn = $('.notes-del');
    const modeBtns = Array.from(el.querySelectorAll('.notes-mode button'));

    let notes = normalizeList(Nova.data.get('notes'));
    let lastSaved = JSON.stringify(notes);
    let activeId = null;
    let query = '';
    let dirty = false;
    let listRaf = 0;
    let metaTimer = null;
    let prefs = Object.assign({ preview: false }, safeObj(Nova.local.get(UI_KEY, {})));
    const saveSoon = U.debounce(saveNow, SAVE_MS);
    const offs = [];

    function safeObj(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }
    function find(id) { return notes.find((n) => n.id === id) || null; }
    function active() { return find(activeId); }

    // ---- persistence
    function saveNow() {
      saveSoon.cancel();
      const persist = notes.filter((n) => !isBlank(n));
      const json = JSON.stringify(persist);
      dirty = false;
      if (json !== lastSaved) {
        lastSaved = json;
        Nova.data.set('notes', persist);
      }
      renderStatus();
    }

    function onRemote(value) {
      const incoming = normalizeList(value);
      const json = JSON.stringify(incoming);
      if (json === lastSaved) return;
      lastSaved = json;
      const local = active();
      // Keep an unsaved (or blank, never-saved) open note instead of losing typing to a remote snapshot.
      if (local && (dirty || isBlank(local))) {
        const i = incoming.findIndex((n) => n.id === local.id);
        if (i >= 0) incoming[i] = local; else incoming.unshift(local);
      }
      notes = incoming;
      if (activeId && !find(activeId)) activeId = null;
      render();
    }

    // ---- selection
    function select(id, opts) {
      opts = opts || {};
      if (dirty) saveNow();
      const prev = active();
      if (prev && prev.id !== id && isBlank(prev)) notes = notes.filter((n) => n !== prev);
      activeId = find(id) ? id : null;
      ctx.setParams(activeId ? { id: activeId } : {});
      if (activeId && opts.view !== false) root.dataset.view = 'editor';
      render();
      if (opts.focus === 'title') focusSoon(titleEl);
      else if (opts.focus === 'body') focusSoon(bodyEl);
    }

    function focusSoon(input) {
      requestAnimationFrame(() => {
        if (!el.isConnected || el.hidden) return;
        input.focus();
        if (input === bodyEl) { const end = bodyEl.value.length; bodyEl.setSelectionRange(end, end); }
      });
    }

    function createNote() {
      if (prefs.preview) setPreview(false);
      const blank = notes.find(isBlank);
      if (blank) { select(blank.id, { focus: 'title' }); return; }
      const now = Date.now();
      const n = { id: U.uid('note'), title: '', body: '', pinned: false, createdAt: now, updatedAt: now };
      notes.unshift(n);
      query = '';
      searchEl.value = '';
      select(n.id, { focus: 'title' });
    }

    function touch(n) {
      n.updatedAt = Date.now();
      dirty = true;
      saveSoon();
      renderStatus();
      renderMeta();
      if (!listRaf) listRaf = requestAnimationFrame(() => { listRaf = 0; renderList(); });
    }

    async function deleteActive() {
      const n = active();
      if (!n) return;
      if (!isBlank(n)) {
        const ok = await Nova.ui.confirm({
          title: 'Delete this note?',
          message: '“' + displayTitle(n) + '” will be deleted' + (Nova.env.isArtifact ? ' everywhere Nova syncs.' : ' from this device.'),
          confirmLabel: 'Delete',
          danger: true,
        });
        if (!ok || !find(n.id)) return;
      }
      const order = visibleNotes();
      const idx = order.indexOf(n);
      notes = notes.filter((x) => x !== n);
      const next = order[idx + 1] || order[idx - 1] || null;
      activeId = null;
      saveNow();
      if (next && next !== n) select(next.id, { view: !isNarrow() }); else { root.dataset.view = 'list'; render(); }
      if (!isBlank(n)) {
        Nova.ui.toast('Note deleted', {
          action: {
            label: 'Undo',
            onClick() {
              if (!find(n.id)) notes.push(n);
              saveNow();
              select(n.id);
            },
          },
          timeout: 6000,
        });
      }
    }

    function togglePin() {
      const n = active();
      if (!n) return;
      n.pinned = !n.pinned;
      if (!isBlank(n)) saveNow();
      render();
    }

    function setPreview(on) {
      prefs.preview = !!on;
      Nova.local.set(UI_KEY, prefs);
      renderEditor();
    }

    function isNarrow() { return el.clientWidth > 0 && el.clientWidth <= 640; }

    // ---- rendering
    function visibleNotes() {
      const sorted = sortNotes(notes);
      if (!query) return sorted;
      return sorted.filter((n) => (n.title + '\n' + n.body).toLowerCase().indexOf(query) !== -1);
    }

    function renderList() {
      const saved = notes.filter((n) => !isBlank(n) || n.id === activeId);
      countEl.textContent = saved.length ? String(saved.length) : '';
      const items = visibleNotes();
      if (!items.length) {
        listEl.innerHTML = query
          ? '<div class="notes-list__empty">' + icon('search', 18) + '<span>No notes match “' + esc(query) + '”</span></div>'
          : '<div class="notes-list__empty"><span>No notes yet</span></div>';
        return;
      }
      const pinned = items.filter((n) => n.pinned);
      const rest = items.filter((n) => !n.pinned);
      let html = '';
      if (pinned.length && rest.length) html += '<div class="notes-list__label">Pinned</div>';
      html += pinned.map(itemHtml).join('');
      if (pinned.length && rest.length) html += '<div class="notes-list__label">Notes</div>';
      html += rest.map(itemHtml).join('');
      const focusedId = document.activeElement && listEl.contains(document.activeElement) ? document.activeElement.dataset.id : null;
      listEl.innerHTML = html;
      if (focusedId) { const b = listEl.querySelector('[data-id="' + CSS.escape(focusedId) + '"]'); if (b) b.focus(); }
    }

    function itemHtml(n) {
      const isActive = n.id === activeId;
      const title = displayTitle(n);
      const snip = query ? matchSnippet(n, query) : snippet(n);
      return '<button type="button" class="notes-item' + (isActive ? ' is-active' : '') + (title === 'Untitled' ? ' is-untitled' : '') +
        '" role="option" aria-selected="' + isActive + '" data-id="' + esc(n.id) + '">' +
        '<span class="notes-item__top">' +
          '<span class="notes-item__title">' + highlight(title, query) + '</span>' +
          (n.pinned ? '<span class="notes-item__pin" title="Pinned">' + icon('pin', 12) + '</span>' : '') +
        '</span>' +
        '<span class="notes-item__snip">' + (snip ? highlight(snip, query) : '<span class="n-faint">No text yet</span>') + '</span>' +
        '<span class="notes-item__time">' + esc(U.fmtRelative(n.updatedAt)) + '</span>' +
      '</button>';
    }

    function renderMeta() {
      const n = active();
      if (!n) { metaEl.textContent = ''; return; }
      const words = wordCount(n.title + ' ' + n.body);
      metaEl.innerHTML = '<span>' + esc(isBlank(n) ? 'New note' : 'Edited ' + U.fmtRelative(n.updatedAt)) + '</span>' +
        '<span aria-hidden="true">·</span><span>' + words + (words === 1 ? ' word' : ' words') + '</span>' +
        (n.pinned ? '<span aria-hidden="true">·</span><span class="notes-meta__pin">' + icon('pin', 11) + 'Pinned</span>' : '');
    }

    function renderStatus() {
      const n = active();
      if (!n || isBlank(n)) { statusEl.textContent = ''; statusEl.className = 'notes-status'; return; }
      if (Nova.storage && !Nova.storage.ok('notes')) { // the browser refuses to keep it: don't claim "Saved"
        statusEl.className = 'notes-status is-unsaved';
        statusEl.innerHTML = icon('alert-triangle', 13) + 'Not saved — this browser won’t keep notes';
        return;
      }
      statusEl.className = 'notes-status' + (dirty ? ' is-saving' : ' is-saved');
      statusEl.innerHTML = dirty ? '<i class="notes-status__dot"></i>Saving…' : icon('check', 13) + 'Saved';
    }

    function autoGrow() {
      bodyEl.style.height = 'auto';
      bodyEl.style.height = Math.max(bodyEl.scrollHeight, 240) + 'px';
    }

    function renderEditor() {
      const n = active();
      const hasNotes = notes.length > 0;
      zeroEl.hidden = hasNotes;
      root.classList.toggle('is-zero', !hasNotes);
      docEl.hidden = !n;
      pickEl.hidden = !!n || !hasNotes;
      el.querySelector('.notes-bar').classList.toggle('is-off', !n);
      [pinBtn, delBtn].concat(modeBtns).forEach((b) => { b.disabled = !n; });
      if (!n) { renderStatus(); return; }
      if (titleEl.value !== n.title) titleEl.value = n.title;
      if (bodyEl.value !== n.body) {
        const focused = document.activeElement === bodyEl;
        const s = bodyEl.selectionStart;
        const e = bodyEl.selectionEnd;
        bodyEl.value = n.body;
        if (focused) bodyEl.setSelectionRange(Math.min(s, n.body.length), Math.min(e, n.body.length));
      }
      pinBtn.setAttribute('aria-pressed', String(n.pinned));
      pinBtn.title = n.pinned ? 'Unpin note' : 'Pin note';
      pinBtn.setAttribute('aria-label', pinBtn.title);
      modeBtns.forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.mode === 'preview') === prefs.preview)));
      bodyEl.hidden = prefs.preview;
      previewEl.hidden = !prefs.preview;
      if (prefs.preview) {
        previewEl.innerHTML = n.body.trim() ? renderMarkdown(n.body)
          : '<p class="n-faint">Nothing to preview yet. Switch to Write and add some text.</p>';
      } else {
        requestAnimationFrame(autoGrow);
      }
      renderMeta();
      renderStatus();
    }

    function render() {
      renderList();
      renderEditor();
    }

    // ---- events
    $('.notes-new').addEventListener('click', createNote);
    $('.notes-zero__btn').addEventListener('click', createNote);
    $('.notes-back').addEventListener('click', () => {
      if (dirty) saveNow();
      root.dataset.view = 'list';
      const n = active();
      if (n && isBlank(n)) { notes = notes.filter((x) => x !== n); activeId = null; ctx.setParams({}); }
      render();
      const b = activeId && listEl.querySelector('[data-id="' + CSS.escape(activeId) + '"]');
      if (b) b.focus();
    });
    pinBtn.addEventListener('click', togglePin);
    delBtn.addEventListener('click', deleteActive);
    modeBtns.forEach((b) => b.addEventListener('click', () => setPreview(b.dataset.mode === 'preview')));

    listEl.addEventListener('click', (e) => {
      const b = e.target.closest('.notes-item');
      if (b) select(b.dataset.id);
    });
    listEl.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      const items = Array.from(listEl.querySelectorAll('.notes-item'));
      const i = items.indexOf(document.activeElement);
      const next = items[Math.min(items.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))];
      if (next) { e.preventDefault(); next.focus(); }
    });

    searchEl.addEventListener('input', () => {
      query = searchEl.value.trim().toLowerCase();
      renderList();
    });
    searchEl.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && searchEl.value) { e.stopPropagation(); searchEl.value = ''; query = ''; renderList(); }
      if (e.key === 'ArrowDown') {
        const first = listEl.querySelector('.notes-item');
        if (first) { e.preventDefault(); first.focus(); }
      }
      if (e.key === 'Enter') {
        const first = listEl.querySelector('.notes-item');
        if (first) { e.preventDefault(); select(first.dataset.id, { focus: 'body' }); }
      }
    });

    titleEl.addEventListener('input', () => { const n = active(); if (n) { n.title = titleEl.value; touch(n); } });
    titleEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || (e.key === 'ArrowDown' && titleEl.selectionStart === titleEl.value.length)) {
        e.preventDefault();
        if (prefs.preview) setPreview(false);
        bodyEl.focus();
        bodyEl.setSelectionRange(0, 0);
      }
    });
    let autoMarkerAt = -1; // caret position right after an auto-continued list marker
    bodyEl.addEventListener('input', (e) => {
      const n = active();
      if (!n) return;
      // Typing "- " right after an auto-inserted "- " shouldn't leave "- - ".
      if (autoMarkerAt >= 0 && e.inputType === 'insertText') {
        const pos = bodyEl.selectionStart;
        const v = bodyEl.value;
        const lineStart = v.lastIndexOf('\n', pos - 1) + 1;
        const line = v.slice(lineStart, pos);
        const dup = /^(\s*)([-*+] (?:\[ \] )?)([-*+] )$/.exec(line);
        if (dup && pos === autoMarkerAt + 2) {
          bodyEl.setRangeText(dup[1] + dup[2], lineStart, pos, 'end');
          autoMarkerAt = -1;
        } else if (!/^\s*[-*+] (?:\[ \] )?[-*+]?$/.test(line)) {
          autoMarkerAt = -1;
        }
      } else if (e.inputType !== 'insertText') {
        autoMarkerAt = e.isTrusted ? -1 : autoMarkerAt;
      }
      n.body = bodyEl.value;
      touch(n);
      autoGrow();
    });
    bodyEl.addEventListener('keydown', (e) => {
      // Continue "- " / "1. " / "- [ ] " lists on Enter; Enter on an empty bullet ends the list.
      if (e.key !== 'Enter' || e.shiftKey || e.altKey || e.metaKey || e.ctrlKey || e.isComposing) return;
      const v = bodyEl.value;
      const pos = bodyEl.selectionStart;
      if (pos !== bodyEl.selectionEnd) return;
      const lineStart = v.lastIndexOf('\n', pos - 1) + 1;
      const line = v.slice(lineStart, pos);
      const m = /^(\s*)([-*+] \[[ xX]\] |[-*+] |(\d+)([.)]) )(.*)$/.exec(line);
      if (!m) return;
      e.preventDefault();
      if (!m[5].trim()) {
        bodyEl.setRangeText('', lineStart, pos, 'end');
      } else {
        let marker = m[2];
        if (m[3]) marker = (Number(m[3]) + 1) + m[4] + ' ';
        else if (/\[[xX]\]/.test(marker)) marker = marker.replace(/\[[xX]\]/, '[ ]');
        bodyEl.setRangeText('\n' + m[1] + marker, pos, pos, 'end');
      }
      bodyEl.dispatchEvent(new Event('input', { bubbles: true }));
      autoMarkerAt = m[5].trim() ? bodyEl.selectionStart : -1;
    });
    titleEl.addEventListener('blur', () => { if (dirty) saveSoon.flush(); });
    bodyEl.addEventListener('blur', () => { if (dirty) saveSoon.flush(); });

    previewEl.addEventListener('click', (e) => {
      const a = e.target.closest('a.notes-a');
      if (a) Nova.trackExternal(a.href, U.hostOf(a.href));
    });
    // Double-click the preview's empty space to jump back into writing.
    // (Only on the empty space around the text: a double-click on a word selects it, which the highlight bubble needs.)
    previewEl.addEventListener('dblclick', (e) => { if (e.target === previewEl) { setPreview(false); focusSoon(bodyEl); } });

    offs.push(Nova.on('data:notes', onRemote));
    offs.push(Nova.on('storage', () => renderStatus()));
    const onPageHide = () => { if (dirty) saveNow(); };
    window.addEventListener('pagehide', onPageHide);

    function handleParams(p) {
      p = p || {};
      if (p.action === 'new' || p.path === 'new') { createNote(); return true; }
      if (p.id && find(p.id) && p.id !== activeId) { select(p.id); return true; }
      return false;
    }

    // ---- first render
    if (!handleParams(ctx.params)) {
      const p = ctx.params;
      const first = sortNotes(notes)[0];
      if (p.id && find(p.id)) { activeId = p.id; root.dataset.view = 'editor'; }
      else if (first) activeId = first.id; // wide layout shows it; narrow layout starts on the list
      render();
    }

    return {
      onShow() {
        renderList();
        renderMeta();
        if (!prefs.preview) requestAnimationFrame(autoGrow);
        clearInterval(metaTimer);
        metaTimer = setInterval(() => { renderMeta(); renderList(); }, 30000);
      },
      onHide() {
        clearInterval(metaTimer);
        if (dirty) saveNow();
      },
      onParams(p) { handleParams(p); },
      unmount() {
        clearInterval(metaTimer);
        cancelAnimationFrame(listRaf);
        if (dirty) saveNow();
        offs.forEach((off) => off());
        window.removeEventListener('pagehide', onPageHide);
      },
    };
  }

  Nova.registerApp({
    id: 'notes',
    name: 'Notes',
    icon: 'notebook',
    singleton: true,
    keywords: ['note', 'notes', 'write', 'notebook', 'jot', 'memo'],
    description: 'Quick notes that save as you type',
    mount,
  });
})();
</script>
<script>
/* ---- web/src/js/apps/tasks.js ---- */
/* Nova Tasks (SPEC §4.1) — homework / to-dos.
 *  Quick add: "Finish geometry 4.3 due fri #math" → { title: 'Finish geometry 4.3', due: <next Fri>, course: 'math' }
 *    Due words: today, tonight, tomorrow/tmr/tmrw, mon…sun (full or short), this/next <day>, next week (→ Monday),
 *    weekend (→ Saturday), in 3 days / in 2 weeks, 10/16, 10/16/26, oct 16, 16 oct. An optional due/by/on/for in front
 *    is swallowed. Bare weekday names and 10/16-style dates only count at the end of the text (or after due/by/on),
 *    so "Read 1/2 of ch. 5" and "SAT practice" stay intact. A weekday that is today means today.
 *    #tag → course (first tag wins; tags are removed from the title).
 *  Groups: Overdue / Today / Upcoming / No date / Done (collapsible, Clear done with Undo).
 *  Data: Nova.data 'tasks' = [{ id, title, course?, due? ('YYYY-MM-DD'), done, createdAt, doneAt? }]
 *  Tab params: { filter? } (course filter). Open with params { action: 'new' } (or nova:tasks/new) to focus quick add.
 *  Device prefs: Nova.local('tasks:ui') = { showDone: bool }. */
(function () {
  'use strict';

  const Nova = window.Nova;
  if (!Nova) return;
  const U = Nova.util;
  const esc = U.esc;
  const icon = (name, size) => U.icon(name, size || 16);
  const UI_KEY = 'tasks:ui';

  // ------------------------------------------------------------------ dates

  const DAY = 86400000;
  function keyToDate(key) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(key || ''));
    return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12) : null;
  }
  function addDays(date, n) { const d = new Date(date.getFullYear(), date.getMonth(), date.getDate() + n, 12); return d; }
  function noon(date) { return new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12); }
  function diffDays(fromKey, toKey) {
    const a = keyToDate(fromKey);
    const b = keyToDate(toKey);
    return a && b ? Math.round((b - a) / DAY) : 0;
  }

  const fmtWeekdayLong = new Intl.DateTimeFormat('en-US', { weekday: 'long' });
  const fmtWeekdayShort = new Intl.DateTimeFormat('en-US', { weekday: 'short' });
  const fmtMonthDay = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' });
  const fmtMonthDayYear = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const fmtHeader = new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  /** { label, long, tone: 'overdue'|'today'|'soon'|'later', diff } for a due key relative to today. */
  function dueInfo(due, todayKey) {
    const d = keyToDate(due);
    if (!d) return null;
    const diff = diffDays(todayKey, due);
    const sameYear = d.getFullYear() === keyToDate(todayKey).getFullYear();
    const md = sameYear ? fmtMonthDay.format(d) : fmtMonthDayYear.format(d);
    const wd = fmtWeekdayShort.format(d);
    if (diff < 0) return { label: diff === -1 ? 'Yesterday' : md, long: (diff === -1 ? 'Yesterday' : wd + ', ' + md) + ' · ' + (-diff) + (diff === -1 ? ' day' : ' days') + ' late', tone: 'overdue', diff };
    if (diff === 0) return { label: 'Today', long: 'Today, ' + md, tone: 'today', diff };
    if (diff === 1) return { label: 'Tomorrow', long: 'Tomorrow, ' + md, tone: 'soon', diff };
    if (diff < 7) return { label: fmtWeekdayLong.format(d), long: fmtWeekdayLong.format(d) + ', ' + md, tone: 'soon', diff };
    return { label: md, long: wd + ', ' + md, tone: 'later', diff };
  }

  // ------------------------------------------------------------------ quick-add parser

  const WEEKDAYS = {
    sun: 0, sunday: 0, mon: 1, monday: 1, tue: 2, tues: 2, tuesday: 2, wed: 3, weds: 3, wednesday: 3,
    thu: 4, thur: 4, thurs: 4, thursday: 4, fri: 5, friday: 5, sat: 6, saturday: 6,
  };
  const MONTHS = {
    jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2, apr: 3, april: 3, may: 4, jun: 5, june: 5,
    jul: 6, july: 6, aug: 7, august: 7, sep: 8, sept: 8, september: 8, oct: 9, october: 9, nov: 10, november: 10,
    dec: 11, december: 11,
  };
  const NUMBER_WORDS = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, ten: 10 };
  const alt = (obj) => Object.keys(obj).sort((a, b) => b.length - a.length).join('|');
  const WD = alt(WEEKDAYS);
  const MO = alt(MONTHS);
  const KW = '(?:(?<kw>due|by|on|for|before)\\s+)?';
  const TAG_RE = /(^|\s)#([\p{L}\p{N}][\p{L}\p{N}_-]{0,23})/gu;
  const TRAILING_RE = /^[\s,.;:!?)–—-]*(?:#[\p{L}\p{N}_-]+[\s,.;:!?–—-]*)*$/u;
  // words that put a number pair like "4-3" or "2/3" in front of it (a lesson, a page range, a problem set)
  const NUMBER_CONTEXT_RE = /\b(?:lessons?|les|pages?|pgs?|pp?|ch|chapters?|problems?|probs?|questions?|qs?|ex|exercises?|hw|ws|worksheet|unit|section|sec|part|topic|slides?|fig|figure|no|nos|number)\.?\s*#?\s*$/i;
  const NOT_POSSESSIVE = "(?!['’]\\w)"; // "today's reading" is a title, not a due date

  function makeDate(year, month, day) {
    const d = new Date(year, month, day, 12);
    return d.getMonth() === month && d.getDate() === day ? d : null;
  }

  // A date without a year that is more than a month in the past means next year.
  function rollYear(month, day, today) {
    let d = makeDate(today.getFullYear(), month, day);
    if (d && (today - d) / DAY > 31) d = makeDate(today.getFullYear() + 1, month, day);
    return d;
  }

  function nextMonday(today) { return addDays(today, ((8 - today.getDay()) % 7) || 7); }

  const RULES = [
    { // 10/16, 10/16/26, 10/16/2026, and 10-16 after due/by/on or with a year
      re: new RegExp('\\b' + KW + '(?<m>\\d{1,2})(?<sep>[/-])(?<d>\\d{1,2})(?:[/-](?<y>\\d{4}|\\d{2}))?(?![\\d/-]|\\.\\d)', 'gi'),
      strict: true,
      // "lesson 4-3", "pages 3-5", "problems 1/9", "HW 4-2" are numbers, not dates: a dash date needs a year or a due word
      reject: (g, raw, before) => !g.kw && ((g.sep === '-' && !g.y) || NUMBER_CONTEXT_RE.test(before)),
      date(g, today) {
        const month = Number(g.m) - 1;
        const day = Number(g.d);
        if (month < 0 || month > 11 || day < 1) return null;
        if (g.y) return makeDate(g.y.length === 2 ? 2000 + Number(g.y) : Number(g.y), month, day);
        return rollYear(month, day, today);
      },
    },
    { // oct 16, october 16th, oct. 16, 2026
      re: new RegExp('\\b' + KW + '(?<mon>' + MO + ')\\.?\\s+(?<d>\\d{1,2})(?:st|nd|rd|th)?\\b(?:,?\\s+(?<y>\\d{4})\\b)?', 'gi'),
      strictWhen: (g) => /^(may|mar)$/i.test(g.mon),
      date(g, today) {
        const month = MONTHS[g.mon.toLowerCase()];
        const day = Number(g.d);
        return g.y ? makeDate(Number(g.y), month, day) : rollYear(month, day, today);
      },
    },
    { // 16 oct, 16th october
      re: new RegExp('\\b' + KW + '(?<d>\\d{1,2})(?:st|nd|rd|th)?\\s+(?<mon>' + MO + ')\\b\\.?', 'gi'),
      strictWhen: (g) => /^(may|mar)$/i.test(g.mon),
      date(g, today) { return rollYear(MONTHS[g.mon.toLowerCase()], Number(g.d), today); },
    },
    {
      re: new RegExp('\\b' + KW + '(?<w>today|tonight|tod)\\b' + NOT_POSSESSIVE, 'gi'),
      strictWhen: (g) => /^tod$/i.test(g.w),
      date(g, today) { return today; },
    },
    {
      re: new RegExp('\\b' + KW + '(?<w>tomorrow|tomorow|tommorow|tommorrow|tmrw|tmr|tmw|tmrow)\\b' + NOT_POSSESSIVE, 'gi'),
      date(g, today) { return addDays(today, 1); },
    },
    {
      re: new RegExp('\\b' + KW + 'next\\s+week\\b' + NOT_POSSESSIVE, 'gi'),
      date(g, today) { return nextMonday(today); },
    },
    {
      re: new RegExp('\\b' + KW + '(?:this\\s+)?(?:weekend)\\b' + NOT_POSSESSIVE, 'gi'),
      date(g, today) { return addDays(today, (6 - today.getDay() + 7) % 7); },
    },
    {
      re: new RegExp('\\b' + KW + '(?<rel>next|this)\\s+(?<wd>' + WD + ')\\b\\.?', 'gi'),
      date(g, today) {
        const wd = WEEKDAYS[g.wd.toLowerCase()];
        if (g.rel.toLowerCase() === 'this') return addDays(today, (wd - today.getDay() + 7) % 7);
        return addDays(nextMonday(today), (wd + 6) % 7);
      },
    },
    {
      re: new RegExp('\\b' + KW + 'in\\s+(?<n>\\d{1,3}|' + alt(NUMBER_WORDS) + ')\\s+(?<u>days?|weeks?)\\b', 'gi'),
      date(g, today) {
        const n = /^\d+$/.test(g.n) ? Number(g.n) : NUMBER_WORDS[g.n.toLowerCase()];
        return addDays(today, /^w/i.test(g.u) ? n * 7 : n);
      },
    },
    { // fri, friday — only after due/by/on or at the end; "SAT"/"SUN" in caps are words, not days
      re: new RegExp('\\b' + KW + '(?<wd>' + WD + ')\\b\\.?', 'gi'),
      strict: true,
      reject: (g, raw) => !g.kw && /^[A-Z]{3}$/.test(raw.trim()),
      date(g, today) { return addDays(today, (WEEKDAYS[g.wd.toLowerCase()] - today.getDay() + 7) % 7); },
    },
  ];

  function cleanTitle(s) {
    return s
      .replace(/\(\s*\)|\[\s*\]/g, ' ') // "(due tue)" leaves "()" behind
      .replace(/\s{2,}/g, ' ')
      .replace(/\s+([,.;:!?])/g, '$1')
      .replace(/^[\s,;:–—-]+|[\s,;:–—-]+$/g, '')
      .replace(/\s+(due|by|on|for|before)$/i, '')
      .trim();
  }

  /** Parse quick-add text. Returns { title, due: 'YYYY-MM-DD'|null, course: string|null, dueText, tagText }. */
  function parseTask(text, now) {
    const today = noon(now ? new Date(now) : new Date());
    let s = String(text || '').replace(/\s+/g, ' ').trim();
    let course = null;
    let tagText = null;
    s = s.replace(TAG_RE, (m, pre, tag) => {
      if (!course) { course = tag; tagText = '#' + tag; }
      return pre;
    });
    let due = null;
    let dueText = null;
    for (const rule of RULES) {
      rule.re.lastIndex = 0;
      let m;
      while ((m = rule.re.exec(s))) {
        const g = m.groups || {};
        const after = s.slice(m.index + m[0].length);
        const strict = rule.strict || (rule.strictWhen && rule.strictWhen(g));
        if (strict && !g.kw && !TRAILING_RE.test(after)) continue;
        const word = g.kw ? m[0].slice(m[0].toLowerCase().indexOf(g.kw.toLowerCase()) + g.kw.length) : m[0];
        if (rule.reject && rule.reject(g, word, s.slice(0, m.index))) continue;
        const d = rule.date(g, today);
        if (!d) continue;
        due = U.dayKey(d);
        dueText = m[0].trim();
        s = s.slice(0, m.index) + ' ' + after.replace(/^[.,;:!]+(?=\s|$)/, ''); // "…due 10/16/26." keeps no stray period
        break;
      }
      if (due) break;
    }
    return { title: cleanTitle(s), due, course, dueText, tagText };
  }

  // ------------------------------------------------------------------ courses

  // Mid-tone hues that stay readable as chip text mixed with --n-text, on light and dark pages alike.
  const COURSE_COLORS = ['#3b82f6', '#e5484d', '#12a150', '#e8930c', '#8e5cf0', '#e0458f', '#0fa5a0', '#ee6a1f', '#0ea5d9', '#6d9e1a', '#5b63e8', '#c0517a'];
  const COURSE_HINTS = [
    [/^(math|alg|geo(m|metry)?$|geom|calc|precalc|pre-?calc|stat|trig|aleks)/, 0],
    [/^(eng|ela|lit|writ|read|essay)/, 1],
    [/^(sci|bio|chem|phys|earth|env|anat|lab)/, 2],
    [/^(hist|ap-?w|apwh|world|us-?h|gov|civ|econ|soc|geog)/, 3],
    [/^(span|fren|germ|lat|chin|jap|ital|asl|lang)/, 4],
    [/^(art|draw|design|photo|paint)/, 5],
    [/^(music|band|choir|orch|piano|guitar)/, 6],
    [/^(pe$|gym|health|sport|fit)/, 7],
    [/^(cs|comp|code|coding|prog|tech|robot|cyber)/, 8],
  ];

  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function courseKey(c) { return String(c || '').trim().toLowerCase(); }
  function courseColor(c) {
    const k = courseKey(c);
    for (const [re, i] of COURSE_HINTS) if (re.test(k)) return COURSE_COLORS[i];
    return COURSE_COLORS[hashStr(k) % COURSE_COLORS.length];
  }
  const AP_NAMES = {
    apworld: 'AP World', apwh: 'AP World', apush: 'APUSH', apbio: 'AP Bio', apchem: 'AP Chem', apphysics: 'AP Physics',
    aplang: 'AP Lang', aplit: 'AP Lit', apcalc: 'AP Calc', apstats: 'AP Stats', apgov: 'AP Gov', appsych: 'AP Psych',
    apcsp: 'AP CSP', apcsa: 'AP CSA', apeuro: 'AP Euro', aphug: 'AP HuG', apes: 'APES', apenv: 'AP Enviro',
  };
  function courseLabel(c) {
    const s = String(c || '').trim();
    if (s !== s.toLowerCase()) return s; // the user chose their own capitals
    if (AP_NAMES[s]) return AP_NAMES[s];
    // "us-history" → "US History", "pe" → "PE", "math" → "Math"
    return s.split(/[-_]+/).filter(Boolean).map((w) => {
      if (w.length <= 2 || /^(ela|apes)$/.test(w)) return w.toUpperCase();
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ');
  }
  function courseChip(c, extra) {
    return '<span class="n-chip n-chip--color tasks-chip' + (extra ? ' ' + extra : '') + '" style="--c:' + courseColor(c) + '">' +
      '<i class="n-chip__dot"></i>' + esc(courseLabel(c)) + '</span>';
  }

  // ------------------------------------------------------------------ model helpers

  function normalizeTask(t) {
    const out = {
      id: String(t.id || U.uid('task')),
      title: typeof t.title === 'string' ? t.title : '',
      done: !!t.done,
      createdAt: Number(t.createdAt) || Date.now(),
    };
    if (typeof t.course === 'string' && t.course.trim()) out.course = t.course.trim().slice(0, 24);
    if (keyToDate(t.due)) out.due = t.due;
    if (out.done) out.doneAt = Number(t.doneAt) || out.createdAt;
    return out;
  }
  function normalizeList(list) {
    return Array.isArray(list) ? list.filter((t) => t && typeof t === 'object').map(normalizeTask) : [];
  }

  function groupTasks(tasks, todayKey) {
    const g = { overdue: [], today: [], upcoming: [], nodate: [], done: [] };
    tasks.forEach((t) => {
      if (t.done) g.done.push(t);
      else if (!t.due) g.nodate.push(t);
      else if (t.due < todayKey) g.overdue.push(t);
      else if (t.due === todayKey) g.today.push(t);
      else g.upcoming.push(t);
    });
    const byDue = (a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : a.createdAt - b.createdAt);
    g.overdue.sort(byDue);
    g.upcoming.sort(byDue);
    g.today.sort((a, b) => a.createdAt - b.createdAt);
    g.nodate.sort((a, b) => a.createdAt - b.createdAt);
    g.done.sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    return g;
  }

  const GROUPS = [
    { id: 'overdue', title: 'Overdue', icon: 'alert-triangle' },
    { id: 'today', title: 'Today', icon: 'sun' },
    { id: 'upcoming', title: 'Upcoming', icon: 'arrow-right' },
    { id: 'nodate', title: 'No date', icon: 'bookmark' },
    { id: 'done', title: 'Done', icon: 'check' },
  ];

  // ------------------------------------------------------------------ app

  function mount(el, ctx) {
    const listId = 'tasks-courses-' + ctx.tabId;
    el.innerHTML =
      '<div class="tasks">' +
        '<header class="tasks-head">' +
          '<div class="tasks-head__text">' +
            '<h1 class="tasks-h1">Tasks</h1>' +
            '<p class="tasks-sub"></p>' +
          '</div>' +
          '<div class="tasks-progress" hidden></div>' +
        '</header>' +
        '<form class="tasks-add" autocomplete="off">' +
          '<div class="tasks-add__box">' +
            '<span class="tasks-add__plus" aria-hidden="true">' + icon('plus', 18) + '</span>' +
            '<input class="tasks-add__input" type="text" enterkeyhint="done" aria-label="Add a task" ' +
              'placeholder="Add a task — try “Read ch. 5 due fri #english”" maxlength="200">' +
            '<button type="submit" class="n-btn n-btn--primary n-btn--sm tasks-add__btn">Add</button>' +
          '</div>' +
          '<div class="tasks-add__preview" aria-live="polite"></div>' +
        '</form>' +
        '<div class="tasks-filters" role="group" aria-label="Filter by class" hidden></div>' +
        '<div class="tasks-groups"></div>' +
        '<datalist id="' + esc(listId) + '"></datalist>' +
      '</div>';

    const $ = (s) => el.querySelector(s);
    const subEl = $('.tasks-sub');
    const progressEl = $('.tasks-progress');
    const form = $('.tasks-add');
    const input = $('.tasks-add__input');
    const previewEl = $('.tasks-add__preview');
    const filtersEl = $('.tasks-filters');
    const groupsEl = $('.tasks-groups');
    const datalist = el.querySelector('datalist');

    let tasks = normalizeList(Nova.data.get('tasks'));
    let lastSaved = JSON.stringify(tasks);
    let todayKey = U.dayKey();
    let filter = typeof ctx.params.filter === 'string' ? ctx.params.filter : null;
    let editingId = null;
    let arriveId = null;
    let pendingRender = false;
    let dayTimer = null;
    let prefs = Object.assign({ showDone: false }, (function (v) { return v && typeof v === 'object' ? v : {}; })(Nova.local.get(UI_KEY, {})));
    const checking = new Map(); // id → timeout while the check-off animation plays
    const offs = [];

    function find(id) { return tasks.find((t) => t.id === id) || null; }

    function save() {
      const json = JSON.stringify(tasks);
      if (json === lastSaved) return;
      lastSaved = json;
      Nova.data.set('tasks', tasks);
    }

    function onRemote(value) {
      const incoming = normalizeList(value);
      const json = JSON.stringify(incoming);
      if (json === lastSaved) return;
      lastSaved = json;
      tasks = incoming;
      if (editingId && !find(editingId)) editingId = null;
      if (editingId || checking.size) { pendingRender = true; return; }
      render();
    }

    function courses() {
      const map = new Map();
      tasks.forEach((t) => {
        if (!t.course) return;
        const k = courseKey(t.course);
        const e = map.get(k) || { key: k, name: t.course, open: 0, total: 0 };
        e.total += 1;
        if (!t.done) e.open += 1;
        map.set(k, e);
      });
      return Array.from(map.values()).sort((a, b) => b.open - a.open || a.key.localeCompare(b.key));
    }

    // ---- quick add
    function renderPreview() {
      const raw = input.value;
      if (!raw.trim()) {
        previewEl.innerHTML = '<span class="tasks-hint">' +
          '<b>Due:</b> today · tmr · fri · next week · 10/16 · oct 16 <span class="tasks-hint__sep">/</span> <b>Class:</b> #math</span>';
        previewEl.classList.remove('has-tokens');
        return;
      }
      const p = parseTask(raw);
      const bits = [];
      if (p.due) {
        const info = dueInfo(p.due, todayKey);
        bits.push('<span class="n-chip tasks-pchip tasks-pchip--due is-' + info.tone + '">' + icon('bell', 12) + 'Due ' + esc(info.long.replace(/ · .*$/, '')) + '</span>');
      }
      if (p.course) bits.push(courseChip(p.course, 'tasks-pchip'));
      if (!p.title) bits.push('<span class="tasks-hint tasks-hint--warn">Add what the task is</span>');
      else if (!bits.length) bits.push('<span class="tasks-hint">No due date — add one like “due fri”, or press Enter</span>');
      previewEl.innerHTML = bits.join('');
      previewEl.classList.toggle('has-tokens', !!(p.due || p.course));
    }

    function addFromInput() {
      const p = parseTask(input.value);
      if (!p.title) {
        form.classList.remove('is-shake');
        void form.offsetWidth;
        form.classList.add('is-shake');
        input.focus();
        return;
      }
      const t = { id: U.uid('task'), title: p.title.slice(0, 200), done: false, createdAt: Date.now() };
      if (p.course) t.course = p.course;
      if (p.due) t.due = p.due;
      tasks.push(t);
      arriveId = t.id;
      if (filter && courseKey(t.course) !== filter) setFilter(null, true);
      input.value = '';
      save();
      render();
      renderPreview();
    }

    // ---- actions
    function setDone(id, done) {
      const t = find(id);
      if (!t || t.done === done) return;
      t.done = done;
      if (done) t.doneAt = Date.now(); else delete t.doneAt;
      arriveId = id;
      save();
      render();
    }

    function startCheck(row, id) {
      const t = find(id);
      if (!t) return;
      if (t.done) { setDone(id, false); return; }
      if (checking.has(id)) { // second click during the animation = never mind
        clearTimeout(checking.get(id));
        checking.delete(id);
        row.classList.remove('is-checking');
        row.querySelector('.tasks-check').setAttribute('aria-checked', 'false');
        flushPending();
        return;
      }
      row.classList.add('is-checking');
      row.querySelector('.tasks-check').setAttribute('aria-checked', 'true');
      burst(row.querySelector('.tasks-check'));
      const ms = Nova.env.reducedMotion ? 120 : 620;
      checking.set(id, setTimeout(() => {
        checking.delete(id);
        setDone(id, true);
      }, ms));
    }

    function burst(anchor) {
      if (Nova.env.reducedMotion || !anchor) return;
      const b = document.createElement('span');
      b.className = 'tasks-burst';
      b.setAttribute('aria-hidden', 'true');
      for (let i = 0; i < 8; i++) {
        const dot = document.createElement('i');
        dot.style.setProperty('--a', (i * 45 + 22) + 'deg');
        b.appendChild(dot);
      }
      anchor.appendChild(b);
      setTimeout(() => b.remove(), 700);
    }

    function removeTask(id) {
      const i = tasks.findIndex((t) => t.id === id);
      if (i < 0) return;
      const t = tasks[i];
      tasks.splice(i, 1);
      if (editingId === id) editingId = null;
      save();
      render();
      Nova.ui.toast('Deleted “' + truncate(t.title, 40) + '”', {
        action: { label: 'Undo', onClick() { if (!find(t.id)) { tasks.splice(Math.min(i, tasks.length), 0, t); arriveId = t.id; save(); render(); } } },
        timeout: 6000,
      });
    }

    function clearDone() {
      const done = tasks.filter((t) => t.done);
      if (!done.length) return;
      const before = tasks.slice();
      tasks = tasks.filter((t) => !t.done);
      save();
      render();
      Nova.ui.toast('Cleared ' + done.length + (done.length === 1 ? ' finished task' : ' finished tasks'), {
        action: { label: 'Undo', onClick() { tasks = before.concat(tasks.filter((t) => !before.some((b) => b.id === t.id))); save(); render(); } },
        timeout: 6000,
      });
    }

    function setFilter(key, silent) {
      filter = key || null;
      ctx.setParams(filter ? { filter } : {});
      if (!silent) render();
    }

    function truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }

    // ---- editing
    function startEdit(id) {
      if (!find(id)) return;
      editingId = id;
      render();
      const row = groupsEl.querySelector('.tasks-row.is-editing .tasks-edit__title');
      if (row) { row.focus(); row.setSelectionRange(row.value.length, row.value.length); }
    }

    function commitEdit(formEl) {
      const t = find(editingId);
      if (!t) { stopEdit(); return; }
      const titleIn = formEl.querySelector('.tasks-edit__title');
      const dateIn = formEl.querySelector('.tasks-edit__date');
      const courseIn = formEl.querySelector('.tasks-edit__course');
      const p = parseTask(titleIn.value);
      if (!p.title) { titleIn.setAttribute('aria-invalid', 'true'); titleIn.focus(); return; }
      t.title = p.title.slice(0, 200);
      const due = p.due || (keyToDate(dateIn.value) ? dateIn.value : null);
      if (due) t.due = due; else delete t.due;
      const course = (p.course || courseIn.value.replace(/^#/, '')).trim().slice(0, 24);
      if (course) t.course = course; else delete t.course;
      stopEdit(true);
    }

    function stopEdit(changed) {
      const id = editingId;
      editingId = null;
      if (changed) save();
      render();
      const btn = id && groupsEl.querySelector('.tasks-row[data-id="' + CSS.escape(id) + '"] .tasks-row__title');
      if (btn) btn.focus();
    }

    function flushPending() {
      if (pendingRender && !editingId && !checking.size) { pendingRender = false; render(); }
    }

    // ---- rendering
    function rowHtml(t, groupId) {
      if (t.id === editingId) return editHtml(t);
      const info = t.due ? dueInfo(t.due, todayKey) : null;
      const showDue = info && !(groupId === 'today' && info.tone === 'today');
      const classes = ['tasks-row'];
      if (t.done) classes.push('is-done');
      if (t.id === arriveId) classes.push('is-arriving');
      return '<li class="' + classes.join(' ') + '" data-id="' + esc(t.id) + '">' +
        '<button type="button" class="tasks-check" role="checkbox" aria-checked="' + t.done + '" aria-label="' +
          esc((t.done ? 'Mark not done: ' : 'Mark done: ') + t.title) + '">' +
          '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</button>' +
        '<div class="tasks-row__main">' +
          '<button type="button" class="tasks-row__title" title="Click to edit · Delete key removes">' + esc(t.title) + '</button>' +
          '<span class="tasks-row__meta">' +
            (t.course ? courseChip(t.course) : '') +
            (showDue ? '<span class="tasks-due is-' + (t.done ? 'done' : info.tone) + '" title="' + esc(info.long) + '">' + esc(info.label) + '</span>' : '') +
          '</span>' +
        '</div>' +
      '</li>';
    }

    function editHtml(t) {
      return '<li class="tasks-row is-editing" data-id="' + esc(t.id) + '">' +
        '<form class="tasks-edit">' +
          '<input class="n-input tasks-edit__title" type="text" value="' + esc(t.title) + '" aria-label="Task" maxlength="200">' +
          '<div class="tasks-edit__fields">' +
            '<label class="tasks-edit__field"><span class="n-label">Due</span>' +
              '<input class="n-input tasks-edit__date" type="date" value="' + esc(t.due || '') + '"></label>' +
            '<div class="tasks-edit__quick" role="group" aria-label="Quick due dates">' +
              '<button type="button" class="n-chip" data-due="today">Today</button>' +
              '<button type="button" class="n-chip" data-due="tomorrow">Tomorrow</button>' +
              '<button type="button" class="n-chip" data-due="none">No date</button>' +
            '</div>' +
            '<label class="tasks-edit__field tasks-edit__field--course"><span class="n-label">Class</span>' +
              '<input class="n-input tasks-edit__course" type="text" list="' + esc(listId) + '" value="' + esc(t.course || '') + '" placeholder="math" maxlength="24"></label>' +
          '</div>' +
          '<div class="tasks-edit__actions">' +
            '<button type="button" class="n-btn n-btn--ghost n-btn--danger n-btn--sm" data-act="delete">' + icon('trash', 14) + '<span>Delete</span></button>' +
            '<span class="tasks-edit__spacer"></span>' +
            '<button type="button" class="n-btn n-btn--sm" data-act="cancel">Cancel</button>' +
            '<button type="submit" class="n-btn n-btn--primary n-btn--sm">Save</button>' +
          '</div>' +
        '</form>' +
      '</li>';
    }

    function groupHtml(def, list) {
      if (!list.length) return '';
      const isDone = def.id === 'done';
      const collapsed = isDone && !prefs.showDone;
      let rows = '';
      if (!collapsed) {
        rows = list.map((t) => rowHtml(t, def.id)).join('');
      }
      const extra = def.id === 'today' ? '<span class="tasks-group__date">' + esc(fmtMonthDay.format(keyToDate(todayKey))) + '</span>' : '';
      return '<section class="tasks-group tasks-group--' + def.id + (collapsed ? ' is-collapsed' : '') + '" aria-label="' + esc(def.title) + '">' +
        '<header class="tasks-group__head">' +
          (isDone
            ? '<button type="button" class="tasks-group__toggle" aria-expanded="' + !collapsed + '">' + icon('chevron-down', 14) +
                '<h2>' + esc(def.title) + '</h2><span class="tasks-group__count">' + list.length + '</span></button>' +
              '<span class="tasks-group__spacer"></span>' +
              '<button type="button" class="n-btn n-btn--ghost n-btn--sm tasks-clear">Clear done</button>'
            : '<span class="tasks-group__icon">' + icon(def.icon, 13) + '</span><h2>' + esc(def.title) + '</h2>' +
              '<span class="tasks-group__count">' + list.length + '</span>' + extra) +
        '</header>' +
        (collapsed ? '' : '<ul class="tasks-list">' + rows + '</ul>') +
      '</section>';
    }

    function renderHeader(groups) {
      const d = keyToDate(todayKey);
      const parts = [];
      if (groups.overdue.length) parts.push('<span class="is-overdue">' + groups.overdue.length + ' overdue</span>');
      if (groups.today.length) parts.push(groups.today.length + ' due today');
      if (groups.upcoming.length) parts.push(groups.upcoming.length + ' upcoming');
      const open = groups.overdue.length + groups.today.length + groups.upcoming.length + groups.nodate.length;
      if (!parts.length && open) parts.push(open + (open === 1 ? ' open task' : ' open tasks'));
      subEl.innerHTML = esc(fmtHeader.format(d)) + (parts.length ? ' <span aria-hidden="true">·</span> ' + parts.join(' <span aria-hidden="true">·</span> ') : '');

      // "2 of 5 done today": tasks due today plus anything finished today.
      const dueToday = tasks.filter((t) => t.due === todayKey || (t.done && t.doneAt && U.dayKey(t.doneAt) === todayKey && (!t.due || t.due <= todayKey)));
      const doneToday = dueToday.filter((t) => t.done).length;
      if (dueToday.length) {
        const pct = Math.round((doneToday / dueToday.length) * 100);
        progressEl.hidden = false;
        progressEl.innerHTML =
          '<svg class="tasks-progress__ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" class="tasks-progress__track"/>' +
          '<circle cx="18" cy="18" r="15" class="tasks-progress__bar" style="stroke-dashoffset:' + (94.25 * (1 - pct / 100)).toFixed(2) + '"/></svg>' +
          '<span class="tasks-progress__text"><b>' + doneToday + ' of ' + dueToday.length + '</b><span>done today</span></span>';
        progressEl.classList.toggle('is-complete', doneToday === dueToday.length);
      } else {
        progressEl.hidden = true;
      }
    }

    function renderFilters(list) {
      if (!list.length) { filtersEl.hidden = true; filtersEl.innerHTML = ''; if (filter) filter = null; return; }
      if (filter && !list.some((c) => c.key === filter)) filter = null;
      filtersEl.hidden = false;
      const total = tasks.filter((t) => !t.done).length;
      filtersEl.innerHTML =
        '<button type="button" class="n-chip tasks-filter" data-filter="" aria-pressed="' + !filter + '">All<span class="tasks-filter__n">' + total + '</span></button>' +
        list.map((c) => '<button type="button" class="n-chip tasks-filter tasks-filter--course" data-filter="' + esc(c.key) + '" aria-pressed="' + (filter === c.key) + '" style="--c:' + courseColor(c.name) + '">' +
          '<i class="n-chip__dot"></i>' + esc(courseLabel(c.name)) + '<span class="tasks-filter__n">' + c.open + '</span></button>').join('');
      datalist.innerHTML = list.map((c) => '<option value="' + esc(c.name) + '"></option>').join('');
    }

    function render() {
      todayKey = U.dayKey();
      const allGroups = groupTasks(tasks, todayKey);
      renderHeader(allGroups);
      renderFilters(courses());
      const visible = filter ? tasks.filter((t) => courseKey(t.course) === filter) : tasks;
      const groups = filter ? groupTasks(visible, todayKey) : allGroups;
      const openCount = groups.overdue.length + groups.today.length + groups.upcoming.length + groups.nodate.length;

      let html = '';
      if (!tasks.length) {
        html = '<div class="tasks-empty n-empty">' +
          '<div class="n-empty__icon">' + icon('check', 24) + '</div>' +
          '<div class="n-empty__title">Nothing on your list</div>' +
          '<div class="n-empty__hint">Type a task above and press Enter. Nova understands due days and class tags:</div>' +
          '<button type="button" class="tasks-example" data-example="Finish geometry 4.3 due fri #math">Finish geometry 4.3 <b>due fri</b> <b>#math</b></button>' +
        '</div>';
      } else if (!openCount) {
        html = '<div class="tasks-allclear">' +
          '<span class="tasks-allclear__icon">' + icon('sparkles', 20) + '</span>' +
          '<div><div class="tasks-allclear__title">' + (filter ? 'All caught up in ' + esc(courseLabel(filter)) : 'All caught up') + '</div>' +
          '<div class="tasks-allclear__hint">Nothing left to do. Enjoy it.</div></div>' +
        '</div>';
      }
      html += GROUPS.map((def) => groupHtml(def, groups[def.id])).join('');
      groupsEl.innerHTML = html;
      arriveId = null;
    }

    // ---- events
    form.addEventListener('submit', (e) => { e.preventDefault(); addFromInput(); });
    form.addEventListener('animationend', () => form.classList.remove('is-shake'));
    input.addEventListener('input', renderPreview);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && input.value) { e.stopPropagation(); input.value = ''; renderPreview(); }
    });

    filtersEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-filter]');
      if (b) setFilter(b.dataset.filter || null);
    });

    groupsEl.addEventListener('click', (e) => {
      const target = e.target;
      const example = target.closest('.tasks-example');
      if (example) { input.value = example.dataset.example; renderPreview(); input.focus(); return; }

        return;

      const id = row.dataset.id;
      if (row.classList.contains('is-editing')) {
        const act = target.closest('[data-act]');
        const quick = target.closest('[data-due]');
        if (quick) {
          const dateIn = row.querySelector('.tasks-edit__date');
          const v = quick.dataset.due;
          dateIn.value = v === 'today' ? todayKey : v === 'tomorrow' ? U.dayKey(addDays(keyToDate(todayKey), 1)) : '';
          return;

        if (act.dataset.act === 'cancel') stopEdit(false);
        else if (act.dataset.act === 'delete') removeTask(id);
        return;
      }

      if (target.closest('.tasks-row__title, .tasks-row__main')) startEdit(id);
    });

    groupsEl.addEventListener('submit', (e) => {
      const f = e.target.closest('.tasks-edit');
      if (!f) return;
      e.preventDefault();
      commitEdit(f);
    });
    groupsEl.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && e.target.closest('.tasks-edit')) { e.stopPropagation(); stopEdit(false); return; }

    groupsEl.addEventListener('focusout', (e) => {
      const f = e.target.closest('.tasks-edit');
      if (!f) return;

    offs.push(Nova.on('data:tasks', onRemote));

    }

    render();
    renderPreview();
    handleParams(ctx.params);

    return {
      onShow() {
        if (U.dayKey() !== todayKey) render();
        clearInterval(dayTimer);
        dayTimer = setInterval(() => { if (U.dayKey() !== todayKey && !editingId) render(); }, 60000);
      },
      onHide() { clearInterval(dayTimer); },
      onParams: handleParams,
      unmount() {
        clearInterval(dayTimer);
        checking.forEach((timer, id) => { clearTimeout(timer); const t = find(id); if (t && !t.done) { t.done = true; t.doneAt = Date.now(); } });

    id: 'tasks',
    name: 'Tasks',
    icon: 'list-checks',
    singleton: true,
    keywords: ['task', 'tasks', 'todo', 'to-do', 'homework', 'hw', 'assignments', 'due'],
    description: 'Homework and to-dos with due days and class tags',

  });

  window.NovaTasks = { parse: parseTask, dueInfo, courseColor, courseLabel, groupTasks };
})();

/* ---- web/src/js/apps/focus.js ---- */
/* Nova Focus (SPEC §4.1) — Pomodoro timer: 25/5 by default, a 15-minute long break after every 4th focus

 *
 * Nova.local('focus') — owned by this file; the Home widget reads it. Exact shape:
 *   {
 *     mode: 'focus' | 'short' | 'long',          current phase
 *     running: boolean,
 *     endsAt: number | null,                      ms timestamp the phase ends at (set only while running)
 *     remainingMs: number,                        ms left while paused/idle; while running it holds the value at
 *                                                 the moment it started — use endsAt - Date.now() instead
 *     lengths: { focus: 25, short: 5, long: 15 }, minutes
 *     sessionsToday: number,                      finished focus sessions on `day`
 *     day: 'YYYY-MM-DD',                          local day sessionsToday counts (a different day means 0)
 *     paused: boolean,                            extra, derived: !running && remainingMs < durationMs
 *     durationMs: number,                         extra, derived: full length of the current phase in ms
 *   }
 * Time left = running ? max(0, endsAt - now) : remainingMs.
 *
 * The timer engine lives at module level (not in the tab), so the countdown, the document-title prefix
 * ("12:04 · …", via Nova.setTitlePrefix) and the chime keep working when the Focus tab is closed or hidden,
 * and a session that ended while Nova was closed is counted on the next load.
 * Commands: open Focus with params { start: true } | { action: 'start' } | nova:focus/start, or call
 *   Nova.emit('focus:command', 'start' | 'pause' | 'toggle' | 'reset' | 'skip').

  const DEFAULT_LENGTHS = { focus: 25, short: 5, long: 15 };
  const LIMITS = { focus: [1, 120], short: [1, 30], long: [1, 60] };
  const LABELS = { focus: 'Focus', short: 'Short break', long: 'Long break' };
  const LONG_EVERY = 4;

  // Small stroke icons the shared set doesn't have (Lucide paths, ISC license).
  const EXTRA = {
    play: '<path d="M7 4.5v15a1 1 0 0 0 1.52.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor" stroke="none"/>',
    pause: '<rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none"/><rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none"/>',
    skip: '<path d="M5 5v14l10-7z"/><path d="M19 5v14"/>',
    reset: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  };

    size = size || 18;

    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const pad = (n) => (n < 10 ? '0' : '') + n;

  function normalize(raw) {

    const full = lengths[mode] * 60000;

      mode,
      running: false,
      endsAt: null,
      remainingMs: full,
      lengths,
      sessionsToday: sameDay ? clampInt(raw.sessionsToday, 0, 999, 0) : 0,
      day: today,
      paused: false,

    notify({ type: 'tick' });
    schedule();
  }

  // ---- commands
  function start() {

    state.endsAt = Date.now() + state.remainingMs;

    armChime();
    schedule();
    updateTitle();
    notify({ type: 'start' });

    if (!state.running) return;
    state.remainingMs = Math.max(1000, left());
    state.running = false;
    state.endsAt = null;
    save();
    cancelChime();
    schedule();
    updateTitle();
    notify({ type: 'pause' });

  function toggle() { if (state.running) pause(); else start(); }

  function reset() {
    state.running = false;
    state.endsAt = null;
    state.remainingMs = fullMs();
    save();
    cancelChime();
    schedule();
    updateTitle();
    notify({ type: 'reset' });
  }

  function setMode(mode, opts) {
    if (MODES.indexOf(mode) === -1) return;
    state.mode = mode;
    state.running = false;
    state.endsAt = null;
    state.remainingMs = fullMs(mode);
    save();
    cancelChime();
    schedule();
    updateTitle();
    notify({ type: 'mode' });

    if (mode !== 'focus') return 'focus';

    state.running = false;
    state.endsAt = null;

        osc.stop(t0 + 1.8);

    get state() { return state; },

    get prefs() { return prefs; },

              '</linearGradient></defs>' +

            '<button type="button" class="n-btn n-btn--ghost n-btn--icon n-btn--lg focus-reset" aria-label="Reset timer" title="Reset (R)">' + xicon('reset', 19) + '</button>' +
            '<button type="button" class="n-btn n-btn--primary n-btn--lg focus-main"></button>' +
            '<button type="button" class="n-btn n-btn--ghost n-btn--icon n-btn--lg focus-skip" aria-label="Skip" title="Skip">' + xicon('skip', 19) + '</button>' +
          '</div>' +

                    '<button type="button" class="n-btn n-btn--ghost n-btn--icon n-btn--sm" data-step="-1" aria-label="Shorter ' + LABELS[m].toLowerCase() + '">' + icon('minus', 14) + '</button>' +
                    '<input type="number" class="focus-len__input" inputmode="numeric" min="' + LIMITS[m][0] + '" max="' + LIMITS[m][1] + '" aria-label="' + LABELS[m] + ' minutes">' +
                    '<button type="button" class="n-btn n-btn--ghost n-btn--icon n-btn--sm" data-step="1" aria-label="Longer ' + LABELS[m].toLowerCase() + '">' + icon('plus', 14) + '</button>' +
                  '</div>' +
                  '<span class="focus-len__unit">min</span>' +
                '</div>').join('') +
            '</div>' +
            '<div class="focus-sound">' +
              '<label class="focus-sound__label"><input type="checkbox" class="n-switch focus-sound__switch"><span>Chime when time’s up</span></label>' +
              '<button type="button" class="n-btn n-btn--ghost n-btn--sm focus-sound__test">' + icon('volume', 14) + '<span>Test</span></button>' +
            '</div>' +
            '<p class="n-hint focus-settings__hint">A long break comes after every ' + LONG_EVERY + ' focus sessions. The timer keeps running in other tabs.</p>' +
          '</div>' +
        '</div>' +
      '</div>';

    const $ = (s) => el.querySelector(s);
    const root = $('.focus');
    const bar = $('.focus-ring__bar');
    const knob = $('.focus-ring__knob');
    const timeEl = $('.focus-time');
    const phaseEl = $('.focus-phase');
    const noteEl = $('.focus-note');
    const mainBtn = $('.focus-main');
    const skipBtn = $('.focus-skip');
    const resetBtn = $('.focus-reset');
    const todayEl = $('.focus-today');
    const settingsEl = $('.focus-settings');
    const moreBtn = $('.focus-more__btn');
    const soundSwitch = $('.focus-sound__switch');
    const modeBtns = Array.from(el.querySelectorAll('.focus-modes button'));

    let raf = 0;
    let visible = false;
    let lastText = '';
    let celebrateTimer = null;

    function renderRing() {
      const s = engine.state;
      const full = s.lengths[s.mode] * 60000;
      const frac = Math.max(0, Math.min(1, engine.left() / full));
      bar.style.strokeDashoffset = (C * (1 - frac)).toFixed(2);
      knob.style.transform = 'rotate(' + (frac * 360).toFixed(2) + 'deg)';
      knob.classList.toggle('is-hidden', frac <= 0.001 || frac >= 0.999);
    }

    function renderTime() {
      const text = fmtClock(engine.left());
      if (text !== lastText) { timeEl.textContent = text; lastText = text; }
    }

    function render() {
      const s = engine.state;
      const full = s.lengths[s.mode] * 60000;
      const remaining = engine.left();
      const paused = !s.running && remaining < full;
      root.dataset.mode = s.mode;
      root.classList.toggle('is-running', s.running);
      root.classList.toggle('is-paused', paused);
      modeBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === s.mode)));

      const sessionNo = s.sessionsToday + 1;
      phaseEl.textContent = s.mode === 'focus' ? 'Focus · session ' + sessionNo : LABELS[s.mode];
      if (s.running) {
        noteEl.textContent = (s.mode === 'focus' ? 'Ends at ' : 'Back at ') + timeFormatter().format(new Date(s.endsAt));
      } else if (paused) {
        noteEl.textContent = 'Paused';
      } else {
        noteEl.textContent = s.mode === 'focus' ? 'Ready when you are' : 'Stretch, sip water, look away';
      }

      let label;
      let ico;
      if (s.running) { label = 'Pause'; ico = 'pause'; }
      else if (paused) { label = 'Resume'; ico = 'play'; }
      else { label = s.mode === 'focus' ? 'Start focus' : 'Start break'; ico = 'play'; }
      mainBtn.innerHTML = xicon(ico, 17) + '<span>' + label + '</span>';
      mainBtn.setAttribute('aria-label', label + ' (Space)');
      skipBtn.title = s.mode === 'focus' ? 'Skip to break' : 'Skip break';
      skipBtn.setAttribute('aria-label', skipBtn.title);
      resetBtn.disabled = !s.running && !paused;

      // Sessions today: dots for the current set of 4.
      const n = s.sessionsToday;
      let filled = n % LONG_EVERY;
      if (n > 0 && filled === 0 && s.mode === 'long') filled = LONG_EVERY;
      let dots = '';
      for (let i = 0; i < LONG_EVERY; i++) dots += '<i class="focus-dot' + (i < filled ? ' is-on' : '') + '"></i>';
      const toLong = LONG_EVERY - (n % LONG_EVERY);
      let text;
      if (!n) text = 'No sessions yet today';
      else text = '<b>' + n + '</b> ' + (n === 1 ? 'session' : 'sessions') + ' today';
      if (s.mode === 'long') text += ' · long break earned';
