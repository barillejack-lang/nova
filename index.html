    const engines = THEMES.searchEngines || {};
    const out = {
      theme: vTheme(raw.theme),
      accent: vAccent(raw.accent),
      wallpaper: raw.wallpaper === 'none' || wallpaperIds.has(raw.wallpaper) ? raw.wallpaper : 'none',
      layout: vEnum(raw.layout, ['vertical', 'horizontal'], DEFAULTS.layout),
      sidebarSide: vEnum(raw.sidebarSide, ['left', 'right'], DEFAULTS.sidebarSide),
      sidebarWidth: vInt(raw.sidebarWidth, 200, 360, DEFAULTS.sidebarWidth),
      sidebarCollapsed: vBool(raw.sidebarCollapsed, DEFAULTS.sidebarCollapsed),
      density: vEnum(raw.density, ['comfortable', 'compact'], DEFAULTS.density),
      cornerRadius: vInt(raw.cornerRadius, 0, 20, DEFAULTS.cornerRadius),
      contentInset: vInt(raw.contentInset, 0, 16, DEFAULTS.contentInset),
      font: vEnum(raw.font, ['system', 'rounded', 'serif', 'mono'], DEFAULTS.font),
      name: typeof raw.name === 'string' ? raw.name.replace(/\s+/g, ' ').trim().slice(0, 40) : DEFAULTS.name,
      searchEngine: Object.prototype.hasOwnProperty.call(engines, raw.searchEngine) ? raw.searchEngine : DEFAULTS.searchEngine,
      clock24: vBool(raw.clock24, DEFAULTS.clock24),
      onboarded: vBool(raw.onboarded, DEFAULTS.onboarded),
      home: {},
    };
    const home = isObj(raw.home) ? raw.home : {};
    Object.keys(DEFAULTS.home).forEach((k) => { out.home[k] = vBool(home[k], DEFAULTS.home[k]); });
    Object.keys(home).forEach((k) => { if (!(k in out.home) && typeof home[k] === 'boolean') out.home[k] = home[k]; });
    Object.keys(raw).forEach((k) => { if (!(k in out) && isSmallJson(raw[k])) out[k] = clone(raw[k]); });
    return out;
  }

  let settings = validateSettings(Store.get('settings'));
  let frozenSettings = null;
  let lastTheme = null;

  function getSettings() {
    if (!frozenSettings) frozenSettings = deepFreeze(clone(settings));
    return frozenSettings;
  }

  // A light wallpaper under a dark theme (or the reverse) leaves the sidebar, tab strip and Home text on a background of
  // nearly their own colour. theme.js only tints --n-sidebar for that, which the sidebar itself never paints, so the
  // frame gets the scrim: the wallpaper stays visible, dimmed (dark theme) or washed (light theme).
  function dimClashingWallpaper(res) {
    const wp = settings.wallpaper;
    const w = res && wp && wp !== 'none' ? (THEMES.wallpapers || []).find((x) => x.id === wp) : null;
    if (!w || !res.vars || w.tone === res.scheme) return;
    const scrim = res.scheme === 'dark' ? 'rgba(8, 8, 14, 0.74)' : 'rgba(255, 255, 255, 0.8)';
    html.style.setProperty('--n-frame', 'linear-gradient(' + scrim + ', ' + scrim + '), ' + w.css);
  }

  function applyTheme() {
    try {
      lastTheme = Theme.apply(settings, THEMES, html);
      if (lastTheme && lastTheme.windowBg) html.style.setProperty('--n-window-bg', lastTheme.windowBg);
      dimClashingWallpaper(lastTheme);
    } catch (err) {
      console.error('[nova] theme failed to apply', err);
      return null;
    }
    emit('theme', lastTheme);
    return lastTheme;
  }

  function commitSettings(next, persist) {
    settings = next;
    frozenSettings = null;
    if (persist) Store.set('settings', next);
    applyTheme();
    emit('settings', getSettings());
  }

  function updateSettings(patch) {
    if (!isObj(patch)) return getSettings();
    const merged = Object.assign({}, settings, patch);
    if (isObj(patch.home)) merged.home = Object.assign({}, settings.home, patch.home);
    const next = validateSettings(merged);
    if (JSON.stringify(next) !== JSON.stringify(settings)) commitSettings(next, true);
    return getSettings();
  }

  function resetSettings() {
    commitSettings(validateSettings(DEFAULTS), true);
    return getSettings();
  }

  // ================================================================ data + local

  const DATA_KEYS = ['links', 'notes', 'tasks'];
  const LOCAL_ONLY_HINT = ['tabs', 'focus', 'recents', 'draw', 'ui'];

  function dataDefault(key) {
    if (key === 'links') return Sites.defaultLinks.map((l) => Object.assign({}, l));
    return [];
  }

  function sanitizeList(key, value) {
    if (!Array.isArray(value)) return null;
    const out = [];
    const ids = new Set();
    value.forEach((item) => {
      if (!isObj(item)) return;
      const copy = clone(item);
      if (typeof copy.id !== 'string' || !copy.id || ids.has(copy.id)) copy.id = uid(key.slice(0, -1) || 'item');
      ids.add(copy.id);
      if (key === 'links') {
        const url = typeof copy.url === 'string' ? normalizeUrl(copy.url) : '';
        if (!url) return; // http(s) only — never keep javascript:/data: links from an import
        copy.url = url;
        copy.title = typeof copy.title === 'string' && copy.title.trim() ? copy.title.trim().slice(0, 60) : Sites.nameFor(copy.url);
        if (copy.color != null && !/^#[0-9a-f]{6}$/i.test(copy.color)) delete copy.color;
      }
      out.push(copy);
    });
    return out;
  }

  function dataGet(key) {
    const v = Store.get(key);
    if (DATA_KEYS.indexOf(key) === -1) return v;
    return Array.isArray(v) ? v : dataDefault(key);
  }

  function dataSet(key, value) {
    if (DATA_KEYS.indexOf(key) === -1) {
      console.warn('[nova] Nova.data only syncs ' + DATA_KEYS.join('/') + ' — "' + key + '" belongs in Nova.local');
      return Store.set(key, value);
    }
    const clean = sanitizeList(key, value);
    if (!clean) { console.error('[nova] Nova.data.set("' + key + '") expects an array'); return false; }
    return Store.set(key, clean);
  }

  function localGet(key, dflt) {
    if (Store.isSynced(key)) console.warn('[nova] "' + key + '" is a synced key — use Nova.data / Nova.settings');
    return Store.get(key, dflt);
  }

  function localSet(key, value) { return Store.set(key, value); }

  // One listener fans store changes out as Nova events.
  Store.onChange((key, value, source) => {
    if (key === 'settings') {
      if (source === 'local') return; // updateSettings already applied + emitted
      const next = validateSettings(value);
      if (JSON.stringify(next) !== JSON.stringify(settings)) commitSettings(next, false);
      return;
    }
    if (DATA_KEYS.indexOf(key) !== -1) {
      const v = Array.isArray(value) ? value : dataDefault(key);
      emit('data:' + key, v);
      emit('data', { key, value: clone(v), source });
      return;
    }
    if (key === 'recents') emit('recents', recentsList());
    emit('local:' + key, value);
  });

  // ================================================================ backup (export / import / reset)

  function exportAll() {
    return {
      app: 'nova', version: VERSION, exportedAt: new Date().toISOString(),
      settings: clone(settings), links: dataGet('links'), notes: dataGet('notes'), tasks: dataGet('tasks'),
    };
  }

  /** Import a backup object (or JSON string). Returns { ok, imported: [keys], error? }. */
  function importAll(input) {
    let obj = input;
    if (typeof input === 'string') {
      try { obj = JSON.parse(input); } catch (_) { return { ok: false, imported: [], error: 'That isn’t valid JSON.' }; }
    }
    if (!isObj(obj)) return { ok: false, imported: [], error: 'Expected a Nova backup object.' };
    const imported = [];
    if (isObj(obj.settings)) { updateSettings(obj.settings); imported.push('settings'); }
    DATA_KEYS.forEach((k) => {
      if (Array.isArray(obj[k])) { dataSet(k, obj[k]); imported.push(k); }
    });
    return imported.length ? { ok: true, imported } : { ok: false, imported, error: 'No settings, links, notes or tasks found.' };
  }

  // Device-only leftovers go too: the Spotify sign-in, the player's own prefs, searches in the address bar, the focus timer.
  function resetAll() {
    resetSettings();
    DATA_KEYS.forEach((k) => Store.set(k, dataDefault(k)));
    try { if (window.NovaMusic && window.NovaMusic.supported) window.NovaMusic.disconnect(); } catch (_) { /* ignore */ }
    Store.remove('spotify');
    Store.remove('music');
    Store.set('recents', []);
    Store.set('focus', null);
  }

  // ================================================================ apps

  const apps = new Map();
  let booted = false;

  function registerApp(desc) {
    if (!desc || typeof desc.id !== 'string' || !desc.id) { console.error('[nova] registerApp needs an id', desc); return null; }
    if (typeof desc.mount !== 'function') { console.error('[nova] app "' + desc.id + '" needs a mount(el, ctx) function'); return null; }
    if (apps.has(desc.id)) console.warn('[nova] app "' + desc.id + '" registered twice — keeping the newer one');
    const app = {
      id: desc.id,
      name: String(desc.name || desc.id),
      title: String(desc.title || desc.name || desc.id), // initial tab title (home uses "New tab")
      icon: String(desc.icon || 'globe'),
      singleton: !!desc.singleton,
      hidden: !!desc.hidden,
      keywords: Array.isArray(desc.keywords) ? desc.keywords.map((k) => String(k).toLowerCase()) : [],
      description: String(desc.description || ''),
      mount: desc.mount,
    };
    apps.set(app.id, app);
    if (booted) emit('apps', listApps());
    return publicApp(app);
  }

  function publicApp(a) {
    return {
      id: a.id, name: a.name, title: a.title, icon: a.icon, singleton: a.singleton, hidden: a.hidden,
      keywords: a.keywords.slice(), description: a.description,
    };
  }

  function listApps() { return Array.from(apps.values()).map(publicApp); }
  function getApp(id) { const a = apps.get(id); return a ? publicApp(a) : null; }

  // ================================================================ tabs

  const T = {
    list: [],          // [{ id, appId, params, title, icon, url, pinned }]
    activeId: null,
    history: [],       // activation history (tab ids)
    histIdx: -1,
    closed: [],        // [{ appId, params, title, pinned, index }]
    views: new Map(),  // tabId → { el, inst, visible }
    host: null,
  };

  function publicTab(t) {
    const out = { id: t.id, appId: t.appId, params: clone(t.params) || {}, title: t.title, icon: t.icon, pinned: t.pinned };
    if (t.url) out.url = t.url;
    return out;
  }

  function findTab(id) { return T.list.find((t) => t.id === id) || null; }
  function indexOfTab(id) { return T.list.findIndex((t) => t.id === id); }
  function pinnedCount() { return T.list.filter((t) => t.pinned).length; }

  function tabsPayload() {
    return {
      tabs: T.list.map(publicTab),
      activeId: T.activeId,
      canBack: T.histIdx > 0,
      canForward: T.histIdx < T.history.length - 1,
      closedCount: T.closed.length,
    };
  }

  const saveSession = debounce(() => {
    const tabs = T.list.map((t) => ({ appId: t.appId, params: t.params, title: t.title, pinned: t.pinned }));
    Store.set('tabs', { tabs, activeIndex: indexOfTab(T.activeId) });
  }, 300);

  function changed() {
    emit('tabs', tabsPayload());
    saveSession();
  }

  function normalizeTarget(target) {
    if (typeof target === 'string') {
      const m = /^nova:(?:\/\/)?([\w-]+)(?:\/(.*))?$/i.exec(target.trim());
      if (m) return { app: m[1].toLowerCase(), params: m[2] ? { path: m[2] } : {} };
      return { app: target.trim(), params: {} };
    }
    if (isObj(target)) {
      const params = isObj(target.params) ? clone(target.params) : {};
      if (target.app || target.appId) return { app: String(target.app || target.appId), params };
      if (target.url) return { app: 'web', params: Object.assign(params, { url: String(target.url) }) };
    }
    return null;
  }

  function tabTitleFor(app, params) {
    if (app.id === 'web' && params && params.url) return Sites.nameFor(params.url);
    return app.title;
  }

  function insertTab(tab, index) {
    const pc = pinnedCount();
    const lo = tab.pinned ? 0 : pc;
    const hi = tab.pinned ? pc : T.list.length;
    const i = Number.isInteger(index) ? Math.min(hi, Math.max(lo, index)) : hi;
    T.list.splice(i, 0, tab);
  }

  function makeTab(app, params, extra) {
    params = params || {};
    return Object.assign({
      id: uid('tab'), appId: app.id, params, title: tabTitleFor(app, params), icon: app.icon,
      url: typeof params.url === 'string' ? params.url : undefined, pinned: false,
    }, extra || {});
  }

  function openTab(target, opts) {
    opts = opts || {};
    const t = normalizeTarget(target);
    const app = t && apps.get(t.app);
    if (!app) { console.warn('[nova] tabs.open: unknown app', target); return null; }
    if (app.singleton) {
      const existing = T.list.find((x) => x.appId === app.id);
      if (existing) {
        if (Object.keys(t.params).length) setParams(existing, t.params, true);
        if (!opts.background) activate(existing.id); else changed();
        return existing.id;
      }
    }
    const tab = makeTab(app, t.params, { pinned: !!opts.pinned });
    if (typeof opts.title === 'string' && opts.title) tab.title = opts.title.slice(0, 120);
    insertTab(tab, opts.index);
    if (!opts.background || !T.activeId) activate(tab.id); else changed();
    return tab.id;
  }

  function pushHistory(id) {
    T.history = T.history.slice(0, T.histIdx + 1);
    if (T.history[T.history.length - 1] !== id) T.history.push(id);
    if (T.history.length > 60) T.history = T.history.slice(-60);
    T.histIdx = T.history.length - 1;
  }

  function removeFromHistory(id) {
    const out = [];
    let idx = T.histIdx;
    T.history.forEach((h, i) => {
      const drop = h === id || (out.length && out[out.length - 1] === h);
      if (drop) { if (i <= T.histIdx) idx -= 1; return; }
      out.push(h);
    });
    T.history = out;
    T.histIdx = Math.max(-1, Math.min(idx, out.length - 1));
  }

  function activate(id, opts) {
    const tab = findTab(id);
    if (!tab) return false;
    const prev = T.activeId;
    const pv = prev && prev !== id ? T.views.get(prev) : null;
    const hadFocus = !!pv && pv.visible && pv.el.contains(document.activeElement); // e.g. Enter on a Home tile
    if (prev !== id) {
      T.activeId = id;
      if (!(opts && opts.fromHistory)) pushHistory(id);
      if (prev) hideView(prev);
    }
    showView(id);
    if (hadFocus) focusView(id);
    changed();
    updateDocTitle();
    return true;
  }

  /** Keyboard focus was inside the tab that just hid: hand it to the new page, so Tab carries on from its top. */
  function focusView(id) {
    const v = T.views.get(id);
    if (!v || !v.visible) return;
    v.el.tabIndex = -1;
    try { v.el.focus({ preventScroll: true }); } catch (_) { /* ignore */ }
  }

  function callHook(v, hook, arg) {
    if (!v || !v.inst || typeof v.inst[hook] !== 'function') return;
    try { v.inst[hook](arg); } catch (err) { console.error('[nova] ' + hook + '() failed in tab ' + v.id, err); }
  }

  function makeCtx(tabId) {
    return {
      tabId,
      get params() { const t = findTab(tabId); return t ? clone(t.params) || {} : {}; },
      setTitle(title) { updateTab(tabId, { title }, true); },
      setIcon(name) { updateTab(tabId, { icon: name }, true); },
      setParams(params) { updateTab(tabId, { params }, true); }, // saved in the session; no onParams echo
      open(target, opts) { return openTab(target, opts); },
      go(input, opts) { return go(input, opts); },
      close() { closeTab(tabId); },
      isActive() { return T.activeId === tabId; },
      Nova: window.Nova,
    };
  }

  function renderCrash(el, app, err, tabId) {
    el.innerHTML = '<div class="n-empty n-empty--fill">' +
      '<div class="n-empty__icon">' + icon('alert-triangle', 22) + '</div>' +
      '<div class="n-empty__title">' + esc(app.name) + ' hit a snag</div>' +
      '<div class="n-empty__hint">' + esc((err && err.message) || 'Something went wrong while opening this tab.') + '</div>' +
      '<button type="button" class="n-btn n-btn--sm" data-nova-reload>' + icon('rotate-cw', 14) + '<span>Reload tab</span></button>' +
      '</div>';
    const btn = el.querySelector('[data-nova-reload]');
    if (btn) btn.addEventListener('click', () => reloadTab(tabId));
  }

  function ensureView(id) {
    let v = T.views.get(id);
    if (v) {
      if (T.host && v.el.parentNode !== T.host) T.host.appendChild(v.el);
      return v;
    }
    const tab = findTab(id);
    const app = tab && apps.get(tab.appId);
    if (!app || !T.host) return null;
    const el = document.createElement('div');
    el.className = 'app app-' + app.id;
    el.setAttribute('data-tab-id', id);
    el.setAttribute('role', 'tabpanel');
    el.setAttribute('aria-label', tab.title);
    el.hidden = true;
    T.host.appendChild(el);
    v = { id, el, inst: {}, visible: false };
    T.views.set(id, v);
    try {
      const inst = app.mount(el, makeCtx(id));
      v.inst = isObj(inst) ? inst : {};
    } catch (err) {
      console.error('[nova] app "' + app.id + '" failed to mount', err);
      renderCrash(el, app, err, id);
    }
    return v;
  }

  function showView(id) {
    if (!T.host || !booted) return; // mounted once the shell has provided the card
    const v = ensureView(id);
    if (!v || v.visible) return;
    v.el.hidden = false;
    v.visible = true;
    callHook(v, 'onShow');
  }

  function hideView(id) {
    const v = T.views.get(id);
    if (!v || !v.visible) return;
    v.el.hidden = true;
    v.visible = false;
    callHook(v, 'onHide');
  }

  function destroyView(id) {
    const v = T.views.get(id);
    if (!v) return;
    if (v.visible) callHook(v, 'onHide');
    callHook(v, 'unmount');
    v.el.remove();
    T.views.delete(id);
  }

  function reloadTab(id) {
    id = id || T.activeId;
    if (!findTab(id)) return false;
    destroyView(id);
    if (id === T.activeId) showView(id);
    return true;
  }

  function setParams(tab, params, notify) {
    const next = isObj(params) ? clone(params) : {};
    if (JSON.stringify(next) === JSON.stringify(tab.params)) return false;
    tab.params = next;
    tab.url = typeof next.url === 'string' ? next.url : undefined;
    if (notify) callHook(T.views.get(tab.id), 'onParams', clone(next));
    return true;
  }

  function updateTab(id, patch, fromApp) {
    const tab = findTab(id);
    if (!tab || !isObj(patch)) return false;
    let dirty = false;
    if (typeof patch.title === 'string') {
      const app = apps.get(tab.appId);
      const title = patch.title.replace(/\s+/g, ' ').trim().slice(0, 120) || (app ? app.title : 'Tab');
      if (title !== tab.title) {
        tab.title = title;
        dirty = true;
        const v = T.views.get(id);
        if (v) v.el.setAttribute('aria-label', title);
      }
    }
    if (typeof patch.icon === 'string' && patch.icon && patch.icon !== tab.icon) { tab.icon = patch.icon; dirty = true; }
    if (isObj(patch.params)) {
      const urlBefore = tab.url;
      if (setParams(tab, patch.params, !fromApp)) {
        dirty = true;
        if (!fromApp && tab.appId === 'web' && tab.url && tab.url !== urlBefore) tab.title = Sites.nameFor(tab.url);
      }
    }
    if (typeof patch.pinned === 'boolean' && patch.pinned !== tab.pinned) { pinTab(id, patch.pinned); return true; }
    if (dirty) {
      changed();
      if (id === T.activeId) updateDocTitle();
    }
    return dirty;
  }

  function closeTab(id) {
    const i = indexOfTab(id);
    if (i < 0) return false;
    const tab = T.list[i];
    const entry = { appId: tab.appId, params: clone(tab.params), title: tab.title, pinned: tab.pinned, index: i, standIn: null };
    T.closed.push(entry);
    if (T.closed.length > 25) T.closed.shift();
    destroyView(id);
    T.list.splice(i, 1);
    const wasActive = T.activeId === id;
    removeFromHistory(id);
    if (!T.list.length) {
      T.activeId = null;
      entry.standIn = openTab('home'); // reopening this tab takes the place of that fresh Home
      if (!entry.standIn) changed();
      return true;
    }
    if (wasActive) {
      T.activeId = null;
      const fromHist = T.histIdx >= 0 ? T.history[T.histIdx] : null;
      if (fromHist && findTab(fromHist)) activate(fromHist, { fromHistory: true });
      else activate(T.list[Math.min(i, T.list.length - 1)].id);
    } else {
      changed();
    }
    return true;
  }

  function closeOthers(id) {
    T.list.filter((t) => t.id !== id && !t.pinned).map((t) => t.id).forEach(closeTab);
    if (findTab(id)) activate(id);
  }

  function moveTab(id, toIndex) {
    const i = indexOfTab(id);
    if (i < 0) return false;
    const tab = T.list.splice(i, 1)[0];
    insertTab(tab, Number.isInteger(toIndex) ? toIndex : T.list.length);
    changed();
    return true;
  }

  function pinTab(id, pinned) {
    const i = indexOfTab(id);
    if (i < 0) return false;
    const tab = T.list.splice(i, 1)[0];
    tab.pinned = pinned !== false;
    insertTab(tab, pinnedCount()); // end of the pinned block / start of the unpinned block
    changed();
    return true;
  }

  function duplicateTab(id) {
    const i = indexOfTab(id);
    const tab = T.list[i];
    const app = tab && apps.get(tab.appId);
    if (!app) return null;
    if (app.singleton) { activate(id); return id; }
    return openTab({ app: app.id, params: clone(tab.params) }, { index: i + 1, pinned: tab.pinned, title: tab.title });
  }

  function reopenClosed() {
    while (T.closed.length) {
      const entry = T.closed.pop();
      if (!apps.has(entry.appId)) continue;
      const id = openTab({ app: entry.appId, params: entry.params }, { index: entry.index, pinned: entry.pinned, title: entry.title });
      const stand = entry.standIn && id && id !== entry.standIn ? findTab(entry.standIn) : null;
      if (stand && stand.appId === 'home' && T.list.length === 2) dropTab(stand.id); // closing the last tab left one empty Home
      return id;
    }
    return null;
  }

  /** Removes a tab without putting it on the "reopen closed tab" stack. */
  function dropTab(id) {
    const i = indexOfTab(id);
    if (i < 0) return;
    destroyView(id);
    T.list.splice(i, 1);
    removeFromHistory(id);
    changed();
  }

  function stepHistory(dir) {
    let i = T.histIdx + dir;
    while (i >= 0 && i < T.history.length && (!findTab(T.history[i]) || T.history[i] === T.activeId)) i += dir;
    if (i < 0 || i >= T.history.length) return false;
    T.histIdx = i;
    return activate(T.history[i], { fromHistory: true });
  }

  /** Activate the next (+1) or previous (-1) tab in strip order, wrapping around. */
  function cycleTab(delta) {
    if (!T.list.length) return false;
    const i = indexOfTab(T.activeId);
    const n = T.list.length;
    return activate(T.list[((i < 0 ? 0 : i) + (delta < 0 ? -1 : 1) + n) % n].id);
  }

  function setHost(el) {
    if (!el || el === T.host) return;
    T.host = el;
    el.classList.add('n-tabhost');
    T.views.forEach((v) => { if (v.el.parentNode !== el) el.appendChild(v.el); });
    if (T.activeId) showView(T.activeId);
  }

  function restoreSession() {
    const saved = Store.get('tabs');
    const seenSingletons = new Set();
    let activeId = null;
    if (saved && Array.isArray(saved.tabs)) {
      saved.tabs.forEach((entry, idx) => {
        const app = entry && apps.get(entry.appId);
        if (!app) return;
        if (app.singleton) {
          if (seenSingletons.has(app.id)) return;
          seenSingletons.add(app.id);
        }
        const params = isObj(entry.params) ? entry.params : {};
        const tab = makeTab(app, params, { pinned: !!entry.pinned });
        if (typeof entry.title === 'string' && entry.title.trim()) tab.title = entry.title.trim().slice(0, 120);
        T.list.push(tab);
        if (idx === saved.activeIndex) activeId = tab.id;
      });
      T.list = T.list.filter((t) => t.pinned).concat(T.list.filter((t) => !t.pinned));
    }
    if (!T.list.length) {
      const first = apps.get('home') || Array.from(apps.values()).find((a) => !a.hidden);
      if (first) T.list.push(makeTab(first, {}));
    }
    if (T.list.length) {
      T.activeId = activeId || T.list[0].id;
      pushHistory(T.activeId);
    }
  }

  // ---- document title
  let titlePrefix = '';
  function updateDocTitle() {
    const t = findTab(T.activeId);
    document.title = (titlePrefix ? titlePrefix + ' · ' : '') + (t ? t.title + ' — Nova' : 'Nova Browser');
  }
  function setTitlePrefix(text) {
    titlePrefix = text ? String(text).slice(0, 40) : '';
    updateDocTitle();
  }

  // ================================================================ navigation

  // Google's embeddable mode (igu=1) is the one search page that renders inside a frame, so Nova searches stay in Nova.
  // DuckDuckGo and Brave refuse framing; they open in a web tab like any other URL and show the browser's refused page.
  const WEB_SEARCH = { google: 'https://www.google.com/search?igu=1&q=%s' };

  function engine() {
    const all = THEMES.searchEngines || {};
    const id = all[settings.searchEngine] ? settings.searchEngine : 'google';
    const e = all[id] || { name: 'Google', search: 'https://www.google.com/search?q=%s' };
    return WEB_SEARCH[id] ? Object.assign({}, e, { search: WEB_SEARCH[id] }) : e;
  }

  function searchUrl(query) {
    return engine().search.replace('%s', encodeURIComponent(String(query == null ? '' : query).trim()));
  }

  function findLinkByTitle(q) {
    const links = dataGet('links');
    return links.find((l) => String(l.title || '').toLowerCase() === q) || null;
  }

  function findSiteByName(q) {
    return Sites.catalog.find((s) => s.id === q || s.name.toLowerCase() === q || (s.short && s.short.toLowerCase() === q)) || null;
  }

  function findAppExact(q) {
    for (const a of apps.values()) {
      if (a.hidden && a.id !== 'home') continue;
      if (a.id === q || a.name.toLowerCase() === q || a.keywords.indexOf(q) !== -1) return a;
    }
    return null;
  }

  // Every web address opens inside a Nova web tab ('embed'): sites that allow framing load, the rest show the
  // browser's own refused page there. Nova never opens a real browser tab by itself.
  function resolveUrl(url, title) {
    return { kind: 'embed', url, title: title || Sites.nameFor(url) };
  }

  /** Decide what an omnibox entry means. See SPEC §4 for the rules. */
  function resolve(input) {
    const s = String(input == null ? '' : input).trim();
    if (!s) return { kind: 'search', query: '', url: '', title: '' };
    const q = s.toLowerCase();

    const nova = /^nova:(?:\/\/)?([\w-]+)(?:\/(.*))?$/i.exec(s);
    if (nova) {
      const app = apps.get(nova[1].toLowerCase());
      if (app) {
        const r = { kind: 'app', appId: app.id, title: app.name };
        if (nova[2]) r.params = { path: nova[2] };
        return r;
      }
    }

    const app = findAppExact(q);
    if (app) return { kind: 'app', appId: app.id, title: app.name };

    const link = findLinkByTitle(q);
    if (link) return resolveUrl(link.url, link.title);

    const site = findSiteByName(q);
    if (site) return resolveUrl(site.url, site.short || site.name);

    if (isUrlish(s)) {
      const url = normalizeUrl(s);
      if (url) return resolveUrl(url);
    }

    return { kind: 'search', query: s, url: searchUrl(s), title: engine().name + ' search' };
  }

  function resolveSuggestion(s) {
    if (s.kind === 'tab' && s.tabId) return { kind: 'tab', tabId: s.tabId, title: s.title };
    if (s.kind === 'app' && s.appId) return { kind: 'app', appId: s.appId, params: s.params, title: s.title };
    if (s.kind === 'search') {
      const query = s.query != null ? String(s.query) : String(s.title || '');
      return { kind: 'search', query, url: s.url || searchUrl(query), title: engine().name + ' search' };
    }
    if (s.url) {
      const url = normalizeUrl(s.url);
      if (!url) return null;
      // A recent search runs again on the current engine (older recents hold URLs without Google's embeddable mode).
      if (s.query) return { kind: 'search', query: String(s.query), url: searchUrl(s.query), title: engine().name + ' search' };
      return resolveUrl(url, s.kind === 'link' || s.kind === 'recent' ? s.title : null);
    }
    return null;
  }

  // Open an app in a new tab, or turn the current tab into it (newTab: false — e.g. from Home).
  function navigateApp(target, newTab, opts) {
    const t = normalizeTarget(target);
    const app = t && apps.get(t.app);
    if (!app) return null;
    const cur = findTab(T.activeId);
    if (newTab || !cur || cur.pinned) return openTab(target, { background: !!opts.background });
    if (app.singleton) {
      const existing = T.list.find((x) => x.appId === app.id);
      if (existing) return openTab(target);
    }
    if (cur.appId === app.id && !app.singleton) {
      if (setParams(cur, t.params, true)) {
        cur.title = tabTitleFor(app, t.params);
        changed();
        updateDocTitle();
      }
      return cur.id;
    }
    const old = T.views.get(cur.id);
    const hadFocus = !!old && old.el.contains(document.activeElement); // e.g. Enter on a Home tile
    destroyView(cur.id);
    cur.appId = app.id;
    cur.params = t.params;
    cur.title = tabTitleFor(app, t.params);
    cur.icon = app.icon;
    cur.url = typeof t.params.url === 'string' ? t.params.url : undefined;
    showView(cur.id);
    if (hadFocus) focusView(cur.id);
    changed();
    updateDocTitle();
    return cur.id;
  }

  /** Act on omnibox input or a suggestion object. Call from inside a click/keydown handler. */
  function go(input, opts) {
    opts = opts || {};
    const newTab = opts.newTab !== false;
    const r = isObj(input) ? resolveSuggestion(input) : resolve(input);
    if (!r) return null;
    if (r.kind === 'tab') { activate(r.tabId); return r; }
    if (r.kind === 'app') {
      const tabId = navigateApp({ app: r.appId, params: r.params || {} }, newTab, opts);
      return Object.assign({ tabId }, r);
    }
    // Web addresses and searches both open in a Nova web tab; this never opens a real browser tab.
    if (r.kind === 'embed' || r.kind === 'search') {
      if (!r.url || !Sites.parse(r.url)) return null;
      addRecent(r.url, r.title, r.kind === 'search' ? r.query : undefined);
      const tabId = navigateApp({ app: 'web', params: { url: r.url } }, newTab, opts);
      return Object.assign({ tabId }, r);
    }
    return null;
  }

  /** Open an http(s) URL in a real browser tab via a synchronous anchor click. Only for explicit "open in a new tab" actions. */
  function openExternal(url, opts) {
    const u = Sites.parse(url);
    if (!u) { console.warn('[nova] openExternal: not an http(s) URL', url); return false; }
    const a = document.createElement('a');
    a.href = u.href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.display = 'none';
    (document.body || html).appendChild(a);
    try { a.click(); } finally { a.remove(); }
    addRecent(u.href, (opts && opts.title) || Sites.nameFor(u.href), opts && opts.query);
    return true;
  }

  /** For real <a target=_blank> clicks rendered by the UI: record the recent + toast. */
  function trackExternal(url, title) {
    const u = Sites.parse(url);
    if (!u) return;
    const name = title || Sites.nameFor(u.href);
    addRecent(u.href, name);
    ui.toast('Opened ' + name + ' in a new tab');
  }

  // ---- recents (device-local)
  const RECENTS_MAX = 30;

  function recentsList() {
    const r = Store.get('recents', []);
    return Array.isArray(r) ? r.filter((x) => x && typeof x.url === 'string') : [];
  }

  function addRecent(url, title, query) {
    if (!url) return;
    const item = { url, title: String(title || Sites.nameFor(url)).slice(0, 120), at: Date.now() };
    if (query) item.query = String(query).slice(0, 200);
    const list = recentsList().filter((x) => x.url !== url);
    list.unshift(item);
    Store.set('recents', list.slice(0, RECENTS_MAX));
  }

  function removeRecent(url) { Store.set('recents', recentsList().filter((x) => x.url !== url)); }
  function clearRecents() { Store.set('recents', []); }

  // ---- suggestions
  function matchScore(text, q) {
    const t = String(text || '').toLowerCase();
    if (!t || !q) return 0;
    if (t === q) return 100;
    if (t.indexOf(q) === 0) return 90;
    if (t.split(/[\s\-_./:]+/).some((w) => w && w.indexOf(q) === 0)) return 74;
    if (q.length >= 3 && t.indexOf(q) !== -1) return 45;
    return 0;
  }

  function urlScore(url, q) {
    const host = hostOf(url);
    if (!host || !q) return 0;
    if (host.indexOf(q) === 0) return 88;
    const pretty = prettyUrl(url).toLowerCase();
    if (pretty.indexOf(q) === 0) return 86;
    if (q.length >= 3 && pretty.indexOf(q) !== -1) return 44;
    return 0;
  }

  function completion(raw, candidates) {
    const q = raw.toLowerCase();
    for (const c of candidates) {
      if (c && c.length > raw.length && c.toLowerCase().indexOf(q) === 0) return raw + c.slice(raw.length);
    }
    return undefined;
  }

  function urlKey(url) { return prettyUrl(url).toLowerCase(); }

  /** Up to 8 suggestions for omnibox/palette input, best first. */
  function suggest(input) {
    const raw = String(input == null ? '' : input).replace(/^\s+/, '');
    const q = raw.trim().toLowerCase();
    const best = new Map(); // dedupe key → { item, score }
    function add(key, item, score) {
      if (score <= 0) return;
      const prev = best.get(key);
      if (!prev || prev.score < score) best.set(key, { item, score });
    }
    const openSingletons = new Set(T.list.map((t) => t.appId));
    const launchable = Array.from(apps.values()).filter((a) => !a.hidden || a.id === 'home');

    if (!q) {
      const recents = recentsList().slice(0, 4).map((r) => recentItem(r));
      const appsList = launchable.filter((a) => !a.hidden).map((a) => appItem(a, openSingletons));
      return recents.concat(appsList).slice(0, 8);
    }

    const novaQ = /^nova:(?:\/\/)?(.*)$/i.exec(q);
    const appQ = novaQ ? novaQ[1] : q;

    launchable.forEach((a) => {
      const s = Math.max(matchScore(a.name, appQ), matchScore(a.id, appQ),
        Math.max(0, ...a.keywords.map((k) => matchScore(k, appQ) * 0.85)));
      const score = novaQ && !appQ ? 80 : s;
      if (score > 0) {
        const item = appItem(a, openSingletons);
        if (!novaQ) item.inline = completion(raw, [a.name, a.id].concat(a.keywords));
        add('app:' + a.id, item, score + 3);
      }
    });
    if (novaQ) return finish(best, raw, false);

    T.list.forEach((t) => {
      const app = apps.get(t.appId);
      if (!app || app.singleton || (t.appId === 'home' && !t.url)) return;
      const score = Math.max(matchScore(t.title, q), t.url ? urlScore(t.url, q) : 0) * 0.9;
      add('tab:' + t.id, {
        kind: 'tab', title: t.title, subtitle: t.id === T.activeId ? 'Current tab' : 'Switch to tab',
        icon: t.icon, tabId: t.id, url: t.url,
      }, t.id === T.activeId ? score * 0.6 : score);
    });

    const links = dataGet('links');
    links.forEach((l) => {
      const score = Math.max(matchScore(l.title, q), urlScore(l.url, q));
      add('url:' + urlKey(l.url), {
        kind: 'link', title: l.title, subtitle: prettyUrl(l.url), favicon: favicon(l.url, l.title, l.color),
        url: l.url, inline: completion(raw, [l.title, hostOf(l.url)]),
      }, score > 0 ? score + 2 : 0); // +2 prefers your own link over the catalog; no match, no row
    });

    recentsList().forEach((r) => {
      const score = r.query ? matchScore(r.query, q) * 0.9 : Math.max(matchScore(r.title, q), urlScore(r.url, q)) * 0.95;
      const item = recentItem(r);
      item.inline = r.query ? completion(raw, [r.query]) : completion(raw, [r.title, hostOf(r.url)]);
      add('url:' + urlKey(r.url), item, score);
    });

    Sites.catalog.forEach((site) => {
      const score = Math.max(matchScore(site.name, q), matchScore(site.short, q), urlScore(site.url, q)) * 0.82;
      add('url:' + urlKey(site.url), {
        kind: 'link', title: site.short || site.name, subtitle: prettyUrl(site.url),
        favicon: favicon(site.url, site.short || site.name, site.color), url: site.url,
        inline: completion(raw, [site.short, site.name, hostOf(site.url)]),
      }, score);
    });

    const urlish = isUrlish(raw.trim());
    if (urlish) {
      const url = normalizeUrl(raw.trim());
      if (url) {
        add('url:' + urlKey(url), { kind: 'embed', title: prettyUrl(url), subtitle: 'Open inside Nova', icon: 'globe', url }, 200);
      }
    }
    return finish(best, raw, urlish);
  }

  function appItem(a, openSet) {
    return {
      kind: 'app', title: a.name, subtitle: a.singleton && openSet.has(a.id) ? 'Switch to tab' : 'Nova app',
      icon: a.icon, appId: a.id,
    };
  }

  function recentItem(r) {
    if (r.query) {
      return { kind: 'recent', title: r.query, subtitle: 'Searched ' + fmtRelative(r.at), icon: 'search', url: r.url, query: r.query };
    }
    return { kind: 'recent', title: r.title, subtitle: prettyUrl(r.url) + ' · ' + fmtRelative(r.at), favicon: favicon(r.url, r.title), url: r.url };
  }

  function finish(best, raw, urlish) {
    const ranked = Array.from(best.values()).sort((a, b) => b.score - a.score);
    const top = ranked.length ? ranked[0].score : 0;
    const query = raw.trim();
    if (query && !/^nova:/i.test(query)) {
      const searchItem = { kind: 'search', title: query, subtitle: 'Search ' + engine().name, icon: 'search', url: searchUrl(query), query };
      // Strong matches (prefix hits) stay above the search action; weak ones go below it.
      const score = urlish ? 1 : (top >= 85 ? 60 : 150);
      ranked.push({ item: searchItem, score });
      ranked.sort((a, b) => b.score - a.score);
      const items = ranked.slice(0, 8).map((r) => r.item);
      if (items.indexOf(searchItem) === -1) items[items.length - 1] = searchItem;
      return tidy(items);
    }
    return tidy(ranked.slice(0, 8).map((r) => r.item));
  }

  function tidy(items) {
    return items.map((it) => {
      const out = {};
      Object.keys(it).forEach((k) => { if (it[k] !== undefined) out[k] = it[k]; });
      return out;
    });
  }

  // ================================================================ ui (implemented by the shell)

  const UI_METHODS = ['toast', 'confirm', 'prompt', 'focusOmnibox', 'openPalette', 'openQuickTheme', 'menu'];
  const uiImpl = {};
  const warned = new Set();
  function warnOnce(name) {
    if (warned.has(name)) return;
    warned.add(name);
    console.warn('[nova] Nova.ui.' + name + ' called before the shell registered it');
  }
  const uiFallback = {
    toast(message) { console.info('[nova] ' + message); },
    confirm() { warnOnce('confirm'); return Promise.resolve(false); },
    prompt() { warnOnce('prompt'); return Promise.resolve(null); },
    focusOmnibox() { warnOnce('focusOmnibox'); },
    openPalette() { warnOnce('openPalette'); },
    openQuickTheme() { warnOnce('openQuickTheme'); },
    menu() { warnOnce('menu'); },
  };

  function uiWrapper(name) {
    return function () {
      const fn = uiImpl[name] || uiFallback[name];
      if (!fn) return undefined;
      try { return fn.apply(null, arguments); } catch (err) {
        console.error('[nova] Nova.ui.' + name + ' failed', err);
        return uiFallback[name] ? uiFallback[name].apply(null, arguments) : undefined;
      }
    };
  }

  const ui = {
    register(impl) {
      if (!isObj(impl)) return;
      Object.keys(impl).forEach((name) => {
        if (typeof impl[name] !== 'function' || name === 'register') return;
        uiImpl[name] = impl[name];
        if (!ui[name]) ui[name] = uiWrapper(name);
      });
      emit('ui', Object.keys(uiImpl));
    },
  };
  UI_METHODS.forEach((name) => { ui[name] = uiWrapper(name); });

  // ================================================================ shell + boot

  let shellImpl = null;
  function registerShell(impl) { shellImpl = impl; }

  function fallbackHost(rootEl) {
    const card = document.createElement('main');
    card.className = 'n-fallback-host';
    rootEl.appendChild(card);
    setHost(card);
  }

  function boot() {
    if (booted) return;
    applyTheme();
    Theme.watchSystem(() => applyTheme());
    restoreSession();

    const rootEl = document.getElementById('nova-root') || document.body;
    const shell = shellImpl || window.NovaShell;
    if (shell && typeof shell.init === 'function') {
      try { shell.init(rootEl, window.Nova); } catch (err) { console.error('[nova] the shell failed to start', err); }
    } else {
      console.warn('[nova] no shell registered — showing tabs without browser chrome');
    }
    if (!T.host) fallbackHost(rootEl);

    booted = true;
    if (T.activeId) showView(T.activeId);
    updateDocTitle();
    html.setAttribute('data-nova-ready', 'true');
    emit('tabs', tabsPayload());
    emit('settings', getSettings());
    emit('env', envSnapshot());
    emit('sync', Store.syncStatus());
    if (!Store.saveOk()) emit('storage', { ok: false, key: null });

    window.addEventListener('pagehide', () => saveSession.flush());
    // Sync starts after the first frame and never blocks it.
    setTimeout(() => { Store.startSync(); }, 0);
  }

  Store.onSync((status) => {
    emit('sync', status);
    if (status.notify && status.message) ui.toast(status.message);
  });

  // The browser can refuse to keep anything (blocked or full storage): edits then live in memory until the tab closes.
  Store.onSaveState((ok, key) => emit('storage', { ok, key }));

  // Theme as early as possible so nothing paints unthemed.
  applyTheme();

  window.Nova = {
    version: VERSION,
    env,
    themes: THEMES,
    util,
    on,
    emit,
    settings: {
      get: getSettings,
      update: updateSettings,
      reset: resetSettings,
      DEFAULTS,
      theme: () => lastTheme,
    },
    data: { get: dataGet, set: dataSet, KEYS: DATA_KEYS.slice() },
    local: { get: localGet, set: localSet, remove: (k) => Store.remove(k), KEYS: LOCAL_ONLY_HINT.slice() },
    sync: { status: () => Store.syncStatus(), retry: () => Store.retrySync() },
    storage: { ok: (key) => Store.saveOk(key) }, // false when the browser won't keep Nova's data; 'storage' event { ok, key }
    backup: { export: exportAll, import: importAll, resetAll },
    registerApp,
    apps: { list: listApps, get: getApp },
    tabs: {
      list: () => T.list.map(publicTab),
      get: (id) => { const t = findTab(id); return t ? publicTab(t) : null; },
      activeId: () => T.activeId,
      open: openTab,
      close: closeTab,
      closeOthers,
      activate: (id) => activate(id),
      move: moveTab,
      pin: pinTab,
      duplicate: duplicateTab,
      reopenClosed,
      closedCount: () => T.closed.length,
      back: () => stepHistory(-1),
      forward: () => stepHistory(1),
      canBack: () => T.histIdx > 0,
      canForward: () => T.histIdx < T.history.length - 1,
      cycle: cycleTab,
      update: (id, patch) => updateTab(id, patch, false),
      reload: reloadTab,
      containerOf: (id) => { const v = T.views.get(id); return v ? v.el : null; },
      setHost,
      host: () => T.host,
    },
    resolve,
    go,
    openExternal,
    trackExternal,
    searchUrl,
    searchEngine: () => Object.assign({ id: settings.searchEngine }, engine()),
    suggest,
    recents: { list: recentsList, add: addRecent, remove: removeRecent, clear: clearRecents },
    sites: Sites,
    ui,
    registerShell,
    setTitlePrefix,
    boot,
  };
})();
</script>
<script>
/* ---- web/src/js/apps/home.js ---- */
/* Nova Home — the new-tab page (SPEC §4.1).
 *   Big clock + date + greeting, a search box with suggestions (Nova.suggest / Nova.go), quick-link
 *   tiles (real anchors; allowlisted sites open in a Nova tab when embedding works), an edit mode
 *   (add / rename / recolor / remove / drag or Shift+Arrow to reorder), a Today widget (next
 *   unfinished tasks), a Focus widget (reads the focus app's Nova.local('focus') state) and the
 *   first-run "Make Nova yours" card.
 * Every section reacts live to 'settings', 'data:links', 'data:tasks', 'local:focus' and 'env'. */
(function () {
  'use strict';

  const N = window.Nova;
  if (!N || typeof N.registerApp !== 'function') return;
  const U = N.util;
  const esc = U.esc;
  const icon = (name, size, opts) => U.icon(name, size, opts);

  // Monogram colors offered in the link editor (user data, like the catalog's colors).
  const TILE_COLORS = ['#d93f4c', '#d4472b', '#b3620c', '#2b8a55', '#0f8f82', '#1f72d6', '#3d5fd6', '#8247c2', '#c93a8f', '#4a5a80'];
  // Only the colour/metric vars a theme swatch needs.
  const SWATCH_VARS = ['--n-frame', '--n-page', '--n-surface', '--n-text', '--n-text-muted', '--n-border', '--n-accent', '--n-tab-active'];

  const fmtDate = new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const fmtWeekday = new Intl.DateTimeFormat('en-US', { weekday: 'short' });
  const fmtMonthDay = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' });

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function num(v) { return typeof v === 'number' && Number.isFinite(v) ? v : null; }
  function motionOk() { return !(N.env && N.env.reducedMotion); }

  function greetingFor(hour) {
    if (hour < 5) return { text: 'Still up', late: true };
    if (hour < 12) return { text: 'Good morning' };
    if (hour < 17) return { text: 'Good afternoon' };
    return { text: 'Good evening' };
  }

  function fmtTime(date, h24) {
    const h = date.getHours();
    const m = pad2(date.getMinutes());
    if (h24) return pad2(h) + ':' + m;
    return (h % 12 || 12) + ':' + m + ' ' + (h < 12 ? 'am' : 'pm');
  }

  function applyVars(el, vars) {
    SWATCH_VARS.forEach((k) => { if (vars[k] != null) el.style.setProperty(k, vars[k]); });
  }

  function previewVars(id, s) {
    try { return window.NovaTheme.previewVars(id, N.themes, s); } catch (_) { return {}; }
  }

  // ================================================================ tasks (Today widget)

  function validDue(v) { return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null; }
  function dateOfKey(key) { const p = key.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function shiftKey(key, days) { const d = dateOfKey(key); d.setDate(d.getDate() + days); return U.dayKey(d); }

  /** Unfinished tasks: dated first (soonest first), then undated (oldest first). Tolerates junk. */
  function openTasks() {
    let tasks = [];
    try { tasks = N.data.get('tasks'); } catch (_) { tasks = []; }
    if (!Array.isArray(tasks)) return [];
    const list = tasks.filter((t) => t && typeof t === 'object' && !t.done && String(t.title || '').trim());
    list.sort((a, b) => {
      const da = validDue(a.due);
      const db = validDue(b.due);
      if (da && db && da !== db) return da < db ? -1 : 1;
      if (da && !db) return -1;
      if (!da && db) return 1;
      return (num(a.createdAt) || 0) - (num(b.createdAt) || 0);
    });
    return list;
  }

  function dueInfo(due, today) {
    due = validDue(due);
    if (!due) return null;
    if (due < today) return { label: 'Overdue', tone: 'over', title: 'Was due ' + fmtMonthDay.format(dateOfKey(due)) };
    if (due === today) return { label: 'Today', tone: 'today' };
    if (due === shiftKey(today, 1)) return { label: 'Tomorrow', tone: 'soon' };
    if (due <= shiftKey(today, 6)) return { label: fmtWeekday.format(dateOfKey(due)), tone: 'later' };
    return { label: fmtMonthDay.format(dateOfKey(due)), tone: 'later' };
  }

  // Class chips look the same here as in the Tasks app (tasks.js exports window.NovaTasks).
  function courseColor(course) {
    const T = window.NovaTasks;
    if (T && typeof T.courseColor === 'function') {
      try { const c = T.courseColor(course); if (/^#[0-9a-f]{6}$/i.test(c || '')) return c; } catch (_) { /* fall through */ }
    }
    return U.monogram(String(course || '')).color;
  }

  function courseLabel(course) {
    const T = window.NovaTasks;
    if (T && typeof T.courseLabel === 'function') {
      try { const l = T.courseLabel(course); if (l) return String(l); } catch (_) { /* fall through */ }
    }
    return String(course || '');
  }

  // ================================================================ focus timer state
  // The focus app owns Nova.local('focus'). Fields read (see the role report):
  //   running, paused, endAt (ms timestamp), remainingMs, durationMs, phase ('focus'|'short'|'long'),
  //   sessionsToday + day ('YYYY-MM-DD'). A few common aliases are tolerated too.

  function readFocus() {
    const out = { state: 'idle', remaining: null, total: null, isBreak: false, phase: 'focus', sessions: null, endAt: null };
    let f = null;
    try { f = N.local.get('focus', null); } catch (_) { f = null; }
    if (!f || typeof f !== 'object') return out;
    const now = Date.now();
    const endAt = num(f.endAt) ?? num(f.endsAt) ?? num(f.endTime) ?? num(f.end);
    const st = String(f.state || f.status || '').toLowerCase();
    let running = f.running === true || st === 'running';
    const paused = !running && (f.paused === true || st === 'paused');
    if (f.running === undefined && !st && endAt && !f.paused) running = endAt > now;
    const remainingMs = num(f.remainingMs) ?? num(f.remaining) ?? num(f.leftMs);
    const total = num(f.durationMs) ?? num(f.totalMs) ?? num(f.duration);
    if (running && endAt) {
      out.state = 'running';
      out.endAt = endAt;
      out.remaining = Math.max(0, endAt - now);
    } else if (paused && remainingMs != null) {
      out.state = 'paused';
      out.remaining = Math.max(0, remainingMs);
    }
    out.total = total && total > 1000 ? total : null;
    const phase = String(f.phase || f.mode || f.kind || 'focus').toLowerCase();
    out.phase = phase;
    out.isBreak = /break|short|long|rest/.test(phase);
    const day = typeof f.day === 'string' ? f.day : (typeof f.date === 'string' ? f.date : null);
    const sessions = num(f.sessionsToday) ?? num(f.completedToday) ?? num(f.todayCount) ?? (f.today && typeof f.today === 'object' ? num(f.today.count) : null);
    out.sessions = sessions == null ? null : (day && day !== U.dayKey() ? 0 : sessions);
    return out;
  }

  function fmtLeft(ms) {
    const total = Math.ceil(Math.max(0, ms) / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return h ? h + ':' + pad2(m) + ':' + pad2(s) : m + ':' + pad2(s);
  }

  // ================================================================ mount

  function mount(el, ctx) {
    const subs = [];
    let ticker = null;
    let todayKey = '';   // the day the Today widget was last drawn for (rolls over at midnight)
    let visible = false;
    let lastMinute = -1;
    let editMode = false;
    let editing = null;          // { id|null, color } while the link editor is open
    let dragState = null;
    let pendingLinks = false;    // a links update arrived mid-drag → re-render after
    let onboardTimer = null;

    el.innerHTML =
      '<div class="home">' +
        '<div class="home__main">' +
          '<header class="home-hero">' +
            '<div class="home-date" data-part="date"></div>' +
            '<button type="button" class="home-clock" data-part="clock"></button>' +
            '<h1 class="home-greeting" data-part="greeting"></h1>' +
          '</header>' +
          '<section class="home-onboard" data-part="onboard" hidden></section>' +
          '<div class="home-search" data-part="search"></div>' +
          '<section class="home-links" data-part="links" aria-label="Quick links"></section>' +
          '<div class="home-widgets" data-part="widgets">' +
            '<section class="home-card home-today" data-part="today" aria-label="Today"></section>' +
            '<section class="home-card home-focus" data-part="focus" aria-label="Focus timer"></section>' +
          '</div>' +
          '<div class="home-allhidden" data-part="allhidden" hidden></div>' +
        '</div>' +
        '<footer class="home-foot">' +
          '<button type="button" class="n-btn n-btn--sm home-foot__btn" data-act="edit-links">' + icon('pencil', 13) + '<span>Edit links</span></button>' +
          '<button type="button" class="n-btn n-btn--sm home-foot__btn" data-act="customize">' + icon('palette', 14) + '<span>Customize</span></button>' +
        '</footer>' +
      '</div>';

    const part = (name) => el.querySelector('[data-part="' + name + '"]');
    const P = {
      date: part('date'), clock: part('clock'), greeting: part('greeting'), onboard: part('onboard'),
      search: part('search'), links: part('links'), widgets: part('widgets'), today: part('today'),
      focus: part('focus'), allhidden: part('allhidden'),
    };

    // ------------------------------------------------------------ clock, date, greeting

    function renderClock(force) {
      const s = N.settings.get();
      const now = new Date();
      const minute = now.getHours() * 60 + now.getMinutes();
      if (!force && minute === lastMinute) return;
      lastMinute = minute;
      const h = now.getHours();
      const hh = s.clock24 ? pad2(h) : String(h % 12 || 12);
      const ampm = s.clock24 ? '' : (h < 12 ? 'am' : 'pm');
      P.clock.innerHTML =
        '<span class="home-clock__digits">' + hh + '<span class="home-clock__colon" aria-hidden="true">:</span>' + pad2(now.getMinutes()) + '</span>' +
        (ampm ? '<span class="home-clock__ampm">' + ampm + '</span>' : '');
      P.clock.setAttribute('aria-label', fmtTime(now, s.clock24) + '. Switch to ' + (s.clock24 ? '12-hour' : '24-hour') + ' time');
      P.clock.title = 'Switch to ' + (s.clock24 ? '12-hour' : '24-hour') + ' time';
      const night = h < 6 || h >= 19;
      P.date.innerHTML = icon(night ? 'moon' : 'sun', 14) + '<span>' + esc(fmtDate.format(now)) + '</span>';
      const g = greetingFor(h);
      const name = String(s.name || '').trim();
      P.greeting.innerHTML = esc(g.text) + (name ? ', <span class="home-greeting__name">' + esc(name) + '</span>' : '') + (g.late ? '?' : '');
    }

    P.clock.addEventListener('click', () => {
      N.settings.update({ clock24: !N.settings.get().clock24 });
    });

    // ------------------------------------------------------------ search

    const S = { typed: '', items: [], active: -1, open: false, inline: false };
    const listId = U.uid('home-sug');
    P.search.innerHTML =
      '<form class="home-search__box" role="search" autocomplete="off">' +
        '<span class="home-search__icon">' + icon('search', 18) + '</span>' +
        '<label class="n-sr" for="' + listId + '-in">Search or type a web address</label>' +
        '<input id="' + listId + '-in" class="home-search__input" type="text" spellcheck="false" autocapitalize="off" ' +
          'role="combobox" aria-autocomplete="both" aria-expanded="false" aria-controls="' + listId + '">' +
        '<button type="submit" class="home-search__go n-btn n-btn--ghost n-btn--icon" aria-label="Go" title="Go">' + icon('arrow-right', 17) + '</button>' +
      '</form>' +
      '<div class="home-sug" id="' + listId + '" role="listbox" aria-label="Suggestions" hidden></div>';
    const input = P.search.querySelector('input');
    const form = P.search.querySelector('form');
    const sugEl = P.search.querySelector('.home-sug');

    function updatePlaceholder() {
      const eng = N.searchEngine ? N.searchEngine().name : 'Google';
      input.placeholder = 'Search ' + eng + ' or type a site';
    }

    function closeSug() {
      S.open = false;
      S.active = -1;
      sugEl.hidden = true;
      P.search.classList.remove('is-open');
      input.setAttribute('aria-expanded', 'false');
      input.removeAttribute('aria-activedescendant');
    }

    function markMatch(title, q) {
      const t = String(title || '');
      const i = q ? t.toLowerCase().indexOf(q.toLowerCase()) : -1;
      if (i < 0) return esc(t);
      return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
    }

    function sugIcon(item) {
      if (item.favicon && item.favicon.letter) {
        return '<span class="n-favicon" style="--c:' + esc(item.favicon.color) + ';--fav-size:24px" aria-hidden="true">' + esc(item.favicon.letter) + '</span>';
      }
      return '<span class="home-sug__glyph">' + icon(item.icon || 'globe', 15) + '</span>';
    }

    function sugHint(item) {
      if (item.kind === 'tab') return 'Switch';
      if (item.kind === 'app') return 'Open';
      if (item.kind === 'embed') return 'Open here';
      if (item.kind === 'search') return 'Search';
      return '';
    }

    function renderSug() {
      const q = S.typed.trim();
      if (!S.items.length) { closeSug(); return; }
      sugEl.innerHTML = S.items.map((item, i) => {
        const id = listId + '-' + i;
        const isLink = !!item.url && item.kind !== 'tab'; // a real href: a plain click opens a Nova web tab, Ctrl/Cmd/Shift/middle-click a browser tab
        const tag = isLink ? 'a' : 'div';
        const href = isLink ? ' href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer"' : '';
        const title = item.kind === 'search' ? '<span class="home-sug__q">' + esc(item.title) + '</span>' : markMatch(item.title, q);
        const hint = sugHint(item);
        return '<' + tag + ' class="home-sug__item" role="option" id="' + id + '" data-i="' + i + '" aria-selected="' + (i === S.active) + '"' + href + ' tabindex="-1">' +
          sugIcon(item) +
          '<span class="home-sug__text"><span class="home-sug__title n-truncate">' + title + '</span>' +
          (item.subtitle ? '<span class="home-sug__sub n-truncate">' + esc(item.subtitle) + '</span>' : '') + '</span>' +
          (hint ? '<span class="home-sug__hint">' + esc(hint) + (i === S.active ? ' ' + icon('arrow-right', 12) : '') + '</span>' : '') +
          '</' + tag + '>';
      }).join('');
      sugEl.hidden = false;
      S.open = true;
      P.search.classList.add('is-open');
      input.setAttribute('aria-expanded', 'true');
      if (S.active >= 0) input.setAttribute('aria-activedescendant', listId + '-' + S.active);
      else input.removeAttribute('aria-activedescendant');
    }

    function refreshSug(allowInline) {
      S.items = N.suggest(S.typed) || [];
      S.active = S.items.length ? 0 : -1;
      S.inline = false;
      const top = S.items[0];
      const typed = S.typed;
      if (allowInline && top && typeof top.inline === 'string' && typed.trim() &&
          top.inline.length > typed.length && top.inline.toLowerCase().indexOf(typed.toLowerCase()) === 0 &&
          input.selectionStart === input.value.length) {
        input.value = typed + top.inline.slice(typed.length);
        input.setSelectionRange(typed.length, input.value.length);
        S.inline = true;
      }
      renderSug();
    }

    function setActive(i) {
      if (!S.items.length) return;
      const n = S.items.length;
      S.active = ((i % n) + n) % n;
      // The inline completion belongs to the top suggestion only.
      if (S.active !== 0 && S.inline) { input.value = S.typed; S.inline = false; }
      renderSug();
      const node = sugEl.querySelector('[data-i="' + S.active + '"]');
      if (node && node.scrollIntoView) node.scrollIntoView({ block: 'nearest' });
    }

    function goTarget(target, ev) {
      const newTab = !!(ev && (ev.ctrlKey || ev.metaKey || ev.shiftKey));
      closeSug();
      const r = N.go(target, { newTab });
      if (r && (r.kind === 'search' || newTab)) {
        input.value = '';
        S.typed = '';
        input.blur();
      }
      return r;
    }

    input.addEventListener('input', (e) => {
      S.typed = input.value;
      if (!S.typed.trim()) { S.items = []; closeSug(); return; }
      const inserting = e.inputType ? /^insert/.test(e.inputType) && e.inputType !== 'insertFromPaste' : true;
      refreshSug(inserting);
    });

    input.addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (!S.open) { S.typed = input.value; refreshSug(false); return; }
        setActive(S.active + 1);
      } else if (e.key === 'ArrowUp') {
        if (!S.open) return;
        e.preventDefault();
        setActive(S.active - 1);
      } else if (e.key === 'Tab' && !e.shiftKey && S.inline) {
        e.preventDefault();
        S.typed = input.value;
        input.setSelectionRange(input.value.length, input.value.length);
        refreshSug(false);
      } else if (e.key === 'Escape') {
        if (S.open) { e.preventDefault(); e.stopPropagation(); if (S.inline) input.value = S.typed; closeSug(); } else if (input.value) { e.preventDefault(); e.stopPropagation(); input.value = ''; S.typed = ''; }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const item = S.open && S.active >= 0 ? S.items[S.active] : null;
        const raw = input.value.trim();
        if (item) goTarget(item, e);
        else if (raw) goTarget(raw, e);
      }
    });

    form.addEventListener('submit', (e) => {
      // Reached by the Go button (Enter is handled in keydown).
      e.preventDefault();
      const raw = input.value.trim();
      if (!raw) { input.focus(); return; }
      const item = S.open && S.active >= 0 ? S.items[S.active] : null;
      goTarget(item || raw, e);
    });

    input.addEventListener('focus', () => {
      if (input.value.trim()) { S.typed = input.value; refreshSug(false); }
    });
    input.addEventListener('blur', () => { setTimeout(() => { if (document.activeElement !== input) closeSug(); }, 120); });

    // Keep focus in the input while clicking suggestions.
    sugEl.addEventListener('pointerdown', (e) => { if (e.button === 0) e.preventDefault(); });
    sugEl.addEventListener('pointermove', (e) => {
      const node = e.target.closest('[data-i]');
      if (!node) return;
      const i = Number(node.getAttribute('data-i'));
      if (i !== S.active) {
        S.active = i;
        if (i !== 0 && S.inline) { input.value = S.typed; S.inline = false; }
        sugEl.querySelectorAll('[data-i]').forEach((n) => n.setAttribute('aria-selected', String(Number(n.getAttribute('data-i')) === i)));
      }
    });
    sugEl.addEventListener('click', (e) => {
      const node = e.target.closest('[data-i]');
      if (!node) return;
      const item = S.items[Number(node.getAttribute('data-i'))];
      if (item && node.tagName === 'A' && (e.ctrlKey || e.metaKey || e.shiftKey)) {
        // Not intercepted: the real anchor opens a browser tab; Nova only records it.
        if (item.query) {
          N.recents.add(item.url, N.searchEngine().name + ' search', item.query);
          N.ui.toast('Opened a ' + N.searchEngine().name + ' search in a new tab');
        } else {
          N.trackExternal(item.url, item.title);
        }
        closeSug();
        return;
      }
      e.preventDefault();
      if (item) goTarget(item, e);
    });

    // ------------------------------------------------------------ quick links

    function getLinks() {
      let links = [];
      try { links = N.data.get('links'); } catch (_) { links = []; }
      return Array.isArray(links) ? links.filter((l) => l && typeof l.url === 'string') : [];
    }

    // Every tile opens inside a Nova web tab (sites that refuse framing show the browser's own refused page there).
    // The anchor keeps its real href, so middle-click and Ctrl/Cmd/Shift-click still open a real browser tab natively.
    function tileHtml(l) {
      const f = U.favicon(l.url, l.title, l.color);
      const title = l.title || N.sites.nameFor(l.url);
      const tip = editMode ? 'Edit ' + title : title + ' — opens inside Nova';
      return '<div class="home-tile-wrap" role="listitem" data-id="' + esc(l.id) + '">' +
        '<a class="home-tile" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer" draggable="false" data-id="' + esc(l.id) + '" title="' + esc(tip) + '"' +
          (editMode ? ' aria-describedby="' + listId + '-edithelp"' : '') + '>' +
          '<span class="home-tile__icon n-favicon" style="--c:' + esc(f.color) + '" aria-hidden="true">' + esc(f.letter) + '</span>' +
          '<span class="home-tile__label">' + esc(title) + '</span>' +
          '<span class="n-sr"> (opens inside Nova)</span>' +
        '</a>' +
        (editMode ? '<button type="button" class="home-tile__remove" data-act="remove" data-id="' + esc(l.id) + '" aria-label="Remove ' + esc(title) + '" title="Remove">' + icon('x', 12, { strokeWidth: 2.6 }) + '</button>' : '') +
      '</div>';
    }

    function renderLinks() {
      if (dragState) { pendingLinks = true; return; }
      const links = getLinks();
      const focusedId = document.activeElement && el.contains(document.activeElement) && document.activeElement.closest('.home-tile') ?
        document.activeElement.getAttribute('data-id') : null;
      let grid = '';
      if (!links.length && !editMode) {
        grid = '<div class="home-links__empty">No quick links yet. <button type="button" class="n-link" data-act="add">Add your first one</button></div>';
      } else {
        grid = '<div class="home-links__grid" role="list">' + links.map(tileHtml).join('') +
          (editMode ? '<div class="home-tile-wrap home-tile-wrap--add" role="listitem"><button type="button" class="home-tile home-tile--add" data-act="add">' +
            '<span class="home-tile__icon home-tile__icon--add">' + icon('plus', 20) + '</span><span class="home-tile__label">Add link</span></button></div>' : '') +
          '</div>';
      }
      P.links.classList.toggle('is-editing', editMode);
      P.links.innerHTML = grid +
        (editMode
          ? '<div class="home-links__bar">' +
              '<span class="home-links__help" id="' + listId + '-edithelp">Drag to reorder · click a tile to rename · <span class="home-kbd-hint">Shift + ← →</span> moves</span>' +
              '<button type="button" class="n-btn n-btn--primary n-btn--sm" data-act="done">' + icon('check', 14) + '<span>Done</span></button>' +
            '</div>'
          : '') +
        '<div class="home-editor-slot"></div>';
      const footBtn = el.querySelector('[data-act="edit-links"]');
      if (footBtn) footBtn.hidden = editMode || !N.settings.get().home.showLinks;
      if (editing) renderEditor();
      if (focusedId) {
        const again = P.links.querySelector('.home-tile[data-id="' + CSS.escape(focusedId) + '"]');
        if (again) again.focus();
      }
    }

    function setEditMode(on) {
      editMode = !!on;
      if (!editMode) editing = null;
      renderLinks();
      if (editMode) {
        const first = P.links.querySelector('.home-tile');
        if (first) first.focus();
      } else {
        const btn = el.querySelector('[data-act="edit-links"]');
        if (btn) btn.focus();
      }
    }

    function saveLinks(next) { N.data.set('links', next); }

    function removeLink(id) {
      const links = getLinks();
      const i = links.findIndex((l) => l.id === id);
      if (i < 0) return;
      const removed = links[i];
      if (editing && editing.id === id) editing = null;
      saveLinks(links.filter((l) => l.id !== id));
      N.ui.toast('Removed ' + (removed.title || 'link'), {
        action: {
          label: 'Undo',
          onClick() {
            const cur = getLinks();
            if (cur.some((l) => l.id === removed.id)) return;
            cur.splice(Math.min(i, cur.length), 0, removed);
            saveLinks(cur);
          },
        },
      });
    }

    function moveLink(id, delta) {
      const links = getLinks();
      const i = links.findIndex((l) => l.id === id);
      const j = i + delta;
      if (i < 0 || j < 0 || j >= links.length) return;
      const item = links.splice(i, 1)[0];
      links.splice(j, 0, item);
      saveLinks(links);
      requestAnimationFrame(() => {
        const again = P.links.querySelector('.home-tile[data-id="' + CSS.escape(id) + '"]');
        if (again) again.focus();
      });
    }

    // ---- link editor (inline card below the tiles)

    function openEditor(id) {
      const link = id ? getLinks().find((l) => l.id === id) : null;
      editing = { id: link ? link.id : null, color: link && link.color ? link.color : '' };
      if (!editMode) { editMode = true; renderLinks(); } else renderEditor();
      const f = P.links.querySelector(link ? 'input[name="title"]' : 'input[name="url"]');
      if (f) { f.focus(); f.select(); }
    }

    function closeEditor(focusId) {
      editing = null;
      const slot = P.links.querySelector('.home-editor-slot');
      if (slot) slot.innerHTML = '';
      const target = focusId ? P.links.querySelector('.home-tile[data-id="' + CSS.escape(focusId) + '"]') : P.links.querySelector('[data-act="add"]');
      if (target) target.focus();
    }

    function renderEditor() {
      const slot = P.links.querySelector('.home-editor-slot');
      if (!slot || !editing) return;
      const link = editing.id ? getLinks().find((l) => l.id === editing.id) : null;
      if (editing.id && !link) { editing = null; slot.innerHTML = ''; return; }
      const fid = U.uid('lnk');
      slot.innerHTML =
        '<form class="home-editor" novalidate>' +
          '<div class="home-editor__head">' +
            '<span class="home-editor__preview" data-part="preview"></span>' +
            '<div><div class="home-editor__title">' + (link ? 'Edit quick link' : 'Add a quick link') + '</div>' +
            '<div class="home-editor__where n-hint" data-part="where"></div></div>' +
          '</div>' +
          '<div class="home-editor__fields">' +
            '<label class="n-field"><span class="n-label">Name</span>' +
              '<input class="n-input" name="title" id="' + fid + '-t" maxlength="60" placeholder="e.g. Desmos" value="' + esc(link ? link.title : '') + '"></label>' +
            '<label class="n-field"><span class="n-label">Address</span>' +
              '<input class="n-input" name="url" id="' + fid + '-u" inputmode="url" spellcheck="false" autocapitalize="off" placeholder="desmos.com/calculator" value="' + esc(link ? U.prettyUrl(link.url) : '') + '" aria-describedby="' + fid + '-err"></label>' +
          '</div>' +
          '<div class="home-editor__err n-hint" id="' + fid + '-err" role="alert"></div>' +
          '<div class="home-editor__colors" role="radiogroup" aria-label="Tile color">' +
            '<button type="button" class="home-color home-color--auto" role="radio" data-color="" title="Automatic color" aria-label="Automatic color"></button>' +
            TILE_COLORS.map((c) => '<button type="button" class="home-color" role="radio" data-color="' + c + '" style="--c:' + c + '" aria-label="Color ' + c + '"></button>').join('') +
          '</div>' +
          '<div class="home-editor__actions">' +
            (link ? '<button type="button" class="n-btn n-btn--danger n-btn--ghost n-btn--sm" data-act="ed-remove">' + icon('trash', 14) + '<span>Remove</span></button>' : '') +
            '<span class="home-editor__spacer"></span>' +
            '<button type="button" class="n-btn n-btn--sm" data-act="ed-cancel">Cancel</button>' +
            '<button type="submit" class="n-btn n-btn--primary n-btn--sm">' + (link ? 'Save' : 'Add link') + '</button>' +
          '</div>' +
        '</form>';
      const edForm = slot.querySelector('form');
      const tIn = edForm.querySelector('input[name="title"]');
      const uIn = edForm.querySelector('input[name="url"]');
      const err = edForm.querySelector('.home-editor__err');

      function currentUrl() {
        const raw = uIn.value.trim();
        if (!raw) return '';
        if (!(U.isUrlish(raw) || /^https?:\/\/\S+$/i.test(raw))) return '';
        return U.normalizeUrl(raw);
      }

      function refreshPreview() {
        const url = currentUrl();
        const title = tIn.value.trim() || (url ? N.sites.nameFor(url) : '');
        const f = U.favicon(url || 'https://example.com', title || '?', editing.color || null);
        const prev = edForm.querySelector('[data-part="preview"]');
        prev.innerHTML = '<span class="n-favicon" style="--c:' + esc(f.color) + ';--fav-size:40px">' + esc(title ? f.letter : '+') + '</span>';
        edForm.querySelector('.home-color--auto').style.setProperty('--c', U.favicon(url || '', title || '?', null).color);
        edForm.querySelectorAll('.home-color').forEach((b) => b.setAttribute('aria-checked', String((b.getAttribute('data-color') || '') === (editing.color || ''))));
        const where = edForm.querySelector('[data-part="where"]');
        if (!url) where.textContent = 'Paste or type a web address.';
        else where.innerHTML = icon('layers', 12) + ' Opens inside Nova';
      }

      tIn.addEventListener('input', refreshPreview);
      uIn.addEventListener('input', () => { uIn.removeAttribute('aria-invalid'); err.textContent = ''; refreshPreview(); });
      edForm.addEventListener('click', (e) => {
        const c = e.target.closest('.home-color');
        if (c) { editing.color = c.getAttribute('data-color') || ''; refreshPreview(); return; }
        const act = e.target.closest('[data-act]');
        if (!act) return;
        const a = act.getAttribute('data-act');
        if (a === 'ed-cancel') { const id = editing.id; closeEditor(id); }
        if (a === 'ed-remove') { const id = editing.id; closeEditor(null); removeLink(id); }
      });
      edForm.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeEditor(editing && editing.id); }
      });
      edForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const url = currentUrl();
        if (!url) {
          uIn.setAttribute('aria-invalid', 'true');
          err.textContent = uIn.value.trim() ? 'That doesn’t look like a web address — try something like desmos.com' : 'Add a web address first.';
          uIn.focus();
          return;
        }
        const title = (tIn.value.trim() || N.sites.nameFor(url)).slice(0, 60);
        const links = getLinks();
        let focusId = editing.id;
        if (editing.id) {
          const i = links.findIndex((l) => l.id === editing.id);
          if (i >= 0) {
            const next = Object.assign({}, links[i], { title, url });
            if (editing.color) next.color = editing.color; else delete next.color;
            links[i] = next;
          }
        } else {
          const added = { id: U.uid('link'), title, url };
          if (editing.color) added.color = editing.color;
          links.push(added);
          focusId = added.id;
          N.ui.toast('Added ' + title + ' to your quick links');
        }
        editing = null;
        saveLinks(links);
        renderLinks();
        const t = P.links.querySelector('.home-tile[data-id="' + CSS.escape(focusId) + '"]');
        if (t) t.focus();
      });
      refreshPreview();
    }

    // ---- tile clicks

    P.links.addEventListener('click', (e) => {
      const actEl = e.target.closest('[data-act]');
      if (actEl && P.links.contains(actEl) && !actEl.closest('.home-editor')) {
        const a = actEl.getAttribute('data-act');
        if (a === 'done') { setEditMode(false); return; }
        if (a === 'add') { e.preventDefault(); openEditor(null); return; }
        if (a === 'remove') { e.preventDefault(); removeLink(actEl.getAttribute('data-id')); return; }
      }
      const tile = e.target.closest('a.home-tile');
      if (!tile) return;
      const link = getLinks().find((l) => l.id === tile.getAttribute('data-id'));
      if (editMode) {
        e.preventDefault();
        if (dragState && dragState.justDragged) return;
        if (link) openEditor(link.id);
        return;
      }
      if (!link) return;
      if (e.ctrlKey || e.metaKey || e.shiftKey) {
        N.trackExternal(link.url, link.title); // not intercepted: the real anchor opens a browser tab
        return;
      }
      e.preventDefault(); // a Nova web tab, never a browser tab (Alt-click: a new Nova tab)
      N.go({ kind: 'link', url: link.url, title: link.title }, { newTab: e.altKey });
    });

    // Middle-click is left alone too: the real anchor opens a browser tab; we only record it.
    P.links.addEventListener('auxclick', (e) => {
      if (e.button !== 1 || editMode) return;
      const tile = e.target.closest('a.home-tile');
      const link = tile && getLinks().find((l) => l.id === tile.getAttribute('data-id'));
      if (link) N.trackExternal(link.url, link.title);
    });

    P.links.addEventListener('keydown', (e) => {
      if (!editMode) return;
      const tile = e.target.closest && e.target.closest('a.home-tile');
      if (!tile) return;
      const id = tile.getAttribute('data-id');
      if (e.shiftKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        e.preventDefault();
        moveLink(id, e.key === 'ArrowLeft' ? -1 : 1);
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        removeLink(id);
      } else if (e.key === 'Escape' && !editing) {
        e.preventDefault();
        setEditMode(false);
      }
    });

    // ---- drag to reorder (pointer events: mouse, touch and stylus)

    P.links.addEventListener('pointerdown', (e) => {
      if (!editMode || e.button !== 0) return;
      const wrap = e.target.closest('.home-tile-wrap');
      if (!wrap || wrap.classList.contains('home-tile-wrap--add') || e.target.closest('.home-tile__remove')) return;
      const grid = wrap.parentElement;
      const g = grid.getBoundingClientRect();
      dragState = {
        wrap, grid, pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, dragging: false, justDragged: false,
        ox: e.clientX - g.left - wrap.offsetLeft, oy: e.clientY - g.top - wrap.offsetTop,
      };
      // Pointer capture starts only once a drag begins, so a plain click still targets the tile.
    });

    function flipFirst(nodes) { return nodes.map((n) => ({ n, x: n.offsetLeft, y: n.offsetTop })); }
    function flipPlay(first) {
      if (!motionOk()) return;
      first.forEach((f) => {
        const dx = f.x - f.n.offsetLeft;
        const dy = f.y - f.n.offsetTop;
        if (!dx && !dy) return;
        f.n.style.transition = 'none';
        f.n.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        f.n.getBoundingClientRect();
        f.n.style.transition = '';
        f.n.style.transform = '';
      });
    }

    P.links.addEventListener('pointermove', (e) => {
      const d = dragState;
      if (!d || e.pointerId !== d.pointerId) return;
      if (!d.dragging) {
        if (Math.hypot(e.clientX - d.startX, e.clientY - d.startY) < 6) return;
        d.dragging = true;
        d.wrap.classList.add('is-dragging');
        d.grid.classList.add('is-sorting');
        try { P.links.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      }
      e.preventDefault();
      const g = d.grid.getBoundingClientRect();
      const px = e.clientX - g.left;
      const py = e.clientY - g.top;
      const others = Array.from(d.grid.querySelectorAll('.home-tile-wrap:not(.is-dragging):not(.home-tile-wrap--add)'));
      const target = others.find((o) => px >= o.offsetLeft && px < o.offsetLeft + o.offsetWidth && py >= o.offsetTop && py < o.offsetTop + o.offsetHeight);
      if (target) {
        const kids = Array.from(d.grid.children);
        const after = kids.indexOf(target) > kids.indexOf(d.wrap);
        const first = flipFirst(others);
        if (after) target.after(d.wrap); else target.before(d.wrap);
        flipPlay(first);
      }
      d.wrap.style.transform = 'translate(' + (px - d.ox - d.wrap.offsetLeft) + 'px,' + (py - d.oy - d.wrap.offsetTop) + 'px) scale(1.06)';
    });

    function endDrag(e, cancelled) {
      const d = dragState;
      if (!d || (e && e.pointerId !== d.pointerId)) return;
      if (!d.dragging) { dragState = null; return; }
      d.wrap.classList.remove('is-dragging');
      d.grid.classList.remove('is-sorting');
