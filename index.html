          STARTERS.map((s, i) => '<button type="button" class="ask-chip" data-starter="' + i + '">' + esc(s.label) + '</button>').join('') +
        '</div>' +
      '</div>';
    }

    function metaHtml(t, last) {
      const bits = [];
      if (t.flag === 'stopped') bits.push('<span class="ask-tag">Stopped</span>');
      if (t.flag === 'interrupted') bits.push('<span class="ask-tag ask-tag--warn">Interrupted</span>');
      if (t.flag === 'truncated') bits.push('<span class="ask-tag">Cut short</span>');
      if (t.flag === 'truncated' && last) bits.push('<button type="button" class="ask-link" data-act="continue">Continue</button>');
      return '<div class="ask-meta">' +
        '<button type="button" class="ask-act" data-act="copy" title="Copy answer" aria-label="Copy answer">' + icon('copy', 13) + '<span>Copy</span></button>' +
        bits.join('') + '</div>';
    }

    function msgHtml(t, i, isNew) {
      const cls = isNew ? ' ask-msg--new' : '';
      if (t.role === 'user') {
        return '<div class="ask-msg ask-msg--user' + cls + '" data-i="' + i + '"><div class="ask-bubble"><span class="n-sr">You: </span>' + esc(t.content) + '</div></div>';
      }
      const last = !!chat && i === chat.turns.length - 1;
      return '<div class="ask-msg ask-msg--claude' + cls + '" data-i="' + i + '">' + AVATAR +
        '<div class="ask-msg__body"><div class="ask-bubble ask-md"><span class="n-sr">Claude: </span>' + renderMarkdown(t.content) + '</div>' +
        metaHtml(t, last) + '</div></div>';
    }

    function pendingHtml() {
      return '<div class="ask-msg ask-msg--claude ask-msg--new is-pending" data-live>' + AVATAR +
        '<div class="ask-msg__body"><div class="ask-bubble ask-md">' + THINKING + '</div></div></div>';
    }

    function appendHtml(html) {
      if (msgsEl.querySelector('.ask-hero')) msgsEl.innerHTML = '';
      msgsEl.insertAdjacentHTML('beforeend', html);
      return msgsEl.lastElementChild;
    }

    function scrollEnd(force) {
      if (force) stick = true;
      if (stick) logEl.scrollTop = logEl.scrollHeight;
    }

    function currentNote() {
      if (note) return note;
      if (run || state === 'blocked' || !chat || !chat.turns.length) return null;
      const last = chat.turns[chat.turns.length - 1];
      if (last.role === 'user') return { kind: 'info', text: 'Claude hasn\'t answered that one yet.', retry: true };
      if (last.flag === 'interrupted') return { kind: 'info', text: 'That answer was cut off.', retry: true };
      return null;
    }

    function renderNote() {
      const n = currentNote();
      if (!n) { noteWrap.innerHTML = ''; return; }
      const iconName = n.kind === 'error' ? 'alert-triangle' : (n.kind === 'warn' ? 'bell' : 'info');
      noteWrap.innerHTML = '<div class="ask-note ask-note--' + esc(n.kind || 'info') + '" role="status">' + icon(iconName, 15) +
        '<span>' + esc(n.text) + '</span>' +
        (n.retry && state === 'ready' ? '<button type="button" class="ask-link" data-act="retry">Try again</button>' : '') + '</div>';
    }

    // Rebuilds the message list from the model. A call in flight for this chat gets its bubble back.
    function renderLog(keepScroll) {
      const turns = chat ? chat.turns : [];
      msgsEl.innerHTML = turns.length ? turns.map((t, i) => msgHtml(t, i)).join('') : heroHtml();
      if (run && run.chat === chat) {
        run.msg = appendHtml(pendingHtml());
        run.bubble = run.msg.querySelector('.ask-bubble');
        if (run.text) paintStream(run, run.text);
      }
      renderNote();
      renderChrome();
      scrollEnd(!keepScroll);
    }

    function renderAll() {
      renderLog();
      renderHistory();
    }

    // ---- talking to Claude
    function paintStream(r, text) {
      if (unmounted || run !== r || !r.bubble.isConnected) return;
      r.msg.classList.remove('is-pending');
      r.msg.classList.add('is-streaming');
      r.bubble.innerHTML = renderMarkdown(text);
      scrollEnd();
    }

    function ask() {
      if (!chat || state !== 'ready' || run) return;
      const ctl = new AbortController();
      const r = { chat, ctl, text: '', msg: null, bubble: null };
      run = r;
      note = null;
      r.msg = appendHtml(pendingHtml());
      r.bubble = r.msg.querySelector('.ask-bubble');
      renderNote();
      renderChrome();
      scrollEnd(true);
      live('Claude is thinking…');
      let p;
      try {
        p = sampleFn(buildInput(chat.turns), {
          modelTier: 'default',
          cache: false,
          signal: ctl.signal,
          onText: (u) => { r.text = u.text; paintStream(r, u.text); },
        });
      } catch (err) { p = Promise.reject(err); } // the capability promises never to throw synchronously
      Promise.resolve(p).then((res) => finishRun(r, res), (err) => failRun(r, err));
    }

    function finishRun(r, res) {
      const text = res && typeof res.text === 'string' ? res.text : r.text;
      if (run === r) run = null;
      const turn = { role: 'assistant', content: text };
      if (res && res.truncated) turn.flag = 'truncated';
      r.chat.turns.push(turn);
      r.chat.updatedAt = Date.now();
      trimChat(r.chat);
      persist();
      if (unmounted) return;
      if (chat === r.chat) {
        if (r.msg && r.msg.isConnected && r.chat.turns[r.chat.turns.length - 1] === turn) {
          const wrap = document.createElement('div'); // swap the live bubble for the finished message in place
          wrap.innerHTML = msgHtml(turn, r.chat.turns.length - 1);
          r.msg.replaceWith(wrap.firstElementChild);
          renderNote();
          renderChrome();
          scrollEnd();
        } else {
          renderLog(true);
        }
        if (document.activeElement === document.body) focusInput();
        live('Claude finished answering.');
      }
      renderHistory();
    }

    function failRun(r, err) {
      const e = err && typeof err === 'object' ? err : {};
      const code = typeof e.code === 'string' ? e.code : 'upstream_error';
      const info = describeError(code);
      if (run === r) run = null;
      const shown = !unmounted && chat === r.chat;
      const partial = code === 'refused' ? '' : String(typeof e.text === 'string' ? e.text : r.text || '');
      let restore = '';
      if (partial.trim()) {
        r.chat.turns.push({ role: 'assistant', content: partial, flag: code === 'cancelled' ? 'stopped' : 'interrupted' });
      } else if (info.takeBack && shown && !input.value.trim() && r.chat.turns.length && r.chat.turns[r.chat.turns.length - 1].role === 'user') {
        restore = r.chat.turns.pop().content; // give the message back so it can be reworded
      }
      if (!r.chat.turns.length) {
        removeFromStore(r.chat);
        if (chat === r.chat) chat = null;
      } else {
        r.chat.updatedAt = Date.now();
      }
      if (unmounted) { persist(); return; }
      if (info.fatal) { fatal = info.text; state = 'blocked'; }
      persist();
      if (shown) {
        if (code === 'cancelled' && !partial.trim()) note = { kind: 'info', text: 'Stopped before Claude wrote anything.', retry: true };
        else note = info.quiet || info.fatal ? null : { kind: info.kind, text: info.text, retry: !!info.retry };
        if (!chat) ctx.setParams({});
        if (restore) input.value = restore;
        renderLog(true);
        if (restore) { autosize(); focusInput(); }
        live(note ? note.text : (info.fatal ? info.text : 'Stopped.'));
      } else {
        renderChrome();
      }
      renderHistory();
    }

    function send(text) {
      text = String(text || '').trim().slice(0, MAX_INPUT_CHARS);
      if (!text || state !== 'ready' || run) return false;
      const now = Date.now();
      if (!chat) {
        chat = { id: U.uid('chat'), title: titleFrom(text), createdAt: now, updatedAt: now, turns: [] };
        store.chats.unshift(chat);
      }
      chat.turns.push({ role: 'user', content: text });
      chat.updatedAt = now;
      trimChat(chat);
      note = null;
      persist();
      ctx.setParams({ id: chat.id });
      msgsEl.querySelectorAll('[data-act="continue"]').forEach((b) => b.remove());
      noteWrap.innerHTML = '';
      appendHtml(msgHtml(chat.turns[chat.turns.length - 1], chat.turns.length - 1, true));
      renderHistory();
      ask();
      return true;
    }

    function submit() {
      if (run) return;
      if (send(input.value)) {
        input.value = '';
        autosize();
        renderChrome();
      }
    }

    function stop() { if (run) run.ctl.abort(); }

    function retry() {
      if (state !== 'ready' || run || !chat || !chat.turns.length) return;
      const last = chat.turns[chat.turns.length - 1];
      if (last.role === 'assistant' && last.flag === 'interrupted') chat.turns.pop();
      if (!chat.turns.length || chat.turns[chat.turns.length - 1].role !== 'user') return;
      note = null;
      renderLog();
      ask();
    }

    // ---- chats
    function leaveChat() {
      if (run) { run.ctl.abort(); run = null; } // the partial answer is kept on its own chat when the call settles
      note = null;
    }

    function openChat(id) {
      const next = store.chats.find((c) => c.id === id);
      closeNav();
      if (!next || next === chat) return;
      leaveChat();
      chat = next;
      ctx.setParams({ id: chat.id });
      persist();
      renderAll();
      focusInput();
    }

    function newChat() {
      closeNav();
      if (chat || run || note) {
        leaveChat();
        chat = null;
        ctx.setParams({});
        persist();
        renderAll();
      }
      focusInput();
    }

    function deleteChat(id) {
      const c = store.chats.find((x) => x.id === id);
      if (!c) return;
      const at = store.chats.indexOf(c);
      removeFromStore(c);
      if (chat === c) { leaveChat(); chat = null; ctx.setParams({}); }
      persist();
      renderAll();
      Nova.ui.toast('Chat deleted', {
        action: {
          label: 'Undo',
          onClick() {
            if (unmounted || store.chats.indexOf(c) !== -1) return;
            store.chats.splice(Math.min(at, store.chats.length), 0, c);
            persist();
            renderHistory();
          },
        },
        timeout: 6000,
      });
    }

    // ---- narrow-width history drawer
    function openNav() {
      root.dataset.nav = 'open';
      scrimEl.hidden = false;
      navBtn.setAttribute('aria-expanded', 'true');
      const first = $('.ask-new');
      if (first) first.focus();
    }

    function closeNav() {
      if (root.dataset.nav !== 'open') return;
      const hadFocus = root.querySelector('.ask-side').contains(document.activeElement);
      root.dataset.nav = 'closed';
      scrimEl.hidden = true;
      navBtn.setAttribute('aria-expanded', 'false');
      if (hadFocus && navBtn.offsetParent !== null) navBtn.focus();
    }

    function focusInput() {
      requestAnimationFrame(() => {
        if (unmounted || el.hidden || input.disabled || !finePointer()) return;
        input.focus({ preventScroll: true });
        const end = input.value.length;
        input.setSelectionRange(end, end);
      });
    }

    function prefill(text) {
      input.value = text;
      renderChrome();
      autosize();
      focusInput();
    }

    // ---- the "Ask Claude works in your claude.ai Nova" card (any copy of Nova that can't reach Claude itself)
    function renderUnavailable() {
      const insideClaude = Nova.env.variant === 'artifact'; // already the claude.ai copy, so pointing at it would be circular
      $('.ask-unavail__title').textContent = insideClaude ? 'Claude isn\'t reachable from here' : 'Ask Claude works in your claude.ai Nova';
      $('.ask-unavail__hint').textContent = insideClaude
        ? 'Nova couldn\'t connect to Claude on this page. You can still chat with Claude in a new tab.'
        : 'It syncs your notes, tasks and settings too. Here, Claude opens in a new tab.';
      const novaLink = $('.ask-open-nova');
      const claudeBtn = $('.ask-open');
      novaLink.hidden = insideClaude;
      claudeBtn.href = claudeLink(carriedPrompt);
      claudeBtn.classList.toggle('n-btn--primary', insideClaude);
    }

    // ---- state of the capability
    function setState(next) {
      state = next;
      const gone = next === 'unavailable';
      $('.ask-side').hidden = gone;
      $('.ask-main').hidden = gone;
      $('.ask-unavail').hidden = !gone;
      if (gone) renderUnavailable();
      scrimEl.hidden = gone || root.dataset.nav !== 'open';
      renderChrome();
      renderNote();
      if (next === 'ready' && input.value) autosize();
    }

    // ---- handoff from the highlight bubble: a new chat, seeded with the card's answer or with a prompt to send
    function applyHandoff(raw) {
      const h = readHandoff(raw);
      if (!h) return false;
      if (h.at && h.at === handledAt) return false; // this handoff was already used
      if (h.at) handledAt = h.at;
      carriedPrompt = h.prompt || (h.turns[0] && h.turns[0].content) || '';
      if (state === 'unavailable') { renderUnavailable(); ctx.setParams({}); return true; }
      if (chat || run || note) { leaveChat(); chat = null; }
      if (h.turns.length) {
        const now = Date.now();
        chat = { id: U.uid('chat'), title: titleFrom(h.context || h.turns[0].content), createdAt: now, updatedAt: now, turns: h.turns };
        store.chats.unshift(chat);
        trimChat(chat);
        persist();
        ctx.setParams({ id: chat.id });
      } else {
        ctx.setParams({});
      }
      renderAll();
      if (h.turns.length) focusInput();
      else if (h.send && state === 'ready') send(h.prompt);
      else if (h.send && state === 'connecting') pendingSend = h.prompt; // sent as soon as Claude is ready
      else prefill(h.prompt);
      return true;
    }

    // ---- events
    $('.ask-new').addEventListener('click', newChat);
    $('.ask-new-mini').addEventListener('click', newChat);
    $('.ask-close').addEventListener('click', closeNav);
    scrimEl.addEventListener('click', closeNav);
    navBtn.addEventListener('click', () => (root.dataset.nav === 'open' ? closeNav() : openNav()));
    sendBtn.addEventListener('click', () => (run ? stop() : submit()));

    input.addEventListener('input', () => { autosize(); sendBtn.disabled = !run && (state !== 'ready' || !input.value.trim()); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.altKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        submit();
      } else if (e.key === 'Escape' && run) {
        e.preventDefault();
        e.stopPropagation();
        stop();
      }
    });

    root.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && root.dataset.nav === 'open') { e.stopPropagation(); closeNav(); }
    });

    histEl.addEventListener('click', (e) => {
      const del = e.target.closest('[data-del]');
      if (del) { deleteChat(del.dataset.del); return; }
      const item = e.target.closest('.ask-hist__item');
      if (item) openChat(item.dataset.id);
    });
    histEl.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      const items = Array.from(histEl.querySelectorAll('.ask-hist__item'));
      const i = items.indexOf(document.activeElement);
      const next = items[Math.min(items.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))];
      if (next) { e.preventDefault(); next.focus(); }
    });

    logEl.addEventListener('scroll', () => { stick = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 60; }, { passive: true });
    logEl.addEventListener('click', (e) => {
      const t = e.target;
      const starter = t.closest('[data-starter]');
      if (starter) { prefill(STARTERS[Number(starter.dataset.starter)].text); return; }
      const codeCopy = t.closest('.ask-code__copy');
      if (codeCopy) {
        const code = codeCopy.closest('.ask-code').querySelector('code');
        U.copyText(code ? code.textContent : '').then((ok) => Nova.ui.toast(ok ? 'Code copied' : 'Couldn\'t copy — select it and press Ctrl+C'));
        return;
      }
      const act = t.closest('[data-act]');
      if (act) {
        const kind = act.dataset.act;
        if (kind === 'retry') retry();
        else if (kind === 'continue') send('Please continue.');
        else if (kind === 'copy') {
          const msg = act.closest('.ask-msg');
          const turn = chat && msg ? chat.turns[Number(msg.dataset.i)] : null;
          if (turn) U.copyText(turn.content).then((ok) => Nova.ui.toast(ok ? 'Answer copied' : 'Couldn\'t copy — select the text and press Ctrl+C'));
        }
        return;
      }
      const a = t.closest('a.ask-a');
      if (a) Nova.trackExternal(a.href, U.hostOf(a.href));
    });
    // Recents get the clean URL (a carried prompt shouldn't end up in the omnibox history).
    $('.ask-open').addEventListener('click', () => Nova.trackExternal(CLAUDE_URL, 'Claude'));
    $('.ask-open-nova').addEventListener('click', () => Nova.trackExternal(NOVA_URL, 'Nova on claude.ai'));

    // A drawer left open must not pop back when the card is narrowed again later.
    let sizeObserver = null;
    if (typeof ResizeObserver === 'function') {
      sizeObserver = new ResizeObserver(() => { if (el.clientWidth >= 720 && root.dataset.nav === 'open') closeNav(); });
      sizeObserver.observe(el);
    }

    // ---- first render
    const p0 = ctx.params || {};
    const startId = typeof p0.id === 'string' && store.chats.some((c) => c.id === p0.id) ? p0.id : store.activeId;
    chat = store.chats.find((c) => c.id === startId) || null;
    if (chat) ctx.setParams({ id: chat.id });
    renderAll();

    if (sampleFn !== undefined || !hasBridge()) {
      setState(sampleFn ? 'ready' : 'unavailable');
    } else {
      setState('connecting');
      resolveSample().then((fn) => {
        if (unmounted) return;
        setState(fn ? 'ready' : 'unavailable');
        if (fn) {
          focusInput();
          if (pendingSend) { const t = pendingSend; pendingSend = ''; send(t); }
        }
      });
    }
    applyHandoff(p0);

    return {
      onShow() {
        renderHistory();
        autosize();
        scrollEnd();
        focusInput();
      },
      onParams(p) {
        p = p || {};
        if (typeof p.id === 'string' && p.id !== (chat && chat.id) && store.chats.some((c) => c.id === p.id)) openChat(p.id);
        applyHandoff(p);
      },
      unmount() {
        unmounted = true;
        if (sizeObserver) sizeObserver.disconnect();
        if (run) { run.ctl.abort(); run = null; }
      },
    };
  }

  // Shared with the highlight bubble's answer card (selection.js, which loads after this file).
  Nova.ask = Object.assign(Nova.ask || {}, {
    renderMarkdown,
    describeError,
    resolveSample,
    sampleNow: () => sampleFn, // undefined = not asked yet · null = unavailable · function = ready
    claudeLink,
    CLAUDE_URL,
    NOVA_URL,
  });

  Nova.registerApp({
    id: 'ask',
    name: 'Ask Claude',
    icon: 'sparkles',
    singleton: true,
    keywords: ['claude', 'ai', 'chat', 'help', 'homework', 'explain'],
    description: 'Chat with Claude for homework help',
    mount,
  });
})();
</script>
<script>
/* ---- web/src/js/shell.js ---- */
/* Nova shell — the browser chrome around the tab card (SPEC §3.4, §4.4).

 * Layout modes (root data-mode):

 *   Nova.ui.toast(message, { action?, timeout=3200 (0 = sticky), icon? }) → { close() }.
 *   Nova.ui.confirm({ title, message, confirmLabel='OK', cancelLabel='Cancel', danger }) → Promise<bool>
 *   Nova.ui.prompt({ title, message?, label, value, placeholder, confirmLabel='Save' }) → Promise<string|null>

  // A few chrome-only glyphs icons.js doesn't have (same 24×24 stroke style as NovaIcons).
  const EXTRA_ICONS = {
    menu: '<path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/>',
    apps: '<rect width="7" height="7" x="3" y="3" rx="2"/><rect width="7" height="7" x="14" y="3" rx="2"/><rect width="7" height="7" x="14" y="14" rx="2"/><rect width="7" height="7" x="3" y="14" rx="2"/>',
    expand: '<path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/>',
    shrink: '<path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="m14 10 7-7"/><path d="m3 21 7-7"/>',
    'sidebar-close': '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/>',
    'sidebar-open': '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/>',
    enter: '<polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/>',
    'arrow-up-right': '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',

    if (k === 'Alt') return Nova.env.alt;
    if (k === 'Shift') return IS_MAC ? '⇧' : 'Shift';

    root: null, card: null, layer: null, chrome: [],

    tabs: [], activeId: null, canBack: false, canForward: false, closedCount: 0,
    settings: null, sync: null,
    drawer: false, peek: false, peekTimer: 0,
    drag: null, pendingRender: false, suppressClick: false, lastActiveId: null,

  });

  function qa(sel, el) { return Array.from((el || S.root).querySelectorAll(sel)); }

    if (!el || el === document.body) return false;
    if (el.isContentEditable) return true;
    const tag = el.tagName;
    if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
    if (tag !== 'INPUT') return false;
    return !/^(button|checkbox|radio|range|color|file|submit|reset|image)$/i.test(el.type || '');

    },
    show(t) {

    },
    hide(cold) {
      clearTimeout(this.timer);
      if (this.el) {
        this.el.remove();

      }

    },

  // ================================================================ positioning

  /** Place a fixed-layer element next to a rect. side: top|bottom|left|right, align: start|center|end. */
  function place(el, r, opts) {
    opts = opts || {};
    const gap = opts.gap == null ? 6 : opts.gap;
    const m = 8;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    el.style.left = '0px';
    el.style.top = '0px';
    const w = el.offsetWidth;
    const ht = el.offsetHeight;
    let side = opts.side || 'bottom';
    const room = { top: r.top - m, bottom: vh - r.bottom - m, left: r.left - m, right: vw - r.right - m };
    const need = side === 'top' || side === 'bottom' ? ht + gap : w + gap;
    if (room[side] < need) {
      const opp = { top: 'bottom', bottom: 'top', left: 'right', right: 'left' }[side];
      if (room[opp] > room[side]) side = opp;
    }
    const align = opts.align || 'center';
    let x;
    let y;
    if (side === 'top' || side === 'bottom') {
      y = side === 'bottom' ? r.bottom + gap : r.top - gap - ht;
      x = align === 'start' ? r.left : align === 'end' ? r.right - w : r.left + r.width / 2 - w / 2;
    } else {
      x = side === 'right' ? r.right + gap : r.left - gap - w;
      y = align === 'start' ? r.top : align === 'end' ? r.bottom - ht : r.top + r.height / 2 - ht / 2;
    }
    x = clampN(x, m, Math.max(m, vw - m - w));
    y = clampN(y, m, Math.max(m, vh - m - ht));

    el.style.top = Math.round(y) + 'px';

    return side;
  }

  function toolPlacement() {
    if (S.mode === 'horizontal') return { side: 'bottom', align: 'end', gap: 8 };
    return { side: 'top', align: S.mode === 'vertical' && S.side === 'right' ? 'end' : 'start', gap: 8 };
  }

  const Pop = {
    stack: [],
    open(entry) {
      if (entry.returnFocus === undefined) entry.returnFocus = document.activeElement;
      this.stack.push(entry);
      S.layer.appendChild(entry.el);
      if (entry.place) entry.place();
      if (entry.anchorEl && entry.anchorEl.hasAttribute('aria-haspopup')) entry.anchorEl.setAttribute('aria-expanded', 'true');
      Tip.hide(true);
      return entry;
    },
    close(entry, opts) {

      case 'ArrowDown': n = i < 0 ? 0 : Math.min(list.length - 1, i + cols); if (cols === 1 && i === list.length - 1) n = 0; break;

      case 'ArrowRight': if (cols === 1) return false; n = i < 0 ? 0 : Math.min(list.length - 1, i + 1); break;
      case 'ArrowLeft': if (cols === 1) return false; n = i < 0 ? 0 : Math.max(0, i - 1); break;
      case 'Home': n = 0; break;
      case 'End': n = list.length - 1; break;

  // Arrow keys over items laid out in a visual grid whose rows differ (the apps launcher: a 3-up apps grid
  // above 2-up site rows). Left/Right step through DOM order; Up/Down jump to the nearest item in the next
  // row up/down, preferring the same horizontal position.
  function gridKeys(e, items) {
    const list = items.filter((x) => !x.hidden && x.offsetParent !== null);
    if (!list.length) return false;
    const i = list.indexOf(document.activeElement);
    let target = null;
    switch (e.key) {
      case 'ArrowRight': target = list[i < 0 ? 0 : Math.min(list.length - 1, i + 1)]; break;
      case 'ArrowLeft': target = list[i < 0 ? 0 : Math.max(0, i - 1)]; break;
      case 'Home': target = list[0]; break;
      case 'End': target = list[list.length - 1]; break;
      case 'ArrowDown':
      case 'ArrowUp': {
        if (i < 0) { target = e.key === 'ArrowDown' ? list[0] : list[list.length - 1]; break; }
        const dir = e.key === 'ArrowDown' ? 1 : -1;
        const cur = list[i].getBoundingClientRect();
        let best = Infinity;
        target = list[i];
        list.forEach((el) => {
          const r = el.getBoundingClientRect();
          const dy = (r.top + r.height / 2 - (cur.top + cur.height / 2)) * dir;

  const dialogQueue = [];

    });

  function pumpDialogs() {
    if (dialogBusy || !dialogQueue.length || !S.layer) return;

    const spec = job.spec;
    const isPrompt = spec.kind === 'prompt';
    const id = U.uid('nv-dlg');
    const danger = !!spec.danger;
    const wrap = h('<div class="nv-modal nv-modal--dialog">' +
      '<div class="nv-dialog" role="' + (danger ? 'alertdialog' : 'dialog') + '" aria-modal="true" aria-labelledby="' + id + '-t"' +
        (spec.message ? ' aria-describedby="' + id + '-m"' : '') + '>' +
        (danger ? '<div class="nv-dialog__badge">' + icon('alert-triangle', 18) + '</div>' : '') +
        '<h2 class="nv-dialog__title" id="' + id + '-t"></h2>' +
        (spec.message ? '<p class="nv-dialog__msg" id="' + id + '-m"></p>' : '') +
        (isPrompt ? '<label class="n-field nv-dialog__field">' + (spec.label ? '<span class="n-label"></span>' : '') +
          '<input class="n-input" type="text" spellcheck="false" autocomplete="off"></label>' : '') +
        '<div class="nv-dialog__actions">' +
          '<button type="button" class="n-btn" data-dlg="cancel"></button>' +
          '<button type="button" class="n-btn n-btn--primary' + (danger ? ' n-btn--danger' : '') + '" data-dlg="ok"></button>' +
        '</div>' +

    box.querySelector('.nv-dialog__title').textContent = String(spec.title || (isPrompt ? 'Enter a value' : 'Are you sure?'));

    const input = isPrompt ? box.querySelector('input') : null;

    const cancelBtn = box.querySelector('[data-dlg="cancel"]');
    okBtn.textContent = String(spec.confirmLabel || (isPrompt ? 'Save' : 'OK'));
    cancelBtn.textContent = String(spec.cancelLabel || 'Cancel');

    let entry = null;
    function finish(ok) {

      done = true;

    okBtn.addEventListener('click', () => finish(true));
    cancelBtn.addEventListener('click', () => finish(false));
    wrap.addEventListener('pointerdown', (e) => { if (e.target === wrap) finish(false); });

    const timeout = opts.timeout === 0 ? 0 : Number(opts.timeout) > 0 ? Number(opts.timeout) : (opts.action ? 5200 : 3200);

  // ================================================================ suggestion items (omnibox + palette)

  // Only gates the "Search Wikipedia in Nova" row (it needs a host that can really frame Wikipedia).
  function webAppEmbeds(url) { return !!url && Nova.env.canEmbed && hasApp('web') && Nova.sites.isEmbeddable(url); }

  /** The web address a suggestion opens. Rows render it as a real href, so Nova.go handles a plain click (a Nova web

    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<b>' + esc(text.slice(i, i + qy.length)) + '</b>' + esc(text.slice(i + qy.length));

  function itemIconHtml(it) {
    if (it.swatchVars) return swatchDotHtml(it.swatchVars);
    if (it.colorDot) return '<span class="nv-dot-ic" style="--c:' + esc(it.colorDot) + '"></span>';
    if (it.wallCss) return '<span class="nv-dot-ic nv-dot-ic--wall" style="background:' + esc(it.wallCss) + '"></span>';
    if (it.favicon) {
      return '<span class="n-favicon" style="--c:' + esc(it.favicon.color) + ';--fav-size:22px" aria-hidden="true">' + esc(it.favicon.letter) + '</span>';
    }
    if (it.kind === 'tab' && it.url) return siteOrIcon(it.url, it.title, it.icon, 22);

  function itemHintHtml(it) {

  function rowHtml(it, i, query, prefix) {

      '<span class="nv-row__icon">' + itemIconHtml(it) + '</span>' +
      '<span class="nv-row__text"><span class="nv-row__title">' + hlText(it.title, it.noHighlight ? '' : query) + '</span>' +
      (sub ? '<span class="nv-row__sub">' + esc(sub) + '</span>' : '') + '</span>' +

      case 'tab': return 'Open tabs';

  /** Under the normal search action, offer the same words as a Wikipedia search shown inside Nova. */
  function withWikipedia(list, raw) {
    const query = String(raw || '').trim();
    if (!query || !webAppEmbeds('https://en.wikipedia.org/') || /^nova:/i.test(query) || U.isUrlish(query)) return list;
    const at = list.findIndex((it) => it.kind === 'search');
    if (at < 0) return list;

      kind: 'embed', title: 'Search Wikipedia in Nova for “' + query + '”', subtitle: 'en.wikipedia.org',

    };

  const Omni = (function () {

          if (mode === 'theme' && input.value) { input.value = ''; render(); }
          else close(true);
        } else if (e.key === 'Backspace' && mode === 'theme' && !input.value) { e.preventDefault(); setMode('main'); }
        else if (e.key === 'Tab') e.preventDefault();
      });
      list.addEventListener('mousedown', (e) => e.preventDefault());
      list.addEventListener('pointermove', (e) => {
        const row = e.target.closest('.nv-row');
        if (!row || row.classList.contains('is-disabled')) return;
        const i = Number(row.dataset.i);
        if (i !== sel) { sel = i; paint(); }
      });
      list.addEventListener('click', (e) => {
        const row = e.target.closest('.nv-row');
        if (!row) return;
        run(items[Number(row.dataset.i)], e);
      });
      wrap.addEventListener('pointerdown', (e) => { if (e.target === wrap) close(true); });
      entry = Pop.open({ el: wrap, kind: 'palette', modal: true, onClose: () => { revertPreview(); entry = null; } });
      if (typeof initial === 'string' && initial) input.value = initial;
      render();
      input.focus();
    }

    function close(restoreFocus) {
      if (!entry) return;
      const e = entry;
      revertPreview();
      Pop.close(e, { focus: !!restoreFocus });
      entry = null;
    }

    return {
      open,
      close,
      toggle() { if (entry) close(true); else open(); },
      isOpen: () => !!entry,
      refresh() { if (entry) render(); },
      openThemes() { open(); setMode('theme'); },
    };
  })();

  // ================================================================ theme helpers

  function autoThemeId() {
    const res = Nova.settings.theme();
    return res && res.scheme === 'light' ? 'daylight' : 'midnight';
  }

  function previewVarsFor(id) {
    try { return window.NovaTheme.previewVars(id, Nova.themes, S.settings || Nova.settings.get()); } catch (_) { return {}; }
  }

  function varsStyle(vars) {
    return Object.keys(vars).filter((k) => /^--n-(frame|page|surface|text|text-muted|accent|accent-text|border|tab-active|sidebar)$/.test(k))
      .map((k) => k + ':' + vars[k]).join(';');
  }

  function swatchDotHtml(vars) {
    return '<span class="nv-swdot" style="' + esc(varsStyle(vars)) + '"><i></i><i></i></span>';
  }

  // ================================================================ quick theme popover

  function openQuickTheme(anchor) {
    const existing = Pop.find('quick-theme');
    if (existing) { Pop.close(existing, { focus: true }); return; }
    Pop.closeAll((e) => !e.modal);
    Omni.close();
    if (S.mode === 'vertical' && S.collapsed && !S.peek) setPeek(true);
    const el = h('<div class="nv-pop nv-qt" role="dialog" aria-label="Theme and layout"></div>');
    const entry = {
      el, kind: 'quick-theme', anchorSel: '[data-act="theme"]',
      anchorEl: anchor && anchor.getBoundingClientRect ? anchor : null,
      place: () => {
        const a = anchorOf(entry);
        if (!a) { place(el, pointRect(window.innerWidth / 2, 60), { side: 'bottom', align: 'center' }); return; }
        place(el, a.getBoundingClientRect(), toolPlacement());
      },
      render: () => renderQuickTheme(el),
    };
    renderQuickTheme(el);
    el.addEventListener('click', onQuickThemeClick);
    el.addEventListener('keydown', (e) => {
      const grid = e.target.closest('[data-cols]');
      if (grid && rovingKeys(e, qa('button', grid), Number(grid.dataset.cols) || 1)) return;
      if (e.key === 'Tab') trapFocus(e, el);
    });
    Pop.open(entry);
    const cur = el.querySelector('.nv-sw[aria-checked="true"]') || el.querySelector('button');
    if (cur) cur.focus({ preventScroll: true });
  }

  function renderQuickTheme(el) {
    const s = S.settings || Nova.settings.get();
    const T = Nova.themes;
    const focusKey = el.contains(document.activeElement) ? document.activeElement.getAttribute('data-qt-key') : null;
    const curChoice = (T.choices || []).find((c) => c.id === s.theme);
    const baseVars = previewVarsFor(s.theme === 'auto' ? autoThemeId() : s.theme);
    const themeBtns = (T.choices || []).map((c) => {
      const on = s.theme === c.id;
      const key = 'theme:' + c.id;
      const win = c.id === 'auto'
        ? '<span class="nv-sw__win nv-sw__win--auto"><span class="nv-sw__half" style="' + esc(varsStyle(previewVarsFor('midnight'))) + '">' + miniWin() + '</span>' +
          '<span class="nv-sw__half nv-sw__half--b" style="' + esc(varsStyle(previewVarsFor('daylight'))) + '">' + miniWin() + '</span></span>'
        : '<span class="nv-sw__win" style="' + esc(varsStyle(previewVarsFor(c.id))) + '">' + miniWin() + '</span>';
      return '<button type="button" class="nv-sw" role="radio" aria-checked="' + on + '" tabindex="' + (on ? 0 : -1) + '" data-qt="theme" data-v="' + esc(c.id) + '" data-qt-key="' + esc(key) + '"' +
        ' aria-label="' + esc(c.name + (c.auto ? ' (follows your device)' : '')) + '"' + (c.auto ? ' data-tip="' + esc(c.hint || 'Follows your device') + '"' : '') + '>' +
        win + '<span class="nv-sw__name">' + esc(c.name) + '</span></button>';
    }).join('');
    const walls = [{ id: 'none', name: 'None' }].concat(T.wallpapers || []).map((w) => {
      const on = s.wallpaper === w.id;
      const bg = w.id === 'none' ? baseVars['--n-frame'] || 'var(--n-frame)' : w.css;
      return '<button type="button" class="nv-wall' + (w.id === 'none' ? ' nv-wall--none' : '') + '" role="radio" aria-checked="' + on + '" tabindex="' + (on ? 0 : -1) +
        '" data-qt="wallpaper" data-v="' + esc(w.id) + '" data-qt-key="wall:' + esc(w.id) + '" aria-label="' + esc(w.id === 'none' ? 'No wallpaper' : w.name) + '" data-tip="' + esc(w.id === 'none' ? 'Theme frame' : w.name) + '" data-tip-side="top">' +
        '<span class="nv-wall__fill" style="background:' + esc(bg) + '"></span>' + (w.id === 'none' ? icon('no-wallpaper', 14) : '') + '</button>';
    }).join('');
    const accents = [{ id: 'default', name: 'Theme default', color: null }].concat(T.accents || []).map((a) => {
      const on = a.color === null ? !s.accent : s.accent === a.color;
      const c = a.color || baseVars['--n-accent'] || 'var(--n-accent)';
      return '<button type="button" class="nv-acc' + (a.color ? '' : ' nv-acc--default') + '" role="radio" aria-checked="' + on + '" tabindex="' + (on ? 0 : -1) +
        '" data-qt="accent" data-v="' + esc(a.color || '') + '" data-qt-key="acc:' + esc(a.id) + '" style="--c:' + esc(c) + '" aria-label="' + esc(a.name) + '" data-tip="' + esc(a.name) + '" data-tip-side="top">' +
        (on ? icon('check', 12) : '') + '</button>';
    }).join('');
    const lay = s.layout === 'horizontal' ? 'top' : s.sidebarSide === 'right' ? 'right' : 'left';
    const layBtn = (v, ic, label) => '<button type="button" aria-pressed="' + (lay === v) + '" data-qt="layout" data-v="' + v + '" data-qt-key="lay:' + v + '">' + icon(ic, 14) + '<span>' + label + '</span></button>';
    const denBtn = (v, label) => '<button type="button" aria-pressed="' + (s.density === v) + '" data-qt="density" data-v="' + v + '" data-qt-key="den:' + v + '">' + label + '</button>';
    el.innerHTML =
      '<div class="nv-qt__sec">' +
        '<div class="nv-qt__head"><span class="nv-qt__label">Theme</span><span class="nv-qt__cur">' + esc(curChoice ? curChoice.name : '') +
          (s.theme === 'auto' ? ' · ' + esc((Nova.themes.themes.find((t) => t.id === autoThemeId()) || {}).name || '') : '') + '</span></div>' +
        '<div class="nv-qt__themes" role="radiogroup" aria-label="Theme" data-cols="5">' + themeBtns + '</div>' +
      '</div>' +
      '<div class="nv-qt__sec">' +
        '<div class="nv-qt__head"><span class="nv-qt__label">Wallpaper</span></div>' +
        '<div class="nv-qt__walls" role="radiogroup" aria-label="Wallpaper" data-cols="9">' + walls + '</div>' +
      '</div>' +
      '<div class="nv-qt__sec">' +
        '<div class="nv-qt__head"><span class="nv-qt__label">Accent</span></div>' +
        '<div class="nv-qt__accents" role="radiogroup" aria-label="Accent color" data-cols="9">' + accents + '</div>' +
      '</div>' +
      '<div class="nv-qt__sec nv-qt__rows">' +
        '<div class="nv-qt__row"><span class="nv-qt__label">Tabs</span><div class="n-seg" role="group" aria-label="Tab layout">' +
          layBtn('left', 'panel-left', 'Left') + layBtn('right', 'panel-right', 'Right') + layBtn('top', 'panel-top', 'Top') + '</div></div>' +
        '<div class="nv-qt__row"><span class="nv-qt__label">Density</span><div class="n-seg" role="group" aria-label="Density">' +
          denBtn('comfortable', 'Roomy') + denBtn('compact', 'Compact') + '</div></div>' +
      '</div>' +
      '<button type="button" class="nv-qt__more" data-qt="more" data-qt-key="more">' + icon('settings', 15) + '<span>More settings</span>' + icon('chevron-right', 15) + '</button>';
    if (focusKey) {
      const f = el.querySelector('[data-qt-key="' + focusKey.replace(/"/g, '') + '"]');
      if (f) f.focus({ preventScroll: true });
    }
  }

  function miniWin() {
    return '<span class="nv-sw__side"><i></i><i></i><i></i></span><span class="nv-sw__card"><i></i><i></i></span>';
  }

  function onQuickThemeClick(e) {
    const b = e.target.closest('[data-qt]');
    if (!b) return;
    const v = b.getAttribute('data-v');
    switch (b.getAttribute('data-qt')) {
      case 'theme': Nova.settings.update({ theme: v }); break;
      case 'wallpaper': Nova.settings.update({ wallpaper: v }); break;
      case 'accent': Nova.settings.update({ accent: v || null }); break;
      case 'density': Nova.settings.update({ density: v }); break;
      case 'layout':
        if (v === 'top') Nova.settings.update({ layout: 'horizontal' });
        else Nova.settings.update({ layout: 'vertical', sidebarSide: v });
        if (Nova.env.narrow) toast(v === 'top' ? 'Top tabs show on wider screens' : 'The sidebar shows on wider screens');
        break;
      case 'more': {
        const entry = Pop.find('quick-theme');
        if (entry) Pop.close(entry);
        openApp('settings', { path: 'appearance' });
        break;
      }
      default:
    }
  }

  // ================================================================ apps launcher

  /** One site in the launcher: a real anchor. A plain click opens it in a Nova web tab (Nova.go); middle-click and
   *  Ctrl/Cmd/Shift-click are left to the browser, which opens the href in a real tab. */
  function siteLinkHtml(site) {
    const label = site.label || site.name;
    const f = U.favicon(site.url, label, site.color);
    return '<a class="nv-site" role="menuitem" href="' + esc(site.url) + '" target="_blank" rel="noopener noreferrer" ' +
      'data-site="' + esc(site.id) + '" data-tip="' + esc(site.name + ' — opens inside Nova') + '" data-tip-side="bottom">' +
      '<span class="n-favicon" style="--c:' + esc(f.color) + ';--fav-size:22px" aria-hidden="true">' + esc(f.letter) + '</span>' +
      '<span class="nv-site__name">' + esc(label) + '</span>' +
      '</a>';
  }

  function sitesSectionHtml() {
    const groups = (Nova.sites.launcher || []).filter((g) => g.sites.length);
    if (!groups.length || !hasApp('web')) return '';
    return '<div class="nv-sites" role="group" aria-label="Sites">' +
      '<div class="nv-apps__head"><span class="nv-qt__label">Sites</span>' +
        '<span class="nv-apps__sub">Open inside Nova</span></div>' +
      groups.map((g) => '<div class="nv-sites__group" role="group" aria-label="' + esc(g.label) + '">' +
        '<div class="nv-sites__label" role="presentation">' + esc(g.label) + '</div>' +
        '<div class="nv-sites__grid">' + g.sites.map(siteLinkHtml).join('') + '</div>' +
        '</div>').join('') +
      '</div>';
  }

  function openApps(anchor) {
    const existing = Pop.find('apps');
    if (existing) { Pop.close(existing, { focus: true }); return; }
    Pop.closeAll((e) => !e.modal);
    Omni.close();
    if (S.mode === 'vertical' && S.collapsed && !S.peek) setPeek(true);
    const apps = Nova.apps.list().filter((a) => !a.hidden);
    const el = h('<div class="nv-pop nv-apps" role="menu" aria-label="Apps and sites">' +
      '<div class="nv-apps__scroll n-scroll">' +
        '<div class="nv-apps__head"><span class="nv-qt__label">Apps</span><span class="nv-apps__sub">Built into Nova</span></div>' +
        '<div class="nv-apps__grid" data-cols="3">' + (apps.length ? apps.map((a) => {
          const open = S.tabs.some((t) => t.appId === a.id);
          return '<button type="button" class="nv-app" role="menuitem" data-app="' + esc(a.id) + '"' + (a.description ? ' data-tip="' + esc(a.description) + '" data-tip-side="bottom"' : '') + '>' +
            '<span class="nv-app__icon">' + icon(a.icon, 20) + (open && a.singleton ? '<i class="nv-app__open" aria-label="open"></i>' : '') + '</span>' +
            '<span class="nv-app__name">' + esc(a.name) + '</span></button>';
        }).join('') : '<div class="nv-pal__empty">No apps yet</div>') + '</div>' +
        sitesSectionHtml() +
      '</div>' +
      (S.installEvent
        ? '<button type="button" class="nv-install" role="menuitem" data-install>' + icon('download', 16) +
          '<span class="nv-install__text"><b>Install Nova as an app</b><span>Opens Nova in its own window, like a separate browser.</span></span></button>'
        : '') +
      '<button type="button" class="nv-apps__foot" data-apps-pal>' + icon('search', 14) + '<span>Search everything</span>' + kbdHtml('palette') + '</button>' +
      '</div>');
    const scroller = el.querySelector('.nv-apps__scroll');
    function scrollCues() {
      scroller.setAttribute('data-more', scroller.scrollTop + scroller.clientHeight < scroller.scrollHeight - 2 ? 'true' : 'false');
      scroller.setAttribute('data-less', scroller.scrollTop > 2 ? 'true' : 'false');
    }
    scroller.addEventListener('scroll', scrollCues, { passive: true });
    const entry = {
      el, kind: 'apps', anchorSel: '[data-act="apps"]', anchorEl: anchor && anchor.getBoundingClientRect ? anchor : null,
      place: () => {
        el.style.maxHeight = Math.max(240, window.innerHeight - 16) + 'px'; // sites scroll inside short windows
        scrollCues();
        const a = anchorOf(entry);
        if (!a) { place(el, pointRect(window.innerWidth / 2, 60), { side: 'bottom' }); return; }
        place(el, a.getBoundingClientRect(), toolPlacement());
      },
    };
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-app]');
      if (b) {
        Pop.close(entry);
        closeDrawer();
        Nova.go({ kind: 'app', appId: b.getAttribute('data-app') }, { newTab: !replaceable(activeTab(), false) });
        return;
      }
      const siteEl = e.target.closest('[data-site]');
      if (siteEl) {
        const site = Nova.sites.byId(siteEl.getAttribute('data-site'));
        if (!site) return;
        Pop.close(entry);
        closeDrawer();
        if (isNativeClick(e)) {
          Nova.trackExternal(site.url, site.name); // Ctrl/Cmd/Shift-click: the anchor itself opens the real tab
        } else {
          e.preventDefault(); // a Nova web tab, never a browser tab
          Nova.go({ kind: 'link', url: site.url, title: site.name }, { newTab: !replaceable(activeTab(), false) });
        }
        return;
      }
      if (e.target.closest('[data-install]')) { Pop.close(entry); installApp(); return; }
      if (e.target.closest('[data-apps-pal]')) { Pop.close(entry); Palette.open(); }
    });
    el.addEventListener('keydown', (e) => {
      if (gridKeys(e, qa('.nv-app, .nv-site, .nv-install', el))) return;
      if (e.key === 'Tab') trapFocus(e, el);
    });
    Pop.open(entry);
    const first = el.querySelector('.nv-app') || el.querySelector('.nv-site');
    if (first) first.focus({ preventScroll: true });
  }

  // ================================================================ actions

  function newNote() {
    if (!hasApp('notes')) { toast('Notes isn’t installed yet'); return; }
    openApp('notes', { action: 'new', at: Date.now() });
  }

  function toggleLayout() {
    const next = (S.settings || Nova.settings.get()).layout === 'horizontal' ? 'vertical' : 'horizontal';
    Nova.settings.update({ layout: next });
    if (Nova.env.narrow) toast(next === 'horizontal' ? 'Top tabs show on wider screens' : 'The sidebar shows on wider screens');
  }

  function toggleSidebar() {
    if (S.mode === 'narrow') { setDrawer(!S.drawer); return; }
    if (S.mode === 'horizontal') {
      toast('The sidebar is part of the sidebar layout', { action: { label: 'Switch layout', onClick: () => Nova.settings.update({ layout: 'vertical' }) } });
      return;
    }
    setPeek(false);
    Nova.settings.update({ sidebarCollapsed: !S.collapsed });
  }

  function toggleFullscreen() {
    const d = document;
    if (d.fullscreenElement) {
      try { const p = d.exitFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (_) { /* ignore */ }
      return;
    }
    const fail = () => toast('Full screen is blocked on this page — try your keyboard’s full-screen key', { icon: 'expand', timeout: 4600 });
    if (!html.requestFullscreen || d.fullscreenEnabled === false) { fail(); return; }
    try {
      const p = html.requestFullscreen({ navigationUI: 'hide' });
      if (p && typeof p.catch === 'function') p.catch(fail);
    } catch (_) { fail(); }
  }

  function updateFullscreen() {
    const fs = !!document.fullscreenElement;
    qa('[data-act="fullscreen"]').forEach((b) => {
      b.innerHTML = icon(fs ? 'shrink' : 'expand', 16);
      b.setAttribute('aria-label', fs ? 'Exit full screen' : 'Full screen');
      b.setAttribute('data-tip', fs ? 'Exit full screen' : 'Full screen');
      b.setAttribute('aria-pressed', fs ? 'true' : 'false');
    });
  }

  // The browser won't keep what Nova writes (storage blocked or full): say so once, and keep the sync dot red.
  function onStorage(info) {
    updateSync();
    if (info && info.ok === false && !S.warnedStorage) {
      S.warnedStorage = true;
      toast('This browser isn’t saving Nova’s data — notes and tasks will be gone when you close this tab.', {
        icon: 'alert-triangle',
        timeout: 14000,
        action: hasApp('settings') ? { label: 'Back up', onClick: () => openApp('settings', { path: 'sync' }) } : undefined,
      });
    }
  }

  function onSyncClick() {
    if (!Nova.storage.ok()) { if (hasApp('settings')) openApp('settings', { path: 'sync' }); return; }
    const st = S.sync || {};
    if (st.state === 'error' && !st.warning) { Nova.sync.retry(); toast('Trying to sync again…', { icon: 'rotate-cw' }); return; }
    if (hasApp('settings')) openApp('settings', { path: 'sync' });
  }

  function syncInfo(st) {
    st = st || { state: 'off' };
    if (!Nova.storage.ok()) return { label: 'Can’t save in this browser', sub: 'Storage is blocked or full — click to copy a backup' };
    const map = {
      off: { label: 'Saved on this device', sub: Nova.env.isArtifact ? 'Sync is off for this visit' : 'Sync turns on when Nova runs as your claude.ai artifact' },
      connecting: { label: 'Connecting sync…', sub: 'Your stuff is saved on this device meanwhile' },
      synced: { label: 'Synced', sub: st.lastSyncedAt ? 'Last synced ' + U.fmtRelative(st.lastSyncedAt) : 'Settings, links, notes and tasks' },
      saving: { label: 'Saving…', sub: 'Syncing your latest changes' },
      error: { label: st.message || 'Sync hit a problem', sub: st.warning ? 'Click for details — it stays on this device' : 'Click to retry — changes stay on this device' },
    };
    const info = Object.assign({}, map[st.state] || map.off);
    if (st.warning && typeof st.warning === 'string') info.sub = st.warning; // store.js sends `warning: true` for a too-big document
    return info;
  }

  function updateSync() {
    const st = S.sync || { state: 'off' };
    const info = syncInfo(st);
    const saves = Nova.storage.ok();
    qa('[data-act="sync"]').forEach((b) => {
      b.dataset.state = saves ? (st.state || 'off') : 'error';
      b.setAttribute('data-tip', info.label);
      b.setAttribute('data-tip-sub', info.sub || '');
      b.setAttribute('aria-label', 'Sync: ' + info.label);
    });
  }

  function updateNav() {
    qa('[data-act="back"]').forEach((b) => { b.disabled = !S.canBack; });
    qa('[data-act="forward"]').forEach((b) => { b.disabled = !S.canForward; });
    const count = S.tabs.length;
    qa('.nv-count').forEach((c) => { c.textContent = count > 99 ? '99+' : String(count); });
    const menuBtn = q('.nv-menu-btn');
    if (menuBtn) menuBtn.setAttribute('aria-label', 'Show tabs (' + count + ' open)');
  }

  // ================================================================ drawer + peek

  function setDrawer(on) {
    on = !!on && S.mode === 'narrow';
    if (S.drawer === on) return;
    S.drawer = on;
    S.root.classList.toggle('is-drawer-open', on);
    const btn = q('.nv-menu-btn');
    if (btn) btn.setAttribute('aria-expanded', on ? 'true' : 'false');
    const side = q('.nv-side');
    if (side) side.inert = !on;
    if (on) {
      Omni.close();
      requestAnimationFrame(() => {
        const act = q('.nv-side [role="tab"].is-active') || q('.nv-side .nv-newtab');
        if (act) { act.focus({ preventScroll: true }); revealInList(act); }
      });
    } else if (side && side.contains(document.activeElement) && btn) {
      btn.focus({ preventScroll: true });
    }
  }

  function closeDrawer() { if (S.drawer) setDrawer(false); }

  function setPeek(on) {
    clearTimeout(S.peekTimer);
    on = !!on && S.mode === 'vertical' && S.collapsed;
    if (S.peek === on) return;
    S.peek = on;
    S.root.classList.toggle('is-peek', on);
    const side = q('.nv-side');
    if (side && S.collapsed) side.inert = !on;
  }

  function canUnpeek() {
    const side = q('.nv-side');
    if (!side || S.drag) return !S.drag;
    if (side.matches(':hover')) return false;
    if (side.contains(document.activeElement)) return false;
    if (Pop.stack.some((e) => e.anchorEl && side.contains(e.anchorEl))) return false;
    if (Omni.isOpen()) return false;
    return true;
  }

  function schedulePeekClose() {
    clearTimeout(S.peekTimer);
    S.peekTimer = setTimeout(() => { if (canUnpeek()) setPeek(false); else if (S.peek) schedulePeekClose(); }, 320);
  }

  // ================================================================ chrome markup

  function navButtons(tipSide) {
    return iconBtn('back', 'arrow-left', 'Back', { tipSide, sub: 'The tab you viewed before' }) +
      iconBtn('forward', 'arrow-right', 'Forward', { tipSide }) +
      iconBtn('reload', 'rotate-cw', 'Reload tab', { tipSide });
  }

  function toolButtons(tipSide) {
    return iconBtn('apps', 'apps', 'Apps', { tipSide, popup: 'menu' }) +
      iconBtn('theme', 'palette', 'Theme & layout', { tipSide, popup: 'dialog' }) +
      iconBtn('fullscreen', 'expand', 'Full screen', { tipSide, kbd: 'fullscreen' }) +
      iconBtn('settings', 'settings', 'Settings', { tipSide });
  }

  function syncBtnHtml(tipSide) {
    return '<button type="button" class="nv-sync" data-act="sync" data-state="off" data-tip-side="' + tipSide + '" aria-label="Sync status" data-tip="Sync">' +
      '<span class="nv-sync__dot"></span></button>';
  }

  function sidebarHtml(drawer) {
    return '<aside class="nv-side' + (drawer ? ' nv-side--drawer' : '') + '" aria-label="Tabs"' + (drawer ? ' id="nv-drawer"' : '') + '>' +
      '<div class="nv-side__top">' +
        '<div class="nv-brand">' + MARK_HTML + '<span class="nv-brand__name">Nova</span></div>' +
        '<div class="nv-side__nav">' + navButtons('bottom') + (drawer ? iconBtn('drawer-close', 'x', 'Close tabs', { tipSide: 'bottom' }) : '') + '</div>' +
      '</div>' +
      (drawer ? '' : '<div class="nv-slot nv-slot--side" data-slot="omni"></div>') +
      '<div class="nv-side__scroll n-scroll">' +
        '<div class="nv-pinned" role="tablist" aria-label="Pinned tabs" aria-orientation="horizontal"></div>' +
        '<div class="nv-tabs" role="tablist" aria-label="Open tabs" aria-orientation="vertical"></div>' +
        '<button type="button" class="nv-newtab" data-act="new-tab">' + icon('plus', 16) + '<span>New tab</span>' + kbdHtml('newTab') + '</button>' +
      '</div>' +
      '<div class="nv-side__foot">' + toolButtons('top') + '<span class="nv-flex"></span>' + syncBtnHtml('top') +
        (drawer ? '' : iconBtn('collapse', 'sidebar-close', 'Hide sidebar', { tipSide: 'top', kbd: 'sidebar', cls: 'nv-collapse' })) +
      '</div>' +
      (drawer ? '' : '<div class="nv-resizer" tabindex="0" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" aria-valuemin="200" aria-valuemax="360"></div>') +
      '</aside>';
  }

  function topHtml() {
    return '<header class="nv-top">' +
      '<div class="nv-strip">' +
        '<div class="nv-brand nv-brand--mini" aria-hidden="true">' + MARK_HTML + '</div>' +
        '<div class="nv-hpinned" role="tablist" aria-label="Pinned tabs" aria-orientation="horizontal"></div>' +
        '<div class="nv-htabs" role="tablist" aria-label="Open tabs" aria-orientation="horizontal"></div>' +
        iconBtn('new-tab', 'plus', 'New tab', { kbd: 'newTab', cls: 'nv-hnew' }) +
      '</div>' +
      '<div class="nv-toolbar">' +
        '<div class="nv-toolbar__group">' + navButtons('bottom') + '</div>' +
        '<div class="nv-slot nv-slot--bar" data-slot="omni"></div>' +
        '<div class="nv-toolbar__group">' + toolButtons('bottom') + syncBtnHtml('bottom') + '</div>' +
      '</div>' +
      '</header>';
  }

  function barHtml() {
    return '<header class="nv-bar">' +
      '<button type="button" class="n-btn n-btn--ghost n-btn--icon nv-ib nv-menu-btn" data-act="drawer" aria-label="Show tabs" aria-expanded="false" aria-controls="nv-drawer">' +
        icon('menu', 18) + '<span class="nv-count" aria-hidden="true"></span></button>' +
      '<div class="nv-slot nv-slot--bar" data-slot="omni"></div>' +
      iconBtn('new-tab', 'plus', 'New tab', { size: 18, kbd: 'newTab' }) +
      '</header>';
  }

  function restoreHtml() {
    return '<button type="button" class="nv-restore" data-act="restore" aria-label="Show sidebar" data-tip="Show sidebar" data-kbd="sidebar" data-tip-side="right">' +
      icon('sidebar-open', 16) + '</button>';
  }

  // ================================================================ chrome render

  function currentMode() {
    if (Nova.env.narrow) return 'narrow';
    return (S.settings || {}).layout === 'horizontal' ? 'horizontal' : 'vertical';
  }

  function applyRootAttrs() {
    const s = S.settings || Nova.settings.get();
    const wasCollapsed = S.collapsed;
    S.side = s.sidebarSide === 'right' ? 'right' : 'left';
    S.collapsed = !!s.sidebarCollapsed;
    S.root.dataset.side = S.side;
    S.root.dataset.collapsed = S.collapsed ? 'true' : 'false';
    S.root.dataset.flush = Number(s.contentInset) === 0 ? 'true' : 'false';
    if (wasCollapsed !== S.collapsed && S.mode === 'vertical') {
      setPeek(false);
      const side = q('.nv-side');
      if (side) side.inert = S.collapsed;
      const col = q('.nv-collapse');
      if (col) {
        col.setAttribute('aria-label', S.collapsed ? 'Keep sidebar open' : 'Hide sidebar');
        col.setAttribute('data-tip', S.collapsed ? 'Keep sidebar open' : 'Hide sidebar');
        col.innerHTML = icon(S.collapsed ? 'pin' : 'sidebar-close', 16);
      }
    }
  }

  function renderChrome(force) {
    applyRootAttrs();
    const mode = currentMode();
    if (mode === S.mode && !force) return;
    S.mode = mode;
    S.root.dataset.mode = mode;
    Tip.hide(true);
    Omni.close();
    Pop.closeAll((e) => !e.modal && e.kind !== 'quick-theme');
    if (S.drag) cancelDrag();
    S.chrome.forEach((n) => n.remove());
    S.chrome = [];
    S.drawer = false;
    S.peek = false;
    S.root.classList.remove('is-drawer-open', 'is-peek');

    const parts = mode === 'vertical' ? [sidebarHtml(false), '<div class="nv-edge" aria-hidden="true"></div>', restoreHtml()]
      : mode === 'horizontal' ? [topHtml()]
        : [barHtml(), sidebarHtml(true), '<div class="nv-scrim" data-act="drawer-close" aria-hidden="true"></div>'];
    parts.forEach((p) => {
      const n = h(p);
      S.root.insertBefore(n, S.card);
      S.chrome.push(n);
    });
    const slot = q('[data-slot="omni"]');
    if (slot) slot.appendChild(Omni.el);
    bindChrome();
    S.lastActiveId = null;
    renderTabs();
    updateNav();
    updateSync();
    updateFullscreen();
    Omni.refresh();
    const side = q('.nv-side');
    if (side && (mode === 'narrow' || S.collapsed)) side.inert = true;
    if (mode === 'vertical') {
      const col = q('.nv-collapse');
      if (col && S.collapsed) {
        col.setAttribute('aria-label', 'Keep sidebar open');
        col.setAttribute('data-tip', 'Keep sidebar open');
        col.innerHTML = icon('pin', 16);
      }
    }
    requestAnimationFrame(() => { Pop.reposition(); positionToasts(); });
  }

  function bindChrome() {
    if (S.mode === 'vertical') {
      const edge = q('.nv-edge');
      const side = q('.nv-side');
      edge.addEventListener('pointerenter', () => {
        if (!S.collapsed) return;
        clearTimeout(S.peekTimer);
        S.peekTimer = setTimeout(() => setPeek(true), 70);
      });
      edge.addEventListener('pointerleave', () => { if (!S.peek) clearTimeout(S.peekTimer); });
      side.addEventListener('pointerenter', () => { if (S.peek) clearTimeout(S.peekTimer); });
      side.addEventListener('pointerleave', () => { if (S.peek) schedulePeekClose(); });
      side.addEventListener('focusout', () => { if (S.peek) schedulePeekClose(); });
      side.addEventListener('transitionend', (e) => { if (e.target === side) { Omni.position(); Pop.reposition(); } });
      const rz = q('.nv-resizer');
      rz.addEventListener('pointerdown', onResizeStart);
      rz.addEventListener('dblclick', () => Nova.settings.update({ sidebarWidth: Nova.settings.DEFAULTS.sidebarWidth }));
      rz.addEventListener('keydown', (e) => {
        const dir = S.side === 'right' ? -1 : 1;
        let d = 0;
        if (e.key === 'ArrowLeft') d = -16 * dir;
        else if (e.key === 'ArrowRight') d = 16 * dir;
        if (!d) return;
        e.preventDefault();
        Nova.settings.update({ sidebarWidth: (S.settings.sidebarWidth || 248) + d });
      });
      rz.setAttribute('aria-valuenow', String(S.settings.sidebarWidth || 248));
    }
    if (S.mode === 'horizontal') {
      const strip = q('.nv-htabs');
      strip.addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && strip.scrollWidth > strip.clientWidth) {
          strip.scrollLeft += e.deltaY;
          e.preventDefault();
        }
      }, { passive: false });
    }
  }

  function onResizeStart(e) {
    if (e.button !== 0) return;
    e.preventDefault();
    const startX = e.clientX;
    const startW = S.settings.sidebarWidth || 248;
    const dir = S.side === 'right' ? -1 : 1;
    let w = startW;
    S.root.classList.add('is-resizing');
    const move = (ev) => {
      w = Math.round(clampN(startW + (ev.clientX - startX) * dir, 200, 360));
      S.root.style.setProperty('--n-sidebar-w', w + 'px');
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      S.root.classList.remove('is-resizing');
      S.root.style.removeProperty('--n-sidebar-w');
      if (w !== startW) Nova.settings.update({ sidebarWidth: w });
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }

  // ================================================================ tab list

  function tabContainers() {
    if (S.mode === 'horizontal') return { pinned: q('.nv-hpinned'), list: q('.nv-htabs'), variant: 'htab' };
    return { pinned: q('.nv-pinned'), list: q('.nv-tabs'), variant: 'tab' };
  }

  function makeTabEl(t, variant) {
    const el = document.createElement('div');
    el.className = variant === 'pin' ? 'nv-pin' : variant === 'htab' ? 'nv-tab nv-htab' : 'nv-tab';
    el.setAttribute('role', 'tab');
    el.dataset.id = t.id;
    el.innerHTML = variant === 'pin'
      ? '<span class="nv-tab__icon"></span>'
      : '<span class="nv-tab__icon"></span><span class="nv-tab__title"></span>' +
        '<button type="button" class="nv-tab__close" tabindex="-1" aria-label="Close tab" data-tip="Close tab" data-kbd="closeTab">' + icon('x', 13) + '</button>';
    return el;
  }

  function updateTabEl(el, t, variant) {
    const active = t.id === S.activeId;
    const sig = [t.title, t.icon, t.url || '', active ? 1 : 0].join('\u0001');
    if (el._sig === sig) return;
    el._sig = sig;
    el.classList.toggle('is-active', active);
    el.setAttribute('aria-selected', active ? 'true' : 'false');
    el.tabIndex = active ? 0 : -1;
    el.querySelector('.nv-tab__icon').innerHTML = tabIcon(t, variant === 'pin' ? 18 : 16);
    const title = el.querySelector('.nv-tab__title');
    if (title) title.textContent = t.title;
    if (variant === 'pin' || variant === 'htab') el.setAttribute('data-tip', t.title);
    if (variant === 'pin') el.setAttribute('aria-label', t.title + ' (pinned)');
  }

  function reconcile(container, list, variant, animate) {
    if (!container) return;
    const existing = new Map();
    Array.from(container.children).forEach((c) => { if (c.dataset.id) existing.set(c.dataset.id, c); else c.remove(); });
    let prev = null;
    list.forEach((t) => {
      let el = existing.get(t.id);
      if (el) existing.delete(t.id);
      else {
        el = makeTabEl(t, variant);
        if (animate) el.classList.add('is-new');
      }
      updateTabEl(el, t, variant);
      const want = prev ? prev.nextSibling : container.firstChild;
      if (el !== want) container.insertBefore(el, want);
      prev = el;
    });
    existing.forEach((el) => el.remove());
  }

  /** Scrolls only the tab list holding `el` (never the page: a hidden, off-canvas sidebar would pan the whole shell). */
  function revealInList(el) {
    const box = el.parentElement;
    if (!box) return;
    const r = el.getBoundingClientRect();
    const b = box.getBoundingClientRect();
    if (r.top < b.top) box.scrollTop -= b.top - r.top;
    else if (r.bottom > b.bottom) box.scrollTop += r.bottom - b.bottom;
    if (r.left < b.left) box.scrollLeft -= b.left - r.left;
    else if (r.right > b.right) box.scrollLeft += r.right - b.right;
  }

  function renderTabs() {
    if (S.drag) { S.pendingRender = true; return; }
    S.pendingRender = false;
    const c = tabContainers();
    if (!c.list) return;
    const hadFocus = S.root.contains(document.activeElement) && document.activeElement.getAttribute('role') === 'tab';
    const animate = !!S.lastActiveId || S.lastActiveId === '';
    reconcile(c.pinned, S.tabs.filter((t) => t.pinned), 'pin', animate);
    reconcile(c.list, S.tabs.filter((t) => !t.pinned), c.variant, animate);
    S.root.classList.toggle('has-pinned', S.tabs.some((t) => t.pinned));
    if (S.activeId !== S.lastActiveId) {
      const act = S.root.querySelector('[role="tab"][data-id="' + S.activeId + '"]');
      if (act && act.offsetParent !== null) revealInList(act);
      S.lastActiveId = S.activeId || '';
    }
    if (hadFocus && (!document.activeElement || document.activeElement === document.body)) {
      const act = S.root.querySelector('[role="tab"][data-id="' + S.activeId + '"]');
      if (act) act.focus({ preventScroll: true });
    }
    setTimeout(() => qa('.is-new').forEach((x) => x.classList.remove('is-new')), 400);
  }

  function tabMenu(id, at, keyboard) {
    const t = S.tabs.find((x) => x.id === id);
    if (!t) return;
    const app = Nova.apps.get(t.appId);
    const others = S.tabs.filter((x) => x.id !== id && !x.pinned).length;
    showMenu(at, [
      { label: t.pinned ? 'Unpin tab' : 'Pin tab', icon: 'pin', onClick: () => Nova.tabs.pin(id, !t.pinned) },
      { label: 'Duplicate', icon: 'copy', disabled: !app || app.singleton, onClick: () => Nova.tabs.duplicate(id) },
      { label: 'Reload', icon: 'rotate-cw', onClick: () => Nova.tabs.reload(id) },
      t.appId === 'web' && t.url ? { label: 'Open in a real tab', icon: 'external-link', href: Nova.sites.realTabUrl(t.url), onClick: () => Nova.trackExternal(Nova.sites.realTabUrl(t.url), t.title) } : null,
      '-',
      { label: 'Close tab', icon: 'x', kbd: id === S.activeId ? 'closeTab' : null, onClick: () => Nova.tabs.close(id) },
      { label: 'Close other tabs', icon: 'layers', disabled: others === 0, onClick: () => Nova.tabs.closeOthers(id) },
    ], { label: 'Tab options', keyboard });
  }

  // ================================================================ drag to reorder

  function dragZones() {
    const c = tabContainers();
    return [
      { el: c.pinned, pinned: true, axis: S.mode === 'horizontal' ? 'x' : 'grid' },
      { el: c.list, pinned: false, axis: S.mode === 'horizontal' ? 'x' : 'y' },
    ].filter((z) => z.el);
  }

  function onTabPointerDown(e, el) {
    if (e.button !== 0 || e.target.closest('.nv-tab__close')) return;
    const id = el.dataset.id;
    if (e.pointerType === 'mouse' && S.mode !== 'narrow' && id !== S.activeId) Nova.tabs.activate(id);
    if (e.pointerType === 'touch') return;
    const start = { x: e.clientX, y: e.clientY };
    let drag = null;
    const move = (ev) => {
      if (!drag) {
        if (Math.abs(ev.clientX - start.x) + Math.abs(ev.clientY - start.y) < 6) return;
        drag = beginDrag(id, start, ev);
        if (!drag) { stop(); return; }
      }
      dragMove(drag, ev);
    };
    const stop = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', cancel);
    };
    const up = () => { stop(); if (drag) dragEnd(drag, false); };
    const cancel = () => { stop(); if (drag) dragEnd(drag, true); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', cancel);
  }

  function beginDrag(id, start, ev) {
    const el = S.root.querySelector('[role="tab"][data-id="' + id + '"]');
    if (!el || !el.parentNode) return null;
    const zones = dragZones();
    const r = el.getBoundingClientRect();
    const ghost = el.cloneNode(true);
    ghost.classList.add('nv-ghost');
    ghost.classList.remove('is-new');
    ghost.removeAttribute('role');
    ghost.removeAttribute('data-id');
    ghost.removeAttribute('data-tip');
    ghost.setAttribute('aria-hidden', 'true');
    ghost.style.left = r.left + 'px';
    ghost.style.top = r.top + 'px';
    ghost.style.width = r.width + 'px';
    ghost.style.height = r.height + 'px';
    S.layer.appendChild(ghost);
    const ph = document.createElement('div');
    ph.className = 'nv-ph';
    ph.style.setProperty('--ph-w', r.width + 'px');
    el.parentNode.insertBefore(ph, el);
    el.hidden = true;
    S.root.classList.add('is-dragging');
    Tip.hide(true);
    const drag = { id, el, ghost, ph, zones, start, last: ev, raf: 0 };
    S.drag = drag;
    autoScrollLoop(drag);
    return drag;
  }

  function zoneAt(drag, x, y) {
    for (const z of drag.zones) {
      const r = z.el.getBoundingClientRect();
      const pad = 8;
      if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) return z;
    }
    return null;
  }

  function insertionPoint(zone, x, y, drag) {
    const zr = zone.el.getBoundingClientRect();
    const kids = Array.from(zone.el.children).filter((c) => c !== drag.ph && c !== drag.el && c.getAttribute('role') === 'tab');
    for (const c of kids) {
      // offsetLeft/Top count from the child's offsetParent, which is the zone only when the zone is positioned
      const own = c.offsetParent === zone.el;
      const cx = zr.left + (own ? c.offsetLeft : c.offsetLeft - zone.el.offsetLeft) - zone.el.scrollLeft;
      const cy = zr.top + (own ? c.offsetTop : c.offsetTop - zone.el.offsetTop) - zone.el.scrollTop;
      const w = c.offsetWidth;
      const ht = c.offsetHeight;
      if (zone.axis === 'y') { if (y < cy + ht / 2) return c; }
      else if (zone.axis === 'x') { if (x < cx + w / 2) return c; }
      else if (y < cy || (y < cy + ht && x < cx + w / 2)) return c;
    }
    return null;
  }

  function nextReal(node, drag) {
    let n = node.nextSibling;
    while (n && n === drag.el) n = n.nextSibling;
    return n;
  }

  function flip(containers, mutate) {
    const els = [];
    containers.forEach((c) => { if (c) Array.from(c.children).forEach((k) => { if (!k.hidden) els.push(k); }); });
    const first = els.map((k) => k.getBoundingClientRect());
    mutate();
    if (Nova.env.reducedMotion || typeof Element.prototype.animate !== 'function') return;
    els.forEach((k, i) => {
      const a = first[i];
      const b = k.getBoundingClientRect();
      const dx = a.left - b.left;
      const dy = a.top - b.top;
      if (!dx && !dy) return;
      k.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }], { duration: 170, easing: 'cubic-bezier(0.2, 0.7, 0.2, 1)' });
    });
  }

  function dragMove(drag, ev) {
    drag.last = { clientX: ev.clientX, clientY: ev.clientY };
    drag.tx = ev.clientX - drag.start.x;
    drag.ty = ev.clientY - drag.start.y;
    drag.ghost.style.transform = 'translate(' + drag.tx + 'px,' + drag.ty + 'px)';
    const zone = zoneAt(drag, ev.clientX, ev.clientY) || drag.zones.find((z) => z.el === drag.ph.parentNode);
    if (!zone) return;
    drag.zones.forEach((z) => z.el.classList.toggle('is-drop', z === zone && zone.el !== drag.el.parentNode));
    const before = insertionPoint(zone, ev.clientX, ev.clientY, drag);
    if (drag.ph.parentNode === zone.el && nextReal(drag.ph, drag) === before) return;
    flip(drag.zones.map((z) => z.el), () => {
      zone.el.insertBefore(drag.ph, before);
      drag.ph.dataset.zone = zone.pinned ? 'pinned' : 'list';
    });
  }

  function autoScrollLoop(drag) {
    const tick = () => {
      if (S.drag !== drag) return;
      const horiz = S.mode === 'horizontal';
      const sc = horiz ? q('.nv-htabs') : q('.nv-side__scroll');
      if (sc && drag.last) {
        const r = sc.getBoundingClientRect();
        const pos = horiz ? drag.last.clientX : drag.last.clientY;
        const lo = horiz ? r.left : r.top;
        const hi = horiz ? r.right : r.bottom;
        let d = 0;
        if (pos < lo + 28) d = -Math.min(14, Math.ceil((lo + 28 - pos) / 3));
        else if (pos > hi - 28) d = Math.min(14, Math.ceil((pos - (hi - 28)) / 3));
        if (d) {
          if (horiz) sc.scrollLeft += d; else sc.scrollTop += d;
          dragMove(drag, drag.last);
        }
      }
      drag.raf = requestAnimationFrame(tick);
    };
    drag.raf = requestAnimationFrame(tick);
  }

  function dragEnd(drag, cancelled) {
    cancelAnimationFrame(drag.raf);
    const zone = drag.zones.find((z) => z.el === drag.ph.parentNode) || null;
    let j = -1;
    if (zone) j = Array.from(zone.el.children).filter((c) => c === drag.ph || (c !== drag.el && c.getAttribute('role') === 'tab')).indexOf(drag.ph);
    const finish = () => {
      drag.ghost.remove();
      drag.ph.remove();
      drag.el.hidden = false;
      drag.zones.forEach((z) => z.el.classList.remove('is-drop'));
      S.drag = null;
      S.root.classList.remove('is-dragging');
      S.suppressClick = true;
      setTimeout(() => { S.suppressClick = false; }, 0);
      if (!cancelled && zone && j >= 0) {
        const tab = S.tabs.find((t) => t.id === drag.id);
        if (tab) {
          const pinnedOthers = S.tabs.filter((t) => t.pinned && t.id !== drag.id).length;
          const wasIndex = S.tabs.indexOf(tab);
          const target = zone.pinned ? j : pinnedOthers + j;
          if (!!tab.pinned !== zone.pinned) Nova.tabs.pin(drag.id, zone.pinned);
          if (target !== wasIndex || !!tab.pinned !== zone.pinned) Nova.tabs.move(drag.id, target);
        }
      }
      renderTabs();
    };
    if (cancelled || Nova.env.reducedMotion || typeof drag.ghost.animate !== 'function') { finish(); return; }
    const pr = drag.ph.getBoundingClientRect();
    const gr = drag.ghost.getBoundingClientRect();
    const tx = (drag.tx || 0) + pr.left - gr.left;
    const ty = (drag.ty || 0) + pr.top - gr.top;
    const anim = drag.ghost.animate([
      { transform: 'translate(' + (drag.tx || 0) + 'px,' + (drag.ty || 0) + 'px)' },
      { transform: 'translate(' + tx + 'px,' + ty + 'px)' },
    ], { duration: 130, easing: 'cubic-bezier(0.2, 0.7, 0.2, 1)', fill: 'forwards' });
    anim.onfinish = finish;
    anim.oncancel = finish;
  }

  function cancelDrag() {
    const d = S.drag;
    if (!d) return;
    cancelAnimationFrame(d.raf);
    d.ghost.remove();
    d.ph.remove();
    d.el.hidden = false;
    S.drag = null;
    S.root.classList.remove('is-dragging');
  }

  // ================================================================ root event delegation

  const ACTIONS = {
    back: () => Nova.tabs.back(),
    forward: () => Nova.tabs.forward(),
    reload: () => Nova.tabs.reload(S.activeId),
    'new-tab': () => { closeDrawer(); Nova.tabs.open('home'); },
    apps: (b) => openApps(b),
    theme: (b) => openQuickTheme(b),
    fullscreen: () => toggleFullscreen(),
    settings: () => openApp('settings'),
    sync: () => onSyncClick(),
    collapse: () => toggleSidebar(),
    restore: () => { setPeek(false); Nova.settings.update({ sidebarCollapsed: false }); },
    drawer: () => setDrawer(!S.drawer),
    'drawer-close': () => setDrawer(false),
  };

  function bindRoot() {
    const root = S.root;
    root.addEventListener('click', (e) => {
      const close = e.target.closest('.nv-tab__close');
      if (close) {
        const tab = close.closest('[role="tab"]');
        e.stopPropagation();
        if (tab) Nova.tabs.close(tab.dataset.id);
        return;
      }
      const tabEl = e.target.closest('[role="tab"][data-id]');
      if (tabEl && root.contains(tabEl)) {
        if (S.suppressClick) return;
        Nova.tabs.activate(tabEl.dataset.id);
        if (S.mode === 'narrow') setDrawer(false);
        return;
      }
      const b = e.target.closest('[data-act]');
      if (b && root.contains(b) && ACTIONS[b.dataset.act] && !b.disabled) ACTIONS[b.dataset.act](b, e);
    });
    root.addEventListener('pointerdown', (e) => {
      const tabEl = e.target.closest('[role="tab"][data-id]');
      if (tabEl) onTabPointerDown(e, tabEl);
    });
    root.addEventListener('mousedown', (e) => {
      if (e.button === 1 && e.target.closest('[role="tab"][data-id]')) e.preventDefault(); // no autoscroll
    });
    root.addEventListener('auxclick', (e) => {
      if (e.button !== 1) return;
      const tabEl = e.target.closest('[role="tab"][data-id]');
      if (tabEl) { e.preventDefault(); Nova.tabs.close(tabEl.dataset.id); }
    });
    root.addEventListener('contextmenu', (e) => {
      const tabEl = e.target.closest('[role="tab"][data-id]');
      if (!tabEl) return;
      e.preventDefault();
      tabMenu(tabEl.dataset.id, { x: e.clientX, y: e.clientY });
    });
    root.addEventListener('keydown', (e) => {
      const tabEl = e.target.closest && e.target.closest('[role="tab"][data-id]');
      if (!tabEl || e.target !== tabEl) return;
      onTabKeydown(e, tabEl);
    });
  }

  function onTabKeydown(e, el) {
    const id = el.dataset.id;
    const all = qa('[role="tab"][data-id]').filter((x) => !x.hidden && x.offsetParent !== null);
    const i = all.indexOf(el);
    const horiz = S.mode === 'horizontal';
    const next = horiz ? 'ArrowRight' : 'ArrowDown';
    const prev = horiz ? 'ArrowLeft' : 'ArrowUp';
    let target = null;
    if (e.key === next) target = all[Math.min(all.length - 1, i + 1)];
    else if (e.key === prev) target = all[Math.max(0, i - 1)];
    else if (e.key === 'Home') target = all[0];
    else if (e.key === 'End') target = all[all.length - 1];
    else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      Nova.tabs.activate(id);
      if (S.mode === 'narrow') setDrawer(false);
      return;
    } else if (e.key === 'Delete' || (e.key === 'Backspace' && (e.ctrlKey || e.metaKey))) { // a bare Backspace right after a click must not close the tab
      e.preventDefault();
      const idx = i;
      Nova.tabs.close(id);
      const rest = qa('[role="tab"][data-id]').filter((x) => !x.hidden && x.offsetParent !== null);
      const f = rest[Math.min(idx, rest.length - 1)];
      if (f) f.focus();
      return;
    } else if (e.key === 'ContextMenu' || (e.key === 'F10' && e.shiftKey)) {
      e.preventDefault();
      tabMenu(id, el, true);
      return;
    }
    if (target) {
      e.preventDefault();
      all.forEach((x) => { x.tabIndex = x === target ? 0 : -1; });
      target.focus();
    }
  }

  // ================================================================ keyboard shortcuts (§4.4)

  function onKeyCapture(e) {
    if (e.isComposing) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && !e.altKey && !e.shiftKey && e.code === 'KeyK') {
      e.preventDefault();
      e.stopPropagation();
      if (Pop.find('dialog')) return;
      Palette.toggle();
    }
  }

  function onKey(e) {
    if (e.isComposing || e.defaultPrevented) return;
    const mod = e.ctrlKey || e.metaKey;
    if (e.key === 'Escape') {
      const top = Pop.top();
      if (top && !top.modal) { e.preventDefault(); Pop.close(top, { focus: true }); return; }
      if (S.drawer) { e.preventDefault(); setDrawer(false); return; }
      if (S.peek) { setPeek(false); return; }
      return;
    }
    if (Pop.hasModal()) return;
    if (isTyping(e.target)) return;
    if (!mod && !e.altKey && !e.shiftKey && e.code === 'Slash') {
      e.preventDefault();
      focusOmnibox();
      return;
    }
    if (!e.altKey || mod) return;
    let handled = true;
    const t = activeTab();
    switch (e.code) {
      case 'KeyT':
