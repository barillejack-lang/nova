      else if (n && toLong === 1) text += ' · long break after the next one';
      todayEl.innerHTML = '<span class="focus-dots" aria-hidden="true">' + dots + '</span><span>' + text + '</span>';

      soundSwitch.checked = !!engine.prefs.sound;
      MODES.forEach((m) => {
        const input = el.querySelector('.focus-len[data-mode="' + m + '"] .focus-len__input');
        if (document.activeElement !== input) input.value = s.lengths[m];
      });
      renderTime();
      renderRing();
    }

    function loop() {
      raf = 0;
      if (!visible) return;
      renderRing();
      renderTime();
      if (engine.state.running) raf = requestAnimationFrame(loop);
    }

    function kick() {
      if (visible && engine.state.running && !raf) raf = requestAnimationFrame(loop);
    }

    function celebrate() {
      root.classList.remove('is-complete');
      void root.offsetWidth;
      root.classList.add('is-complete');
      clearTimeout(celebrateTimer);
      celebrateTimer = setTimeout(() => root.classList.remove('is-complete'), 1400);
    }

    const off = engine.subscribe((evt) => {
      if (evt.type === 'tick') { if (!raf) { renderTime(); renderRing(); } return; }
      render();
      kick();
      if (evt.type === 'complete' && visible && !evt.away) celebrate();
    });

    async function chooseMode(mode) {
      const s = engine.state;
      if (mode === s.mode) return;
      if (s.running && s.mode === 'focus') {
        const ok = await Nova.ui.confirm({
          title: 'Switch to ' + LABELS[mode].toLowerCase() + '?',
          message: 'This stops the focus session that’s running. It won’t count toward today.',
          confirmLabel: 'Switch',
        });
        if (!ok) return;
      }
      engine.setMode(mode);
    }

    function stepLength(mode, delta, absolute) {
      const s = engine.state;
      const v = absolute != null ? absolute : s.lengths[mode] + delta;
      engine.setLengths({ [mode]: v });
    }

    mainBtn.addEventListener('click', () => { engine.primeAudio(); engine.toggle(); });
    resetBtn.addEventListener('click', () => engine.reset());
    skipBtn.addEventListener('click', () => engine.skip());
    modeBtns.forEach((b) => b.addEventListener('click', () => chooseMode(b.dataset.mode)));
    moreBtn.addEventListener('click', () => {
      settingsEl.hidden = !settingsEl.hidden;
      moreBtn.setAttribute('aria-expanded', String(!settingsEl.hidden));
      moreBtn.classList.toggle('is-active', !settingsEl.hidden);
      if (!settingsEl.hidden) settingsEl.scrollIntoView({ block: 'nearest', behavior: Nova.env.reducedMotion ? 'auto' : 'smooth' });
    });
    settingsEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-step]');
      if (!b) return;
      stepLength(b.closest('.focus-len').dataset.mode, Number(b.dataset.step));
    });
    settingsEl.addEventListener('change', (e) => {
      const input = e.target.closest('.focus-len__input');
      if (input) stepLength(input.closest('.focus-len').dataset.mode, 0, input.value);
    });
    settingsEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.closest('.focus-len__input')) e.target.blur();
    });
    soundSwitch.addEventListener('change', () => engine.setSound(soundSwitch.checked));
    $('.focus-sound__test').addEventListener('click', () => {
      engine.primeAudio();
      if (!engine.prefs.sound) engine.setSound(true);
      if (!engine.playChime()) Nova.ui.toast('Sound isn’t available in this browser');
    });

    // Space = start/pause, R = reset (not while typing).
    el.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const t = e.target;
      if (t.closest('input, textarea, select, [contenteditable="true"]')) return;
      if (e.code === 'Space' && !t.closest('button')) { e.preventDefault(); engine.primeAudio(); engine.toggle(); }
      else if (e.code === 'KeyR') { e.preventDefault(); engine.reset(); }
    });
    el.tabIndex = -1;

    const offSettings = Nova.on('settings', () => render());

    function handleParams(p) {
      p = p || {};
      const cmd = p.start === true || p.action === 'start' || p.path === 'start' ? 'start'
        : p.action === 'pause' || p.path === 'pause' ? 'pause' : null;
      if (!cmd) return;
      ctx.setParams({});
      if (cmd === 'start') { engine.primeAudio(); engine.start(); } else engine.pause();
    }

    render();
    handleParams(ctx.params);

    return {
      onShow() { visible = true; render(); kick(); },
      onHide() { visible = false; cancelAnimationFrame(raf); raf = 0; },
      onParams: handleParams,
      unmount() {
        visible = false;
        cancelAnimationFrame(raf);
        clearTimeout(celebrateTimer);
        off();
        offSettings();
      },
    };
  }

  Nova.registerApp({
    id: 'focus',
    name: 'Focus',
    icon: 'timer',
    singleton: true,
    keywords: ['focus', 'timer', 'pomodoro', 'study', 'break', 'concentrate'],
    description: 'Pomodoro focus timer',
    mount,
  });
})();
</script>
<script>
/* ---- web/src/js/apps/calc.js ---- */
/* Nova Calc (SPEC §4.1) — basic and scientific calculator with its own tokenizer and recursive-descent parser.
 * Nothing is eval()ed. Grammar, lowest to highest precedence:
 *   expr    := term (('+' | '−') term)*
 *   term    := factor (('×' | '÷') factor | <implicit ×> factor)*      2π, 2(3), 2sin(30)
 *   factor  := ('+' | '−') factor | power                                 sign binds looser than ^: −3^2 = −9
 *   power   := postfix ('^' factor)?                                     right-assoc: 2^3^2 = 2^9
 *   postfix := primary ('%' | '²')*
 *   primary := number | π | e | fn '(' expr ')' | fn factor | '(' expr ')'
 * Device state: Nova.local('calc') = { mode, angle, expr, committed, ans, history: [{ expr, text, value }] }. */
(function () {
  'use strict';

  const Nova = window.Nova;
  if (!Nova) return;
  const U = Nova.util;
  const esc = U.esc;

  const KEY = 'calc';
  const HISTORY_MAX = 30;
  const EXPR_MAX = 120;
  const BINARY = ['+', '−', '×', '÷', '^', '%', '²']; // keys that continue an answer after =
  const KEY_MAP = { '*': '×', x: '×', X: '×', '/': '÷', '-': '−', ',': '.' };
  const TYPABLE = /^[0-9a-z.+−×÷^%()²π√]$/i;
  const SYNTAX = 'Check the expression';
  const INCOMPLETE = 'Finish the expression';

  // Lucide delete-left glyph (ISC) — not in the shared icon set.
  const BACKSPACE_PATH = '<path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m18 9-6 6"/><path d="m12 9 6 6"/>';
  function backspaceIcon(size) {
    return '<svg class="n-icon" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + BACKSPACE_PATH + '</svg>';
  }

  // ================================================================ tokenizer + parser

  const FUNCS = new Set(['sin', 'cos', 'tan', 'ln', 'log', 'sqrt']);
  const CONSTS = new Map([['pi', Math.PI], ['e', Math.E]]);
  const SYMBOLS = new Map([
    ['+', '+'], ['-', '-'], ['−', '-'], ['–', '-'], ['*', '*'], ['×', '*'], ['·', '*'],
    ['/', '/'], ['÷', '/'], ['^', '^'], ['%', '%'], ['²', '²'],
  ]);
  const NUMBER = /(\d+\.?\d*|\.\d+)/y; // no 1e5 notation: a typed "2e+3" is 2 × e + 3 (big answers are written 1×10^21)
  const WORD = /[a-z]+/y;

  class CalcError extends Error {
    constructor(message, kind) {
      super(message);
      this.kind = kind || 'syntax';
    }
  }

  function tokenize(source) {
    const src = String(source).toLowerCase();
    const out = [];
    let i = 0;
    while (i < src.length) {
      const ch = src[i];
      if (ch === ' ' || ch === '\t') { i++; continue; }
      NUMBER.lastIndex = i;
      const num = NUMBER.exec(src);
      if (num) {
        out.push({ t: 'num', v: parseFloat(num[0]) });
        i = NUMBER.lastIndex;
        if (src[i] === '.') throw new CalcError(SYNTAX); // "1.2.3"
        continue;
      }
      if (ch >= 'a' && ch <= 'z') {
        WORD.lastIndex = i;
        const w = WORD.exec(src)[0];
        i += w.length;
        if (w === 'x') out.push({ t: 'op', v: '*' });
        else if (CONSTS.has(w)) out.push({ t: 'num', v: CONSTS.get(w) });
        else if (FUNCS.has(w)) out.push({ t: 'fn', v: w });
        else throw new CalcError(SYNTAX);
        continue;
      }
      if (ch === '(' || ch === ')') { out.push({ t: ch }); i++; continue; }
      if (ch === 'π') { out.push({ t: 'num', v: Math.PI }); i++; continue; }
      if (ch === '√') { out.push({ t: 'fn', v: 'sqrt' }); i++; continue; }
      if (SYMBOLS.has(ch)) { out.push({ t: 'op', v: SYMBOLS.get(ch) }); i++; continue; }
      throw new CalcError(SYNTAX);
    }
    out.push({ t: 'end' });
    return out;
  }

  function applyFn(name, x, angle) {
    const toRad = (a) => (angle === 'deg' ? (a * Math.PI) / 180 : a);
    switch (name) {
      case 'sin': return Math.sin(toRad(x));
      case 'cos': return Math.cos(toRad(x));
      case 'tan': {
        const r = toRad(x);
        if (Math.abs(Math.cos(r)) < 1e-12) throw new CalcError('tan is undefined at this angle', 'math');
        return Math.tan(r);
      }
      case 'ln':
        if (x <= 0) throw new CalcError('ln needs a number above 0', 'math');
        return Math.log(x);
      case 'log':
        if (x <= 0) throw new CalcError('log needs a number above 0', 'math');
        return Math.log10(x);
      case 'sqrt':
        if (x < 0) throw new CalcError("Can't take the √ of a negative number", 'math');
        return Math.sqrt(x);
      default:
        throw new CalcError(SYNTAX);
    }
  }

  // Round away binary noise (0.1+0.2, sin(30°)) and reject results that are not usable numbers.
  function clean(v) {
    if (Number.isNaN(v)) throw new CalcError("That doesn't have a real answer", 'math');
    if (!Number.isFinite(v)) throw new CalcError('Result is too big', 'math');
    if (Math.abs(v) < 1e-13) return 0;
    return parseFloat(v.toPrecision(12));
  }

  function evaluate(source, angle) {
    const toks = tokenize(source);
    let p = 0;
    const cur = () => toks[p];
    const isOp = (v) => cur().t === 'op' && cur().v === v;
    const startsOperand = () => {
      const t = cur().t;
      return t === 'num' || t === 'fn' || t === '(';
    };

    function closeParen() {
      if (cur().t === ')') { p++; return; }
      if (cur().t === 'end') throw new CalcError(INCOMPLETE, 'incomplete');
      throw new CalcError(SYNTAX);
    }

    function expr() {
      let v = term();
      while (isOp('+') || isOp('-')) {
        const op = toks[p++].v;
        const r = term();
        v = op === '+' ? v + r : v - r;
      }
      return v;
    }

    function term() {
      let v = factor();
      for (;;) {
        if (isOp('*')) { p++; v *= factor(); }
        else if (isOp('/')) {
          p++;
          const d = factor();
          if (Math.abs(d) < 1e-13) throw new CalcError("Can't divide by 0", 'math'); // same cut-off as clean(): 0.1+0.2−0.3 is zero
          v /= d;
        } else if (startsOperand()) { v *= factor(); }
        else return v;
      }
    }

    function factor() {
      if (isOp('-')) { p++; return -factor(); }
      if (isOp('+')) { p++; return factor(); }
      return power();
    }

    function power() {
      const base = postfix();
      if (isOp('^')) { p++; return Math.pow(base, factor()); }
      return base;
    }

    function postfix() {
      let v = primary();
      for (;;) {
        if (isOp('%')) { p++; v /= 100; }
        else if (isOp('²')) { p++; v *= v; }
        else return v;
      }
    }

    function primary() {
      const t = cur();
      if (t.t === 'num') { p++; return t.v; }
      if (t.t === '(') { p++; const v = expr(); closeParen(); return v; }
      if (t.t === 'fn') {
        p++;
        let arg;
        if (cur().t === '(') { p++; arg = expr(); closeParen(); }
        else arg = factor();
        return applyFn(t.v, arg, angle);
      }
      if (t.t === 'end') throw new CalcError(INCOMPLETE, 'incomplete');
      throw new CalcError(SYNTAX);
    }

    const result = expr();
    if (cur().t !== 'end') throw new CalcError(SYNTAX);
    return clean(result);
  }

  // ================================================================ text helpers

  const NUMFMT = new Intl.NumberFormat('en-US', { maximumSignificantDigits: 12, useGrouping: true });

  function format(v) {
    if (v === 0) return '0';
    const a = Math.abs(v);
    if (a >= 1e15 || a < 1e-9) {
      const parts = v.toExponential(8).split('e');
      return parts[0].replace(/\.?0+$/, '') + ' × 10^' + Number(parts[1]);
    }
    return NUMFMT.format(v);
  }

  // Text the parser reads back exactly: a plain number (1e+21 written as 1×10^21), with the sign shown as a real minus.
  function plainText(v) {
    const s = String(parseFloat(v.toPrecision(12)));
    const m = /^(-?[\d.]+)e([+-])(\d+)$/.exec(s);
    const t = m ? m[1] + '×10^' + (m[2] === '-' ? '(−' + m[3] + ')' : m[3]) : s;
    return t.replace(/^-/, '−');
  }
  function answerText(v) { return v < 0 ? '(' + plainText(v) + ')' : plainText(v); }

  function closers(expression) {
    let open = 0;
    for (const ch of expression) {
      if (ch === '(') open++;
      else if (ch === ')') open--;
    }
    return open > 0 ? ')'.repeat(open) : '';
  }

  // ± on the last number; on an operator or open paren it starts a negative term; otherwise negates the group.
  function toggleSign(text) {
    if (!text) return '−';
    if (/[(+−\-×÷*/^%]$/.test(text)) return text + '−';
    const m = /(\d*\.?\d+|\d+\.)$/.exec(text);
    if (!m) return '−(' + text + ')';
    const head = text.slice(0, m.index);
    if (/(^|[-−+×÷*/^(])[-−]$/.test(head)) return head.slice(0, -1) + m[0];
    return head + '−' + m[0];
  }

  // ================================================================ keys

  const BASIC_KEYS = [
    { act: 'ac', label: 'AC', cls: 'is-clear', aria: 'All clear' },
    { act: 'del', html: backspaceIcon(18), cls: 'is-clear', aria: 'Backspace' },
    { k: '%', cls: 'is-fn', aria: 'Percent' },
    { k: '÷', cls: 'is-op', aria: 'Divide' },
    { k: '7' }, { k: '8' }, { k: '9' },
    { k: '×', cls: 'is-op', aria: 'Multiply' },
    { k: '4' }, { k: '5' }, { k: '6' },
    { k: '−', cls: 'is-op', aria: 'Subtract' },
    { k: '1' }, { k: '2' }, { k: '3' },
    { k: '+', cls: 'is-op', aria: 'Add' },
    { act: 'neg', label: '±', cls: 'is-fn', aria: 'Change sign' },
    { k: '0' },
    { k: '.', aria: 'Decimal point' },
    { act: 'eq', label: '=', cls: 'is-eq', aria: 'Equals' },
  ];

  const SCI_KEYS = [
    { k: 'sin(', label: 'sin', cls: 'is-sci', aria: 'Sine' },
    { k: 'cos(', label: 'cos', cls: 'is-sci', aria: 'Cosine' },
    { k: 'tan(', label: 'tan', cls: 'is-sci', aria: 'Tangent' },
    { k: 'ln(', label: 'ln', cls: 'is-sci', aria: 'Natural log' },
    { k: 'log(', label: 'log', cls: 'is-sci', aria: 'Base-10 log' },
    { k: '√(', label: '√', cls: 'is-sci', aria: 'Square root' },
    { k: '²', label: 'x²', cls: 'is-sci', aria: 'Square' },
    { k: '^', label: 'x^y', cls: 'is-sci', aria: 'Power' },
    { k: '(', label: '(', cls: 'is-sci', aria: 'Open parenthesis' },
    { k: ')', label: ')', cls: 'is-sci', aria: 'Close parenthesis' },
    { k: 'π', label: 'π', cls: 'is-sci', aria: 'Pi' },
    { k: 'e', label: 'e', cls: 'is-sci', aria: 'Euler’s number' },
  ];

  function keyHtml(d) {
    const label = d.html || esc(d.label || d.k);
    const aria = d.aria || d.label || d.k;
    const attr = d.act ? ' data-act="' + d.act + '"' : ' data-k="' + esc(d.k) + '"';
    return '<button type="button" class="calc-key ' + (d.cls || '') + '"' + attr +
      ' aria-label="' + esc(aria) + '" title="' + esc(aria) + '">' + label + '</button>';
  }

  // ================================================================ state

  const isNum = (v) => typeof v === 'number' && Number.isFinite(v);

  function loadState() {
    const raw = Nova.local.get(KEY, null);
    const r = raw && typeof raw === 'object' ? raw : {};
    const history = Array.isArray(r.history)
      ? r.history.filter((h) => h && typeof h.expr === 'string' && typeof h.text === 'string' && isNum(h.value))
        .slice(0, HISTORY_MAX)
      : [];
    return {
      mode: r.mode === 'sci' ? 'sci' : 'basic',
      angle: r.angle === 'rad' ? 'rad' : 'deg',
      expr: typeof r.expr === 'string' ? r.expr.slice(0, EXPR_MAX) : '',
      committed: r.committed === true && isNum(r.ans),
      ans: isNum(r.ans) ? r.ans : 0,
      live: null,
      notice: '',
      history,
    };
  }

  function focusIfIdle(node) {
    const a = document.activeElement;
    if (!a || a === document.body) node.focus({ preventScroll: true });
  }

  // ================================================================ view

  function mount(el, ctx) {
    const st = loadState();
    el.innerHTML =
      '<div class="calc" tabindex="-1" data-mode="' + st.mode + '">' +
        '<div class="calc-wrap">' +
          '<section class="calc-main" aria-label="Calculator">' +
            '<div class="calc-top">' +
              '<div class="n-seg calc-mode" role="group" aria-label="Mode">' +
                '<button type="button" data-mode="basic" aria-pressed="false">Basic</button>' +
                '<button type="button" data-mode="sci" aria-pressed="false">Scientific</button>' +
              '</div>' +
              '<div class="n-seg calc-angle" role="group" aria-label="Angle units" hidden>' +
                '<button type="button" data-angle="deg" aria-pressed="false">DEG</button>' +
                '<button type="button" data-angle="rad" aria-pressed="false">RAD</button>' +
              '</div>' +
            '</div>' +
            '<div class="calc-screen">' +
              '<div class="calc-expr"></div>' +
              '<div class="calc-result" aria-live="polite"></div>' +
              '<div class="calc-hint" role="status"></div>' +
            '</div>' +
            '<div class="calc-pad"></div>' +
            '<p class="calc-tips n-hint">Type to calculate · <kbd class="n-kbd">Enter</kbd> for = · <kbd class="n-kbd">Esc</kbd> clears</p>' +
          '</section>' +
          '<aside class="calc-side">' +
            '<div class="n-card calc-history">' +
              '<div class="n-card__head"><span class="n-card__title">History</span>' +
                '<button type="button" class="n-btn n-btn--ghost n-btn--sm calc-hist__clear">Clear</button></div>' +
              '<ol class="calc-hist__list n-scroll"></ol>' +
            '</div>' +
          '</aside>' +
        '</div>' +
      '</div>';

    const $ = (sel) => el.querySelector(sel);
    const root = $('.calc');
    const exprEl = $('.calc-expr');
    const resultEl = $('.calc-result');
    const hintEl = $('.calc-hint');
    const padEl = $('.calc-pad');
    const modeSeg = $('.calc-mode');
    const angleSeg = $('.calc-angle');
    const listEl = $('.calc-hist__list');
    const clearHistBtn = $('.calc-hist__clear');
    const save = U.debounce(persist, 250);

    function persist() {
      try {
        Nova.local.set(KEY, {
          mode: st.mode, angle: st.angle, expr: st.expr,
          committed: st.committed, ans: st.ans, history: st.history,
        });
      } catch (_) { /* storage blocked: the calculator still works */ }
    }

    function setExpr(text) {
      st.expr = text.slice(0, EXPR_MAX);
      st.committed = false;
      st.notice = '';
    }

    function typeText(text) {
      if (st.committed) {
        if (text === ')') return;
        if (BINARY.indexOf(text) !== -1) setExpr(answerText(st.ans) + text);
        else setExpr(text);
      } else {
        if (st.expr.length >= EXPR_MAX) return;
        if (text === '.' && /\.\d*$/.test(st.expr)) return; // this number already has its decimal point
        setExpr(st.expr + text);
      }
      render();
    }

    function backspace() {
      const cut = /(?:sin|cos|tan|ln|log|√)\($|pi$/.exec(st.expr);
      setExpr(cut ? st.expr.slice(0, cut.index) : st.expr.slice(0, -1));
      render();
    }

    function clearAll() {
      st.expr = '';
      st.committed = false;
      st.live = null;
      st.notice = '';
      render();
    }

    function negate() {
      setExpr(toggleSign(st.committed ? plainText(st.ans) : st.expr));
      render();
    }

    function commit() {
      if (st.committed || !st.expr) return;
      const full = st.expr + closers(st.expr);
      try {
        const value = evaluate(full, st.angle);
        st.ans = value;
        st.live = value;
        st.committed = true;
        st.expr = full;
        st.notice = '';
        st.history = [{ expr: full, text: format(value), value }].concat(st.history).slice(0, HISTORY_MAX);
      } catch (err) {
        st.notice = err instanceof CalcError ? err.message : SYNTAX;
      }
      render();
    }

    function view() {
      if (st.committed) return { big: format(st.ans), hint: '', bad: false };
      if (!st.expr) return { big: '0', hint: '', bad: false };
      if (st.notice) return { big: '', hint: st.notice, bad: true };
      try {
        st.live = evaluate(st.expr + closers(st.expr), st.angle);
        return { big: format(st.live), hint: '', bad: false };
      } catch (err) {
        if (err instanceof CalcError && err.kind === 'math') return { big: '', hint: err.message, bad: true };
      }
      // Still typing (for example "2+"): show the value of what is complete so far.
      const head = st.expr.replace(/[+\-−×÷^%]+$/, '');
      if (head && head !== st.expr) {
        try { return { big: format(evaluate(head + closers(head), st.angle)), hint: '', bad: false }; }
        catch (_) { /* fall through */ }
      }
      return { big: st.live == null ? '' : format(st.live), hint: '', bad: false };
    }

    function renderHistory() {
      listEl.innerHTML = st.history.length
        ? st.history.map((h, i) =>
          '<li><button type="button" class="calc-hist__item" data-i="' + i + '" title="Use ' + esc(h.text) + ' as the current value">' +
            '<span class="calc-hist__expr">' + esc(h.expr) + '</span>' +
            '<span class="calc-hist__res">' + esc(h.text) + '</span></button></li>').join('')
        : '<li class="calc-hist__empty">Your calculations show up here.</li>';
      clearHistBtn.disabled = !st.history.length;
    }

    function renderPad() {
      const sci = st.mode === 'sci'
        ? '<div class="calc-keys calc-keys--sci" role="group" aria-label="Scientific keys">' + SCI_KEYS.map(keyHtml).join('') + '</div>'
        : '';
      padEl.innerHTML = sci + '<div class="calc-keys" role="group" aria-label="Keypad">' + BASIC_KEYS.map(keyHtml).join('') + '</div>';
    }

    function syncModes() {
      root.dataset.mode = st.mode;
      modeSeg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === st.mode)));
      angleSeg.hidden = st.mode !== 'sci';
      angleSeg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.angle === st.angle)));
    }

    function render() {
      const v = view();
      exprEl.textContent = st.committed ? st.expr + ' =' : st.expr;
      exprEl.scrollLeft = exprEl.scrollWidth;
      resultEl.textContent = v.big;
      resultEl.classList.toggle('is-long', v.big.length > 11);
      resultEl.classList.toggle('is-xlong', v.big.length > 16);
      hintEl.textContent = v.hint;
      hintEl.classList.toggle('is-error', v.bad);
      renderHistory();
      save();
    }

    // ---- input
    padEl.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b || !padEl.contains(b)) return;
      if (b.dataset.act === 'ac') clearAll();
      else if (b.dataset.act === 'del') backspace();
      else if (b.dataset.act === 'eq') commit();
      else if (b.dataset.act === 'neg') negate();
      else if (b.dataset.k) typeText(b.dataset.k);
    });

    modeSeg.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-mode]');
      if (!b || b.dataset.mode === st.mode) return;
      st.mode = b.dataset.mode === 'sci' ? 'sci' : 'basic';
      syncModes();
      renderPad();
      render();
    });

    angleSeg.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-angle]');
      if (!b) return;
      st.angle = b.dataset.angle === 'rad' ? 'rad' : 'deg';
      syncModes();
      render();
    });

    listEl.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-i]');
      const h = b && st.history[Number(b.dataset.i)];
      if (!h) return;
      st.expr = answerText(h.value);
      st.committed = false;
      st.live = h.value;
      st.notice = '';
      render();
    });

    clearHistBtn.addEventListener('click', () => {
      st.history = [];
      render();
    });

    // Keyboard: digits, operators, letters for function names, Enter/= evaluates, Backspace edits, Esc clears.
    root.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const key = e.key;
      // Enter on a focused key, toggle, history item or Clear presses that control (the browser's own click)
      if (key === 'Enter' && e.target !== root && e.target.closest && e.target.closest('button, a, input, select, textarea, summary')) return;
      if (key === 'Enter' || key === '=') { e.preventDefault(); commit(); return; }
      if (key === 'Backspace') { e.preventDefault(); backspace(); return; }
      if (key === 'Escape' || key === 'Delete') { e.preventDefault(); clearAll(); return; }
      if (key.length !== 1) return;
      const ch = KEY_MAP[key] || key;
      if (TYPABLE.test(ch)) { e.preventDefault(); typeText(ch); }
    });

    syncModes();
    renderPad();
    render();

    const onPageHide = () => save.flush(); // a reload or a closed window within 250 ms of the last key still keeps it
    window.addEventListener('pagehide', onPageHide);

    return {
      onShow() { focusIfIdle(root); },
      unmount() { window.removeEventListener('pagehide', onPageHide); save.flush(); },
    };
  }

  Nova.registerApp({
    id: 'calc',
    name: 'Calculator',
    icon: 'calculator',
    singleton: true,
    keywords: ['calc', 'calculator', 'math', 'sin', 'sqrt', 'scientific'],
    description: 'Basic and scientific calculator',
    mount,
  });
})();
</script>
<script>
/* ---- web/src/js/apps/draw.js ---- */
/* Nova Draw (SPEC §4.1) — a whiteboard: pen, highlighter, eraser, 8 inks, 3 sizes, undo/redo, clear (confirm).
 * Strokes are vector data (CSS px, anchored top-left) and are redrawn on resize.
 * Nova.local('draw') = { v: 1, strokes: [{ tool, color, width, pts: [x, y, …] }], savedAt } — capped and thinned.
 * Nova.local('draw:prefs') = { tool, ink, size }.
 * Two canvases: the committed layer is transparent, so the board's var(--n-page) shows through and the eraser
 * really erases; the live layer holds the stroke in progress so highlighter ink never double-blends. */
(function () {
  'use strict';

  const Nova = window.Nova;
  if (!Nova) return;
  const U = Nova.util;
  const icon = (name, size) => U.icon(name, size || 16);

  const KEY = 'draw';
  const PREFS_KEY = 'draw:prefs';
  const MAX_STROKES = 2000;
  const SAVE_LIMIT = 1500000; // characters; the oldest strokes go first when a save would exceed it
  const UNDO_MAX = 300;
  const HL_ALPHA = 0.36;
  const TOOLS = ['pen', 'hl', 'erase'];
  const TOOL_LABELS = { pen: 'Pen', hl: 'Highlighter', erase: 'Eraser' };
  const TOOL_ICONS = { pen: 'pencil', hl: 'highlighter', erase: 'eraser' };
  const WIDTHS = { pen: [2, 4.5, 9], hl: [12, 20, 32], erase: [10, 20, 36] };
  const SIZE_NAMES = ['Thin', 'Medium', 'Thick'];
  const SIZE_DOTS = [3, 6, 10];
  // Black and white, plus six inks that read on both light and dark pages.
  const INKS = [
    { name: 'Black', hex: '#16161d' },
    { name: 'White', hex: '#ffffff' },
    { name: 'Red', hex: '#e5484d' },
    { name: 'Orange', hex: '#f76808' },
    { name: 'Green', hex: '#30a46c' },
    { name: 'Blue', hex: '#3b82f6' },
    { name: 'Violet', hex: '#8e5cf7' },
    { name: 'Pink', hex: '#e54d9e' },
  ];

  const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
  const isHex = (s) => typeof s === 'string' && /^#[0-9a-f]{6}$/i.test(s);

  const toolBtn = (t) =>
    '<button type="button" class="n-btn n-btn--ghost n-btn--icon draw-tool" data-tool="' + t + '" aria-pressed="false" ' +
    'aria-label="' + TOOL_LABELS[t] + '" title="' + TOOL_LABELS[t] + '">' + icon(TOOL_ICONS[t], 17) + '</button>';
  const inkBtn = (ink, i) =>
    '<button type="button" class="draw-ink" data-ink="' + i + '" style="--ink:' + ink.hex + '" aria-pressed="false" ' +
    'aria-label="' + ink.name + ' ink" title="' + ink.name + '"></button>';
  const sizeBtn = (name, i) =>
    '<button type="button" class="n-btn n-btn--ghost n-btn--icon draw-size" data-size="' + i + '" aria-pressed="false" ' +
    'aria-label="' + name + ' line" title="' + name + ' line"><i style="--d:' + SIZE_DOTS[i] + 'px"></i></button>';

  // ================================================================ storage shapes

  function validStroke(s) {
    if (!isObj(s) || TOOLS.indexOf(s.tool) === -1 || !isHex(s.color)) return false;
    if (!(typeof s.width === 'number' && s.width > 0 && s.width <= 80)) return false;
    return Array.isArray(s.pts) && s.pts.length >= 2 && s.pts.length % 2 === 0 &&
      s.pts.every((n) => typeof n === 'number' && Number.isFinite(n));
  }

  function loadStrokes() {
    const raw = Nova.local.get(KEY, null);
    const list = isObj(raw) && Array.isArray(raw.strokes) ? raw.strokes : [];
    return list.filter(validStroke).slice(-MAX_STROKES)
      .map((s) => ({ tool: s.tool, color: s.color, width: s.width, pts: s.pts.slice() }));
  }

  function loadPrefs() {
    const raw = Nova.local.get(PREFS_KEY, null);
    const r = isObj(raw) ? raw : {};
    const dark = document.documentElement.getAttribute('data-scheme') === 'dark';
    return {
      tool: TOOLS.indexOf(r.tool) !== -1 ? r.tool : 'pen',
      ink: Number.isInteger(r.ink) && r.ink >= 0 && r.ink < INKS.length ? r.ink : (dark ? 1 : 0),
      size: Number.isInteger(r.size) && r.size >= 0 && r.size < SIZE_NAMES.length ? r.size : 1,
    };
  }

  // Whole pixels, near-duplicate points dropped, very long strokes halved. The last point is always kept.
  function compact(s) {
    const src = s.pts;
    const out = [];
    let lx = null;
    let ly = null;
    for (let i = 0; i < src.length; i += 2) {
      const x = Math.round(src[i]);
      const y = Math.round(src[i + 1]);
      const last = i >= src.length - 2;
      if (lx === null || last || Math.abs(x - lx) + Math.abs(y - ly) >= 2) {
        out.push(x, y);
        lx = x;
        ly = y;
      }
    }
    let pts = out;
    if (pts.length > 400) {
      const half = [];
      for (let i = 0; i < pts.length - 2; i += 4) half.push(pts[i], pts[i + 1]);
      half.push(pts[pts.length - 2], pts[pts.length - 1]);
      pts = half;
    }
    return { tool: s.tool, color: s.color, width: s.width, pts };
  }

  function persistStrokes(strokes) {
    let list = strokes.slice(-MAX_STROKES).map(compact);
    while (list.length > 1 && JSON.stringify(list).length > SAVE_LIMIT) {
      list = list.slice(Math.ceil(list.length / 10));
    }
    try {
      Nova.local.set(KEY, { v: 1, strokes: list, savedAt: Date.now() });
    } catch (_) { /* storage full or blocked: keep drawing in memory */ }
  }

  // ================================================================ rendering

  // A smooth curve through the points: each point is a control point, the midpoints are the joins.
  function tracePath(ctx, pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    let i = 2;
    for (; i + 3 < pts.length; i += 2) {
      const mx = (pts[i] + pts[i + 2]) / 2;
      const my = (pts[i + 1] + pts[i + 3]) / 2;
      ctx.quadraticCurveTo(pts[i], pts[i + 1], mx, my);
    }
    ctx.lineTo(pts[pts.length - 2], pts[pts.length - 1]);
  }

  // live = the stroke in progress on the live layer; previewRgb tints an eraser that is still moving.
  function paint(ctx, s, live, previewRgb) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = s.width;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (s.tool === 'erase') {
      if (live) {
        ctx.strokeStyle = previewRgb || 'gray';
        ctx.globalAlpha = 0.55;
      } else {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = '#000000';
      }
    } else {
      ctx.strokeStyle = s.color;
      if (s.tool === 'hl') ctx.globalAlpha = HL_ALPHA;
    }
    ctx.fillStyle = ctx.strokeStyle;
    const p = s.pts;
    if (p.length <= 2) {
      ctx.beginPath();
      ctx.arc(p[0], p[1], s.width / 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      tracePath(ctx, p);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ================================================================ mount

  function mount(el, ctx) {
    const prefs = loadPrefs();
    let strokes = loadStrokes();
    let undoStack = [];
    let redoStack = [];
    let current = null;
    let activePointer = null;
    let cssW = 0;
    let cssH = 0;
    let dpr = 1;
    let fitKey = '';
    let liveRaf = 0;
    let fitRaf = 0;

    el.innerHTML =
      '<div class="draw" tabindex="-1">' +
        '<div class="draw-board">' +
          '<canvas class="draw-main" aria-hidden="true"></canvas>' +
          '<canvas class="draw-live" aria-hidden="true"></canvas>' +
          '<div class="draw-hint" aria-hidden="true"><span class="draw-hint__icon">' + icon('pencil', 22) +
            '</span><span>Draw with a mouse, finger or stylus</span></div>' +
        '</div>' +
        '<div class="draw-toolbar" role="toolbar" aria-label="Whiteboard tools">' +
          '<div class="draw-group">' + TOOLS.map(toolBtn).join('') + '</div>' +
          '<span class="draw-sep" aria-hidden="true"></span>' +
          '<div class="draw-group draw-inks" role="group" aria-label="Ink color">' + INKS.map(inkBtn).join('') + '</div>' +
          '<span class="draw-sep" aria-hidden="true"></span>' +
          '<div class="draw-group" role="group" aria-label="Line size">' +
            SIZE_NAMES.map(sizeBtn).join('') + '</div>' +
          '<span class="draw-sep" aria-hidden="true"></span>' +
          '<div class="draw-group">' +
            '<button type="button" class="n-btn n-btn--ghost n-btn--icon" data-act="undo" aria-label="Undo" title="Undo (Ctrl+Z)">' + icon('undo', 17) + '</button>' +
            '<button type="button" class="n-btn n-btn--ghost n-btn--icon" data-act="redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)">' + icon('redo', 17) + '</button>' +
            '<button type="button" class="n-btn n-btn--ghost n-btn--icon draw-clear" data-act="clear" aria-label="Clear the whiteboard" title="Clear the whiteboard">' + icon('trash', 17) + '</button>' +
          '</div>' +
        '</div>' +
        '<span class="draw-probe" aria-hidden="true"></span>' +
      '</div>';

    const $ = (sel) => el.querySelector(sel);
    const root = $('.draw');
    const board = $('.draw-board');
    const mainC = $('.draw-main');
    const liveC = $('.draw-live');
    const hint = $('.draw-hint');
    const probe = $('.draw-probe');
    const toolbar = $('.draw-toolbar');
    const undoBtn = $('[data-act="undo"]');
    const redoBtn = $('[data-act="redo"]');
    const clearBtn = $('[data-act="clear"]');
    const mctx = mainC.getContext('2d');
    const lctx = liveC.getContext('2d');
    const queueSave = U.debounce(() => persistStrokes(strokes), 350);

    function previewColor() {
      probe.style.color = 'var(--n-text-faint)';
      return getComputedStyle(probe).color;
    }

    function syncUI() {
      el.querySelectorAll('.draw-tool').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tool === prefs.tool)));
      el.querySelectorAll('.draw-ink').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.ink) === prefs.ink)));
      el.querySelectorAll('.draw-size').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.size) === prefs.size)));
      undoBtn.disabled = undoStack.length === 0;
      redoBtn.disabled = redoStack.length === 0;
      clearBtn.disabled = strokes.length === 0;
      hint.hidden = strokes.length > 0;
    }

    function savePrefs() {
      try { Nova.local.set(PREFS_KEY, { tool: prefs.tool, ink: prefs.ink, size: prefs.size }); } catch (_) { /* ignore */ }
    }

    function redrawAll() {
      mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      mctx.clearRect(0, 0, cssW, cssH);
      strokes.forEach((s) => paint(mctx, s, false));
      syncUI();
    }

    function fit() {
      fitRaf = 0;
      const w = Math.floor(board.clientWidth);
      const h = Math.floor(board.clientHeight);
      if (w < 2 || h < 2) return; // hidden tab: fit again when it shows
      dpr = Math.min(3, window.devicePixelRatio || 1);
      const key = w + 'x' + h + '@' + dpr;
      if (key === fitKey) return;
      fitKey = key;
      cssW = w;
      cssH = h;
      mainC.width = Math.round(w * dpr);
      mainC.height = Math.round(h * dpr);
      liveC.width = Math.round(w * dpr);
      liveC.height = Math.round(h * dpr);
      lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redrawAll();
    }

    function scheduleFit() {
      if (!fitRaf) fitRaf = requestAnimationFrame(fit);
    }

    function drawLive() {
      liveRaf = 0;
      lctx.clearRect(0, 0, cssW, cssH);
      if (!current) return;
      const rgb = current.tool === 'erase' ? previewColor() : null;
      paint(lctx, current, true, rgb);
    }

    function scheduleLive() {
      if (!liveRaf) liveRaf = requestAnimationFrame(drawLive);
    }

    function pointAt(e) {
      const r = liveC.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    }

    function addPoint(x, y) {
      const p = current.pts;
      const n = p.length;
      if (Math.hypot(x - p[n - 2], y - p[n - 1]) >= 0.6) p.push(x, y);
    }

    function pushUndo(op) {
      undoStack.push(op);
      if (undoStack.length > UNDO_MAX) undoStack.shift();
    }

    function commit(s) {
      strokes.push(s);
      pushUndo({ type: 'add', stroke: s });
      redoStack = [];
      paint(mctx, s, false);
      syncUI();
      queueSave();
    }

    function undo() {
      const op = undoStack.pop();
      if (!op) return;
      if (op.type === 'add') {
        const i = strokes.lastIndexOf(op.stroke);
        if (i !== -1) strokes.splice(i, 1);
      } else {
        strokes = op.prev.slice();
      }
      redoStack.push(op);
      redrawAll();
      queueSave();
    }

    function redo() {
      const op = redoStack.pop();
      if (!op) return;
      if (op.type === 'add') strokes.push(op.stroke);
      else strokes = [];
      undoStack.push(op);
      redrawAll();
      queueSave();
    }

    async function clearAll() {
      if (!strokes.length) return;
      const ok = await Nova.ui.confirm({
        title: 'Clear the whiteboard?',
        message: 'Everything on the board goes away. Ctrl+Z brings it back.',
        confirmLabel: 'Clear',
        danger: true,
      });
      if (!ok) return;
      const prev = strokes.slice();
      strokes = [];
      pushUndo({ type: 'clear', prev });
      redoStack = [];
      redrawAll();
      queueSave();
      root.focus({ preventScroll: true }); // the Clear button is disabled now; keep Ctrl+Z (promised above) working
    }

    function setTool(tool) {
      prefs.tool = tool;
      savePrefs();
      syncUI();
    }

    function setInk(i) {
      prefs.ink = i;
      if (prefs.tool === 'erase') prefs.tool = 'pen';
      savePrefs();
      syncUI();
    }

    function setSize(i) {
      prefs.size = i;
      savePrefs();
      syncUI();
    }

    // ---- pointer input (mouse, touch and stylus all arrive as pointer events)
    liveC.addEventListener('pointerdown', (e) => {
      if (current) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      root.focus({ preventScroll: true });
      try { liveC.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      activePointer = e.pointerId;
      const ink = INKS[prefs.ink];
      const [x, y] = pointAt(e);
      current = { tool: prefs.tool, color: ink.hex, width: WIDTHS[prefs.tool][prefs.size], pts: [x, y] };
      scheduleLive();
    });

    liveC.addEventListener('pointermove', (e) => {
      if (!current || e.pointerId !== activePointer) return;
      const coalesced = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [];
      (coalesced.length ? coalesced : [e]).forEach((ev) => {
        const [x, y] = pointAt(ev);
        addPoint(x, y);
      });
      scheduleLive();
    });

    function endStroke(e) {
      if (!current || e.pointerId !== activePointer) return;
      // A cancelled pointer has no trustworthy position, so only a real pointerup adds its last point.
      if (e.type === 'pointerup') {
        const [x, y] = pointAt(e);
        addPoint(x, y);
      }
      const s = current;
      current = null;
      activePointer = null;
      try { liveC.releasePointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      commit(s);
      drawLive();
    }
    liveC.addEventListener('pointerup', endStroke);
    liveC.addEventListener('pointercancel', endStroke);

    // ---- toolbar and keyboard
    toolbar.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.tool) setTool(b.dataset.tool);
      else if (b.dataset.ink != null) setInk(Number(b.dataset.ink));
      else if (b.dataset.size != null) setSize(Number(b.dataset.size));
      else if (b.dataset.act === 'undo') undo();
      else if (b.dataset.act === 'redo') redo();
      else if (b.dataset.act === 'clear') clearAll();
    });

    root.addEventListener('keydown', (e) => {
      if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
      if (e.code === 'KeyZ') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
      else if (e.code === 'KeyY') { e.preventDefault(); redo(); }
    });

    const ro = typeof ResizeObserver === 'function' ? new ResizeObserver(scheduleFit) : null;
    if (ro) ro.observe(board);

    syncUI();
    scheduleFit();

    const onPageHide = () => queueSave.flush(); // a reload or a closed window within 350 ms of the last stroke still keeps it
    window.addEventListener('pagehide', onPageHide);

    return {
      onShow() {
        fit();
        const a = document.activeElement;
        if (!a || a === document.body) root.focus({ preventScroll: true });
      },
      unmount() {
        window.removeEventListener('pagehide', onPageHide);
        if (ro) ro.disconnect();
        cancelAnimationFrame(fitRaf);
        cancelAnimationFrame(liveRaf);
        queueSave.flush();
      },
    };
  }

  Nova.registerApp({
    id: 'draw',
    name: 'Draw',
    icon: 'brush',
    singleton: true,
    keywords: ['draw', 'whiteboard', 'sketch', 'pen', 'highlighter', 'board'],
    description: 'Whiteboard with pen, highlighter and eraser',
    mount,
  });
})();
</script>
<script>
/* ---- web/src/js/apps/web.js ---- */
/* Nova Web (SPEC §4.1) — a hidden app that shows one web page inside an iframe.
 * params.url is the page the user asked for; the frame loads frameUrl(url) (Nova.sites.toEmbedUrl, plus two small tweaks).
 * Every http(s) URL gets a frame, allowlisted or not: a site that allows framing simply loads, one that refuses
 * shows the browser's own "refused to connect" page inside the frame. There is no "can't open" card. Where the host
 * blocks every frame (the claude.ai artifact) the frame just stays empty and a muted line in the bar says so.
 * The only outbound link is the bar's real "Open in new tab" anchor. */
(function () {
  'use strict';

  const Nova = window.Nova;
  if (!Nova) return;
  const U = Nova.util;
  const esc = U.esc;
  const icon = (name, size) => U.icon(name, size || 16);

  const SHIMMER_MAX_MS = 10000; // a page that never fires 'load' still gets revealed
  const SANDBOX = 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation allow-downloads';
  const ALLOW = 'fullscreen; autoplay; encrypted-media; picture-in-picture; clipboard-write';
  const REFERRER = 'strict-origin-when-cross-origin';
  const INFO = "If a page says it refused to connect, that site doesn't allow being shown inside Nova — use Open in new tab.";

  const isWebUrl = (url) => /^https?:\/\/\S+$/i.test(url);
  const LOCAL_HTTP = /^http:\/\/(localhost|127\.0\.0\.1|\[::1\])(:|\/|$)/i;

  // The page to show: a full http(s) URL as given, a bare "example.com" completed, anything else = nothing.
  function paramUrl(p) {
    const raw = p && typeof p.url === 'string' ? p.url.trim() : '';
    if (isWebUrl(raw)) return raw;
    return raw && U.isUrlish(raw) ? U.normalizeUrl(raw) : '';
  }

  // The address the frame loads. Two cases need a tweak: a local file:// copy of Nova sends no referrer, which YouTube's
  // player refuses (Error 153), so the plain page goes in the frame instead of the embed; and an https page (the public
  // build) can't frame http:// addresses (mixed content), so those are tried over https. "Open in new tab" keeps the
  // address as the user gave it.
  function frameUrl(raw) {
    if (location.protocol === 'file:' && Nova.sites.needsReferrer(raw)) {
      const u = Nova.sites.parse(raw);
      return u ? u.href : raw;
    }
    const src = Nova.sites.toEmbedUrl(raw);
    if (location.protocol === 'https:' && /^http:\/\//i.test(src) && !LOCAL_HTTP.test(src)) return 'https:' + src.slice(5);
    return src;
  }

  // Name, host and tile for the page: a search's "query – Engine", the catalog entry, else a tidy host.
  function identify(url) {
    const name = Nova.sites.nameFor(url);
    const tile = U.favicon(url, name);
    return { name, host: U.hostOf(url), letter: tile.letter, color: tile.color };
  }

  function mount(el, ctx) {
    let url = paramUrl(ctx.params);
    let frame = null;
    let loadingEl = null;
    let loadTimer = 0;
    let hintOpen = false;

    el.innerHTML =
      '<div class="web">' +
        '<div class="web-head">' +
          '<header class="web-bar">' +
            '<span class="n-favicon web-mark" aria-hidden="true"></span>' +
            '<div class="web-id"><span class="web-name"></span><span class="web-host"></span></div>' +
            '<button type="button" class="n-btn n-btn--ghost n-btn--icon n-btn--sm web-info" aria-label="' + esc(INFO) + '" ' +
              'aria-expanded="false" data-tip="Page won’t load?" data-tip-sub="' + esc(INFO) + '" data-tip-side="bottom">' + icon('info', 15) + '</button>' +
            '<button type="button" class="n-btn n-btn--ghost n-btn--icon n-btn--sm web-reload" aria-label="Reload page" title="Reload page">' +
              icon('rotate-cw', 15) + '</button>' +
            '<a class="n-btn n-btn--ghost n-btn--sm web-open" target="_blank" rel="noopener noreferrer" ' +
              'aria-label="Open in new tab" title="Open in a new browser tab">' + icon('external-link', 14) +
              '<span>Open in new tab</span></a>' +
          '</header>' +
          '<p class="web-note" hidden></p>' +
          '<div class="web-hint" role="note" hidden>' + esc(INFO) + '</div>' +
        '</div>' +
        '<div class="web-stage"></div>' +
      '</div>';

    const $ = (sel) => el.querySelector(sel);
    const markEl = $('.web-mark');
    const nameEl = $('.web-name');
    const hostEl = $('.web-host');
    const infoBtn = $('.web-info');
    const reloadBtn = $('.web-reload');
    const openLink = $('.web-open');
    const noteEl = $('.web-note');
    const hintEl = $('.web-hint');
    const stage = $('.web-stage');

    // ---- loading shimmer: covers the frame until the page fires 'load' (a refused page fires it too) or SHIMMER_MAX_MS passes
    function showLoading(on) {
      clearTimeout(loadTimer);
      if (!loadingEl) return;
      loadingEl.hidden = !on;
      stage.setAttribute('aria-busy', on ? 'true' : 'false');
      if (on) loadTimer = setTimeout(() => showLoading(false), SHIMMER_MAX_MS);
    }

    function startLoading() {
      if (!frame) return;
      showLoading(true);
      // A same-origin page reloads where it is. The browser forbids telling a cross-origin frame to reload, so
      // those start again from the address this tab opened.
      try { frame.contentWindow.location.reload(); return; } catch (_) { /* cross-origin */ }
      frame.setAttribute('src', frameUrl(url));
    }

    function mountFrame(info) {
      stage.textContent = '';
      const f = document.createElement('iframe');
      f.className = 'web-frame';
      f.title = info.name;
      f.setAttribute('sandbox', SANDBOX);
      f.setAttribute('allow', ALLOW);
      f.setAttribute('referrerpolicy', REFERRER);
      // The source goes on before the frame joins the page, so the only 'load' this listener ever hears is the real page's.
      f.setAttribute('src', frameUrl(url));
      f.addEventListener('load', () => { if (f === frame) showLoading(false); });
      frame = f;
      stage.appendChild(f);
      stage.insertAdjacentHTML('beforeend',
        '<div class="web-loading" aria-hidden="true">' +
          '<div class="web-loading__sheen"></div>' +
          '<div class="web-loading__label"></div>' +
        '</div>');
      loadingEl = stage.querySelector('.web-loading');
      loadingEl.querySelector('.web-loading__label').textContent = 'Loading ' + (info.host || info.name) + '…';
      showLoading(true);
    }

    function emptyCard() {
      return '<div class="n-empty n-empty--fill">' +
        '<div class="n-empty__icon">' + icon('globe', 22) + '</div>' +
        '<div class="n-empty__title">Nothing to show here</div>' +
        '<div class="n-empty__hint">This tab doesn’t have a site yet. Pick one from Home or the omnibox.</div></div>';
    }

    function setHint(on) {
      hintOpen = on;
      hintEl.hidden = !on;
      infoBtn.setAttribute('aria-expanded', on ? 'true' : 'false');
    }

    // One muted line when this copy of Nova can't frame anything (the claude.ai artifact, or a CSP that blocked a frame).
    function syncNote() {
      const fromFile = !!url && location.protocol === 'file:' && Nova.sites.needsReferrer(url);
      const none = !!url && (!Nova.env.canEmbed || fromFile);
      noteEl.hidden = !none;
      noteEl.textContent = Nova.env.isArtifact
        ? "Nova inside claude.ai can't show websites — use Open in new tab."
        : fromFile && Nova.env.canEmbed
          ? "Videos won't play in a Nova opened from a file — use Open in new tab."
          : "This copy of Nova can't show websites — use Open in new tab.";
    }

    function render() {
      const info = url ? identify(url) : null;
      ctx.setTitle(info ? info.name : 'Web');
      markEl.hidden = !info;
      if (info) {
        markEl.style.setProperty('--c', info.color);
        markEl.textContent = info.letter;
      }
      nameEl.textContent = info ? info.name : 'Nothing to show';
      hostEl.textContent = info ? info.host : '';
      reloadBtn.hidden = !info;
      infoBtn.hidden = !info;
      openLink.hidden = !info;
      if (info) openLink.setAttribute('href', Nova.sites.realTabUrl(url));
      setHint(false);
      syncNote();

      frame = null;
      loadingEl = null;
      clearTimeout(loadTimer);
      if (info) mountFrame(info);
      else stage.innerHTML = emptyCard();
    }

    reloadBtn.addEventListener('click', () => startLoading());
    openLink.addEventListener('click', () => Nova.trackExternal(Nova.sites.realTabUrl(url), nameEl.textContent));
    infoBtn.addEventListener('click', () => setHint(!hintOpen));
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && hintOpen) { e.stopPropagation(); setHint(false); infoBtn.focus(); }
    });
    // A tap anywhere else closes the note (touch screens have no hover tooltip).
    const onDocDown = (e) => { if (hintOpen && !e.target.closest('.web-info, .web-hint')) setHint(false); };
    document.addEventListener('pointerdown', onDocDown, true);

    // The note follows the host's frame policy; the frame itself is never re-created for it.
    const offEnv = Nova.on('env', syncNote);

    render();

    return {
      onHide() { setHint(false); },
      onParams(p) {
        const next = paramUrl(p);
        if (next !== url) {
          url = next;
          render();
        }
      },
      unmount() {
        offEnv();
        clearTimeout(loadTimer);
        document.removeEventListener('pointerdown', onDocDown, true);
      },
    };
  }

  Nova.registerApp({
    id: 'web',
    name: 'Web',
    icon: 'globe',
    singleton: false,
    hidden: true,
    keywords: ['web', 'site', 'page'],
    description: 'A page shown inside Nova',
    mount,
  });
})();
</script>
<script>
/* ---- web/src/js/apps/ask.js ---- */
/* Nova Ask Claude — a study-helper chat on the claude.ai `sample` capability.
 *  - Availability: window.claude.use('sample') resolves the sample function, or null when this copy of Nova
 *    can't reach Claude → a friendly card with a real "Open Claude" link replaces the chat. The chat UI shows
 *    at once (disabled, "Connecting to Claude…") while use() is pending (it can take ~10 s to settle on null).
 *  - Claude is only ever called from a user action (Send, Try again, Continue). Every call uses cache:false,
 *    a fresh AbortController, and is never retried by code.
 *  - The page owns the conversation: each call sends [instructions, ...last 20 turns] ending on a user turn.
 *  - Answers go through a small safe Markdown renderer: the text is HTML-escaped first, so raw model HTML is
 *    never inserted. Links become real <a target=_blank rel="noopener noreferrer"> (http/https only).
 *  - Chats (newest 15) live in Nova.local('ask') = { v, activeId, chats:[{ id, title, createdAt, updatedAt,
 *    turns:[{ role:'user'|'assistant', content, flag?:'stopped'|'interrupted'|'truncated' }] }] } — device-only.
 * Tab params: { id } = the open chat (saved in the tab session).
 *   Handoff from the highlight bubble (selection.js) — { prompt, context?, at?, turns?, send? }: a new chat is started
 *   once per `at`. `turns` (user/assistant pairs, from the answer card) seed that chat so the conversation carries on;
 *   otherwise `prompt` fills the composer (or is sent at once when `send` is true and Claude is ready). `context` is the
 *   highlighted text: it titles the chat and is appended to the prompt when the prompt doesn't already contain it.
 *   The handoff params are dropped from the tab session after they are used, so a reload never repeats them.
 * Also exports Nova.ask = { renderMarkdown, describeError, resolveSample, sampleNow } for the highlight answer card. */
(function () {
  'use strict';

  const Nova = window.Nova;
  if (!Nova) return;
  const U = Nova.util;
  const esc = U.esc;
  const icon = (name, size) => U.icon(name, size || 16);

  const STORE_KEY = 'ask';
  const CLAUDE_URL = 'https://claude.ai/new';
  const NOVA_URL = 'https://claude.ai/artifact/DjcHnCQD6Tj4qerexgvJpo'; // Jack's private claude.ai copy of Nova
  const MAX_Q_CHARS = 1500;        // longest prompt carried in a claude.ai/new?q= link
  const MAX_HANDOFF_TURNS = 12;
  const MAX_CHATS = 15;
  const MAX_SENT_TURNS = 20;
  const MAX_KEPT_TURNS = 60;
  const MAX_KEPT_CHARS = 40000;
  const MAX_SENT_CHARS = 70000;
  const MAX_INPUT_CHARS = 20000;
  const INPUT_MAX_PX = 168;
  const FLAGS = ['stopped', 'interrupted', 'truncated'];

  const STARTERS = [
    { label: 'Explain this like I\'m 15', text: 'Explain this like I\'m 15: ' },
    { label: 'Quiz me on…', text: 'Quiz me on ' },
    { label: 'Help me outline an essay about…', text: 'Help me outline an essay about ' },
    { label: 'Check my math step by step', text: 'Check my math step by step:\n' },
  ];

  const SEND_ICON = '<svg class="n-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>';
  const STOP_ICON = '<svg class="n-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';

  // ------------------------------------------------------------------ the sample capability

  let sampleFn;          // undefined = not asked yet · null = unavailable · function = ready
  let samplePromise = null;

  function hasBridge() { return !!(window.claude && typeof window.claude.use === 'function'); }

  function resolveSample() {
    if (samplePromise) return samplePromise;
    samplePromise = new Promise((resolve) => {
      if (!hasBridge()) { resolve(null); return; }
      let p;
      try { p = Promise.resolve(window.claude.use('sample')); } catch (_) { resolve(null); return; }
      p.then((fn) => resolve(typeof fn === 'function' ? fn : null), () => resolve(null));
    }).then((fn) => { sampleFn = fn; return fn; });
    return samplePromise;
  }

  // ------------------------------------------------------------------ prompt + data helpers

  function instructions() {
    const settings = Nova.settings && Nova.settings.get ? Nova.settings.get() : null;
    const name = String((settings && settings.name) || '').trim().slice(0, 40);
    return [
      'You are Claude, chatting with a high school student inside their personal browser home page. Be a friendly, encouraging study helper.',
      '- Explain things clearly in plain language, with a small example when it helps.',
      '- For math and science, show the steps one at a time and say why each step works.',
      '- Encourage their own thinking: for homework, give hints, ask a guiding question or check their attempt instead of just handing over a finished answer or a whole essay.',
      '- Keep replies fairly short unless asked for more. Light Markdown is fine (short paragraphs, bullet lists, **bold** key terms, fenced code blocks for code).',
      '- Write math in plain text like 3x^2 + 2x - 5 = 0 or (a + b) / 2, not LaTeX.',
      '- If you are not sure about something, say so.',
      (name ? 'The student\'s name is ' + name + '. ' : '') + 'Reply to their messages below.',
    ].join('\n');
  }

  function titleFrom(text) {
    const t = String(text || '').replace(/\s+/g, ' ').trim();
    if (!t) return 'New chat';
    return t.length > 48 ? t.slice(0, 47).trimEnd() + '…' : t;
  }

  function normalizeTurn(t) {
    if (!t || typeof t !== 'object') return null;
    const role = t.role === 'assistant' ? 'assistant' : (t.role === 'user' ? 'user' : null);
    const content = typeof t.content === 'string' ? t.content : '';
    if (!role || !content.trim()) return null;
    const out = { role, content };
    if (role === 'assistant' && FLAGS.indexOf(t.flag) !== -1) out.flag = t.flag;
    return out;
  }

  function normalizeChat(c) {
    if (!c || typeof c !== 'object' || !Array.isArray(c.turns)) return null;
    const turns = c.turns.map(normalizeTurn).filter(Boolean);
    if (!turns.length) return null;
    const now = Date.now();
    const firstUser = turns.find((t) => t.role === 'user');
    return {
      id: String(c.id || U.uid('chat')),
      title: typeof c.title === 'string' && c.title.trim() ? c.title.slice(0, 80) : titleFrom(firstUser && firstUser.content),
      createdAt: Number(c.createdAt) || Number(c.updatedAt) || now,
      updatedAt: Number(c.updatedAt) || Number(c.createdAt) || now,
      turns,
    };
  }

  function loadStore() {
    const raw = Nova.local.get(STORE_KEY, null);
    const seen = {};
    const chats = (raw && Array.isArray(raw.chats) ? raw.chats : [])
      .map(normalizeChat)
      .filter((c) => c && !seen[c.id] && (seen[c.id] = true))
      .sort((a, b) => b.updatedAt - a.updatedAt)
      .slice(0, MAX_CHATS);
    return { chats, activeId: raw && typeof raw.activeId === 'string' ? raw.activeId : null };
  }

  function charCount(turns) { return turns.reduce((n, t) => n + t.content.length, 0); }

  // Bound what we keep on the device: the newest turns that fit.
  function trimChat(chat) {
    while (chat.turns.length > 2 && (chat.turns.length > MAX_KEPT_TURNS || charCount(chat.turns) > MAX_KEPT_CHARS)) chat.turns.shift();
  }

  // The `sample` input: standing instructions as a leading user turn, then the recent turns, ending on the user.
  function buildInput(turns) {
    let tail = turns.filter((t) => t.content.trim()).slice(-MAX_SENT_TURNS);
    while (tail.length > 1 && charCount(tail) > MAX_SENT_CHARS) tail = tail.slice(1);
    return [{ role: 'user', content: instructions() }].concat(tail.map((t) => ({ role: t.role, content: t.content })));
  }

  /** What to tell the viewer for a rejected sample() call. Branch on the code, never on the message. */
  function describeError(code) {
    switch (code) {
      case 'cancelled':
        return { quiet: true };
      case 'not_granted':
        return { fatal: true, text: 'Claude wasn\'t allowed for this page — you can allow it from the artifact\'s permissions' };
      case 'sampling_disabled':
        return { fatal: true, text: 'Claude isn\'t turned on for this account.' };
      case 'not_declared':
      case 'capability_disabled':
      case 'capability_removed':
        return { fatal: true, text: 'Claude isn\'t available in this view of the page.' };
      case 'rate_limited':
        return { kind: 'warn', retry: true, text: 'Claude needs a short break — try again in a bit' };
      case 'session_expired':
        return { kind: 'warn', text: 'Your claude.ai sign-in ran out. Reload this page and sign in again.' };
      case 'refused':
        return { kind: 'info', takeBack: true, text: 'Claude can\'t help with that one. Try asking it a different way.' };
      case 'empty_completion':
        return { kind: 'info', takeBack: true, text: 'Claude didn\'t write anything back. Try rephrasing your question.' };
      case 'prompt_too_large':
        return { kind: 'warn', takeBack: true, text: 'That\'s too much for Claude to read at once. Try a shorter message, or start a new chat.' };
      default:
        return { kind: 'error', retry: true, text: 'Something went wrong reaching Claude.' };
    }
  }

  // ------------------------------------------------------------------ handoff from the highlight bubble

  /** A claude.ai/new link that carries a prompt (explicit click only — it opens a real tab). */
  function claudeLink(prompt) {
    const q = String(prompt || '').trim().slice(0, MAX_Q_CHARS);
    return q ? CLAUDE_URL + '?q=' + encodeURIComponent(q) : CLAUDE_URL;
  }

  /** Tab params → { prompt, context, at, turns, send } or null when they hold no handoff. */
  function readHandoff(p) {
    if (!p || typeof p !== 'object') return null;
    let prompt = typeof p.prompt === 'string' ? p.prompt.trim().slice(0, MAX_INPUT_CHARS) : '';
    const context = typeof p.context === 'string' ? p.context.replace(/\s+/g, ' ').trim().slice(0, 4000) : '';
    let turns = (Array.isArray(p.turns) ? p.turns : []).slice(0, MAX_HANDOFF_TURNS).map(normalizeTurn).filter(Boolean);
    while (turns.length && turns[0].role !== 'user') turns.shift();
    if (turns.length && turns[turns.length - 1].role === 'user') prompt = prompt || turns.pop().content; // unanswered → composer
    if (!turns.length && !prompt) return null;
    if (prompt && context && prompt.indexOf(context) === -1) prompt = (prompt + '\n\n\u00ab' + context + '\u00bb').slice(0, MAX_INPUT_CHARS);
    return { prompt, context, at: Number(p.at) || 0, turns, send: p.send === true };
  }

  // ------------------------------------------------------------------ safe Markdown

  const SAFE_URL = /^https?:\/\/[^\s<>"']+$/i;
  const TABLE_SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;

  function linkHtml(url, label) {
    const href = url.replace(/&amp;/g, '&');
    if (!SAFE_URL.test(href)) return label;
    return '<a class="n-link ask-a" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
  }

  // Emphasis on already-escaped text.
  function emphasis(s) {
    return s
      .replace(/\*\*\*([^*\n]+?)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\w)/g, '$1<em>$2</em>')
      .replace(/(^|[^\w])_([^_\s][^_\n]*?)_(?!\w)/g, '$1<em>$2</em>')
      .replace(/~~([^~\n]+?)~~/g, '<del>$1</del>');
  }

  // `text` is raw model text; the result is safe HTML. Code spans and links are set aside first so later
  // passes can't reach into them.
  function inline(text) {
    const stash = [];
    const keep = (html) => '\u0000' + (stash.push(html) - 1) + '\u0000';
    let s = esc(String(text).replace(/\u0000/g, ''));
    s = s.replace(/`([^`\n]+)`/g, (m, code) => keep('<code>' + code + '</code>'));
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, (m, label, url) => keep(linkHtml(url, emphasis(label))));
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, (m, pre, url) => {
      const shown = url.replace(/^https?:\/\/(www\.)?/, '');
      return pre + keep(linkHtml(url, shown.length > 54 ? shown.slice(0, 53) + '…' : shown));
    });
    s = emphasis(s);
    for (let i = 0; i < 3 && s.indexOf('\u0000') !== -1; i++) s = s.replace(/\u0000(\d+)\u0000/g, (m, n) => stash[Number(n)] || '');
    return s;
  }

  function codeHtml(body, lang) {
    return '<div class="ask-code"><div class="ask-code__bar"><span class="ask-code__lang">' + esc(String(lang || 'code').slice(0, 20)) + '</span>' +
      '<button type="button" class="ask-code__copy" aria-label="Copy code">' + icon('copy', 13) + '<span>Copy</span></button></div>' +
      '<pre tabindex="0"><code>' + esc(body) + '</code></pre></div>';
  }

  function splitRow(line) {
    let s = line.trim();
    if (s.charAt(0) === '|') s = s.slice(1);
    if (s.charAt(s.length - 1) === '|' && s.charAt(s.length - 2) !== '\\') s = s.slice(0, -1);
    return s.split(/(?<!\\)\|/).map((c) => c.replace(/\\\|/g, '|').trim());
  }

  function tableHtml(headLine, sepLine, rows) {
    const aligns = splitRow(sepLine).map((c) => (/^:-+:$/.test(c) ? 'center' : (/-:$/.test(c) ? 'right' : '')));
    const cell = (tag, text, i) => '<' + tag + (aligns[i] ? ' class="is-' + aligns[i] + '"' : '') + '>' + inline(text) + '</' + tag + '>';
    return '<div class="ask-table"><table><thead><tr>' + splitRow(headLine).map((c, i) => cell('th', c, i)).join('') + '</tr></thead><tbody>' +
      rows.map((r) => '<tr>' + splitRow(r).map((c, i) => cell('td', c, i)).join('') + '</tr>').join('') + '</tbody></table></div>';
  }

  function renderMarkdown(src) {
    const lines = String(src == null ? '' : src).replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let para = [];
    let quote = [];
    const stack = [];   // open lists, innermost last: { tag, indent }
    let gap = false;    // a blank line was seen since the last list item

    const flushPara = () => { if (para.length) out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; };
    const flushQuote = () => { if (quote.length) out.push('<blockquote>' + quote.map(inline).join('<br>') + '</blockquote>'); quote = []; };
    const closeLists = () => { while (stack.length) out.push('</li></' + stack.pop().tag + '>'); gap = false; };
    const flushAll = () => { flushPara(); flushQuote(); closeLists(); };

    function openList(tag, indent, num) {
      out.push('<' + tag + (tag === 'ol' && num > 1 && num < 1000 ? ' start="' + num + '"' : '') + '>');
      stack.push({ tag, indent });
    }

    function pushItem(indent, tag, num, html) {
      gap = false;
      while (stack.length && indent < stack[stack.length - 1].indent - 1) out.push('</li></' + stack.pop().tag + '>');
      const top = stack[stack.length - 1];
      if (!top) openList(tag, indent, num);
      else if (indent > top.indent + 1) openList(tag, indent, num);      // nested inside the open <li>
      else if (top.tag === tag) out.push('</li>');
      else { stack.pop(); out.push('</li></' + top.tag + '>'); openList(tag, top.indent, num); }
      out.push('<li>' + html);
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      let m;

      if ((m = /^(\s*)(`{3,}|~{3,})\s*([\w+#.-]*)[^`]*$/.exec(line))) {
        const closeRe = new RegExp('^\\s*' + m[2].charAt(0) + '{' + m[2].length + ',}\\s*$');
        const dedent = new RegExp('^ {0,' + m[1].length + '}');
        const body = [];
        let j = i + 1;
        while (j < lines.length && !closeRe.test(lines[j])) { body.push(lines[j].replace(dedent, '')); j++; }
        flushAll();
        out.push(codeHtml(body.join('\n'), m[3]));
        i = j; // the closing fence (or the end — an unfinished block while streaming)
        continue;
      }

      if (!line.trim()) { flushPara(); flushQuote(); if (stack.length) gap = true; continue; }

      if (line.indexOf('|') !== -1 && i + 1 < lines.length && lines[i + 1].indexOf('|') !== -1 && TABLE_SEP.test(lines[i + 1])) {
        const rows = [];
        let j = i + 2;
        while (j < lines.length && lines[j].trim() && lines[j].indexOf('|') !== -1) { rows.push(lines[j]); j++; }
        flushAll();
        out.push(tableHtml(line, lines[i + 1], rows));
        i = j - 1;
        continue;
      }

      if ((m = /^\s{0,3}(#{1,4})\s+(.+?)\s*#*\s*$/.exec(line))) {
        flushAll();
        const level = m[1].length + 2; // # → h3 … #### → h6 (answers sit inside a bubble)
        out.push('<h' + level + ' class="ask-h">' + inline(m[2]) + '</h' + level + '>');
        continue;
      }

      if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { flushAll(); out.push('<hr>'); continue; }

      if ((m = /^\s{0,3}>\s?(.*)$/.exec(line))) { flushPara(); closeLists(); quote.push(m[1]); continue; }

      if ((m = /^(\s*)([-*+•]|\d{1,3}[.)])\s+(.*)$/.exec(line))) {
        flushPara();
        flushQuote();
        const isNum = /\d/.test(m[2]);
        pushItem(m[1].replace(/\t/g, '    ').length, isNum ? 'ol' : 'ul', isNum ? parseInt(m[2], 10) : 0, inline(m[3]));
        continue;
      }

      if (stack.length && (!gap || /^\s{2,}/.test(line))) { out.push('<br>' + inline(line.trim())); continue; } // continues the open item
      flushQuote();
      closeLists();
      para.push(line.trim());
    }
    flushAll();
    return out.join('');
  }

  // ------------------------------------------------------------------ app

  const TEMPLATE =
    '<div class="ask is-empty" data-state="connecting" data-nav="closed">' +
      '<aside class="ask-side" id="ask-side" aria-label="Chat history">' +
        '<div class="ask-side__head">' +
          '<div class="ask-brand">' +
            '<span class="ask-mark" aria-hidden="true">' + icon('sparkles', 17) + '</span>' +
            '<h1 class="ask-h1">Ask Claude</h1>' +
            '<button type="button" class="n-btn n-btn--ghost n-btn--icon n-btn--sm ask-close" aria-label="Close history" title="Close">' + icon('x', 16) + '</button>' +
          '</div>' +
          '<button type="button" class="n-btn n-btn--primary ask-new" title="Start a new chat">' + icon('plus', 15) + '<span>New chat</span></button>' +
        '</div>' +
        '<div class="ask-side__label">Recent chats</div>' +
        '<div class="ask-hist n-scroll" role="list"></div>' +
        '<p class="ask-side__foot">' + icon('lock', 12) + '<span>Chats are saved on this device only.</span></p>' +
      '</aside>' +
      '<div class="ask-scrim" hidden></div>' +
      '<section class="ask-main" aria-label="Conversation">' +
        '<div class="ask-bar">' +
          '<button type="button" class="n-btn n-btn--ghost n-btn--icon ask-nav" aria-label="Chat history" aria-expanded="false" aria-controls="ask-side" title="Chat history">' + icon('history', 18) + '</button>' +
          '<h2 class="ask-bar__title">New chat</h2>' +
          '<span class="ask-pill" hidden><span class="n-spinner" aria-hidden="true"></span><span>Connecting to Claude…</span></span>' +
          '<button type="button" class="n-btn n-btn--ghost n-btn--icon ask-new-mini" aria-label="New chat" title="New chat">' + icon('plus', 18) + '</button>' +
        '</div>' +
        '<div class="ask-log n-scroll" role="log" aria-live="off" aria-label="Messages" tabindex="0">' +
          '<div class="ask-log__inner"><div class="ask-msgs"></div><div class="ask-notewrap"></div></div>' +
        '</div>' +
        '<div class="ask-banner" role="status" hidden></div>' +
        '<div class="ask-composer">' +
          '<div class="ask-box">' +
            '<textarea class="ask-input" rows="1" maxlength="' + MAX_INPUT_CHARS + '" aria-label="Message Claude" placeholder="Connecting to Claude…" spellcheck="true" disabled></textarea>' +
            '<button type="button" class="n-btn n-btn--primary n-btn--icon ask-send" aria-label="Send message" title="Send (Enter)" disabled>' + SEND_ICON + '</button>' +
          '</div>' +
          '<p class="ask-foot"><span class="ask-foot__keys">Enter to send · Shift+Enter for a new line · </span>Claude can make mistakes, so double-check anything important.</p>' +
        '</div>' +
      '</section>' +
      '<div class="ask-unavail" hidden>' +
        '<div class="ask-unavail__card">' +
          '<div class="ask-unavail__mark" aria-hidden="true">' + icon('sparkles', 26) + '</div>' +
          '<h2 class="ask-unavail__title"></h2>' +
          '<p class="ask-unavail__hint"></p>' +
          '<div class="ask-unavail__actions">' +
            '<a class="n-btn n-btn--primary n-btn--lg ask-open-nova" href="' + NOVA_URL + '" target="_blank" rel="noopener noreferrer">' +
              '<span>Open my claude.ai Nova</span>' + icon('external-link', 15) + '</a>' +
            '<a class="n-btn n-btn--lg ask-open" href="' + CLAUDE_URL + '" target="_blank" rel="noopener noreferrer">' +
              '<span>Open Claude</span>' + icon('external-link', 15) + '</a>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="n-sr ask-live" aria-live="polite"></div>' +
    '</div>';

  const AVATAR = '<span class="ask-avatar" aria-hidden="true">' + icon('sparkles', 15) + '</span>';
  const THINKING = '<span class="ask-thinking"><span class="ask-dots" aria-hidden="true"><i></i><i></i><i></i></span><span>Thinking…</span></span>';

  function mount(el, ctx) {
    el.innerHTML = TEMPLATE;
    const $ = (sel) => el.querySelector(sel);
    const root = $('.ask');
    const histEl = $('.ask-hist');
    const scrimEl = $('.ask-scrim');
    const navBtn = $('.ask-nav');
    const titleEl = $('.ask-bar__title');
    const pillEl = $('.ask-pill');
    const logEl = $('.ask-log');
    const msgsEl = $('.ask-msgs');
    const noteWrap = $('.ask-notewrap');
    const bannerEl = $('.ask-banner');
    const input = $('.ask-input');
    const sendBtn = $('.ask-send');
    const liveEl = $('.ask-live');

    let store = loadStore();
    let chat = null;           // the open chat (an object in store.chats), or null for a blank one
    let state = 'connecting';  // connecting | ready | blocked | unavailable
    let run = null;            // the call in flight: { chat, ctl, msg, bubble, text }
    let note = null;           // transient inline note: { kind, text, retry }
    let fatal = '';            // banner text once Claude can't be used in this view
    let stick = true;          // keep the log pinned to the newest text
    let unmounted = false;
    let handledAt = 0;         // `at` of the last highlight handoff used
    let carriedPrompt = '';    // a handed-off prompt, kept for the claude.ai/new?q= link when Claude can't be reached
    let pendingSend = '';      // a handed-off prompt waiting for Claude to become ready

    function finePointer() { return !!(window.matchMedia && window.matchMedia('(pointer: fine)').matches); }
    function live(text) { liveEl.textContent = ''; liveEl.textContent = text; }

    // ---- persistence
    function persist() {
      store.chats.sort((a, b) => b.updatedAt - a.updatedAt);
      store.chats = store.chats.slice(0, MAX_CHATS);
      Nova.local.set(STORE_KEY, { v: 1, activeId: chat ? chat.id : null, chats: store.chats });
    }

    function removeFromStore(c) { store.chats = store.chats.filter((x) => x !== c); }

    // ---- chrome (buttons, composer, banner)
    function autosize() {
      if (!input.isConnected || input.offsetParent === null) return;
      input.style.height = 'auto';
      const h = Math.min(input.scrollHeight, INPUT_MAX_PX);
      input.style.height = h + 'px';
      input.classList.toggle('is-scroll', input.scrollHeight > INPUT_MAX_PX);
    }

    function renderChrome() {
      const turns = chat ? chat.turns : [];
      root.dataset.state = state;
      root.classList.toggle('is-empty', !turns.length && !run);
      root.classList.toggle('is-busy', !!run);
      titleEl.textContent = chat ? chat.title : 'New chat';
      pillEl.hidden = state !== 'connecting';
      bannerEl.hidden = !fatal;
      bannerEl.innerHTML = fatal ? icon('info', 15) + '<span>' + esc(fatal) + '</span>' : '';
      input.disabled = state !== 'ready';
      input.placeholder = state === 'connecting' ? 'Connecting to Claude…'
        : state === 'blocked' ? 'Claude isn\'t available here right now'
        : 'Ask Claude anything…';
      const stop = !!run;
      sendBtn.classList.toggle('is-stop', stop);
      sendBtn.innerHTML = stop ? STOP_ICON : SEND_ICON;
      sendBtn.title = stop ? 'Stop (Esc)' : 'Send (Enter)';
      sendBtn.setAttribute('aria-label', stop ? 'Stop' : 'Send message');
      sendBtn.disabled = !stop && (state !== 'ready' || !input.value.trim());
    }

    // ---- history list
    function renderHistory() {
      if (!store.chats.length) {
        histEl.innerHTML = '<div class="ask-hist__empty">Your chats will show up here.</div>';
        return;
      }
      const focusedId = document.activeElement && histEl.contains(document.activeElement) ? document.activeElement.dataset.id : null;
      histEl.innerHTML = store.chats.map((c) => {
        const active = chat === c;
        return '<div class="ask-hist__row' + (active ? ' is-active' : '') + '" role="listitem">' +
          '<button type="button" class="ask-hist__item" data-id="' + esc(c.id) + '"' + (active ? ' aria-current="true"' : '') + '>' +
            '<span class="ask-hist__title">' + esc(c.title) + '</span>' +
            '<span class="ask-hist__time">' + esc(U.fmtRelative(c.updatedAt)) + '</span>' +
          '</button>' +
          '<button type="button" class="n-btn n-btn--ghost n-btn--icon n-btn--sm ask-hist__del" data-del="' + esc(c.id) + '" aria-label="Delete chat: ' + esc(c.title) + '" title="Delete chat">' + icon('trash', 14) + '</button>' +
        '</div>';
      }).join('');
      if (focusedId) {
        const b = histEl.querySelector('[data-id="' + CSS.escape(focusedId) + '"]');
        if (b) b.focus();
      }
    }

    // ---- messages
    function heroHtml() {
      const settings = Nova.settings && Nova.settings.get ? Nova.settings.get() : null;
      const name = String((settings && settings.name) || '').trim().slice(0, 30);
      return '<div class="ask-hero">' +
        '<div class="ask-hero__mark" aria-hidden="true">' + icon('sparkles', 28) + '</div>' +
        '<h2 class="ask-hero__title">What are you working on' + (name ? ', ' + esc(name) : '') + '?</h2>' +
        '<p class="ask-hero__sub">Ask about a homework problem, a topic that won\'t click, or have Claude quiz you. It\'ll help you think it through.</p>' +
        '<div class="ask-chips" role="group" aria-label="Ideas to start with">' +
