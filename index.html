      d.wrap.style.transform = '';
      const ids = Array.from(d.grid.querySelectorAll('.home-tile-wrap[data-id]')).map((n) => n.getAttribute('data-id'));
      d.justDragged = true;
      // Keep the flag through the click that follows pointerup, then clear.
      setTimeout(() => { if (dragState === d) dragState = null; if (pendingLinks) { pendingLinks = false; renderLinks(); } }, 0);
      if (cancelled) { pendingLinks = true; return; }
      const links = getLinks();
      const byId = new Map(links.map((l) => [l.id, l]));
      const next = ids.map((id) => byId.get(id)).filter(Boolean);
      links.forEach((l) => { if (ids.indexOf(l.id) === -1) next.push(l); });
      if (next.map((l) => l.id).join() !== links.map((l) => l.id).join()) saveLinks(next);
    }
    P.links.addEventListener('pointerup', (e) => endDrag(e, false));
    P.links.addEventListener('pointercancel', (e) => endDrag(e, true));
    P.links.addEventListener('dragstart', (e) => { if (editMode) e.preventDefault(); });

    // ------------------------------------------------------------ Today widget

    function renderToday() {
      const all = openTasks();
      const today = U.dayKey();
      todayKey = today;
      const shown = all.slice(0, 3);
      const overdue = all.filter((t) => validDue(t.due) && t.due < today).length;
      const dueToday = all.filter((t) => t.due === today).length;
      const hasTasksApp = !!N.apps.get('tasks');
      let sub = '';
      if (!all.length) sub = 'All clear';
      else if (overdue && dueToday) sub = dueToday + ' due today · ' + overdue + ' overdue';
      else if (overdue) sub = overdue + ' overdue';
      else if (dueToday) sub = dueToday + ' due today';
      else sub = all.length + ' to do';

      let body = '';
      if (!all.length) {
        body = '<div class="home-today__empty">' +
          '<span class="home-today__emptyart" aria-hidden="true">' + icon('check', 18, { strokeWidth: 2.4 }) + '</span>' +
          '<div><div class="home-today__emptytitle">Nothing due. Nice.</div>' +
          '<div class="n-hint">Homework you add in Tasks shows up here.</div></div></div>';
      } else {
        body = '<ul class="home-tasks">' + shown.map((t) => {
          const due = dueInfo(t.due, today);
          const course = typeof t.course === 'string' && t.course.trim() ? t.course.trim() : '';
          return '<li class="home-task" data-id="' + esc(t.id) + '">' +
            '<button type="button" class="home-task__check" data-act="done" aria-label="Mark “' + esc(t.title) + '” done" title="Mark done">' + icon('check', 12, { strokeWidth: 3 }) + '</button>' +
            '<button type="button" class="home-task__body" data-act="open-tasks" title="' + esc(t.title) + '">' +
              '<span class="home-task__title n-truncate">' + esc(t.title) + '</span>' +
              ((course || due) ? '<span class="home-task__meta">' +
                (course ? '<span class="n-chip n-chip--color" style="--c:' + esc(courseColor(course)) + '"><i class="n-chip__dot"></i>' + esc(courseLabel(course)) + '</span>' : '') +
                (due ? '<span class="home-task__due is-' + due.tone + '"' + (due.title ? ' title="' + esc(due.title) + '"' : '') + '>' + esc(due.label) + '</span>' : '') +
              '</span>' : '') +
            '</button></li>';
        }).join('') + '</ul>' +
        (all.length > shown.length ? '<button type="button" class="home-today__more n-link" data-act="open-tasks">+' + (all.length - shown.length) + ' more in Tasks</button>' : '');
      }
      P.today.innerHTML =
        '<div class="home-card__head">' +
          '<span class="home-card__ic home-card__ic--today">' + icon('check', 15, { strokeWidth: 2.4 }) + '</span>' +
          '<div class="home-card__titles"><h2 class="home-card__title">Today</h2><div class="home-card__sub">' + esc(sub) + '</div></div>' +
          (hasTasksApp ? '<button type="button" class="n-btn n-btn--ghost n-btn--sm home-card__open" data-act="open-tasks" title="Open Tasks"><span>' + (all.length ? 'Tasks' : 'Add a task') + '</span>' + icon('arrow-right', 13) + '</button>' : '') +
        '</div>' + body;
    }

    P.today.addEventListener('click', (e) => {
      const act = e.target.closest('[data-act]');
      if (!act) return;
      const a = act.getAttribute('data-act');
      if (a === 'open-tasks') {
        if (N.apps.get('tasks')) N.go({ kind: 'app', appId: 'tasks' }, { newTab: e.ctrlKey || e.metaKey });
        return;
      }
      if (a === 'done') {
        const li = act.closest('.home-task');
        const id = li && li.getAttribute('data-id');
        if (!id || li.classList.contains('is-done')) return;
        li.classList.add('is-done');
        setTimeout(() => completeTask(id), motionOk() ? 420 : 0);
      }
    });

    function completeTask(id) {
      let tasks = N.data.get('tasks');
      if (!Array.isArray(tasks)) return;
      const t = tasks.find((x) => x && x.id === id);
      if (!t) { renderToday(); return; }
      t.done = true;
      t.doneAt = Date.now();
      N.data.set('tasks', tasks);
      N.ui.toast('Done: ' + t.title, {
        action: {
          label: 'Undo',
          onClick() {
            const cur = N.data.get('tasks');
            const x = Array.isArray(cur) && cur.find((y) => y && y.id === id);
            if (!x) return;
            x.done = false;
            delete x.doneAt;
            N.data.set('tasks', cur);
          },
        },
      });
    }

    // ------------------------------------------------------------ Focus widget

    function focusSub(f) {
      if (f.state === 'idle') return 'Pomodoro timer';
      if (f.isBreak) return 'Stretch, drink some water';
      return f.sessions != null ? 'Session ' + (f.sessions + 1) + ' today' : 'In the zone';
    }

    let focusSnapshot = '';
    function renderFocus() {
      const f = readFocus();
      const hasFocusApp = !!N.apps.get('focus');
      const R = 25;
      const C = 2 * Math.PI * R;
      let progress = 0;
      if (f.total && f.remaining != null) progress = Math.min(1, Math.max(0, 1 - f.remaining / f.total));
      const label = f.isBreak ? (/long/.test(f.phase) ? 'Long break' : 'Break') : 'Focus';
      let main = '';
      let sub = '';
      let btn = '';
      if (f.state === 'running' || f.state === 'paused') {
        main = '<span class="home-focus__time">' + fmtLeft(f.remaining) + '</span>';
        if (f.state === 'paused') sub = label + ' · paused';
        else if (f.remaining <= 0) sub = 'Time’s up!';
        else sub = label + ' · ends ' + fmtTime(new Date(f.endAt), N.settings.get().clock24);
        btn = hasFocusApp ? '<button type="button" class="n-btn n-btn--sm" data-act="open-focus"><span>Open timer</span>' + icon('arrow-right', 13) + '</button>' : '';
      } else {
        main = '<span class="home-focus__idle">Ready when you are</span>';
        sub = f.sessions ? f.sessions + (f.sessions === 1 ? ' session' : ' sessions') + ' today — keep it going' : '25 minutes on, 5 off';
        btn = hasFocusApp ? '<button type="button" class="n-btn n-btn--primary n-btn--sm" data-act="start-focus">' + icon('sparkles', 13) + '<span>Start focus</span></button>' : '';
      }
      const snap = [f.state, main, sub, btn, Math.round(progress * 200)].join('|');
      if (snap === focusSnapshot) return;
      focusSnapshot = snap;
      const running = f.state === 'running';
      P.focus.classList.toggle('is-running', running);
      P.focus.classList.toggle('is-break', f.isBreak && f.state !== 'idle');
      P.focus.innerHTML =
        '<div class="home-card__head">' +
          '<span class="home-card__ic home-card__ic--focus">' + icon('history', 15, { strokeWidth: 2.2 }) + '</span>' +
          '<div class="home-card__titles"><h2 class="home-card__title">Focus</h2><div class="home-card__sub">' + esc(focusSub(f)) + '</div></div>' +
        '</div>' +
        '<div class="home-focus__row">' +
          '<svg class="home-ring" viewBox="0 0 64 64" aria-hidden="true">' +
            '<circle class="home-ring__track" cx="32" cy="32" r="' + R + '"/>' +
            '<circle class="home-ring__bar" cx="32" cy="32" r="' + R + '" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - progress)).toFixed(2) + '" transform="rotate(-90 32 32)"/>' +
          '</svg>' +
          '<div class="home-focus__text">' + main + '<span class="home-focus__sub">' + esc(sub) + '</span></div>' +
          (btn ? '<div class="home-focus__btn">' + btn + '</div>' : '') +
        '</div>';
    }

    P.focus.addEventListener('click', (e) => {
      const act = e.target.closest('[data-act]');
      if (!act || !N.apps.get('focus')) return;
      const a = act.getAttribute('data-act');
      const newTab = e.ctrlKey || e.metaKey;
      if (a === 'start-focus') N.go({ kind: 'app', appId: 'focus', params: { start: true } }, { newTab });
      else if (a === 'open-focus') N.go({ kind: 'app', appId: 'focus' }, { newTab });
    });

    // ------------------------------------------------------------ first-run card

    let onboardBuilt = false;
    const segName = U.uid('ob-layout');

    function buildOnboard() {
      const s = N.settings.get();
      const choices = (N.themes.choices || []).slice(0, 10);
      P.onboard.setAttribute('aria-labelledby', segName + '-title');
      P.onboard.innerHTML =
        '<div class="home-onboard__head">' +
          '<span class="home-onboard__badge" aria-hidden="true">' + icon('sparkles', 20) + '</span>' +
          '<div><h2 class="home-onboard__title" id="' + segName + '-title">Make Nova yours</h2>' +
          '<p class="home-onboard__lede">Pick a name, a look and where your tabs live. You can change all of it later in Settings.</p></div>' +
        '</div>' +
        '<div class="home-onboard__grid">' +
          '<label class="n-field home-onboard__name"><span class="n-label">What should Nova call you?</span>' +
            '<input class="n-input" data-ob="name" maxlength="40" placeholder="Your name" value="' + esc(s.name) + '"></label>' +
          '<div class="n-field home-onboard__layout"><span class="n-label">Tabs</span>' +
            '<div class="n-seg" role="radiogroup" aria-label="Tab layout">' +
              '<label><input type="radio" name="' + segName + '" value="vertical"' + (s.layout !== 'horizontal' ? ' checked' : '') + '><span>' + icon('panel-left', 14) + 'Sidebar</span></label>' +
              '<label><input type="radio" name="' + segName + '" value="horizontal"' + (s.layout === 'horizontal' ? ' checked' : '') + '><span>' + icon('panel-top', 14) + 'On top</span></label>' +
            '</div></div>' +
          '<div class="n-field home-onboard__themes"><span class="n-label">Theme · <b data-ob="themename"></b></span>' +
            '<div class="home-swatches" role="radiogroup" aria-label="Theme">' +
              choices.map((c) => '<button type="button" class="home-swatch' + (c.auto ? ' home-swatch--auto' : '') + '" role="radio" data-tid="' + esc(c.id) + '" title="' + esc(c.name) + '" aria-label="' + esc(c.name) + '">' +
                (c.auto
                  ? '<span class="home-swatch__half" data-half="dark"><i></i></span><span class="home-swatch__half home-swatch__half--b" data-half="light"><i></i></span>'
                  : '<span class="home-swatch__half"><i></i></span>') +
                '</button>').join('') +
            '</div></div>' +
        '</div>' +
        '<div class="home-onboard__actions">' +
          '<button type="button" class="n-btn n-btn--ghost n-btn--sm" data-ob="skip">Skip for now</button>' +
          '<button type="button" class="n-btn n-btn--primary" data-ob="done">' + icon('check', 15) + '<span>Looks good</span></button>' +
        '</div>';
      paintSwatches();
      onboardBuilt = true;
    }

    function paintSwatches() {
      const s = N.settings.get();
      P.onboard.querySelectorAll('.home-swatch').forEach((b) => {
        const id = b.getAttribute('data-tid');
        if (id === 'auto') {
          applyVars(b.querySelector('[data-half="dark"]'), previewVars('midnight', s));
          applyVars(b.querySelector('[data-half="light"]'), previewVars('daylight', s));
        } else {
          applyVars(b.querySelector('.home-swatch__half'), previewVars(id, s));
        }
      });
    }

    function syncOnboard() {
      const s = N.settings.get();
      const show = !s.onboarded;
      if (!show) {
        if (!P.onboard.hidden && onboardBuilt) {
          P.onboard.hidden = true;
          P.onboard.innerHTML = '';
          P.onboard.removeAttribute('aria-labelledby');
          onboardBuilt = false;
        }
        return;
      }
      if (!onboardBuilt) buildOnboard();
      P.onboard.hidden = false;
      P.onboard.querySelectorAll('.home-swatch').forEach((b) => b.setAttribute('aria-checked', String(b.getAttribute('data-tid') === s.theme)));
      const choice = (N.themes.choices || []).find((c) => c.id === s.theme);
      const nameEl = P.onboard.querySelector('[data-ob="themename"]');
      if (nameEl) nameEl.textContent = choice ? choice.name : s.theme;
      P.onboard.querySelectorAll('input[name="' + segName + '"]').forEach((r) => { r.checked = r.value === s.layout; });
      const nameIn = P.onboard.querySelector('[data-ob="name"]');
      if (nameIn && document.activeElement !== nameIn && nameIn.value.trim() !== s.name) nameIn.value = s.name;
    }

    function finishOnboard(skipped) {
      clearTimeout(onboardTimer);
      const nameIn = P.onboard.querySelector('[data-ob="name"]');
      const patch = { onboarded: true };
      if (nameIn) patch.name = nameIn.value;
      const card = P.onboard;
      const done = () => {
        N.settings.update(patch);
        N.ui.toast(skipped ? 'No problem — Settings has all of this whenever you want it' : 'All set! Change anything later in Settings');
      };
      if (motionOk()) {
        card.classList.add('is-leaving');
        setTimeout(done, 200);
      } else done();
    }

    P.onboard.addEventListener('click', (e) => {
      const sw = e.target.closest('.home-swatch');
      if (sw) { N.settings.update({ theme: sw.getAttribute('data-tid') }); return; }
      const b = e.target.closest('[data-ob]');
      if (!b) return;
      if (b.getAttribute('data-ob') === 'done') finishOnboard(false);
      if (b.getAttribute('data-ob') === 'skip') finishOnboard(true);
    });
    P.onboard.addEventListener('change', (e) => {
      if (e.target.name === segName) N.settings.update({ layout: e.target.value });
    });
    P.onboard.addEventListener('input', (e) => {
      if (e.target.getAttribute('data-ob') !== 'name') return;
      clearTimeout(onboardTimer);
      const v = e.target.value;
      onboardTimer = setTimeout(() => N.settings.update({ name: v }), 250);
    });
    P.onboard.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.getAttribute('data-ob') === 'name') { e.preventDefault(); finishOnboard(false); }
    });

    // ------------------------------------------------------------ visibility of sections

    function applyVisibility() {
      const s = N.settings.get();
      const h = s.home || {};
      P.clock.hidden = !h.showClock;
      P.date.hidden = !h.showClock && !h.showGreeting;
      P.greeting.hidden = !h.showGreeting;
      P.search.hidden = !h.showSearch;
      P.links.hidden = !h.showLinks;
      const footEdit = el.querySelector('[data-act="edit-links"]');
      if (footEdit) footEdit.hidden = !h.showLinks || editMode;
      P.today.hidden = !h.showTasks;
      P.focus.hidden = !h.showFocus;
      P.widgets.hidden = !h.showTasks && !h.showFocus;
      P.widgets.classList.toggle('is-single', !!h.showTasks !== !!h.showFocus);
      const any = h.showClock || h.showGreeting || h.showSearch || h.showLinks || h.showTasks || h.showFocus;
      P.allhidden.hidden = !!any;
      if (!any && !P.allhidden.innerHTML) {
        P.allhidden.innerHTML = '<div class="n-empty"><div class="n-empty__icon">' + icon('eye-off', 22) + '</div>' +
          '<div class="n-empty__title">A very calm new tab</div>' +
          '<div class="n-empty__hint">Every Home widget is switched off. Turn some back on in Settings.</div>' +
          '<button type="button" class="n-btn n-btn--sm" data-act="home-settings">' + icon('settings', 14) + '<span>Home settings</span></button></div>';
      }
      if (h.showSearch) updatePlaceholder();
    }

    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-act="edit-links"]')) {
        setEditMode(true);
        P.links.scrollIntoView({ block: 'nearest', behavior: motionOk() ? 'smooth' : 'auto' });
        return;
      }
      const act = e.target.closest('[data-act="customize"], [data-act="home-settings"]');
      if (!act) return;
      ctx.open({ app: 'settings', params: { path: act.getAttribute('data-act') === 'customize' ? 'appearance' : 'home' } });
    });

    // Escape leaves edit mode from anywhere on the page.
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && editMode && !editing && !e.defaultPrevented && !e.target.closest('.home-search')) setEditMode(false);
    });

    // ------------------------------------------------------------ ticking + events

    function tick() {
      renderClock(false);
      renderFocus();
      if (U.dayKey() !== todayKey) renderToday(); // left open past midnight: "Tomorrow" becomes "Today"
    }

    function start() {
      stop();
      ticker = setInterval(tick, 1000);
    }
    function stop() { if (ticker) { clearInterval(ticker); ticker = null; } }

    function renderAll() {
      applyVisibility();
      renderClock(true);
      syncOnboard();
      renderLinks();
      renderToday();
      focusSnapshot = '';
      renderFocus();
    }

    subs.push(N.on('settings', () => {
      applyVisibility();
      renderClock(true);
      syncOnboard();
      if (onboardBuilt) paintSwatches();
      focusSnapshot = '';
      renderFocus();
    }));
    subs.push(N.on('data:links', () => renderLinks()));
    subs.push(N.on('data:tasks', () => renderToday()));
    subs.push(N.on('local:focus', () => renderFocus()));
    subs.push(N.on('env', () => { renderLinks(); }));
    subs.push(N.on('apps', () => { renderToday(); focusSnapshot = ''; renderFocus(); }));
    subs.push(N.on('theme', () => { if (onboardBuilt) paintSwatches(); }));

    renderAll();

    return {
      onShow() {
        visible = true;
        renderClock(true);
        renderToday();
        focusSnapshot = '';
        renderFocus();
        start();
      },
      onHide() {
        visible = false;
        stop();
        closeSug();
        if (dragState) endDrag(null, true);
      },
      unmount() {
        stop();
        clearTimeout(onboardTimer);
        subs.forEach((off) => off());
        subs.length = 0;
        void visible;
      },
    };
  }

  N.registerApp({
    id: 'home',
    name: 'Home',
    title: 'New tab',
    icon: 'home',
    singleton: false,
    hidden: true,
    keywords: ['home', 'new tab', 'start'],
    description: 'Your new-tab page: clock, search, quick links, today’s tasks and the focus timer',
    mount,
  });
})();

<script>
/* ---- web/src/js/apps/settings.js ---- */
/* Nova Settings (SPEC §4.1) — singleton. Sections: Appearance, Home, Search, Quick links, Keyboard,
 * Sync & data, About. Pages are built on first visit and then kept; every control is updated in
 * place from the 'settings' event (so changes from the quick-theme popover, another browser tab or
 * sync show up live without re-rendering under the user's pointer). params.path = '<section>[/<group>]'. */
(function () {
  'use strict';

  const N = window.Nova;
  if (!N || typeof N.registerApp !== 'function') return;
  const U = N.util;
  const esc = U.esc;
  const icon = (name, size, opts) => U.icon(name, size, opts);
  const Theme = window.NovaTheme;

  const SECTIONS = [
    { id: 'appearance', label: 'Appearance', icon: 'palette', lede: 'Themes, colors and how the window is laid out. Everything changes live.' },
    { id: 'home', label: 'Home', icon: 'home', lede: 'What your new-tab page shows.' },
    { id: 'search', label: 'Search', icon: 'search', lede: 'Where searches from the address bar and Home go.' },
    { id: 'links', label: 'Quick links', icon: 'bookmark', lede: 'The tiles on your Home page. They sync with your settings.' },
    { id: 'keyboard', label: 'Keyboard', icon: 'keyboard', lede: 'Shortcuts that never fight Chrome’s own.' },
    { id: 'sync', label: 'Sync & data', icon: 'rotate-cw', lede: 'Keep your stuff in sync, back it up, or start fresh.' },
    { id: 'about', label: 'About', icon: 'info', lede: 'What Nova is, and what it can open inside.' },
    { id: 'music', label: 'Music', icon: 'volume', lede: 'See what’s playing on Spotify and pause or skip without leaving Nova.' },
  ];

  const MINI_VARS = ['--n-frame', '--n-sidebar', '--n-page', '--n-surface', '--n-surface-2', '--n-text', '--n-text-muted',
    '--n-text-faint', '--n-border', '--n-accent', '--n-accent-text', '--n-accent-soft', '--n-tab-active', '--n-radius'];
  const ENGINE_COLORS = { google: '#1f72d6', duckduckgo: '#d4472b', bing: '#0f8f82', brave: '#d93f4c' };
  const RANGE_KEYS = { cornerRadius: [0, 20], contentInset: [0, 16], sidebarWidth: [200, 360] };
  const WIDGETS = [
    { key: 'showClock', label: 'Clock', hint: 'The big time and date', icon: 'clock' },
    { key: 'showGreeting', label: 'Greeting', hint: '“Good afternoon, Jack”', icon: 'sparkles' },
    { key: 'showSearch', label: 'Search box', hint: 'Search or open a site from Home', icon: 'search' },
    { key: 'showLinks', label: 'Quick links', hint: 'Your tiles for school sites and tools', icon: 'bookmark' },
    { key: 'showTasks', label: 'Today', hint: 'Your next homework and to-dos', icon: 'list-checks' },
    { key: 'showFocus', label: 'Focus timer', hint: 'The Pomodoro timer at a glance', icon: 'timer' },
  ];

  function hexOk(v) { return /^#[0-9a-f]{6}$/i.test(v || ''); }

  function kbd(keys) {
    return keys.map((k) => '<kbd class="n-kbd">' + esc(k) + '</kbd>').join('<span class="set-kplus">+</span>');
  }

  function fmtBytes(n) { return n < 1024 ? n + ' B' : (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB'; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

  // ================================================================ mount

  function mount(el, ctx) {
    const subs = [];
    const pages = {};
    const syncers = [];       // fn(settings) for built pages
    const P = U.uid('set');   // id prefix for this mount
    let current = null;
    let rafSettings = 0;
    let pendingPatch = null;
    let syncStatus = N.sync.status();
    let relTimer = null;

    el.innerHTML =
      '<div class="set">' +
        '<nav class="set-nav n-scroll" aria-label="Settings sections">' +
          '<div class="set-nav__head"><h1 class="set-nav__title">Settings</h1></div>' +
          '<div class="set-nav__list">' +
            SECTIONS.map((s) => '<button type="button" class="set-nav__item" data-sec="' + s.id + '">' +
              '<span class="set-nav__ic">' + icon(s.icon, 15) + '</span><span class="set-nav__label">' + esc(s.label) + '</span></button>').join('') +
          '</div>' +
          '<button type="button" class="set-nav__sync" data-sec="sync" data-part="navsync"></button>' +
        '</nav>' +
        '<main class="set-main n-scroll" tabindex="-1"></main>' +
      '</div>';
    const nav = el.querySelector('.set-nav');
    const main = el.querySelector('.set-main');

    // Batch rapid control changes (sliders, color picker) into one update per frame.
    function update(patch) {
      pendingPatch = Object.assign(pendingPatch || {}, patch);
      if (patch.home && pendingPatch.home !== patch.home) pendingPatch.home = Object.assign({}, pendingPatch.home, patch.home);
      if (rafSettings) return;
      rafSettings = requestAnimationFrame(() => {
        rafSettings = 0;
        const p = pendingPatch;
        pendingPatch = null;
        if (p) N.settings.update(p);
      });
    }
    function updateNow(patch) {
      if (rafSettings) { cancelAnimationFrame(rafSettings); rafSettings = 0; }
      const p = Object.assign(pendingPatch || {}, patch);
      pendingPatch = null;
      N.settings.update(p);
    }

    // ------------------------------------------------------------ markup helpers

    function pageHead(sec) {
      return '<header class="set-page__head"><span class="set-page__ic">' + icon(sec.icon, 18) + '</span>' +
        '<div><h1 class="set-page__title">' + esc(sec.label) + '</h1><p class="set-page__lede">' + esc(sec.lede) + '</p></div></header>';
    }

    function group(id, title, hint, body, extraClass) {
      return '<section class="set-group' + (extraClass ? ' ' + extraClass : '') + '" data-group="' + id + '" id="' + P + '-' + id + '" aria-labelledby="' + P + '-' + id + '-t">' +
        '<div class="set-group__head"><h2 class="set-group__title" id="' + P + '-' + id + '-t">' + title + '</h2>' +
        (hint ? '<p class="set-group__hint">' + hint + '</p>' : '') + '</div>' + body + '</section>';
    }

    function row(label, hint, control, opts) {
      opts = opts || {};
      const id = U.uid('row');
      return '<div class="set-row' + (opts.cls ? ' ' + opts.cls : '') + '"' + (opts.attr || '') + '>' +
        (opts.icon ? '<span class="set-row__ic">' + icon(opts.icon, 15) + '</span>' : '') +
        '<div class="set-row__text"><div class="set-row__label" id="' + id + '">' + label + '</div>' +
        (hint ? '<div class="set-row__hint">' + hint + '</div>' : '') + '</div>' +
        '<div class="set-row__control">' + control.replace(/\{\{labelledby\}\}/g, id) + '</div></div>';
    }

    function seg(key, options, label) {
      const name = U.uid('seg');
      return '<div class="n-seg" role="radiogroup" aria-label="' + esc(label) + '" data-seg="' + key + '">' +
        options.map((o) => '<label><input type="radio" name="' + name + '" value="' + esc(o.value) + '"><span>' +
          (o.icon ? icon(o.icon, 14) : '') + esc(o.label) + '</span></label>').join('') + '</div>';
    }

    function range(key, label, unit) {
      const r = RANGE_KEYS[key];
      return '<div class="set-range-wrap"><input type="range" class="set-range" data-range="' + key + '" min="' + r[0] + '" max="' + r[1] + '" step="1" aria-label="' + esc(label) + '">' +
        '<output class="set-range__val" data-range-out="' + key + '"></output></div>' + (unit ? '' : '');
    }

    function sw(path, label) {
      return '<input type="checkbox" class="n-switch" data-switch="' + path + '" aria-label="' + esc(label) + '">';
    }

    // Shared syncers for generic controls inside a page element.
    function bindGeneric(page) {
      syncers.push((s) => {
        page.querySelectorAll('[data-seg]').forEach((g) => {
          const v = String(s[g.getAttribute('data-seg')]);
          g.querySelectorAll('input').forEach((i) => { i.checked = i.value === v; });

          if (document.activeElement !== r) r.value = s[key];
          paintRange(r);
        });
        page.querySelectorAll('[data-switch]').forEach((c) => {
          const path = c.getAttribute('data-switch').split('.');
          const v = path.length === 2 ? (s[path[0]] || {})[path[1]] : s[path[0]];
          c.checked = !!v;
        });
      });
    }

    function paintRange(r) {
      const key = r.getAttribute('data-range');
      const lim = RANGE_KEYS[key];
      const v = Number(r.value);
      r.style.setProperty('--_p', ((v - lim[0]) / (lim[1] - lim[0]) * 100) + '%');
      const out = r.parentElement.querySelector('[data-range-out]');
      if (out) out.textContent = v + ' px';
    }

    // Generic control events (delegated on the whole app).
    el.addEventListener('change', (e) => {
      const t = e.target;
      const segEl = t.closest('[data-seg]');
      if (segEl && t.type === 'radio') {
        const key = segEl.getAttribute('data-seg');
        let v = t.value;
        if (v === 'true' || v === 'false') v = v === 'true';
        updateNow({ [key]: v });
        return;
      }
      if (t.hasAttribute && t.hasAttribute('data-switch')) {
        const path = t.getAttribute('data-switch').split('.');
        if (path.length === 2) updateNow({ [path[0]]: { [path[1]]: t.checked } });
        else updateNow({ [path[0]]: t.checked });
      }

    el.addEventListener('input', (e) => {
      const t = e.target;
      if (t.hasAttribute && t.hasAttribute('data-range')) {
        paintRange(t);
        update({ [t.getAttribute('data-range')]: Number(t.value) });
      }
    });

    // Button radios: arrow keys move + select (roving tabindex is kept by syncRadios).
    el.addEventListener('keydown', (e) => {
      const r = e.target.closest && e.target.closest('button[role="radio"]');
      if (!r) return;
      const keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
      if (!(e.key in keys)) return;

      if (!groupEl) return;
      const items = Array.from(groupEl.querySelectorAll('button[role="radio"]:not(:disabled)'));
      const i = items.indexOf(r);
      const next = items[(i + keys[e.key] + items.length) % items.length];
      e.preventDefault();
      next.focus();
      next.click();
    });

    function syncRadios(groupEl, isOn) {
      const items = Array.from(groupEl.querySelectorAll('button[role="radio"]'));
      let any = false;
      items.forEach((b) => {

    function previewFor(id, s) {
      let vars = {};
      try { vars = Theme.previewVars(id, N.themes, s); } catch (_) { vars = {}; }

        vars['--n-accent'] = s.accent;
        vars['--n-accent-text'] = Theme.textOn(s.accent);

      }
      return vars;
    }
    function applyVars(node, vars) { MINI_VARS.forEach((k) => { if (vars[k] != null) node.style.setProperty(k, vars[k]); }); }

    function themeDefaults() {
      const t = N.settings.theme && N.settings.theme();
      const raw = t && t.theme ? (t.scheme === 'dark' && t.theme.darkVars ? t.theme.darkVars : t.theme.vars) : {};
      return { accent: raw['--n-accent'] || '#8b7cff', frame: raw['--n-frame'] || 'var(--n-frame)', page: raw['--n-page'] || 'var(--n-page)', name: t && t.theme ? t.theme.name : '' };
    }

    // ================================================================ Appearance

    function miniHtml(cls) {
      return '<span class="mini' + (cls ? ' ' + cls : '') + '">' +
        '<span class="mini__side"><span class="mini__dots"><i></i><i></i><i></i></span><span class="mini__omni"></span>' +
          '<span class="mini__tab is-on"></span><span class="mini__tab"></span><span class="mini__tab is-short"></span></span>' +
        '<span class="mini__card"><span class="mini__h"></span><span class="mini__l"></span><span class="mini__l is-short"></span>' +

            '<button type="button" class="set-theme" role="radio" aria-checked="false" data-tid="' + esc(c.id) + '"' + (c.hint ? ' title="' + esc(c.hint) + '"' : '') + '>' +
              '<span class="set-theme__art">' + (c.auto ? miniHtml('mini--a') + miniHtml('mini--b') : miniHtml()) + '</span>' +
              '<span class="set-theme__meta"><span class="set-theme__name">' + esc(c.name) + '</span>' +
                '<span class="set-theme__scheme" aria-hidden="true">' + (c.auto ? icon('sun', 11) + icon('moon', 11) : icon(c.scheme === 'dark' ? 'moon' : 'sun', 11)) + '</span>' +
                (c.auto ? '<span class="n-sr"> (follows your device)</span>' : '') +

              '<span class="set-theme__check" aria-hidden="true">' + icon('check', 11, { strokeWidth: 3.2 }) + '</span>' +
            '</button>').join('') + '</div>') +
        group('accent', 'Accent color', 'Buttons, highlights and the clock’s colon. Pick one, or any color you like.',
          '<div class="set-accents">' +
            '<div class="set-swatches" role="radiogroup" aria-label="Accent color">' +
              '<button type="button" class="set-swatch set-swatch--auto" role="radio" data-accent="" title="Theme default" aria-label="Theme default"><span class="set-swatch__a">A</span></button>' +
              accents.map((a) => '<button type="button" class="set-swatch" role="radio" data-accent="' + esc(a.color) + '" style="--c:' + esc(a.color) + '" title="' + esc(a.name) + '" aria-label="' + esc(a.name) + '"></button>').join('') +
              '<span class="set-swatch set-swatch--custom" data-part="customsw" title="Pick any color">' +
                '<input type="color" class="set-swatch__input" data-part="color" aria-label="Custom accent color">' +
                '<span class="set-swatch__plus" aria-hidden="true">' + icon('plus', 13, { strokeWidth: 2.6 }) + '</span>' +
              '</span>' +
            '</div>' +
            '<span class="set-accent__value n-mono" data-part="accentval"></span>' +
          '</div>') +
        group('wallpaper', 'Wallpaper', 'Shows behind the tabs and on Home. Text gets a soft backdrop when a wallpaper’s brightness doesn’t match the theme.',
          '<div class="set-walls" role="radiogroup" aria-label="Wallpaper">' + walls.map((w) =>
            '<button type="button" class="set-wall" role="radio" data-wp="' + esc(w.id) + '">' +
              '<span class="set-wall__art"><i></i></span><span class="set-wall__name">' + esc(w.name) + '</span></button>').join('') + '</div>') +
        group('layout', 'Layout', '',
          '<div class="set-layouts" role="radiogroup" aria-label="Tab layout">' +
            '<button type="button" class="set-layout" role="radio" data-layout="vertical">' +
              '<span class="set-layout__art is-v" aria-hidden="true"><span class="la-side"><i></i><i class="on"></i><i></i><i></i></span><span class="la-card"></span></span>' +
              '<span class="set-layout__text"><span class="set-layout__name">Sidebar tabs</span><span class="set-layout__hint">Room for lots of tabs, with titles you can read</span></span>' +
            '</button>' +
            '<button type="button" class="set-layout" role="radio" data-layout="horizontal">' +
              '<span class="set-layout__art is-h" aria-hidden="true"><span class="la-top"><i class="on"></i><i></i><i></i></span><span class="la-bar"></span><span class="la-card"></span></span>' +
              '<span class="set-layout__text"><span class="set-layout__name">Top tabs</span><span class="set-layout__hint">The classic browser look, more room for pages</span></span>' +
            '</button>' +
          '</div>' +
          '<div class="set-list set-list--after" data-part="sidebaropts">' +
            row('Sidebar side', 'Which edge the tab list sits on', seg('sidebarSide', [{ value: 'left', label: 'Left', icon: 'panel-left' }, { value: 'right', label: 'Right', icon: 'panel-right' }], 'Sidebar side'), { cls: 'is-vonly' }) +
            row('Sidebar width', 'Wider shows longer tab titles', range('sidebarWidth', 'Sidebar width'), { cls: 'is-vonly' }) +
            row('Hide the sidebar', 'Point at the window edge to peek at your tabs', sw('sidebarCollapsed', 'Hide the sidebar'), { cls: 'is-vonly' }) +
          '</div>') +
        group('shape', 'Window shape', '',
          '<div class="set-list">' +
            row('Density', 'Compact fits more on a small screen', seg('density', [{ value: 'comfortable', label: 'Comfortable' }, { value: 'compact', label: 'Compact' }], 'Density')) +
            row('Corner radius', 'From sharp to extra round', range('cornerRadius', 'Corner radius')) +
            row('Page inset', 'Space between the page and the window frame', range('contentInset', 'Page inset')) +
          '</div>') +
        group('font', 'Font', 'Used everywhere in Nova. Headings and the clock get a matching display style.',
          '<div class="set-fonts" role="radiogroup" aria-label="Font">' + fonts.map((f) =>
            '<button type="button" class="set-font" role="radio" data-font="' + esc(f.id) + '">' +
              '<span class="set-font__aa" data-stack="' + esc(f.id) + '">Aa</span>' +
              '<span class="set-font__name">' + esc(f.label) + '</span>' +
              '<span class="set-font__sample" data-stack="' + esc(f.id) + '">' + esc(fontSample(f.id)) + '</span>' +
            '</button>').join('') + '</div>');

      // Font previews use the real stacks.
      page.querySelectorAll('[data-stack]').forEach((n) => {
        const f = fonts.find((x) => x.id === n.getAttribute('data-stack'));
        if (f) n.style.fontFamily = f.id === 'system' && n.classList.contains('set-font__aa') ? '"Bricolage Grotesque", ' + f.stack : f.stack;
      });
      // Wallpaper swatches.
      page.querySelectorAll('.set-wall').forEach((b) => {
        const w = (N.themes.wallpapers || []).find((x) => x.id === b.getAttribute('data-wp'));
        if (w) b.querySelector('.set-wall__art').style.background = w.css;
      });

      const themesEl = page.querySelector('.set-themes');
      const swatches = page.querySelector('.set-swatches');
      const colorIn = page.querySelector('[data-part="color"]');
      const customSw = page.querySelector('[data-part="customsw"]');
      const accentVal = page.querySelector('[data-part="accentval"]');
      const wallsEl = page.querySelector('.set-walls');
      const layoutsEl = page.querySelector('.set-layouts');
      const sideOpts = page.querySelector('[data-part="sidebaropts"]');
      const fontsEl = page.querySelector('.set-fonts');
      let lastPreviewKey = '';

      themesEl.addEventListener('click', (e) => {
        const b = e.target.closest('.set-theme');
        if (b) updateNow({ theme: b.getAttribute('data-tid') });
      });
      swatches.addEventListener('click', (e) => {
        const b = e.target.closest('button.set-swatch');
        if (b) updateNow({ accent: b.getAttribute('data-accent') || null });
      });
      colorIn.addEventListener('input', () => update({ accent: colorIn.value }));
      colorIn.addEventListener('change', () => updateNow({ accent: colorIn.value }));
      wallsEl.addEventListener('click', (e) => {
        const b = e.target.closest('.set-wall');
        if (b) updateNow({ wallpaper: b.getAttribute('data-wp') });
      });
      layoutsEl.addEventListener('click', (e) => {
        const b = e.target.closest('.set-layout');
        if (b) updateNow({ layout: b.getAttribute('data-layout') });
      });
      fontsEl.addEventListener('click', (e) => {
        const b = e.target.closest('.set-font');
        if (b) updateNow({ font: b.getAttribute('data-font') });
      });

      syncers.push((s) => {
        const d = themeDefaults();
        // Theme gallery
        syncRadios(themesEl, (b) => b.getAttribute('data-tid') === s.theme);
        themesEl.classList.toggle('is-h', s.layout === 'horizontal');
        const key = [s.accent, s.cornerRadius, s.font, s.density, Theme.systemPrefersDark()].join('|');
        if (key !== lastPreviewKey) {
          lastPreviewKey = key;
          themesEl.querySelectorAll('.set-theme').forEach((b) => {
            const id = b.getAttribute('data-tid');
            if (id === 'auto') {
              applyVars(b.querySelector('.mini--a'), previewFor('midnight', s));
              applyVars(b.querySelector('.mini--b'), previewFor('daylight', s));
            } else applyVars(b.querySelector('.mini'), previewFor(id, s));
          });
        }
        // Accent
        const acc = hexOk(s.accent) ? s.accent.toLowerCase() : '';
        const preset = accents.some((a) => a.color.toLowerCase() === acc);
        syncRadios(swatches, (b) => (b.getAttribute('data-accent') || '').toLowerCase() === acc);
        const autoSw = swatches.querySelector('.set-swatch--auto');
        autoSw.style.setProperty('--c', d.accent);
        autoSw.title = 'Theme default (' + d.name + ')';
        customSw.classList.toggle('is-on', !!acc && !preset);
        customSw.style.setProperty('--c', acc && !preset ? acc : 'transparent');
        if (document.activeElement !== colorIn) colorIn.value = acc || (hexOk(d.accent) ? d.accent : '#8b7cff');
        accentVal.textContent = acc ? acc.toUpperCase() : 'Theme default';
        // Wallpapers
        syncRadios(wallsEl, (b) => b.getAttribute('data-wp') === s.wallpaper);
        const none = wallsEl.querySelector('[data-wp="none"] .set-wall__art');
        if (none) none.style.background = d.frame;
        wallsEl.style.setProperty('--wall-page', d.page);
        // Layout
        syncRadios(layoutsEl, (b) => b.getAttribute('data-layout') === s.layout);
        const vertical = s.layout !== 'horizontal';
        sideOpts.classList.toggle('is-disabled', !vertical);
        sideOpts.querySelectorAll('input').forEach((i) => { i.disabled = !vertical; });
        layoutsEl.classList.toggle('is-right', s.sidebarSide === 'right');
        // Fonts
        syncRadios(fontsEl, (b) => b.getAttribute('data-font') === s.font);
      });
      bindGeneric(page);
    }

    function fontSample(id) {
      return { system: 'Clear and friendly', rounded: 'Soft and bubbly', serif: 'Bookish and classy', mono: 'Like a code editor' }[id] || '';
    }

    // ================================================================ Home

    function buildHome(page) {
      page.innerHTML = pageHead(SECTIONS[1]) +
        group('you', 'You', '',
          '<div class="set-list">' +
            row('Your name', 'Shown in the greeting. Leave it empty for just “Good morning”.',
              '<input class="n-input set-name" data-part="name" maxlength="40" placeholder="Your name" aria-labelledby="{{labelledby}}">', { cls: 'set-row--field' }) +
            row('Clock', '', seg('clock24', [{ value: 'false', label: '12-hour' }, { value: 'true', label: '24-hour' }], 'Clock format'), { attr: ' data-part="clockrow"' }) +
          '</div>') +
        group('widgets', 'Widgets', 'Choose what shows up on every new tab.',
          '<div class="set-list">' + WIDGETS.map((w) => row(w.label, esc(w.hint), sw('home.' + w.key, w.label), { icon: w.icon })).join('') + '</div>') +
        group('welcome', 'Welcome card', '',
          '<div class="set-list">' +
            row('“Make Nova yours”', 'The first-run card with the name, theme and layout pickers',
              '<button type="button" class="n-btn n-btn--sm" data-act="welcome">' + icon('sparkles', 14) + '<span>Show again</span></button>') +
          '</div>');

      const nameIn = page.querySelector('[data-part="name"]');
      const clockRow = page.querySelector('[data-part="clockrow"] .set-row__hint') || null;
      let nameTimer = null;
      nameIn.addEventListener('input', () => {
        clearTimeout(nameTimer);
        nameTimer = setTimeout(() => updateNow({ name: nameIn.value }), 300);
      });
      nameIn.addEventListener('change', () => { clearTimeout(nameTimer); updateNow({ name: nameIn.value }); });
      page.addEventListener('click', (e) => {
        if (e.target.closest('[data-act="welcome"]')) {
          updateNow({ onboarded: false });
          N.ui.toast('The welcome card is back on Home', { action: { label: 'Open Home', onClick: () => N.tabs.open('home') } });
        }
      });
      const labelEl = page.querySelector('[data-part="clockrow"] .set-row__label');
      syncers.push((s) => {
        if (document.activeElement !== nameIn) nameIn.value = s.name;
        const now = new Date();
        const h = now.getHours();
        const m = String(now.getMinutes()).padStart(2, '0');
        labelEl.innerHTML = 'Clock <span class="set-row__example">' + (s.clock24 ? String(h).padStart(2, '0') + ':' + m : (h % 12 || 12) + ':' + m + ' ' + (h < 12 ? 'am' : 'pm')) + '</span>';
        void clockRow;
      });
      bindGeneric(page);
    }

    // ================================================================ Search

    function buildSearch(page) {
      const engines = N.themes.searchEngines || {};
      const ids = Object.keys(engines);
      const name = U.uid('eng');
      page.innerHTML = pageHead(SECTIONS[2]) +
        group('engine', 'Search engine', '',
          '<div class="set-list set-engines" role="radiogroup" aria-label="Search engine">' + ids.map((id) => {
            const e = engines[id];
            const host = U.hostOf(e.search.replace('%s', 'x'));
            return '<label class="set-choice">' +
              '<input type="radio" class="n-sr" name="' + name + '" value="' + esc(id) + '">' +
              '<span class="n-favicon" style="--c:' + (ENGINE_COLORS[id] || '#4a5a80') + ';--fav-size:30px">' + esc(e.name.charAt(0)) + '</span>' +
              '<span class="set-choice__text"><span class="set-choice__name">' + esc(e.name) + '</span><span class="set-choice__sub">' + esc(host) + '</span></span>' +
              '<span class="set-choice__radio" aria-hidden="true">' + icon('check', 12, { strokeWidth: 3.2 }) + '</span>' +
            '</label>';
          }).join('') + '</div>') +
        group('try', 'How the address bar decides', 'Type anything into the address bar or the Home search box:',
          '<div class="set-list set-explain">' +
            '<div class="set-explain__row"><code class="set-code">nova:notes</code><span>opens a Nova app (also just <code class="set-code">notes</code>)</span></div>' +
            '<div class="set-explain__row"><code class="set-code">desmos</code><span>opens one of your quick links or a known site</span></div>' +
            '<div class="set-explain__row"><code class="set-code">wikipedia.org</code><span>opens that website</span></div>' +
            '<div class="set-explain__row"><code class="set-code">photosynthesis</code><span data-part="searchto"></span></div>' +
          '</div>' +
          '<p class="set-note">' + icon('info', 13) + '<span>Nova can’t show live search suggestions as you type (pages like this aren’t allowed to talk to search engines in the background), so it suggests your apps, quick links and recent sites instead.</span></p>');
      const list = page.querySelector('.set-engines');
      const to = page.querySelector('[data-part="searchto"]');
      list.addEventListener('change', (e) => { if (e.target.name === name) updateNow({ searchEngine: e.target.value }); });
      syncers.push((s) => {
        list.querySelectorAll('input').forEach((i) => { i.checked = i.value === s.searchEngine; });
        const eng = engines[s.searchEngine] || engines.google || { name: 'Google' };
        to.innerHTML = 'searches ' + esc(eng.name) + ' inside Nova: <span class="set-url n-mono">' + esc(U.prettyUrl(N.sites.realTabUrl(N.searchUrl('photosynthesis')))) + '</span>';
      });
    }

    // ================================================================ Quick links

    function buildLinks(page) {
      page.innerHTML = pageHead(SECTIONS[3]) +
        group('add', 'Add a link', '',
          '<form class="set-addlink" novalidate>' +
            '<input class="n-input" name="title" maxlength="60" placeholder="Name (optional)" aria-label="Name">' +
            '<input class="n-input" name="url" inputmode="url" spellcheck="false" autocapitalize="off" placeholder="Web address, e.g. desmos.com/calculator" aria-label="Web address">' +
            '<button type="submit" class="n-btn n-btn--primary">' + icon('plus', 15) + '<span>Add</span></button>' +
            '<div class="set-addlink__err n-hint" role="alert"></div>' +
          '</form>') +
        group('list', 'Your links <span class="set-count" data-part="count"></span>', 'Drag the handle or use the arrows to reorder. Edits save when you leave a field.',
          '<ul class="set-list set-links" data-part="links"></ul>' +
          '<div class="set-links__foot"><button type="button" class="n-btn n-btn--ghost n-btn--sm" data-act="reset-links">' + icon('rotate-cw', 13) + '<span>Reset to the default links</span></button></div>') +
        group('popular', 'Popular for school', 'One click adds a tile.',
          '<div class="set-popular" data-part="popular"></div>');

      const form = page.querySelector('.set-addlink');
      const err = form.querySelector('.set-addlink__err');
      const listEl = page.querySelector('[data-part="links"]');
      const countEl = page.querySelector('[data-part="count"]');
      const popEl = page.querySelector('[data-part="popular"]');
      let deferred = false;
      let drag = null;

      function getLinks() {
        const l = N.data.get('links');
        return Array.isArray(l) ? l : [];
      }
      function validUrl(raw) {
        raw = String(raw || '').trim();
        if (!raw || !(U.isUrlish(raw) || /^https?:\/\/\S+$/i.test(raw))) return '';
        return U.normalizeUrl(raw);
      }
      function where(url) {
        // Every link opens in a Nova tab; this says whether the site will actually show there.
        const inside = N.env.canEmbed && N.sites.isEmbeddable(url);
        return '<span class="set-where' + (inside ? ' is-inside' : '') + '" title="' + (inside ? 'Shows inside a Nova tab' : 'Opens in a Nova tab, but this site usually refuses to be shown there — use “Open in new tab” in the tab’s top bar') + '">' +
          icon(inside ? 'layers' : 'external-link', 12) + '<span>' + (inside ? 'Shows in Nova' : 'Needs new tab') + '</span></span>';
      }

      function render() {
        if (listEl.contains(document.activeElement) || drag) { deferred = true; return; }
        deferred = false;
        const links = getLinks();
        countEl.textContent = links.length ? String(links.length) : '';
        if (!links.length) {
          listEl.innerHTML = '<li class="set-links__empty">No quick links. Add one above, or pick from the popular sites below.</li>';
        } else {
          listEl.innerHTML = links.map((l, i) => {
            const f = U.favicon(l.url, l.title, l.color);
            return '<li class="set-link" data-id="' + esc(l.id) + '">' +
              '<span class="set-link__grip" data-grip title="Drag to reorder" aria-hidden="true">' + icon('grip', 14) + '</span>' +
              '<span class="n-favicon" style="--c:' + esc(f.color) + ';--fav-size:28px">' + esc(f.letter) + '</span>' +
              '<span class="set-link__fields">' +
                '<input class="n-input set-link__title" data-field="title" value="' + esc(l.title) + '" maxlength="60" aria-label="Name for ' + esc(l.title) + '">' +
                '<input class="n-input set-link__url" data-field="url" value="' + esc(U.prettyUrl(l.url)) + '" spellcheck="false" autocapitalize="off" aria-label="Address for ' + esc(l.title) + '">' +
              '</span>' +
              where(l.url) +
              '<span class="set-link__btns">' +
                '<button type="button" class="n-btn n-btn--ghost n-btn--icon n-btn--sm" data-move="-1" aria-label="Move ' + esc(l.title) + ' up" title="Move up"' + (i === 0 ? ' disabled' : '') + '>' + icon('chevron-up', 15) + '</button>' +
                '<button type="button" class="n-btn n-btn--ghost n-btn--icon n-btn--sm" data-move="1" aria-label="Move ' + esc(l.title) + ' down" title="Move down"' + (i === links.length - 1 ? ' disabled' : '') + '>' + icon('chevron-down', 15) + '</button>' +
                '<button type="button" class="n-btn n-btn--ghost n-btn--icon n-btn--sm n-btn--danger" data-del aria-label="Remove ' + esc(l.title) + '" title="Remove">' + icon('trash', 14) + '</button>' +
              '</span>' +
            '</li>';
          }).join('');
        }
        renderPopular(links);
      }

      function renderPopular(links) {
        const have = new Set();
        links.forEach((l) => { const s = N.sites.lookup(l.url); if (s) have.add(s.id); });
        const picks = N.sites.catalog.filter((s) => !have.has(s.id)).slice(0, 18);
        popEl.innerHTML = picks.length
          ? picks.map((s) => '<button type="button" class="set-pop" data-site="' + esc(s.id) + '" title="Add ' + esc(s.name) + '">' +
              '<span class="n-favicon" style="--c:' + esc(s.color) + ';--fav-size:18px">' + esc(U.monogram(s.short || s.name).letter) + '</span>' +
              '<span>' + esc(s.short || s.name) + '</span>' + icon('plus', 12, { strokeWidth: 2.4 }) + '</button>').join('')
          : '<span class="n-hint">You’ve added every site Nova knows about. Impressive.</span>';
      }

      function save(next) { N.data.set('links', next); }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const urlIn = form.querySelector('[name="url"]');
        const titleIn = form.querySelector('[name="title"]');
        const url = validUrl(urlIn.value);
        if (!url) {
          urlIn.setAttribute('aria-invalid', 'true');
          err.textContent = urlIn.value.trim() ? 'That doesn’t look like a web address — try something like desmos.com' : 'Type a web address first.';
          urlIn.focus();
          return;
        }
        const title = (titleIn.value.trim() || N.sites.nameFor(url)).slice(0, 60);
        save(getLinks().concat([{ id: U.uid('link'), title, url }]));
        urlIn.value = '';
        titleIn.value = '';
        urlIn.removeAttribute('aria-invalid');
        err.textContent = '';
        N.ui.toast('Added ' + title + ' to your quick links');
        titleIn.focus();
      });
      form.addEventListener('input', (e) => {
        if (e.target.name === 'url') { e.target.removeAttribute('aria-invalid'); err.textContent = ''; }
      });

      listEl.addEventListener('change', (e) => {
        const input = e.target.closest('[data-field]');
        if (!input) return;
        const li = input.closest('.set-link');
        const links = getLinks();
        const l = links.find((x) => x.id === li.getAttribute('data-id'));
        if (!l) return;
        if (input.getAttribute('data-field') === 'title') {
          l.title = input.value.trim() || N.sites.nameFor(l.url);
          input.value = l.title;
        } else {
          const url = validUrl(input.value);
          if (!url) {
            input.setAttribute('aria-invalid', 'true');
            N.ui.toast('That address doesn’t look right, so the old one was kept');
            input.value = U.prettyUrl(l.url);
            setTimeout(() => input.removeAttribute('aria-invalid'), 1600);
            return;
          }
          l.url = url;
        }
        save(links);
      });
      listEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.matches('[data-field]')) { e.preventDefault(); e.target.blur(); }
        if (e.key === 'Escape' && e.target.matches('[data-field]')) {
          const li = e.target.closest('.set-link');
          const l = getLinks().find((x) => x.id === li.getAttribute('data-id'));
          if (l) e.target.value = e.target.getAttribute('data-field') === 'title' ? l.title : U.prettyUrl(l.url);
          e.target.blur();
        }
      });
      listEl.addEventListener('focusout', () => {
        setTimeout(() => { if (deferred && !listEl.contains(document.activeElement)) render(); }, 0);
      });
      listEl.addEventListener('click', (e) => {
        const li = e.target.closest('.set-link');
        if (!li) return;
        const id = li.getAttribute('data-id');
        const links = getLinks();
        const i = links.findIndex((x) => x.id === id);
        if (i < 0) return;
        const mv = e.target.closest('[data-move]');
        if (mv) {
          const j = i + Number(mv.getAttribute('data-move'));
          if (j < 0 || j >= links.length) return;
          const item = links.splice(i, 1)[0];
          links.splice(j, 0, item);
          save(links);
          render();
          const btn = listEl.querySelector('.set-link[data-id="' + CSS.escape(id) + '"] [data-move="' + mv.getAttribute('data-move') + '"]');
          const fallback = listEl.querySelector('.set-link[data-id="' + CSS.escape(id) + '"] [data-move]:not(:disabled)');
          (btn && !btn.disabled ? btn : fallback || listEl).focus();
          return;
        }
        if (e.target.closest('[data-del]')) {
          const removed = links.splice(i, 1)[0];
          save(links);
          render();
          const next = listEl.querySelectorAll('.set-link [data-del]')[Math.min(i, links.length - 1)];
          if (next) next.focus();
          N.ui.toast('Removed ' + removed.title, {
            action: {
              label: 'Undo',
              onClick() {
                const cur = getLinks();
                if (cur.some((x) => x.id === removed.id)) return;
                cur.splice(Math.min(i, cur.length), 0, removed);
                save(cur);
              },
            },
          });
        }
      });

      // Drag the grip to reorder (pointer events → mouse, touch and stylus).
      listEl.addEventListener('pointerdown', (e) => {
        const grip = e.target.closest('[data-grip]');
        if (!grip || e.button !== 0) return;
        const li = grip.closest('.set-link');
        e.preventDefault();
        if (document.activeElement && listEl.contains(document.activeElement)) document.activeElement.blur();
        const top = listEl.getBoundingClientRect().top;
        drag = { li, pointerId: e.pointerId, oy: e.clientY - top - li.offsetTop };
        li.classList.add('is-dragging');
        listEl.classList.add('is-sorting');
        try { listEl.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      });
      listEl.addEventListener('pointermove', (e) => {
        if (!drag || e.pointerId !== drag.pointerId) return;
        e.preventDefault();
        const y = e.clientY - listEl.getBoundingClientRect().top;
        const rows = Array.from(listEl.querySelectorAll('.set-link:not(.is-dragging)'));
        const before = rows.find((r) => y < r.offsetTop + r.offsetHeight / 2);
        const firstPos = rows.map((r) => ({ r, y: r.offsetTop }));
        const prevNext = drag.li.nextElementSibling;
        if (before) { if (before !== drag.li.nextElementSibling) listEl.insertBefore(drag.li, before); } else if (listEl.lastElementChild !== drag.li) listEl.appendChild(drag.li);
        if (drag.li.nextElementSibling !== prevNext && !N.env.reducedMotion) {
          firstPos.forEach((f) => {
            const dy = f.y - f.r.offsetTop;
            if (!dy) return;
            f.r.style.transition = 'none';
            f.r.style.transform = 'translateY(' + dy + 'px)';
            f.r.getBoundingClientRect();
            f.r.style.transition = '';
            f.r.style.transform = '';
          });
        }
        drag.li.style.transform = 'translateY(' + (y - drag.oy - drag.li.offsetTop) + 'px)';
      });
      function endListDrag(e) {
        if (!drag || (e && e.pointerId !== drag.pointerId)) return;
        const li = drag.li;
        li.classList.remove('is-dragging');
        listEl.classList.remove('is-sorting');
        li.style.transform = '';
        drag = null;
        const ids = Array.from(listEl.querySelectorAll('.set-link')).map((n) => n.getAttribute('data-id'));
        const links = getLinks();
        const byId = new Map(links.map((l) => [l.id, l]));
        const next = ids.map((id) => byId.get(id)).filter(Boolean);
        links.forEach((l) => { if (ids.indexOf(l.id) === -1) next.push(l); });
        if (next.map((l) => l.id).join() !== links.map((l) => l.id).join()) save(next);
        render();
      }
      listEl.addEventListener('pointerup', endListDrag);
      listEl.addEventListener('pointercancel', endListDrag);

      popEl.addEventListener('click', (e) => {
        const b = e.target.closest('[data-site]');
        if (!b) return;
        const s = N.sites.byId(b.getAttribute('data-site'));
        if (!s) return;
        save(getLinks().concat([{ id: U.uid('link'), title: s.short || s.name, url: s.url, color: s.color }]));
        N.ui.toast('Added ' + (s.short || s.name) + ' to your quick links');
      });

      page.querySelector('[data-act="reset-links"]').addEventListener('click', async () => {
        const ok = await N.ui.confirm({
          title: 'Reset your quick links?',
          message: 'This puts back the ' + N.sites.defaultLinks.length + ' default school links and removes any you added.',
          confirmLabel: 'Reset links',
          danger: true,
        });
        if (!ok) return;
        save(N.sites.defaultLinks.map((l) => Object.assign({}, l)));
        N.ui.toast('Quick links reset');
      });

    // ================================================================ Keyboard

    // ================================================================ Sync & data

    function buildSync(page) {
      page.innerHTML = pageHead(SECTIONS[5]) +
        group('status', 'Sync', '',
          '<div class="set-sync" data-part="status"></div>' +
          '<div class="set-synced">' +
            '<div class="set-synced__col"><div class="set-synced__h">' + icon('rotate-cw', 13) + 'Syncs between devices</div>' +
              '<div class="set-synced__chips"><span class="n-chip">Settings &amp; theme</span><span class="n-chip">Quick links</span><span class="n-chip">Notes</span><span class="n-chip">Tasks</span></div></div>' +
            '<div class="set-synced__col"><div class="set-synced__h">' + icon('lock', 13) + 'Stays on this device</div>' +
              '<div class="set-synced__chips"><span class="n-chip">Open tabs</span><span class="n-chip">Focus timer</span><span class="n-chip">Whiteboard</span><span class="n-chip">Recent sites</span></div></div>' +
          '</div>') +
        group('backup', 'Back up', 'Copies everything that syncs as text. Paste it into a note, a doc or an email to yourself.',
          '<div class="set-card">' +
            '<div class="set-backup__row">' +
              '<button type="button" class="n-btn n-btn--primary" data-act="copy">' + icon('copy', 15) + '<span>Copy backup</span></button>' +
              '<button type="button" class="n-btn" data-act="show" aria-expanded="false">' + icon('file', 15) + '<span>Show as text</span></button>' +
              '<span class="set-backup__stats n-hint" data-part="stats"></span>' +
            '</div>' +
            '<div class="set-backup__text" data-part="exportbox" hidden>' +
              '<textarea class="n-textarea set-json" data-part="export" readonly spellcheck="false" aria-label="Backup text"></textarea>' +
              '<div class="n-hint" data-part="exporthint">Click inside, press ' + kbd([N.env.mod || 'Ctrl', 'A']) + ' then ' + kbd([N.env.mod || 'Ctrl', 'C']) + ' to copy it yourself.</div>' +
            '</div>' +
          '</div>') +
        group('restore', 'Restore', 'Paste a backup you copied earlier. You’ll get to confirm before anything changes.',
          '<div class="set-card">' +
            '<textarea class="n-textarea set-json" data-part="import" spellcheck="false" placeholder="Paste a Nova backup here — it starts with {&quot;app&quot;: &quot;nova&quot;" aria-label="Backup to restore"></textarea>' +
            '<div class="set-restore__err n-hint" data-part="importerr" role="alert"></div>' +
            '<div class="set-backup__row"><button type="button" class="n-btn" data-act="restore" disabled>' + icon('download', 15) + '<span>Restore backup</span></button>' +
              '<span class="n-hint" data-part="importinfo"></span></div>' +
          '</div>') +
        group('danger', 'Start fresh', '',
          '<div class="set-list set-danger">' +
            row('Clear recent sites', 'Forget the sites and searches the address bar suggests', '<button type="button" class="n-btn n-btn--sm" data-act="recents"><span>Clear</span></button>', { attr: ' data-part="recentsrow"' }) +
            row('Reset settings', 'Theme, layout, name and Home widgets go back to how they started. Notes, tasks and links stay.', '<button type="button" class="n-btn n-btn--sm n-btn--danger" data-act="reset-settings"><span>Reset</span></button>') +
            row('Erase everything', 'Resets settings and deletes all notes, tasks and quick links — everywhere Nova syncs. On this device it also signs out of Spotify and clears recent sites.', '<button type="button" class="n-btn n-btn--sm n-btn--danger n-btn--primary" data-act="erase"><span>Erase…</span></button>') +
          '</div>');

      const statusEl = page.querySelector('[data-part="status"]');
      const stats = page.querySelector('[data-part="stats"]');
      const exportBox = page.querySelector('[data-part="exportbox"]');
      const exportTa = page.querySelector('[data-part="export"]');
      const exportHint = page.querySelector('[data-part="exporthint"]');
      const showBtn = page.querySelector('[data-act="show"]');
      const importTa = page.querySelector('[data-part="import"]');
      const importErr = page.querySelector('[data-part="importerr"]');
      const importInfo = page.querySelector('[data-part="importinfo"]');
      const restoreBtn = page.querySelector('[data-act="restore"]');
      const recentsRow = page.querySelector('[data-part="recentsrow"]');

      function backupText() { return JSON.stringify(N.backup.export(), null, 2); }

      function refreshStats() {
        const b = N.backup.export();
        const text = JSON.stringify(b, null, 2);
        stats.textContent = [plural(b.links.length, 'link'), plural(b.notes.length, 'note'), plural(b.tasks.length, 'task'), fmtBytes(new Blob([text]).size)].join(' · ');
        if (!exportBox.hidden) exportTa.value = text;
        const n = N.recents.list().length;
        const btn = recentsRow.querySelector('button');
        btn.disabled = !n;
        recentsRow.querySelector('.set-row__hint').textContent = n
          ? 'Forget ' + plural(n, 'recent site or search', 'recent sites and searches') + ' the address bar suggests'
          : 'Nothing to clear right now';
      }

      function renderStatus() {
        const st = syncStatus || { state: 'off' };
        const map = {
          off: { tone: 'off', ic: icon('wifi-off', 18), title: 'Sync is off' },
          connecting: { tone: 'busy', ic: '<span class="n-spinner"></span>', title: 'Connecting…' },
          saving: { tone: 'busy', ic: '<span class="n-spinner"></span>', title: 'Saving…' },
          synced: { tone: 'ok', ic: icon('check', 18, { strokeWidth: 2.6 }), title: 'Synced' },
          error: { tone: 'err', ic: icon('alert-triangle', 18), title: st.warning ? 'Some things stay on this device' : 'Sync hit a problem' },
        };
        const m = map[st.state] || map.off;
        let detail = st.message && st.message !== m.title ? st.message : '';
        if (st.state === 'synced' && st.lastSyncedAt) detail = 'Last synced ' + U.fmtRelative(st.lastSyncedAt);
        let extra = '';
        if (st.state === 'off') {
          extra = N.env.isArtifact
            ? 'Your stuff is saved in this browser for now.'
            : (N.env.variant === 'public'
              ? 'You’re using the GitHub Pages copy, so everything is saved in this browser only. Open Nova from your claude.ai link to sync between devices.'
              : 'You’re using the downloaded file, so everything is saved in this browser only. Open Nova from your claude.ai link to sync between devices.');
        } else if (st.state === 'synced' || st.state === 'saving') {
          extra = 'Changes save to your claude.ai account and show up on your other devices.';
        }
        statusEl.className = 'set-sync is-' + m.tone;
        statusEl.innerHTML =
          '<span class="set-sync__ic">' + m.ic + '</span>' +
          '<div class="set-sync__text"><div class="set-sync__title">' + esc(m.title) + '</div>' +
            (detail ? '<div class="set-sync__msg">' + esc(detail) + '</div>' : '') +
            (extra ? '<div class="set-sync__extra n-hint">' + esc(extra) + '</div>' : '') + '</div>' +
          (st.state === 'error' && !st.warning ? '<button type="button" class="n-btn n-btn--sm" data-act="retry">' + icon('rotate-cw', 14) + '<span>Try again</span></button>' : '');
      }

      function selectExport() { exportTa.focus(); exportTa.select(); }

      page.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-act]');
        if (!b) return;
        const act = b.getAttribute('data-act');
        if (act === 'retry') { N.sync.retry(); return; }
        if (act === 'copy') {
          const text = backupText();
          const ok = await U.copyText(text);
          if (ok) {
            N.ui.toast('Backup copied — paste it somewhere safe');
          } else {
            exportTa.value = text;
            exportBox.hidden = false;
            showBtn.setAttribute('aria-expanded', 'true');
            exportHint.innerHTML = '<b>Copy didn’t work here.</b> The backup is selected — press ' + kbd([N.env.mod || 'Ctrl', 'C']) + ' to copy it.';
            selectExport();
          }
          return;
        }
        if (act === 'show') {
          const open = exportBox.hidden;
          exportBox.hidden = !open;
          b.setAttribute('aria-expanded', String(open));
          b.querySelector('span').textContent = open ? 'Hide text' : 'Show as text';
          if (open) { exportTa.value = backupText(); exportTa.scrollTop = 0; }
          return;
        }
        if (act === 'restore') { doRestore(); return; }
        if (act === 'recents') {
          N.recents.clear();
          N.ui.toast('Recent sites cleared');
          refreshStats();
          return;
        }
        if (act === 'reset-settings') {
          const ok = await N.ui.confirm({ title: 'Reset all settings?', message: 'Your theme, layout, name, search engine and Home widgets go back to the defaults. Notes, tasks and quick links aren’t touched.', confirmLabel: 'Reset settings', danger: true });
          if (!ok) return;
          N.settings.reset();
          N.ui.toast('Settings reset');
          return;
        }
        if (act === 'erase') {
          const ok = await N.ui.confirm({
            title: 'Erase everything?',
            message: 'This deletes all your notes and tasks, resets your quick links and settings — on every device that syncs — and, on this device, signs you out of Spotify and clears your recent sites. Copy a backup first if you might want anything back.',
            confirmLabel: 'Erase everything',
            danger: true,
          });
          if (!ok) return;
          N.backup.resetAll();
          N.ui.toast('Nova has been reset. Fresh start!');
        }
      });

      function parseBackup(raw) {
        let obj = null;
        try { obj = JSON.parse(raw); } catch (_) {
          return { error: 'That isn’t a complete backup — make sure you pasted everything from the first { to the last }.' };
        }
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { error: 'That isn’t a Nova backup.' };
        if (obj.app && obj.app !== 'nova') return { error: 'That backup is from a different app.' };
        const parts = [];
        if (obj.settings && typeof obj.settings === 'object' && !Array.isArray(obj.settings)) parts.push('settings');
        ['links', 'notes', 'tasks'].forEach((k) => {
          if (Array.isArray(obj[k])) parts.push(plural(obj[k].length, k === 'links' ? 'quick link' : k.slice(0, -1)));
        });
        if (!parts.length) return { error: 'No Nova settings, links, notes or tasks found in that text.' };
        return { obj, parts };
      }

      function listText(parts) {
        return parts.length > 1 ? parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1] : parts[0];
      }

      importTa.addEventListener('input', () => {
        importErr.textContent = '';
        importTa.removeAttribute('aria-invalid');
        const raw = importTa.value.trim();
        restoreBtn.disabled = !raw;
        if (!raw) { importInfo.textContent = ''; return; }
        const r = parseBackup(raw);
        importInfo.textContent = r.error ? '' : 'Found ' + listText(r.parts);
      });

      async function doRestore() {
        const raw = importTa.value.trim();
        if (!raw) return;
        const r = parseBackup(raw);
        if (r.error) {
          importErr.textContent = r.error;
          importTa.setAttribute('aria-invalid', 'true');
          return;
        }
        const syncing = syncStatus && (syncStatus.state === 'synced' || syncStatus.state === 'saving');
        const ok = await N.ui.confirm({
          title: 'Restore this backup?',
          message: 'This replaces your ' + listText(r.parts) + (syncing ? ' on every device that syncs' : ' in this browser') + '. Anything the backup doesn’t include stays as it is.',
          confirmLabel: 'Restore',
          danger: true,
        });
        if (!ok) return;
        const res = N.backup.import(r.obj);
        if (res.ok) {
          importTa.value = '';
          restoreBtn.disabled = true;
          importInfo.textContent = '';
          N.ui.toast('Backup restored');
          refreshStats();
        } else {
          importErr.textContent = res.error || 'That backup couldn’t be restored.';
        }
      }

      page.__refreshSync = renderStatus;
      page.__refreshStats = refreshStats;
      renderStatus();
      refreshStats();
    }

    // ================================================================ About

    // What leaves the page differs by copy: the claude.ai one only syncs; the others also talk to the sites you search or open.
    function creditNote() {
      if (N.env.isArtifact) return 'Made for Jack. Nothing you type leaves this page except through sync to your own claude.ai account.';

      const inside = N.sites.catalog.filter((s) => s.embed);

      const chip = (s) => '<span class="set-site"><span class="n-favicon" style="--c:' + esc(s.color) + ';--fav-size:16px">' + esc(U.monogram(s.short || s.name).letter) + '</span>' + esc(s.short || s.name) + '</span>';

      const envNote = page.querySelector('[data-part="envnote"]');

        envNote.innerHTML = N.env.isArtifact
          ? icon('info', 13) + '<span>Right now you’re using the <b>claude.ai version</b>. That page doesn’t allow any frames at all, so no website can show inside Nova here — use <b>Open in new tab</b> in a tab’s top bar. Your apps, notes and tasks work exactly the same. The GitHub Pages copy and the downloaded <b>nova.html</b> file can show the friendly sites inside.</span>'
