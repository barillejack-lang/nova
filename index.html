        if (e.shiftKey) { if (!Nova.tabs.reopenClosed()) toast('No closed tabs to reopen'); }
        else Nova.tabs.open('home');
        break;
      case 'KeyW': if (e.shiftKey) handled = false; else if (t) Nova.tabs.close(t.id); break;
      case 'KeyJ': Nova.tabs.cycle(1); break;
      case 'KeyK': Nova.tabs.cycle(-1); break;
      case 'KeyS': toggleSidebar(); break;
      case 'KeyL': toggleLayout(); break;
      case 'KeyN': newNote(); break;
      case 'KeyF': toggleFullscreen(); break;
      default: handled = false;
    }
    if (handled) { e.preventDefault(); Tip.hide(true); }
  }

  function focusOmnibox(text) {
    Pop.closeAll((e) => !e.modal);
    if (S.mode === 'vertical' && S.collapsed) setPeek(true);
    if (S.mode === 'narrow') closeDrawer();
    Omni.focus(text);
  }

  /** Keeps <meta name="theme-color"> (the installed app's title bar, the phone's address bar) on the theme. */
  function syncThemeColor(res) {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta && res && /^#[0-9a-f]{6}$/i.test(res.windowBg || '')) meta.setAttribute('content', res.windowBg);
  }

  // ================================================================ init

  function onTabs(p) {
    S.tabs = Array.isArray(p.tabs) ? p.tabs : [];
    S.activeId = p.activeId;
    S.canBack = !!p.canBack;
    S.canForward = !!p.canForward;
    S.closedCount = p.closedCount || 0;
    renderTabs();
    updateNav();
    Omni.refresh();
    if (Palette.isOpen()) Palette.refresh();
  }

  function onSettings(s) {
    S.settings = s;
    renderChrome(false);
    const rz = q('.nv-resizer');
    if (rz) rz.setAttribute('aria-valuenow', String(s.sidebarWidth));
    const qt = Pop.find('quick-theme');
    if (qt) { qt.render(); qt.place(); }
    requestAnimationFrame(() => { Omni.position(); positionToasts(); });
  }

  Nova.registerShell({
    init(rootEl) {
      S.settings = Nova.settings.get();
      S.sync = Nova.sync.status();
      S.root = h('<div class="nv" data-mode=""></div>');
      S.card = h('<main class="nv-card" aria-label="Tab content"></main>');
      S.layer = h('<div class="nv-layer"></div>');
      S.root.appendChild(S.card);
      rootEl.appendChild(S.root);
      rootEl.appendChild(S.layer);
      Nova.tabs.setHost(S.card);

      Nova.ui.register({
        toast,
        confirm: showConfirm,
        prompt: showPrompt,
        menu: showMenu,
        focusOmnibox,
        openPalette: (initial) => Palette.open(typeof initial === 'string' ? initial : undefined),
        openQuickTheme: () => openQuickTheme(),
        toggleFullscreen,
        toggleSidebar,
        openApps: () => openApps(),
        closePopovers,
      });

      const p = { tabs: Nova.tabs.list(), activeId: Nova.tabs.activeId(), canBack: Nova.tabs.canBack(), canForward: Nova.tabs.canForward(), closedCount: Nova.tabs.closedCount() };
      S.tabs = p.tabs;
      S.activeId = p.activeId;
      S.canBack = p.canBack;
      S.canForward = p.canForward;
      S.closedCount = p.closedCount;

      Tip.init();
      bindRoot();
      renderChrome(true);

      Nova.on('tabs', onTabs);
      Nova.on('settings', onSettings);
      Nova.on('env', () => { renderChrome(false); Omni.refresh(); });
      Nova.on('sync', (st) => { S.sync = st; updateSync(); });
      Nova.on('storage', onStorage);
      Nova.on('theme', (res) => { syncThemeColor(res); const qt = Pop.find('quick-theme'); if (qt && !Palette.isOpen()) qt.render(); });
      syncThemeColor(Nova.settings.theme());
      Nova.on('apps', () => { if (Palette.isOpen()) Palette.refresh(); });

      document.addEventListener('keydown', onKeyCapture, true);
      document.addEventListener('keydown', onKey);
      document.addEventListener('fullscreenchange', updateFullscreen);
      window.addEventListener('resize', () => {
        Tip.hide(true);
        Pop.closeAll((e) => e.kind === 'menu');
        Pop.reposition();
        Omni.position();
        positionToasts();
      });
      window.addEventListener('blur', () => { Pop.closeAll((e) => e.kind === 'menu'); Tip.hide(true); });
    },
  });
})();
</script>
<script>
/* ---- web/src/js/music.js ---- */
/* Nova music — the Spotify mini-player (web/IDEAS.md §1). Public build only.
 *
 * What it does: signs Jack in to Spotify with the Authorization Code flow + PKCE (public client, no
 * secret, ever), polls GET /v1/me/player for "what's playing" and drives play / pause / next / previous.
 * The widget floats in the bottom-right corner of the content card (collapsed pill ⇄ expanded card, or hidden); on
 * narrow screens it becomes a mini-player bar under the card, which makes room for it (--mp-reserve).
 *
 * Where it runs: the 'public' build (the GitHub Pages copy). In the 'artifact' and 'standalone' builds
 * NovaMusic.supported is false, nothing renders and Settings → Music just explains where it works.
 * fetch() is allowed only in this file (web/build.js has a guard exception for js/music.js).
 *
 * Storage (device-only): Nova.local('spotify') = { access_token, refresh_token, expires_at, client_id,
 *   scope, name }  ·  Nova.local('music') = { mode: 'collapsed'|'expanded', hidden, connectDismissed,
 *   clientId (override) }  ·  sessionStorage 'nova:music:pkce' = { verifier, state, clientId, redirectUri }
 *   for the few seconds the browser is on accounts.spotify.com. Tokens are never logged or exported.
 *
 * Test hook (documented for web/tests/music.js; harmless in production):
 *   window.__NOVA_MUSIC_TEST = { redirectUri, playingMs, pausedMs, idleMs, settleMs, fetchMs }
 *   set before the page loads. redirectUri replaces https://barillejack-lang.github.io/nova/ (and skips the
 *   "are we on the GitHub Pages address?" check); the *Ms values shorten the polling intervals; the hook
 *   also lets the 'standalone' build run the player. It never enables the 'artifact' build.
 *
 * Public API (window.NovaMusic, used by Settings → Music):
 *   supported, state(), connect(), disconnect(), setHidden(bool), setClientId(str) → { ok, error? },
 *   loadProfile() → Promise<name|''>, on 'music' via Nova.on('music', state => …).
 *
 * Polling: 5 s while playing, 15 s while paused, 30 s when idle (nothing active), none while the page is
 * hidden or the player is hidden/disconnected. 401 → one token refresh then a retry; 429 → waits Retry-After.
 * Controls are optimistic and re-poll ~600 ms later; 403/404 means no active device. */
(function () {
  'use strict';

  const N = window.Nova;
  if (!N || !N.local || !N.util) return;
  const U = N.util;

  // ================================================================ constants + environment

  const DEFAULT_CLIENT_ID = 'cf4b7312db3d4912ad7bf7b680fa5fec'; // public PKCE client id (no secret exists or is needed)
  const REDIRECT_URI = 'https://barillejack-lang.github.io/nova/';
  const SCOPES = 'user-read-currently-playing user-read-playback-state user-modify-playback-state';
  const AUTH_URL = 'https://accounts.spotify.com/authorize';
  const TOKEN_URL = 'https://accounts.spotify.com/api/token';
  const API = 'https://api.spotify.com/v1';
  const OPEN_SPOTIFY = 'https://open.spotify.com';
  const PKCE_KEY = 'nova:music:pkce';
  const CLIENT_ID_RE = /^[0-9a-f]{32}$/i;
  const FETCH_TIMEOUT_MS = 15000; // a stalled Wi-Fi or filter must not freeze the player on "Checking Spotify…"
  const CLEAR_PX = 62;            // desktop: the pill's height plus its distance from the corner
  const RESERVE_PX = 50;          // narrow screens: height the card gives up so the bar never covers a page's first or last row

  const TEST = (window.__NOVA_MUSIC_TEST && typeof window.__NOVA_MUSIC_TEST === 'object') ? window.__NOVA_MUSIC_TEST : null;
  const REDIRECT = TEST && typeof TEST.redirectUri === 'string' && /^https?:\/\/[^\s]+$/i.test(TEST.redirectUri) ? TEST.redirectUri : REDIRECT_URI;
  const timing = { playingMs: 5000, pausedMs: 15000, idleMs: 30000, settleMs: 600, fetchMs: FETCH_TIMEOUT_MS };
  if (TEST) Object.keys(timing).forEach((k) => { if (Number.isFinite(TEST[k]) && TEST[k] > 0) timing[k] = TEST[k]; });

  const variant = N.env.variant;
  const supported = !N.env.isArtifact && (variant === 'public' || (variant === 'standalone' && !!TEST));

  // ================================================================ tiny helpers

  const ICON_EXTRA = {
    music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  };

  function ic(name, size, opts) {
    const body = ICON_EXTRA[name];
    if (!body) return U.icon(name, size, opts);
    size = size || 16;
    return '<svg class="n-icon n-icon-' + name + '" width="' + size + '" height="' + size +
      '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      body + '</svg>';
  }

  function h(markup) {
    const t = document.createElement('template');
    t.innerHTML = String(markup).trim();
    return t.content.firstElementChild;
  }

  function toast(message, opts) { try { return N.ui.toast(message, opts); } catch (_) { return null; } }

  function sessionGet(key) { try { return window.sessionStorage.getItem(key); } catch (_) { return null; } }
  function sessionSet(key, value) { try { window.sessionStorage.setItem(key, value); return true; } catch (_) { return false; } }
  function sessionRemove(key) { try { window.sessionStorage.removeItem(key); } catch (_) { /* ignore */ } }

  function b64url(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function randomToken(byteCount) {
    const a = new Uint8Array(byteCount);
    window.crypto.getRandomValues(a);
    return b64url(a);
  }
  async function sha256Challenge(verifier) {
    const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    return b64url(new Uint8Array(digest));
  }

  function fmtTime(ms) {
    const s = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
    return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
  }

  /** fetch() that gives up after timing.fetchMs (15 s), rejecting like any network failure. */
  function timedFetch(url, init) {
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), timing.fetchMs) : 0;
    return fetch(url, ctl ? Object.assign({ signal: ctl.signal }, init) : init).finally(() => clearTimeout(timer));
  }

  /** res.json() that also gives up when the body stalls. */
  function readJson(res) {
    let timer = 0;
    const stalled = new Promise((resolve, reject) => { timer = setTimeout(() => reject(new Error('timeout')), timing.fetchMs); });
    return Promise.race([res.json(), stalled]).finally(() => clearTimeout(timer));
  }

  function httpsUrl(url) { return typeof url === 'string' && /^https:\/\/[^\s]+$/i.test(url) ? url : ''; }
  function spotifyUrl(url) { return typeof url === 'string' && /^https:\/\/open\.spotify\.com\/[^\s]*$/i.test(url) ? url : OPEN_SPOTIFY; }

  // ================================================================ state

  const S = {
    tokens: null,        // saved sign-in (see header)
    playback: null,      // normalized current item, or null when nothing is active
    at: 0,               // Date.now() when playback.progressMs was measured
    status: 'loading',   // 'loading' | 'ok' | 'offline'
    busy: false,         // a poll is in flight
    again: false,        // a re-poll was requested while busy
    timer: 0,            // next poll
    settle: 0,           // post-control re-poll
    blockedUntil: 0,     // 429 back-off
    connecting: false,   // exchanging a ?code for tokens
    refreshing: null,    // single-flight refresh promise
    pending: false,      // a control was sent and the next poll hasn't landed yet
    lastId: '',          // track id last announced to screen readers
    ticker: 0,
    ready: false,
  };
  const W = { root: null };  // widget element refs, filled by buildWidget()

  // ---- preferences + tokens (Nova.local)

  function rawPrefs() {
    const p = N.local.get('music', {});
    return p && typeof p === 'object' ? p : {};
  }
  function prefs() {
    const p = rawPrefs();
    return {
      mode: p.mode === 'expanded' ? 'expanded' : 'collapsed',
      hidden: !!p.hidden,
      connectDismissed: !!p.connectDismissed,
      clientId: typeof p.clientId === 'string' && CLIENT_ID_RE.test(p.clientId.trim()) ? p.clientId.trim() : '',
    };
  }
  function setPrefs(patch) { N.local.set('music', Object.assign(rawPrefs(), patch)); } // fires local:music → render()

  function clientId() { return prefs().clientId || DEFAULT_CLIENT_ID; }

  function readTokens() {
    const t = N.local.get('spotify', null);
    return t && typeof t === 'object' && typeof t.access_token === 'string' && typeof t.refresh_token === 'string' ? t : null;
  }

  function saveTokens(data, cid) {
    const prev = S.tokens || {};
    S.tokens = {
      access_token: String(data.access_token),
      refresh_token: typeof data.refresh_token === 'string' && data.refresh_token ? data.refresh_token : prev.refresh_token,
      expires_at: Date.now() + (Number(data.expires_in) > 0 ? Number(data.expires_in) : 3600) * 1000,
      client_id: cid || prev.client_id || clientId(),
      scope: typeof data.scope === 'string' ? data.scope : (prev.scope || SCOPES),
      name: prev.name || '',
    };
    N.local.set('spotify', S.tokens);
  }

  function atHome() {
    if (TEST) return true;
    try { return location.origin + location.pathname.replace(/index\.html$/, '') === REDIRECT; } catch (_) { return false; }
  }

  function publicState() {
    const p = prefs();
    return {
      supported,
      atHome: atHome(),
      connected: !!S.tokens,
      connecting: S.connecting,
      name: (S.tokens && S.tokens.name) || '',
      hidden: p.hidden,
      clientId: clientId(),
      customClientId: p.clientId,
      defaultClientId: DEFAULT_CLIENT_ID,
      playing: !!(S.playback && S.playback.isPlaying),
    };
  }
  function emitState() { N.emit('music', publicState()); }

  // ================================================================ auth (PKCE)

  async function connect() {
    if (!supported) return false;
    if (S.connecting) return false;
    if (!atHome()) {
      toast('Open Nova at barillejack-lang.github.io/nova to connect Spotify');
      return false;
    }
    if (!window.crypto || !window.crypto.subtle || !window.crypto.getRandomValues) {
      toast('This browser can’t do a secure Spotify sign-in');
      return false;
    }
    try {
      const verifier = randomToken(64);
      const state = randomToken(18);
      const cid = clientId();
      const challenge = await sha256Challenge(verifier);
      if (!sessionSet(PKCE_KEY, JSON.stringify({ verifier, state, clientId: cid, redirectUri: REDIRECT }))) {
        toast('Spotify sign-in needs browser storage — turn off private browsing and try again');
        return false;
      }
      const query = new URLSearchParams({
        response_type: 'code',
        client_id: cid,
        scope: SCOPES,
        redirect_uri: REDIRECT,
        state,
        code_challenge_method: 'S256',
        code_challenge: challenge,
      });
      window.location.assign(AUTH_URL + '?' + query.toString()); // same tab; Spotify sends us back to REDIRECT
      return true;
    } catch (_) {
      sessionRemove(PKCE_KEY);
      toast('Couldn’t start the Spotify sign-in');
      return false;
    }
  }

  function disconnect(reason) {
    clearTimeout(S.timer);
    clearTimeout(S.settle);
    S.tokens = null;
    S.playback = null;
    S.status = 'loading';
    S.pending = false;
    N.local.remove('spotify');
    sessionRemove(PKCE_KEY);
    render();
    emitState();
    if (reason === 'expired') toast('Spotify signed you out — connect again in Settings → Music');
    else if (reason === 'changed') toast('Client ID changed — connect Spotify again');
  }

  function hasAuthReturn() {
    try {
      const q = new URLSearchParams(location.search);
      return q.has('code') || q.has('error');
    } catch (_) { return false; }
  }

  function stripQuery() {
    try { history.replaceState(history.state, '', location.pathname + location.hash); } catch (_) { /* ignore */ }
  }

  /** Back from accounts.spotify.com: ?code&state (or ?error). The query is stripped before any network call. */
  async function handleReturn() {
    let q;
    try { q = new URLSearchParams(location.search); } catch (_) { return; }
    const code = q.get('code');
    const error = q.get('error');
    const state = q.get('state');
    let pk = null;
    try { pk = JSON.parse(sessionGet(PKCE_KEY) || 'null'); } catch (_) { pk = null; }
    sessionRemove(PKCE_KEY);
    stripQuery();

    if (error) {
      toast(error === 'access_denied'
        ? 'Spotify wasn’t connected — you can try again any time in Settings → Music'
        : 'Spotify couldn’t connect (' + String(error).slice(0, 40) + ')');
      return;
    }
    if (!code || !pk || !state || state !== pk.state || typeof pk.verifier !== 'string') {
      toast('That Spotify sign-in didn’t match — please try connecting again');
      return;
    }
    S.connecting = true;
    render();
    emitState();
    try {
      const data = await tokenRequest({
        grant_type: 'authorization_code',
        code,
        redirect_uri: pk.redirectUri || REDIRECT,
        client_id: pk.clientId || clientId(),
        code_verifier: pk.verifier,
      });
      saveTokens(data, pk.clientId || clientId());
      toast('Spotify connected', { icon: 'check' });
    } catch (_) {
      toast('Spotify sign-in didn’t finish — please try again');
    }
    S.connecting = false;
    S.status = 'loading';
    render();
    emitState();
    if (S.tokens) {
      poll();
      loadProfile();
    }
  }

  async function tokenRequest(params) {
    const res = await timedFetch(TOKEN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(params).toString(),
    });
    let data = null;
    try { data = await readJson(res); } catch (_) { data = null; }
    if (!res.ok || !data || typeof data.access_token !== 'string') {
      const err = new Error('token request failed (' + res.status + ')');
      err.status = res.status;
      err.code = data && data.error;
      throw err;
    }
    return data;
  }

  /** Refreshes the access token (one request at a time). Resolves the new token, or null if Spotify signed us out. */
  function refresh() {
    if (S.refreshing) return S.refreshing;
    const t = S.tokens; // kept current across Nova tabs by the local:spotify listener
    if (!t) return Promise.resolve(null);
    const cid = t.client_id || clientId();
    S.refreshing = tokenRequest({ grant_type: 'refresh_token', refresh_token: t.refresh_token, client_id: cid })
      .then((data) => { saveTokens(data, cid); return S.tokens.access_token; })
      .catch((err) => {
        if (err && (err.status === 400 || err.status === 401)) { disconnect('expired'); return null; }
        throw err; // network / 5xx: keep the sign-in and try again at the next poll
      })
      .then((token) => { S.refreshing = null; return token; }, (err) => { S.refreshing = null; throw err; });
    return S.refreshing;
  }

  async function accessToken() {
    if (!S.tokens) return null;
    if (Date.now() < S.tokens.expires_at - 60000) return S.tokens.access_token;
    return refresh();
  }

  // ================================================================ Spotify API

  async function api(method, path) {
    let token = await accessToken();
    if (!token) return null;
    const call = (t) => timedFetch(API + path, { method, headers: { Authorization: 'Bearer ' + t } });
    let res = await call(token);
    if (res.status === 401) { // the token was rejected: refresh once, retry once
      token = await refresh();
      if (!token) return null;
      res = await call(token);
    }
    return res;
  }

  function retryAfterMs(res) {
    let s = NaN;
    try { s = Number(res.headers.get('retry-after')); } catch (_) { s = NaN; }
    if (!Number.isFinite(s) || s <= 0) s = 10;
    return Math.min(120, Math.max(1, s)) * 1000;
  }

  function normalize(data) {
    if (!data || typeof data !== 'object') return null;
    const item = data.item;
    const kind = data.currently_playing_type || (item && item.type) || '';
    if (!item || typeof item !== 'object') {
      if (kind !== 'ad' && kind !== 'episode') return null;
      return {
        id: kind, title: kind === 'ad' ? 'Advertisement' : 'Podcast episode', artist: '', album: '', art: [], url: OPEN_SPOTIFY,
        durationMs: 0, progressMs: 0, isPlaying: !!data.is_playing, device: data.device && data.device.name ? String(data.device.name) : '',
      };
    }
    const artists = Array.isArray(item.artists) ? item.artists.map((a) => a && a.name).filter(Boolean).join(', ') : '';
    const images = (item.album && item.album.images) || item.images || (item.show && item.show.images) || [];
    const art = (Array.isArray(images) ? images : [])
      .filter((i) => i && httpsUrl(i.url))
      .map((i) => ({ url: i.url, w: Number(i.width) || 0 }))
      .sort((a, b) => b.w - a.w);
    return {
      id: String(item.id || item.uri || item.name || ''),
      title: String(item.name || 'Unknown'),
      artist: artists || (item.show && item.show.name) || '',
      album: (item.album && item.album.name) || '',
      art,
      url: spotifyUrl(item.external_urls && item.external_urls.spotify),
      durationMs: Number(item.duration_ms) || 0,
      progressMs: Number(data.progress_ms) || 0,
      isPlaying: !!data.is_playing,
      device: data.device && data.device.name ? String(data.device.name) : '',
    };
  }

  function progressNow() {
    const p = S.playback;
    if (!p) return 0;
    const pos = p.isPlaying ? p.progressMs + (Date.now() - S.at) : p.progressMs;
    return p.durationMs ? Math.min(p.durationMs, Math.max(0, pos)) : Math.max(0, pos);
  }

  function pollingActive() {
    return supported && S.ready && !!S.tokens && !prefs().hidden && !document.hidden;
  }

  function scheduleNext() {
    clearTimeout(S.timer);
    if (!pollingActive()) return;
    const p = S.playback;
    let ms = !p ? timing.idleMs : (p.isPlaying ? timing.playingMs : timing.pausedMs);
    if (p && p.isPlaying && p.durationMs) { // catch the track change right after a song ends
      const left = p.durationMs - progressNow() + 700;
      if (left > 0 && left < ms) ms = Math.max(1000, left);
    }
    ms = Math.max(ms, S.blockedUntil - Date.now());
    S.timer = setTimeout(poll, ms);
  }

  async function poll() {
    clearTimeout(S.timer);
    if (!pollingActive()) return;
    if (Date.now() < S.blockedUntil) { scheduleNext(); return; } // Spotify said "slow down": a tab switch or a control doesn't skip that
    if (S.busy) { S.again = true; return; }
    S.busy = true;
    try {
      const res = await api('GET', '/me/player');
      if (!res) {
        // signed out (or no token): disconnect() already re-rendered
      } else if (res.status === 200) {
        let data = null;
        try { data = await readJson(res); } catch (_) { data = null; }
        applyPlayback(normalize(data));
      } else if (res.status === 204) {
        applyPlayback(null);
      } else if (res.status === 429) {
        S.blockedUntil = Date.now() + retryAfterMs(res);
      } else {
        setStatus('offline');
      }
    } catch (_) {
      setStatus('offline');
    }
    S.busy = false;
    if (S.pending) { S.pending = false; render(); }
    if (S.again) { S.again = false; poll(); return; }
    scheduleNext();
  }

  function setStatus(status) {
    if (S.status === status) return;
    S.status = status;
    render();
  }

  function applyPlayback(next) {
    S.status = 'ok';
    S.playback = next;
    S.at = Date.now();
    S.pending = false;
    render();
  }

  async function loadProfile() {
    if (!S.tokens) return '';
    try {
      const res = await api('GET', '/me');
      if (!res || !res.ok || !S.tokens) return (S.tokens && S.tokens.name) || '';
      const me = await readJson(res);
      const name = String((me && (me.display_name || me.id)) || '').slice(0, 80);
      if (name && S.tokens && S.tokens.name !== name) {
        S.tokens = Object.assign({}, S.tokens, { name });
        N.local.set('spotify', S.tokens);
        emitState();
      }
      return name;
    } catch (_) {
      return (S.tokens && S.tokens.name) || '';
    }
  }

  // ================================================================ controls

  const CONTROLS = {
    play: ['PUT', '/me/player/play'],
    pause: ['PUT', '/me/player/pause'],
    next: ['POST', '/me/player/next'],
    previous: ['POST', '/me/player/previous'],
  };

  const NO_DEVICE = 'Start playing on Spotify first (phone or computer), then control it here';

  async function control(kind) {
    const spec = CONTROLS[kind];
    if (!spec || !S.tokens) return;
    const p = S.playback;
    const beforeAt = Date.now();
    const before = p ? Object.assign({}, p, { progressMs: progressNow() }) : null;
    if (p) { // optimistic UI
      if (kind === 'play' || kind === 'pause') {
        p.progressMs = before.progressMs;
        p.isPlaying = kind === 'play';
        S.at = beforeAt;
      } else if (kind === 'previous') {
        p.progressMs = 0;
        S.at = beforeAt;
      }
    }
    S.pending = kind === 'next' || kind === 'previous';
    render();
    let res = null;
    try {
      res = await api(spec[0], spec[1]);
    } catch (_) {
      revert();
      toast('Couldn’t reach Spotify — check your connection');
      return;
    }
    if (!res) { revert(); return; }
    if (res.status === 403 || res.status === 404) {
      let reason = '';
      try { const body = await readJson(res); reason = body && body.error && body.error.reason; } catch (_) { reason = ''; }
      revert();
      toast(reason === 'PREMIUM_REQUIRED' ? 'Play, pause and skip need Spotify Premium' : NO_DEVICE);
    } else if (res.status === 429) {
      S.blockedUntil = Date.now() + retryAfterMs(res);
      revert();
      toast('Spotify asked for a short break — try again in a few seconds');
      return;
    } else if (!res.ok) {
      revert();
      toast('Spotify couldn’t do that just now');
    }
    clearTimeout(S.settle);
    S.settle = setTimeout(poll, timing.settleMs);

    function revert() {
      S.pending = false;
      if (S.playback && before) { Object.assign(S.playback, before); S.at = beforeAt; }
      render();
    }
  }

  // ================================================================ widget

  const MARKUP =
    '<aside class="mp" role="region" aria-label="Spotify player" data-view="off" data-mode="collapsed" data-narrow="false" hidden>' +
      '<div class="n-sr" role="status" aria-live="polite" data-part="live"></div>' +
      '<div class="mp-connect">' +
        '<button type="button" class="mp-connect__btn" data-mp="connect">' + ic('music', 15) + '<span data-part="connect-label">Connect Spotify</span></button>' +
        '<button type="button" class="mp-x" data-mp="dismiss" aria-label="Dismiss" data-tip="Dismiss" data-tip-side="top">' + ic('x', 13) + '</button>' +
      '</div>' +
      '<div class="mp-pill">' +
        '<button type="button" class="mp-pill__main" data-mp="expand" aria-expanded="false">' +
          '<span class="mp-art" data-part="art-sm"><span class="mp-art__ph">' + ic('music', 15) + '</span><img class="mp-art__img" alt="" referrerpolicy="no-referrer" draggable="false"></span>' +
          '<span class="mp-marquee" data-part="marquee"><span class="mp-marquee__txt" data-part="pill-text"></span></span>' +
        '</button>' +
        '<button type="button" class="mp-btn mp-btn--side" data-mp="previous" aria-label="Previous track" data-tip="Previous" data-tip-side="top"><span class="mp-flip">' + ic('skip-forward', 15, { filled: true }) + '</span></button>' +
        '<button type="button" class="mp-btn mp-btn--play" data-mp="toggle" data-part="pill-play" aria-label="Play" data-tip="Play" data-tip-side="top"></button>' +
        '<button type="button" class="mp-btn mp-btn--side" data-mp="next" aria-label="Next track" data-tip="Next" data-tip-side="top">' + ic('skip-forward', 15, { filled: true }) + '</button>' +
        '<span class="mp-pill__bar" aria-hidden="true"><i data-part="pill-bar"></i></span>' +
      '</div>' +
      '<section class="mp-card" aria-label="Now playing on Spotify">' +
        '<img class="mp-glow" alt="" aria-hidden="true" referrerpolicy="no-referrer" draggable="false">' +
        '<header class="mp-card__head">' +
          '<span class="mp-brand">' + ic('music', 14) + '<span>Spotify</span></span>' +
          '<span class="mp-card__tools">' +
            '<button type="button" class="mp-x" data-mp="collapse" aria-label="Minimize player" data-tip="Minimize" data-tip-side="top">' + ic('chevron-up', 15) + '</button>' +
            '<button type="button" class="mp-x" data-mp="hide" aria-label="Hide player" data-tip="Hide" data-tip-side="top">' + ic('eye-off', 15) + '</button>' +
          '</span>' +
        '</header>' +
        '<div class="mp-card__body">' +
          '<span class="mp-art mp-art--lg" data-part="art-lg"><span class="mp-art__ph">' + ic('music', 30) + '</span><img class="mp-art__img" alt="" referrerpolicy="no-referrer" draggable="false"></span>' +
          '<div class="mp-meta">' +
            '<div class="mp-title" data-part="title"></div>' +
            '<div class="mp-artist" data-part="artist"></div>' +
            '<div class="mp-album" data-part="album"></div>' +
          '</div>' +
        '</div>' +
        '<div class="mp-prog" data-part="prog">' +
          '<span class="mp-time" data-part="pos">0:00</span>' +
          '<div class="mp-track" role="progressbar" aria-label="Track progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-part="track"><i data-part="card-bar"></i></div>' +
          '<span class="mp-time mp-time--end" data-part="dur">0:00</span>' +
        '</div>' +
        '<div class="mp-controls">' +
          '<button type="button" class="mp-btn mp-btn--lg" data-mp="previous" aria-label="Previous track" data-tip="Previous" data-tip-side="top"><span class="mp-flip">' + ic('skip-forward', 18, { filled: true }) + '</span></button>' +
          '<button type="button" class="mp-btn mp-btn--play mp-btn--xl" data-mp="toggle" data-part="card-play" aria-label="Play" data-tip="Play" data-tip-side="top"></button>' +
          '<button type="button" class="mp-btn mp-btn--lg" data-mp="next" aria-label="Next track" data-tip="Next" data-tip-side="top">' + ic('skip-forward', 18, { filled: true }) + '</button>' +
        '</div>' +
        '<footer class="mp-card__foot">' +
          '<span class="mp-device" data-part="device">' + ic('volume', 13) + '<span data-part="device-name"></span></span>' +
          '<a class="mp-open" data-part="open" href="' + OPEN_SPOTIFY + '" target="_blank" rel="noopener noreferrer"><span>Open in Spotify</span>' + ic('external-link', 12) + '</a>' +
        '</footer>' +
      '</section>' +
    '</aside>';

  function part(name) { return W.root.querySelector('[data-part="' + name + '"]'); }

  function buildWidget() {
    const root = h(MARKUP);
    W.root = root;
    ['live', 'connect-label', 'art-sm', 'art-lg', 'pill-text', 'marquee', 'pill-play', 'card-play', 'pill-bar', 'card-bar', 'track',
      'title', 'artist', 'album', 'pos', 'dur', 'prog', 'device', 'device-name', 'open'].forEach((k) => { W[k] = part(k); });
    W.glow = root.querySelector('.mp-glow');
    W.expand = root.querySelector('[data-mp="expand"]');
    W.sideBtns = Array.from(root.querySelectorAll('.mp-btn'));
    (document.getElementById('nova-root') || document.body).appendChild(root);

    root.addEventListener('click', onClick);
    root.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && prefs().mode === 'expanded' && root.querySelector('.mp-card').contains(document.activeElement)) {
        e.preventDefault();
        setMode('collapsed', true);
      }
    });
    root.querySelectorAll('.mp-art__img, .mp-glow').forEach((img) => {
      img.addEventListener('load', () => { const a = img.closest('.mp-art'); if (a) a.classList.add('has-img'); else img.classList.add('is-on'); });
      img.addEventListener('error', () => { const a = img.closest('.mp-art'); if (a) a.classList.remove('has-img'); else img.classList.remove('is-on'); });
    });
  }

  function onClick(e) {
    const el = e.target.closest('[data-mp]');
    if (!el || !W.root.contains(el) || el.disabled) return;
    const act = el.getAttribute('data-mp');
    if (act === 'connect') connect();
    else if (act === 'dismiss') setPrefs({ connectDismissed: true });
    else if (act === 'expand') setMode('expanded', true);
    else if (act === 'collapse') setMode('collapsed', true);
    else if (act === 'hide') hidePlayer();
    else if (act === 'toggle') control(S.playback && S.playback.isPlaying ? 'pause' : 'play');
    else if (act === 'next' || act === 'previous') control(act);
  }

  function setMode(mode, moveFocus) {
    setPrefs({ mode });
    if (!moveFocus) return;
    requestAnimationFrame(() => {
      const target = mode === 'expanded' ? W.root.querySelector('[data-mp="collapse"]') : W.expand;
      if (target && target.offsetParent !== null) target.focus({ preventScroll: true });
    });
  }

  function hidePlayer() {
    setPrefs({ hidden: true });
    toast('Music player hidden — bring it back in Settings → Music', {
      action: { label: 'Undo', onClick: () => setPrefs({ hidden: false }) },
    });
  }

  // ---- rendering

  function viewState() {
    if (!supported || !S.ready || !W.root) return 'off';
    const p = prefs();
    if (p.hidden) return 'off';
    if (!S.tokens) return S.connecting || (!p.connectDismissed && atHome()) ? 'connect' : 'off';
    if (!S.playback) return 'idle';
    return S.playback.isPlaying ? 'playing' : 'paused';
  }

  function pickArt(art, minWidth) {
    if (!art || !art.length) return '';
    const fit = art.filter((a) => a.w >= minWidth);
    return (fit.length ? fit[fit.length - 1] : art[0]).url; // art is sorted large → small
  }

  function setArt(artEl, url) {
    const img = artEl.querySelector('img');
    if (!img) return;
    if (!url) {
      if (img.getAttribute('src')) img.removeAttribute('src');
      artEl.classList.remove('has-img');
      return;
    }
    if (img.getAttribute('src') !== url) {
      artEl.classList.remove('has-img');
      img.src = url;
    }
  }

  function setGlow(url) {
    if (!url) { W.glow.classList.remove('is-on'); if (W.glow.getAttribute('src')) W.glow.removeAttribute('src'); return; }
    if (W.glow.getAttribute('src') !== url) { W.glow.classList.remove('is-on'); W.glow.src = url; }
  }

  function setText(el, text) { if (el.textContent !== text) el.textContent = text; }

  function setPlayButton(btn, playing) {
    const label = playing ? 'Pause' : 'Play';
    const key = playing ? 'pause' : 'play';
    if (btn.getAttribute('data-state') !== key) {
      btn.setAttribute('data-state', key);
      btn.innerHTML = ic(playing ? 'pause' : 'play', btn.classList.contains('mp-btn--xl') ? 20 : 16, { filled: true });
    }
    btn.setAttribute('aria-label', label);
    btn.setAttribute('data-tip', label);
  }

  function render() {
    if (!W.root) return;
    const view = viewState();
    const p = prefs();
    const play = S.playback;
    const narrow = !!N.env.narrow;
    const mode = p.mode === 'expanded' ? 'expanded' : 'collapsed';
    const root = W.root;

    root.hidden = view === 'off';
    root.setAttribute('data-view', view);
    root.setAttribute('data-mode', mode);
    root.setAttribute('data-narrow', narrow ? 'true' : 'false');
    root.setAttribute('data-busy', S.pending ? 'true' : 'false');
    W.expand.setAttribute('aria-expanded', mode === 'expanded' ? 'true' : 'false');
    if (view === 'off') { stopTicker(); place(); return; }

    if (view === 'connect') {
      setText(W['connect-label'], S.connecting ? 'Connecting…' : 'Connect Spotify');
      root.querySelector('[data-mp="connect"]').disabled = S.connecting;
      stopTicker();
      place();
      return;
    }

    const live = view === 'playing' || view === 'paused';
    const title = live ? play.title : (S.status === 'offline' ? 'Can’t reach Spotify' : S.status === 'loading' ? 'Checking Spotify…' : 'Nothing playing');
    const artist = live ? play.artist : (S.status === 'ok' ? 'Start something in Spotify on your phone or computer and it shows up here.' : '');
    const line = live && play.artist ? play.title + ' — ' + play.artist : title;

    setText(W['pill-text'], line);
    W.expand.setAttribute('aria-label', (mode === 'expanded' ? 'Minimize' : 'Open') + ' Spotify player. ' + (live ? 'Now playing: ' + line : title));
    setText(W.title, title);
    setText(W.artist, artist);
    setText(W.album, live ? play.album : '');
    setText(W['device-name'], live && play.device ? play.device : '');
    W.device.hidden = !(live && play.device);
    W.open.setAttribute('href', live ? play.url : OPEN_SPOTIFY);
    W.prog.hidden = !live;

    const smallArt = live ? pickArt(play.art, 48) : '';
    setArt(W['art-sm'], smallArt);
    setArt(W['art-lg'], live ? pickArt(play.art, 200) : '');
    setGlow(smallArt);

    setPlayButton(W['pill-play'], view === 'playing');
    setPlayButton(W['card-play'], view === 'playing');
    W.sideBtns.forEach((b) => { b.disabled = !live; });

    if (live && play.id !== S.lastId) {
      if (S.lastId) setText(W.live, 'Now playing: ' + line);
      S.lastId = play.id;
    } else if (!live) {
      S.lastId = '';
    }

    tick();
    syncTicker(view === 'playing');
    place();
    requestAnimationFrame(fitMarquee);
  }

  /** Scrolls a long "Title — Artist" line inside the pill (only the overflow distance). */
  function fitMarquee() {
    if (!W.root || W.root.hidden) return;
    const box = W.marquee;
    const txt = W['pill-text'];
    const over = Math.ceil(txt.scrollWidth - box.clientWidth);
    if (over > 2) {
      box.classList.add('is-scroll');
      box.style.setProperty('--mp-shift', -over + 'px');
      box.style.setProperty('--mp-dur', Math.round(5 + over / 22) + 's');
    } else {
      box.classList.remove('is-scroll');
      box.style.removeProperty('--mp-shift');
    }
  }

  // ---- progress ticker (interpolates between polls)

  function tick() {
    const play = S.playback;
    if (!W.root || W.root.hidden) return;
    if (!play) { W['pill-bar'].style.width = '0%'; return; }
    const pos = progressNow();
    const frac = play.durationMs ? pos / play.durationMs : 0;
    const pct = (Math.round(frac * 1000) / 10) + '%';
    W['pill-bar'].style.width = pct;
    W['card-bar'].style.width = pct;
    setText(W.pos, fmtTime(pos));
    setText(W.dur, play.durationMs ? fmtTime(play.durationMs) : '');
    W.track.setAttribute('aria-valuenow', String(Math.round(frac * 100)));
    W.track.setAttribute('aria-valuetext', fmtTime(pos) + (play.durationMs ? ' of ' + fmtTime(play.durationMs) : ''));
  }

  function stopTicker() { clearInterval(S.ticker); S.ticker = 0; }
  function syncTicker(want) {
    if (want && !document.hidden) { if (!S.ticker) S.ticker = setInterval(tick, 250); } else stopTicker();
  }

  // ---- placement: bottom-right corner of the content card. Pages keep their headers, toolbars and tab strips at the
  // top, so nothing there is ever covered. Narrow screens get a bar along the bottom instead, and the card gives up
  // RESERVE_PX (shell.css reads --mp-reserve) so the bar sits under the page rather than over it.

  function place() {
    if (!W.root) return;
    const narrow = !!N.env.narrow;
    const reserve = narrow && W.root && !W.root.hidden ? RESERVE_PX : 0;
    const root = document.documentElement;
    root.style.setProperty('--mp-reserve', reserve + 'px');
    // desktop: scrolling pages (Home, Settings) keep this much space under their last row, so nothing ends up beneath the pill
    root.style.setProperty('--mp-clear', !narrow && W.root && !W.root.hidden ? CLEAR_PX + 'px' : '0px');
    const card = N.tabs.host && N.tabs.host();
    if (!card || !card.getBoundingClientRect) return;
    const r = card.getBoundingClientRect();
    if (!r.width) return;
    if (narrow) {
      let inset = 8;
      try { inset = parseFloat(getComputedStyle(card).marginLeft) || inset; } catch (_) { /* keep 8 */ }
      W.root.style.setProperty('--mp-left', Math.round(r.left) + 'px');
      W.root.style.setProperty('--mp-right', Math.round(Math.max(0, window.innerWidth - r.right)) + 'px');
      W.root.style.setProperty('--mp-bottom', Math.round(inset) + 'px');
      return;
    }
    const right = Math.max(22, window.innerWidth - r.right + 22);   // clear of a page's own scrollbar
    const bottom = Math.max(14, window.innerHeight - r.bottom + 14);
    W.root.style.setProperty('--mp-right', Math.round(right) + 'px');
    W.root.style.setProperty('--mp-bottom', Math.round(bottom) + 'px');
  }

  let placeFrame = 0;
  function placeSoon() {
    if (placeFrame) return;
    placeFrame = requestAnimationFrame(() => { placeFrame = 0; place(); fitMarquee(); });
  }

  // ================================================================ public API

  function setHidden(hidden) { setPrefs({ hidden: !!hidden }); }

  function setClientId(value) {
    const v = String(value == null ? '' : value).trim();
    if (v && !CLIENT_ID_RE.test(v)) return { ok: false, error: 'A Spotify Client ID is 32 letters and numbers (0–9, a–f).' };
    const next = v.toLowerCase() === DEFAULT_CLIENT_ID ? '' : v.toLowerCase();
    const was = clientId();
    setPrefs({ clientId: next });
    if (S.tokens && clientId() !== was) disconnect('changed');
    else emitState();
    return { ok: true };
  }

  window.NovaMusic = {
    supported,
    state: publicState,
    connect,
    disconnect: () => disconnect(),
    setHidden,
    setClientId,
    loadProfile,
  };

  // ================================================================ boot

  function init() {
    if (S.ready) return;
    S.ready = true;
    S.tokens = readTokens();
    buildWidget();

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearTimeout(S.timer);
        stopTicker();
      } else if (pollingActive()) {
        poll();
        render();
      }
    });
    window.addEventListener('resize', placeSoon);
    if (window.ResizeObserver && N.tabs.host && N.tabs.host()) new ResizeObserver(placeSoon).observe(N.tabs.host());
    N.on('settings', () => { placeSoon(); setTimeout(placeSoon, 180); });
    N.on('env', () => { render(); placeSoon(); });
    N.on('tabs', placeSoon);
    let wasHidden = prefs().hidden;
    N.on('local:music', () => { // any preference change, from this tab or another
      const hidden = prefs().hidden;
      render();
      if (hidden !== wasHidden) {
        wasHidden = hidden;
        if (hidden) clearTimeout(S.timer); else if (pollingActive()) poll();
      }
      emitState();
    });
    N.on('local:spotify', (value) => { // another Nova browser tab connected / disconnected / refreshed
      const next = value && typeof value.access_token === 'string' ? value : null;
      if (JSON.stringify(next) === JSON.stringify(S.tokens)) return;
      const hadTokens = !!S.tokens;
      S.tokens = next;
      if (!next) { S.playback = null; S.status = 'loading'; clearTimeout(S.timer); }
      render();
      emitState();
      if (next && !hadTokens) poll();
    });

    render();
    placeSoon();
    if (hasAuthReturn()) handleReturn();
    else if (S.tokens) poll();
  }

  if (supported) {
    if (document.documentElement.getAttribute('data-nova-ready') === 'true') init();
    else {
      const off = N.on('env', () => { off(); init(); }); // 'env' is emitted once at the end of Nova.boot()
    }
  }
})();
