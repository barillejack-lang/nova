<script>
/* ---- web/src/js/selection.js ---- */
/* Nova highlight bubble — select text in Nova's own pages and a small bubble offers Ask Claude / Copy / Search.
 *  - Where: text selected inside an app container (#nova-root .app): notes (textarea via selectionStart/End), Ask answers,
 *    Home, Tasks, Settings … never the omnibox / palette / dialogs (outside the app containers), never inside an iframe
 *    (cross-origin frames can't be read), never password fields or anything under [data-no-ask].
 *  - When: after pointerup for a mouse selection, ~300 ms after a keyboard selection settles. It never takes focus.
 *    It hides on Escape, scroll, resize, tab switch, or when the selection collapses / changes.
 *  - Copy: navigator.clipboard.writeText, then execCommand('copy') on the still-selected text, then Nova's hidden-textarea
 *    fallback; toast "Copied". Search: Nova.go(Nova.searchUrl(text)) inside the click (Google opens inside Nova when the
 *    search page can be framed, else in a real tab).
 *  - Ask Claude, claude.ai copy (window.claude.use('sample') resolved): the bubble opens an answer card (<= 380px) that
 *    streams "Explain this simply for a high-school student: «text»", with Explain / Define / Summarize / Give an example
 *    chips, a follow-up box, Stop, Copy answer and "Continue in Ask Claude" (opens the Ask tab with the conversation).
 *    Calls use the quick tier, only ever start from a click, are never retried by code, and are aborted when the card closes.
 *    The first answer for a chip may be replayed from the platform's 5-minute cache; follow-ups and regenerate use cache:false.
 *  - Ask Claude everywhere else (public / standalone): a real <a target=_blank rel="noopener noreferrer"> to
 *    https://claude.ai/new?q=<the selected text, trimmed to ~1500 chars> — the click is the user's explicit action.
 *  Shares the safe Markdown renderer and the error copy with the Ask tab through Nova.ask (ask.js loads first). */
(function () {
  'use strict';

  const Nova = window.Nova;
  if (!Nova) return;
  const U = Nova.util;
  const esc = U.esc;
  const icon = (name, size) => U.icon(name, size || 14);

  const CLAUDE_NEW = 'https://claude.ai/new';
  const SETTLE_MS = 300;          // keyboard selections: wait until the selection stops changing
  const POINTER_MS = 12;          // mouse selections are final at pointerup
  const MIN_CHARS = 2;
  const GAP = 8;                  // distance between the selection and the bubble
  const EDGE = 8;                 // keep clear of the viewport edge
  const CARD_MAX_H = 460;
  const CARD_MIN_H = 250;         // the card needs this much room (header + chips + follow-up box + some answer)
  const MAX_ASK_TEXT = 4000;      // highlighted text sent to Claude
  const MAX_Q = 1500;             // highlighted text carried in a claude.ai/new?q= link
  const MAX_SEARCH = 200;
  const MAX_FOLLOWUP = 2000;
  const MAX_HANDOFF_TURNS = 12;
  const MAX_HANDOFF_CHARS = 16000;

  const CHIPS = [
    { id: 'explain', label: 'Explain', ask: 'Explain this simply for a high-school student: ' },
    { id: 'define', label: 'Define', ask: 'Define the key words or ideas in this, in plain language a high-school student would get: ' },
    { id: 'summarize', label: 'Summarize', ask: 'Summarize this in 2-3 short bullet points: ' },
    { id: 'example', label: 'Give an example', ask: 'Give one clear, concrete example that shows this idea, for a high-school student: ' },
  ];

  const RULES = [
    'You are Claude, helping a high school student who highlighted some text in their own notes or schoolwork (it is shown inside « » marks).',
    '- Answer in plain, friendly language and keep it short: about 120 words or fewer unless they ask for more.',
    '- Light Markdown is fine (short bullet lists, **bold** key terms). Write math in plain text like 3x^2 + 2x - 5 = 0, not LaTeX.',
    '- If the text looks like homework, explain the idea and give hints rather than handing over a finished answer.',
    '- If you are not sure about something, say so.',
  ].join('\n');

  const THINKING = '<span class="ask-thinking"><span class="ask-dots" aria-hidden="true"><i></i><i></i><i></i></span><span>Thinking…</span></span>';
  const CONNECTING = '<span class="ask-thinking"><span class="n-spinner" aria-hidden="true"></span><span>Connecting to Claude…</span></span>';
  const SEND_ICON = '<svg class="n-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>';
  const STOP_ICON = '<svg class="n-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>';

  const S = {
    bubble: null,        // the three-button bubble (created on first use)
    card: null,          // the answer card
    mode: 'none',        // 'none' | 'bubble' | 'card'
    sel: null,           // { kind, raw, text, token, ... } the selection the bubble is for
    anchor: null,        // viewport rect of that selection
    tabId: null,         // active tab when the bubble appeared
    key: '',             // what the bubble DOM was last built for
    down: false,         // primary pointer is down (a mouse selection may be in progress)
    downInApp: false,
    tKey: 0,
    tPtr: 0,
    dismissed: '',       // token of a selection the user already dismissed (Escape / used an action)
    cs: null,            // the answer card's state
    resizeObs: null,
    layoutRaf: 0,
  };

  // ------------------------------------------------------------------ small helpers

  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

  /** Cut to n chars without splitting a surrogate pair. */
  function clip(s, n) {
    s = String(s == null ? '' : s);
    if (s.length <= n) return s;
    let t = s.slice(0, n);
    if (/[\ud800-\udbff]$/.test(t)) t = t.slice(0, -1);
    return t;
  }

  function cleanText(raw) {
    return String(raw == null ? '' : raw).replace(/ /g, ' ').replace(/\r\n?/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function safeEncode(s) {
    try { return encodeURIComponent(s); } catch (_) { return encodeURIComponent(s.replace(/[\ud800-\udfff]/g, '\uFFFD')); }
  }

  function claudeHref(text) { return CLAUDE_NEW + '?q=' + safeEncode(clip(text, MAX_Q)); }

  function A() { return Nova.ask || null; }

  /** 'inline' = answer in a card (claude.ai copy with the sample capability); 'link' = real link to claude.ai. */
  function askMode() {
    if (!Nova.env.isArtifact) return 'link';
    const a = A();
    if (!a || !a.sampleNow) return 'link';
    return a.sampleNow() === null ? 'link' : 'inline'; // undefined (still resolving) keeps the inline button
  }

  function md(text) {
    const a = A();
    return a && a.renderMarkdown ? a.renderMarkdown(text) : '<p>' + esc(text).replace(/\n/g, '<br>') + '</p>';
  }

  function toast(msg, opts) { try { Nova.ui.toast(msg, opts); } catch (_) { /* the shell may be missing */ } }

  // ------------------------------------------------------------------ reading the selection

  function isTextControl(el) {
    if (!el || el.disabled) return false;
    if (el.tagName === 'TEXTAREA') return true;
    return el.tagName === 'INPUT' && /^(text|search|url|email|tel)$/i.test(el.type || 'text');
  }

  function inHost(node) {
    const el = node && (node.nodeType === 1 ? node : node.parentElement);
    return !!el && ((S.bubble && S.bubble.contains(el)) || (S.card && S.card.contains(el)));
  }

  /** The visible app container (of the active tab) a node lives in, or null. */
  function appOf(node) {
    const el = node && (node.nodeType === 1 ? node : node.parentElement);
    if (!el || !el.closest) return null;
    const app = el.closest('.app');
    if (!app || app.hidden || !app.isConnected || app.classList.contains('app-web')) return null;
    if (!app.closest('#nova-root') || el.closest('[data-no-ask]') || inHost(el)) return null;
    const active = Nova.tabs.containerOf ? Nova.tabs.containerOf(Nova.tabs.activeId()) : null;
    return active && active !== app ? null : app;
  }

  function readSelection() {
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'IFRAME' || ae.tagName === 'FRAME')) return null;
    let sel = null;
    if (isTextControl(ae)) {
      if (!appOf(ae)) return null;
      let s = null;
      let e = null;
      try { s = ae.selectionStart; e = ae.selectionEnd; } catch (_) { return null; }
      if (s == null || e == null || e <= s) return null;
      sel = { kind: 'control', el: ae, start: s, end: e, raw: ae.value.slice(s, e) };
    } else {
      const ds = document.getSelection ? document.getSelection() : null;
      if (!ds || !ds.rangeCount || ds.isCollapsed) return null;
      const range = ds.getRangeAt(0);
      if (!appOf(range.commonAncestorContainer)) return null;
      sel = { kind: 'dom', range, raw: ds.toString() };
    }
    sel.text = cleanText(sel.raw);
    if (sel.text.replace(/\s/g, '').length < MIN_CHARS) return null;
    sel.token = sel.kind + ':' + (sel.kind === 'control' ? sel.start + ':' + sel.end + ':' : '') + sel.text;
    return sel;
  }

  // Viewport rects of the selected text inside a <textarea> / <input>: lay the same text out in a hidden mirror.
  const MIRROR_PROPS = ['direction', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'fontStyle', 'fontVariant',
    'fontWeight', 'fontStretch', 'fontSize', 'lineHeight', 'fontFamily', 'textAlign', 'textTransform', 'textIndent',
    'letterSpacing', 'wordSpacing', 'tabSize', 'overflowWrap', 'wordBreak'];

  function controlRects(el, start, end) {
    const box = el.getBoundingClientRect();
    if (el.tagName !== 'TEXTAREA') return [box]; // single-line inputs: anchor on the field itself
    const cs = getComputedStyle(el);
    const m = document.createElement('div');
    MIRROR_PROPS.forEach((p) => { m.style[p] = cs[p]; });
    const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    m.style.cssText += ';position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;box-sizing:content-box;' +
      'white-space:pre-wrap;overflow:hidden;width:' + Math.max(10, el.clientWidth - padX) + 'px;';
    const span = document.createElement('span');
    span.textContent = el.value.slice(start, end) || '​';
    m.appendChild(document.createTextNode(el.value.slice(0, start)));
    m.appendChild(span);
    m.appendChild(document.createTextNode(el.value.slice(end) || '​'));
    document.body.appendChild(m);
    const mr = m.getBoundingClientRect();
    const dx = box.left + el.clientLeft - el.scrollLeft - mr.left;
    const dy = box.top + el.clientTop - el.scrollTop - mr.top;
    const out = Array.from(span.getClientRects()).map((r) => ({
      left: r.left + dx, right: r.right + dx, top: r.top + dy, bottom: r.bottom + dy, width: r.width, height: r.height,
    }));
    m.remove();
    // keep only what is visible inside the field (the textarea may scroll on its own)
    const vis = out.filter((r) => r.bottom > box.top && r.top < box.bottom).map((r) => ({
      left: r.left, right: r.right, top: Math.max(r.top, box.top), bottom: Math.min(r.bottom, box.bottom), width: r.width, height: r.height,
    }));
    return vis.length ? vis : [box];
  }

  function anchorOf(sel) {
    let rects = [];
    if (sel.kind === 'dom') {
      rects = Array.from(sel.range.getClientRects());
      if (!rects.length) rects = [sel.range.getBoundingClientRect()];
    } else {
      rects = controlRects(sel.el, sel.start, sel.end);
    }
    rects = rects.filter((r) => r && (r.width > 0.5 || r.height > 0.5));
    if (!rects.length) return null;
    let first = rects[0];
    let last = rects[0];
    let left = Infinity;
    let right = -Infinity;
    rects.forEach((r) => {
      if (r.top < first.top - 0.5 || (Math.abs(r.top - first.top) <= 0.5 && r.left < first.left)) first = r;
      if (r.bottom > last.bottom + 0.5 || (Math.abs(r.bottom - last.bottom) <= 0.5 && r.right > last.right)) last = r;
      left = Math.min(left, r.left);
      right = Math.max(right, r.right);
    });
    return { left, right, top: first.top, bottom: last.bottom, topCx: (first.left + first.right) / 2, bottomCx: (last.left + last.right) / 2 };
  }

  /** The area the bubble may sit in: the tab card, inside the viewport. */
  function bounds() {
    const host = Nova.tabs.host ? Nova.tabs.host() : null;
    const r = host ? host.getBoundingClientRect() : null;
    const vw = document.documentElement.clientWidth || window.innerWidth;
    const vh = window.innerHeight;
    return {
      top: Math.max(0, r ? r.top : 0), bottom: Math.min(vh, r ? r.bottom : vh),
      left: Math.max(0, r ? r.left : 0), right: Math.min(vw, r ? r.right : vw), vw, vh,
    };
  }

  // ------------------------------------------------------------------ elements + layout

  function ensureEls() {
    if (S.bubble) return;
    const layer = document.querySelector('#nova-root > .nv-layer') || document.getElementById('nova-root') || document.body;
    S.bubble = document.createElement('div');
    S.bubble.className = 'sel-bubble';
    S.bubble.setAttribute('role', 'toolbar');
    S.bubble.setAttribute('aria-label', 'Selected text');
    S.bubble.hidden = true;
    S.card = document.createElement('div');
    S.card.className = 'sel-card';
    S.card.setAttribute('role', 'dialog');
    S.card.setAttribute('aria-label', 'Ask Claude about the highlighted text');
    S.card.hidden = true;
    layer.appendChild(S.bubble);
    layer.appendChild(S.card);

    // Keep the selection and the focus where they are when the bubble's buttons are pressed.
    [S.bubble, S.card].forEach((el) => {
      el.addEventListener('mousedown', (e) => {
        if (e.target.closest('button, a, .sel-bubble')) e.preventDefault();
      });
    });
    S.bubble.addEventListener('click', onBubbleClick);
    S.card.addEventListener('click', onCardClick);
    S.card.addEventListener('submit', onCardSubmit);

    if (typeof ResizeObserver === 'function') {
      S.resizeObs = new ResizeObserver(() => {
        if (S.mode === 'card') queueLayout();
      });
      S.resizeObs.observe(S.card);
    }
  }

  function queueLayout() {
    if (S.layoutRaf) return;
    S.layoutRaf = requestAnimationFrame(() => { S.layoutRaf = 0; if (S.mode === 'card') layout(S.card, S.anchor, 'card'); });
  }

  /** Put el next to the anchor: above it when there is room, else below; clamp inside the viewport. */
  function layout(el, anchor, kind) {
    if (!el || !anchor) return;
    const b = bounds();
    const aTop = clamp(anchor.top, b.top, b.bottom);
    const aBottom = clamp(anchor.bottom, b.top, b.bottom);
    el.style.left = '0px';
    el.style.top = '0px';
    el.style.removeProperty('--sel-max');
    const w = el.offsetWidth;
    let h = el.offsetHeight;
    const above = aTop - GAP - Math.max(b.top, EDGE);
    const below = Math.min(b.bottom, b.vh - EDGE) - aBottom - GAP;
    let side = el.dataset.side === 'top' || el.dataset.side === 'bottom' ? el.dataset.side : 'top';
    if (kind === 'bubble' || !el.dataset.side) side = above >= h ? 'top' : (below >= h ? 'bottom' : (above >= below ? 'top' : 'bottom'));
    if (kind === 'card') {
      // keep the side the card opened on unless it has no room left; scroll inside the card instead of growing past it
      if ((side === 'top' ? above : below) < CARD_MIN_H && (side === 'top' ? below : above) > (side === 'top' ? above : below)) side = side === 'top' ? 'bottom' : 'top';
      const room = Math.max(CARD_MIN_H, Math.floor(side === 'top' ? above : below));
      el.style.setProperty('--sel-max', Math.min(room, CARD_MAX_H) + 'px');
      h = el.offsetHeight;
    }
    const cx = side === 'top' ? anchor.topCx : anchor.bottomCx;
    const x = clamp(cx - w / 2, EDGE, Math.max(EDGE, b.vw - EDGE - w));
    const y = clamp(side === 'top' ? aTop - GAP - h : aBottom + GAP, EDGE, Math.max(EDGE, b.vh - EDGE - h));
    el.style.left = Math.round(x) + 'px';
    el.style.top = Math.round(y) + 'px';
    el.dataset.side = side;
    el.style.setProperty('--sel-ax', Math.round(clamp(cx - x, 18, Math.max(18, w - 18))) + 'px');
  }

  // ------------------------------------------------------------------ the bubble

  function bubbleHtml(sel) {
    const ask = askMode() === 'inline'
      ? '<button type="button" class="sel-btn sel-btn--ask" data-act="ask">' + icon('sparkles', 14) + '<span>Ask Claude</span></button>'
      : '<a class="sel-btn sel-btn--ask" data-act="ask-link" href="' + esc(claudeHref(sel.text)) + '" target="_blank" rel="noopener noreferrer">' +
          icon('sparkles', 14) + '<span>Ask Claude</span><span class="sel-ext" aria-hidden="true">↗</span></a>';
    return ask +
      '<button type="button" class="sel-btn" data-act="copy">' + icon('copy', 14) + '<span>Copy</span></button>' +
      '<button type="button" class="sel-btn" data-act="search">' + icon('search', 14) + '<span>Search</span></button>';
  }

  function showBubble(sel, anchor) {
    ensureEls();
    S.sel = sel;
    S.anchor = anchor;
    S.tabId = Nova.tabs.activeId();
    const key = askMode() + '|' + sel.token;
    if (S.key !== key) { S.bubble.innerHTML = bubbleHtml(sel); S.key = key; }
    const fresh = S.mode === 'none';
    S.mode = 'bubble';
    S.bubble.hidden = false;
    S.bubble.removeAttribute('data-side');
    layout(S.bubble, anchor, 'bubble');
    if (fresh) {
      S.bubble.classList.remove('is-in');
      void S.bubble.offsetWidth; // restart the pop-in
      S.bubble.classList.add('is-in');
    }
  }

  function hide(dismiss) {
    clearTimeout(S.tKey);
    clearTimeout(S.tPtr);
    if (dismiss && S.sel) S.dismissed = S.sel.token;
    if (S.cs) closeCardState();
    if (S.mode === 'none') return;
    S.mode = 'none';
    S.key = '';
    if (S.bubble) S.bubble.hidden = true;
    if (S.card) { S.card.hidden = true; S.card.innerHTML = ''; }
  }

  function evaluate() {
    if (S.mode === 'card' || S.down) return;
    if (S.bubble && S.bubble.contains(document.activeElement)) return;
    const sel = readSelection();
    if (!sel) { S.dismissed = ''; hide(false); return; }
    if (sel.token === S.dismissed) { hide(false); return; }
    S.dismissed = '';
    const anchor = anchorOf(sel);
    const b = bounds();
    if (!anchor || anchor.bottom < b.top || anchor.top > b.bottom || anchor.right < b.left || anchor.left > b.right) { hide(false); return; }
    showBubble(sel, anchor);
  }

  function copySelection() {
    const sel = S.sel;
    if (!sel) return;
    const raw = sel.raw;
    const done = (ok) => { toast(ok ? 'Copied' : 'Couldn’t copy — press ' + Nova.env.mod + '+C', ok ? { icon: 'check' } : undefined); };
    const viaSelection = () => { try { return document.execCommand('copy'); } catch (_) { return false; } }; // the text is still selected
    const fallback = () => (viaSelection() ? Promise.resolve(true) : U.copyText(raw));
    let p = null;
    try { p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(raw) : null; } catch (_) { p = null; }
    (p ? p.then(() => true, fallback) : fallback()).then(done, () => done(false));
    hide(true);
  }

  function searchSelection() {
    const sel = S.sel;
    if (!sel) return;
    const q = clip(sel.text.replace(/\s+/g, ' '), MAX_SEARCH).trim();
    hide(true);
    if (q) Nova.go(Nova.searchUrl(q));
  }

  function onBubbleClick(e) {
    const btn = e.target.closest('[data-act]');
    if (!btn || !S.bubble.contains(btn)) return;
    const act = btn.dataset.act;
    if (act === 'copy') copySelection();
    else if (act === 'search') searchSelection();
    else if (act === 'ask') openCard();
    else if (act === 'ask-link') {
      Nova.trackExternal(CLAUDE_NEW, 'Claude'); // a clean recent, not the whole selection
      setTimeout(() => hide(true), 0);          // after the browser has followed the link
    }
  }

  // ------------------------------------------------------------------ the answer card (claude.ai copy)

  function openCard() {
    const sel = S.sel;
    if (!sel) return;
    const text = clip(sel.text, MAX_ASK_TEXT);
    S.mode = 'card';
    S.bubble.hidden = true;
    S.card.hidden = false;
    S.card.removeAttribute('data-side');
    const cs = {
      text, chip: 'explain', turns: [], run: null, note: null, fatal: false, connecting: false, seq: 0, stick: true,
      copyText: '', els: null,
    };
    S.cs = cs;
    S.card.innerHTML =
      '<div class="sel-card__head">' +
        '<span class="sel-card__mark" aria-hidden="true">' + icon('sparkles', 14) + '</span>' +
        '<span class="sel-card__title">Ask Claude</span>' +
        '<button type="button" class="sel-x" data-act="close" aria-label="Close" title="Close (Esc)">' + icon('x', 15) + '</button>' +
      '</div>' +
      '<blockquote class="sel-quote"></blockquote>' +
      '<div class="sel-chips" role="group" aria-label="What should Claude do with it?">' +
        CHIPS.map((c) => '<button type="button" class="n-chip sel-chip" data-chip="' + c.id + '" aria-pressed="false">' + esc(c.label) + '</button>').join('') +
      '</div>' +
      '<div class="sel-body n-scroll" role="log" aria-label="Claude’s answer" tabindex="0">' +
        '<div class="sel-thread"></div><div class="sel-notewrap"></div>' +
      '</div>' +
      '<form class="sel-foot" autocomplete="off">' +
        '<div class="sel-ask">' +
          '<input type="text" class="n-input sel-input" maxlength="' + MAX_FOLLOWUP + '" placeholder="Ask a follow-up…" aria-label="Follow-up question" spellcheck="true">' +
          '<button type="submit" class="n-btn n-btn--primary n-btn--icon n-btn--sm sel-send" aria-label="Send follow-up" title="Send" disabled>' + SEND_ICON + '</button>' +
        '</div>' +
        '<div class="sel-actions">' +
          '<button type="button" class="sel-link" data-act="stop" hidden>' + STOP_ICON + '<span>Stop</span></button>' +
          '<button type="button" class="sel-link" data-act="copy-answer" hidden>' + icon('copy', 13) + '<span>Copy answer</span></button>' +
          '<button type="button" class="sel-link sel-link--go" data-act="continue">Continue in Ask Claude ' + icon('arrow-right', 13) + '</button>' +
        '</div>' +
      '</form>';
    const q = (sel2) => S.card.querySelector(sel2);
    cs.els = { quote: q('.sel-quote'), body: q('.sel-body'), thread: q('.sel-thread'), notes: q('.sel-notewrap'), input: q('.sel-input'),
      send: q('.sel-send'), stop: q('[data-act="stop"]'), copyAns: q('[data-act="copy-answer"]'), chips: Array.from(S.card.querySelectorAll('[data-chip]')) };
    cs.els.quote.textContent = text;
    cs.els.body.addEventListener('scroll', () => { cs.stick = cs.els.body.scrollHeight - cs.els.body.scrollTop - cs.els.body.clientHeight < 40; }, { passive: true });
    cs.els.input.addEventListener('input', () => renderChrome());
    layout(S.card, S.anchor, 'card');
    S.card.classList.remove('is-in');
    void S.card.offsetWidth;
    S.card.classList.add('is-in');
    startAsk('explain');
  }

  function closeCardState() {
    const cs = S.cs;
    S.cs = null;
    if (!cs) return;
    cs.seq++;
    const r = cs.run;
    cs.run = null;
    if (r) { try { r.ctl.abort(); } catch (_) { /* already settled */ } }
  }

  function promptFor(chipId, text) {
    const chip = CHIPS.find((c) => c.id === chipId) || CHIPS[0];
    return chip.ask + '«' + text + '»';
  }

  function startAsk(chipId, fresh) {
    const cs = S.cs;
    if (!cs || cs.fatal) return;
    if (cs.run) { const r = cs.run; cs.run = null; try { r.ctl.abort(); } catch (_) { /* ignore */ } }
    cs.chip = chipId;
    cs.turns = [{ role: 'user', content: promptFor(chipId, cs.text) }];
    cs.note = null;
    ask(!fresh); // the first answer for a chip may come from the platform cache
  }

  function sampleInput(cs) {
    return [{ role: 'user', content: RULES }].concat(cs.turns.map((t) => ({ role: t.role, content: t.content })));
  }

  function ask(useCache) {
    const cs = S.cs;
    if (!cs || cs.run) return;
    const a = A();
    const id = ++cs.seq;
    const have = a && a.sampleNow ? a.sampleNow() : null;
    cs.note = null;
    if (have === undefined) {                       // the capability is still resolving (it can take a few seconds)
      cs.connecting = true;
      renderAll();
      a.resolveSample().then(() => { if (S.cs === cs && cs.seq === id) { cs.connecting = false; ask(useCache); } });
      return;
    }
    cs.connecting = false;
    if (!have) {
      cs.fatal = true;
      cs.note = { kind: 'info', text: 'Claude isn’t available in this view of the page.', open: true };
      renderAll();
      return;
    }
    const ctl = new AbortController();
    const r = { ctl, text: '', liveEl: null };
    cs.run = r;
    renderAll();
    cs.stick = true;
    scrollEnd();
    const opts = { modelTier: 'quick', signal: ctl.signal, onText: (u) => { r.text = u.text; paintLive(cs, r); } };
    if (!useCache) opts.cache = false;
    let p;
    try { p = have(sampleInput(cs), opts); } catch (err) { p = Promise.reject(err); } // sample() promises never to throw synchronously
    Promise.resolve(p).then((res) => finishRun(cs, r, res), (err) => failRun(cs, r, err));
  }

  function finishRun(cs, r, res) {
    if (S.cs !== cs || cs.run !== r) return;
    cs.run = null;
    const turn = { role: 'assistant', content: res && typeof res.text === 'string' ? res.text : r.text };
    if (res && res.truncated) turn.flag = 'truncated';
    cs.turns.push(turn);
    renderAll();
  }

  function failRun(cs, r, err) {
    if (S.cs !== cs || cs.run !== r) return;
    cs.run = null;
    const e = err && typeof err === 'object' ? err : {};
    const code = typeof e.code === 'string' ? e.code : 'upstream_error';
    const a = A();
    const info = a && a.describeError ? a.describeError(code) : { kind: 'error', retry: true, text: 'Something went wrong reaching Claude.' };
    const partial = code === 'refused' ? '' : String(typeof e.text === 'string' ? e.text : r.text || '');
    if (partial.trim()) cs.turns.push({ role: 'assistant', content: partial, flag: code === 'cancelled' ? 'stopped' : 'interrupted' });
    if (info.fatal) cs.fatal = true;
    if (code === 'cancelled') cs.note = partial.trim() ? null : { kind: 'info', text: 'Stopped before Claude wrote anything.', retry: true };
    else cs.note = { kind: info.fatal ? 'warn' : (info.kind || 'error'), text: info.text, retry: !!info.retry, open: !!info.fatal };
    renderAll();
  }

  function submitFollowUp() {
    const cs = S.cs;
    if (!cs || cs.run || cs.fatal || cs.connecting) return;
    const text = cs.els.input.value.trim().slice(0, MAX_FOLLOWUP);
    if (!text) return;
    cs.els.input.value = '';
    cs.turns.push({ role: 'user', content: text });
    ask(false);
  }

  function retryAsk() {
    const cs = S.cs;
    if (!cs || cs.run || cs.fatal) return;
    const last = cs.turns[cs.turns.length - 1];
    if (last && last.role === 'assistant' && last.flag === 'interrupted') cs.turns.pop();
    if (!cs.turns.length || cs.turns[cs.turns.length - 1].role !== 'user') return;
    ask(false);
  }

  function stopAsk() {
    const cs = S.cs;
    if (cs && cs.run) cs.run.ctl.abort();
  }

  function lastAnswer(cs) {
    for (let i = cs.turns.length - 1; i >= 0; i--) if (cs.turns[i].role === 'assistant') return cs.turns[i].content;
    return '';
  }

  function continueInAsk() {
    const cs = S.cs;
    if (!cs) return;
    const turns = cs.turns.map((t) => ({ role: t.role, content: t.content, flag: t.flag }));
    if (cs.run && cs.run.text.trim()) turns.push({ role: 'assistant', content: cs.run.text, flag: 'stopped' });
    const params = { prompt: cs.turns[0].content, context: cs.text, at: Date.now() };
    if (turns.some((t) => t.role === 'assistant' && String(t.content).trim())) {
      // the newest turns that fit, still starting on a user turn
      let kept = turns.slice(-MAX_HANDOFF_TURNS);
      while (kept.length > 2 && kept.reduce((n, t) => n + t.content.length, 0) > MAX_HANDOFF_CHARS) kept = kept.slice(1);
      while (kept.length && kept[0].role !== 'user') kept.shift();
      params.turns = kept.map((t) => (t.flag ? { role: t.role, content: t.content, flag: t.flag } : { role: t.role, content: t.content }));
    }
    hide(true);
    Nova.tabs.open({ app: 'ask', params });
  }

  // ---- card rendering

  function flagTag(t) {
    if (t.flag === 'stopped') return '<span class="ask-tag">Stopped</span>';
    if (t.flag === 'interrupted') return '<span class="ask-tag ask-tag--warn">Interrupted</span>';
    if (t.flag === 'truncated') return '<span class="ask-tag">Cut short</span>';
    return '';
  }

  function renderThread() {
    const cs = S.cs;
    const out = [];
    cs.turns.forEach((t, i) => {
      if (i === 0) return; // the opening prompt is the quote + the chip
      if (t.role === 'user') out.push('<div class="sel-you">' + esc(t.content) + '</div>');
      else out.push('<div class="sel-ans ask-md">' + md(t.content) + flagTag(t) + '</div>');
    });
    if (cs.connecting) out.push('<div class="sel-ans ask-md is-pending" data-live>' + CONNECTING + '</div>');
    else if (cs.run) out.push('<div class="sel-ans ask-md is-pending" data-live>' + THINKING + '</div>');
    cs.els.thread.innerHTML = out.join('');
    if (cs.run) {
      cs.run.liveEl = cs.els.thread.querySelector('[data-live]');
      if (cs.run.text) paintLive(cs, cs.run);
    }
  }

  function renderNote() {
    const cs = S.cs;
    const n = cs.note;
    if (!n) { cs.els.notes.innerHTML = ''; return; }
    const ic = n.kind === 'error' ? 'alert-triangle' : (n.kind === 'warn' ? 'bell' : 'info');
    const a = A();
    cs.els.notes.innerHTML = '<div class="sel-note sel-note--' + esc(n.kind || 'info') + '" role="status">' + icon(ic, 14) +
      '<span>' + esc(n.text) + '</span>' +
      (n.retry && !cs.fatal ? '<button type="button" class="sel-link" data-act="retry">Try again</button>' : '') +
      (n.open ? '<a class="sel-link" href="' + esc(a && a.claudeLink ? a.claudeLink(cs.turns[0] ? cs.turns[0].content : '') : CLAUDE_NEW) +
        '" target="_blank" rel="noopener noreferrer" data-act="open-claude">Open Claude</a>' : '') +
      '</div>';
  }

  function renderChrome() {
    const cs = S.cs;
    if (!cs) return;
    const running = !!cs.run;
    const busy = running || cs.connecting;
    cs.els.chips.forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.chip === cs.chip));
      b.disabled = cs.fatal;
    });
    cs.els.input.disabled = cs.fatal;
    cs.els.send.disabled = cs.fatal || busy || !cs.els.input.value.trim();
    cs.els.stop.hidden = !running;
    cs.els.copyAns.hidden = running || !lastAnswer(cs).trim();
    cs.els.body.setAttribute('aria-busy', String(busy));
  }

  function renderAll() {
    const cs = S.cs;
    if (!cs || !cs.els) return;
    renderThread();
    renderNote();
    renderChrome();
    scrollEnd();
    queueLayout();
  }

  function paintLive(cs, r) {
    if (S.cs !== cs || cs.run !== r || !r.liveEl || !r.liveEl.isConnected) return;
    r.liveEl.classList.remove('is-pending');
    r.liveEl.classList.add('is-streaming');
    r.liveEl.innerHTML = md(r.text);
    scrollEnd();
  }

  function scrollEnd() {
    const cs = S.cs;
    if (cs && cs.stick && cs.els) cs.els.body.scrollTop = cs.els.body.scrollHeight;
  }

  function onCardClick(e) {
    const cs = S.cs;
    if (!cs) return;
    const t = e.target;
    const chip = t.closest('[data-chip]');
    if (chip) {
      if (chip.disabled) return;
      const same = chip.dataset.chip === cs.chip;
      if (same && (cs.run || cs.connecting)) return;
      startAsk(chip.dataset.chip, same && !!lastAnswer(cs)); // clicking the active chip again asks fresh
      return;
    }
    const codeCopy = t.closest('.ask-code__copy');
    if (codeCopy) {
      const code = codeCopy.closest('.ask-code').querySelector('code');
      U.copyText(code ? code.textContent : '').then((ok) => toast(ok ? 'Code copied' : 'Couldn’t copy — select it and press ' + Nova.env.mod + '+C'));
      return;
    }
    const link = t.closest('a.ask-a');
    if (link) { Nova.trackExternal(link.href, U.hostOf(link.href)); return; }
    const btn = t.closest('[data-act]');
    if (!btn || !S.card.contains(btn)) return;
    const act = btn.dataset.act;
    if (act === 'close') hide(true);
    else if (act === 'stop') stopAsk();
    else if (act === 'retry') retryAsk();
    else if (act === 'continue') continueInAsk();
    else if (act === 'open-claude') Nova.trackExternal(CLAUDE_NEW, 'Claude');
    else if (act === 'copy-answer') {
      U.copyText(lastAnswer(cs)).then((ok) => toast(ok ? 'Answer copied' : 'Couldn’t copy — select the text and press ' + Nova.env.mod + '+C', ok ? { icon: 'check' } : undefined));
    }
  }

  function onCardSubmit(e) {
    e.preventDefault();
    submitFollowUp();
  }

  // ------------------------------------------------------------------ events

  function schedule(ms) {
    clearTimeout(S.tKey);
    S.tKey = setTimeout(evaluate, ms);
  }

  document.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (inHost(e.target)) return;
    S.down = true;
    S.downInApp = !!appOf(e.target);
    S.dismissed = '';
    if (S.mode !== 'none') hide(false); // a new gesture: the card and bubble go away (the selection may be replaced)
  }, true);

  function onPointerEnd(e) {
    if (!S.down) return;
    S.down = false;
    if (inHost(e.target)) return;
    if (S.downInApp) {
      clearTimeout(S.tPtr);
      S.tPtr = setTimeout(evaluate, POINTER_MS);
    }
  }
  document.addEventListener('pointerup', onPointerEnd, true);
  document.addEventListener('pointercancel', onPointerEnd, true);
  window.addEventListener('blur', () => { S.down = false; });

  // Keyboard selections (shift+arrows, ctrl+A …) and selections made in text fields: wait until they settle.
  function onSelectionActivity() {
    if (S.mode === 'card' || S.down) return;
    if (S.mode === 'bubble') {
      const sel = readSelection();
      if (!sel || !S.sel || sel.token !== S.sel.token) hide(false); // collapsed or changed: out of the way right away
    }
    schedule(SETTLE_MS);
  }
  document.addEventListener('selectionchange', onSelectionActivity);
  document.addEventListener('select', onSelectionActivity, true);
  document.addEventListener('keyup', (e) => {
    if (e.key === 'Escape') return;
    onSelectionActivity();
  }, true);

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || S.mode === 'none') return;
    if (S.mode === 'card') e.preventDefault(); // the card swallows this Escape (so a drawer behind it stays put)
    hide(true);
  }, true);

  document.addEventListener('scroll', (e) => {
    if (S.mode !== 'bubble' || inHost(e.target)) return;
    hide(false);
  }, true);

  window.addEventListener('resize', () => {
    if (S.mode === 'bubble') hide(false);
    else if (S.mode === 'card') queueLayout();
  });

  document.addEventListener('focusin', (e) => {
    if (S.mode === 'bubble' && !inHost(e.target) && !appOf(e.target)) hide(false); // a dialog / the omnibox took focus
  });

  Nova.on('tabs', (p) => {
    if (S.mode !== 'none' && p && p.activeId !== S.tabId) hide(false);
  });

  // The tab card changes size when the sidebar opens or the window is resized: the anchor is stale.
  function watchCard() {
    const host = Nova.tabs.host ? Nova.tabs.host() : null;
    if (!host || typeof ResizeObserver !== 'function') { setTimeout(watchCard, 400); return; }
    let first = true;
    new ResizeObserver(() => {
      if (first) { first = false; return; }
      if (S.mode === 'bubble') hide(false);
    }).observe(host);
  }
  setTimeout(watchCard, 0);

  // On the claude.ai copy, find out early whether Claude can answer, so the bubble shows the right Ask Claude button.
  if (Nova.env.isArtifact) {
    setTimeout(() => {
      const a = A();
      if (!a || !a.resolveSample) return;
      a.resolveSample().then(() => { if (S.mode === 'bubble') { S.key = ''; showBubble(S.sel, S.anchor); } });
    }, 0);
  }

  Nova.selection = { hide: () => hide(true), mode: () => S.mode };
})();
</script>
<script>
  (function () {
    if (window.Nova && typeof window.Nova.boot === 'function') { window.Nova.boot(); return; }
    var root = document.getElementById('nova-root');
    if (root) root.innerHTML = '<div class="n-noscript">Nova couldn’t start. Try reloading the page.</div>';
  })();
</script>
</body>
</html>
